name = "wavee-crash"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Served ONLY on crash.cproducts.dev (zone on Cloudflare — README step 0). workers.dev and preview URLs are off so
# no hostname reaches this Worker without Cloudflare Access in front of it.
workers_dev = false
preview_urls = false
routes = [{ pattern = "crash.cproducts.dev", custom_domain = true }]

# The dashboard (ops/crash/dashboard — `npm run deploy` builds it first) on the same hostname. Cloudflare serves
# assets directly (behind Access); the Worker runs only for /v1/*. Unknown paths fall back to index.html (SPA routes).
[assets]
directory = "../dashboard/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*"]

# ── D1 ──────────────────────────────────────────────────────────────────────
# Create once: `wrangler d1 create wavee-crash`, then paste the printed
# database_id below. schema.sql is the frozen baseline (applied once); every later
# change is a numbered file in migrations/, applied with
# `wrangler d1 migrations apply wavee-crash --remote` (see README).
[[d1_databases]]
binding = "DB"
database_name = "wavee-crash"
database_id = "1a00d669-661e-4fb2-b266-1db1ae1c2e32"
migrations_dir = "migrations"

# ── R2 ──────────────────────────────────────────────────────────────────────
# Create once: `wrangler r2 bucket create wavee-crash`. The daily purge ([triggers]
# below) deletes report objects with their rows; the 90-day lifecycle rule on
# reports/ (never symbols/) stays as a backstop — configured separately, see README.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "wavee-crash"

# ── Rate limiting ────────────────────────────────────────────────────────────
# 30 requests/min per limiter key (the key is the caller's IP, passed straight
# into Cloudflare's own rate-limiting infrastructure — never written to our D1
# rows, R2 objects or logs; see src/index.ts `rateLimitKey`).
[[ratelimits]]
name = "RATE"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# ── Cron ─────────────────────────────────────────────────────────────────────
# Daily retention purge (src/retention.ts via `scheduled()`): reports rows + their R2 objects older than 90 days.
# Issues keep their lifetime stats. 03:17 UTC, off the hour.
[triggers]
crons = ["17 3 * * *"]

# ── Vars ──────────────────────────────────────────────────────────────────
# INGEST_KEY is a secret only (`wrangler secret put INGEST_KEY`), never a [vars] entry: a var and a secret share one
# binding namespace, so a committed placeholder here could become the live ingest key on deploy. `wrangler dev`
# reads it from `.dev.vars` (gitignored). Unset → every ingest/erase call is 401 (fails closed).
# DISCORD_WEBHOOK_URL is a secret only, too (`wrangler secret put DISCORD_WEBHOOK_URL`): the crash alerts channel's
# webhook. Unset → alerts are a no-op.
[vars]
# Cloudflare Access (README step 6). Public values, not secrets. Placeholders fail closed: every Access-gated route
# answers 401 until both are real.
ACCESS_TEAM_DOMAIN = "https://cproducts.cloudflareaccess.com"
# AUD tag of the "Wavee crashes" application (the whole host; the ingest Bypass app has its own, never used here).
ACCESS_AUD = "57c515f6bc8ab398e21bbaa7ee8ea7b989607fa875f7b808ebfbdd6a28b582a2"
