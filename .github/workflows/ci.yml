name: CI

# Pre-merge validation gate. Runs on PRs into the protected branches and on pushes
# to short-lived work branches for fast feedback. Builds Wavee.UI.WinUI x64
# (unsigned, no MSIX) against the STUB playback sources — the proprietary playback
# bundle is intentionally NOT used on PRs.
#
# Tests are intentionally omitted for now. (Re-add a `dotnet test` step + wire this
# as a required status check on the "Protect release branches" ruleset when ready.)
#
# Publishing is a SEPARATE, deliberate action — see release.yml (workflow_dispatch).

on:
  pull_request:
    branches: [master, 'release/**']
  push:
    branches: ['feature/**', 'fix/**', 'hotfix/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PR Build
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      Configuration: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Klankhuis.Hero (hero carousel control)
        shell: pwsh
        run: |
          # Same external ProjectReference the release build resolves via
          # $(KlankhuisHeroProject); clone it and point the property at the clone.
          $dest = Join-Path $env:RUNNER_TEMP 'hero-carousel-winui'
          git clone --depth 1 https://github.com/christosk92/hero-carousel-winui.git $dest
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone hero-carousel-winui" }
          $proj = Join-Path $dest 'src/Klankhuis.Hero/Klankhuis.Hero.csproj'
          if (-not (Test-Path $proj)) { throw "Klankhuis.Hero.csproj not found at $proj after clone" }
          "KlankhuisHeroProject=$proj" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Wavee.UI.WinUI (x64, unsigned, no package)
        shell: pwsh
        run: |
          # Compile/validate only — no MSIX, no signing. Stub playback sources are
          # fine here (the proprietary bundle is intentionally absent on PRs).
          msbuild src/Wavee.UI.WinUI/Wavee.UI.WinUI.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=false `
            /restore
