name: CI

# PR gate: compile-check (x64) + unit tests. The expensive both-arch build +
# Azure signing only runs in release.yml. No secrets are used here, so the
# proprietary playback bundle stays out of PR runs (stub-audio compiles fine).

on:
  pull_request:
    branches: [master, experimental]
  push:
    branches: ['feature/**', 'fix/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: PR Build & Test
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Clone Klankhuis.Hero (hero carousel control)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'hero-carousel-winui'
          git clone --depth 1 https://github.com/christosk92/hero-carousel-winui.git $dest
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone hero-carousel-winui" }
          $proj = Join-Path $dest 'src/Klankhuis.Hero/Klankhuis.Hero.csproj'
          if (-not (Test-Path $proj)) { throw "Klankhuis.Hero.csproj not found at $proj" }
          "KlankhuisHeroProject=$proj" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Build Wavee.UI.WinUI (x64, compile check)
        shell: pwsh
        run: |
          # Debug-Unpackaged: fast JIT sideload config (no MSIX tooling / no
          # SelfContained). Validates the whole compile graph + trim/AOT
          # analyzers. The full Release/both-arch/signed build is release.yml.
          msbuild src/Wavee.UI.WinUI/Wavee.UI.WinUI.csproj `
            /p:Configuration=Debug-Unpackaged `
            /p:Platform=x64 `
            /restore `
            /v:minimal

      - name: Test
        shell: pwsh
        run: |
          dotnet test test/Wavee.Tests/Wavee.Tests.csproj -c Debug --nologo
          dotnet test test/Wavee.UI.Tests/Wavee.UI.Tests.csproj -c Debug --nologo
