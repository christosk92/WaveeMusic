name: Release MSIX

# Deliberate (milestone) release pipeline — workflow_dispatch ONLY:
#   Run on a release/<X.Y.Z>-<label> branch -> pre-release v<X.Y.Z>-<label>.N
#       (N auto-increments from existing tags; auto-published; refreshes the
#        experimental-latest rolling .appinstaller channel testers ride).
#   Run on master WITH an explicit version_tag (e.g. v0.1.0) -> production release
#       (published as a DRAFT for review — you click Publish to go live).
#   An explicit version_tag input overrides the ref either way (re-cut / fallback).
#
# Merging into a release branch does NOT publish — ci.yml gates merges; a release
# is cut HERE, deliberately. The version comes from the BRANCH NAME, so there are
# no version env vars to edit: start a line with release/<X.Y.Z>-<label>, change
# phase with release/<X.Y.Z>-beta / -rc, ship production by running on master.
#
# Pipeline: version (compute + tag) -> build (matrix, per-arch) -> sign (x64) -> release
#
# Why per-arch then sign-on-x64: a self-contained WinUI build resolves its RID
# from the host (arm64 cross-build on x64 -> NETSDK1032), so each arch builds on
# a matching runner; signing is architecture-agnostic and the Azure toolchain
# fails under arm64 emulation, so both packages are signed in one x64 job.

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Explicit version tag override (e.g. v0.1.0 for production, or v0.1.0-alpha.3). Optional on release/* branches; REQUIRED on master.'
        required: false

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version tag from the ref
        id: out
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null 2>&1 || true
          REF="${{ github.ref_name }}"
          OVERRIDE="${{ inputs.version_tag }}"

          if [ -n "$OVERRIDE" ]; then
            # Explicit override (re-cut / fallback). Pre-release if the tag has a label.
            TAG="$OVERRIDE"
            case "$TAG" in *-*) PRE=true ;; *) PRE=false ;; esac
          elif [[ "$REF" == release/* ]]; then
            # Pre-release line: version comes from the branch name release/<X.Y.Z>-<label>.
            VER="${REF#release/}"            # e.g. 0.1.0-alpha
            BASE="${VER%%-*}"               # 0.1.0
            LABEL="${VER#*-}"               # alpha
            if [ "$LABEL" = "$VER" ] || [ -z "$BASE" ]; then
              echo "::error::Release branch must be named release/<X.Y.Z>-<label> (e.g. release/0.1.0-alpha)."; exit 1
            fi
            # Next counter = (max existing v<BASE>-<LABEL>.N) + 1; robust to gaps; starts at .1.
            LAST=$(git tag -l "v${BASE}-${LABEL}.*" | sed -E "s/.*\.([0-9]+)$/\1/" | sort -n | tail -1)
            N=$(( ${LAST:-0} + 1 ))
            TAG="v${BASE}-${LABEL}.${N}"; PRE=true
          elif [ "$REF" = "master" ]; then
            echo "::error::Production releases from master require an explicit version_tag input (e.g. v0.1.0)."; exit 1
          else
            echo "::error::Run this workflow on a release/<X.Y.Z>-<label> branch (pre-release) or on master with version_tag (production)."; exit 1
          fi

          echo "Resolved tag=$TAG (prerelease=$PRE) from ref=$REF"
          echo "tag=$TAG"        | tee -a "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" | tee -a "$GITHUB_OUTPUT"

      - name: Push tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.out.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — reusing."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: arm64
            runner: windows-11-arm

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      Configuration: Release
      ReleaseTag: ${{ needs.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore proprietary playback sources
        shell: pwsh
        env:
          PLAYBACK_SOURCES_ZIP_B64: ${{ secrets.PLAYBACK_SOURCES_ZIP_B64 }}
        run: |
          # The public repo deliberately omits the Spotify playback sources
          # (gitignored). Without them the build defines
          # WAVEE_SPOTIFY_PLAYBACK_STUBS and the MSIX cannot decrypt audio.
          # signing/Pack-PlaybackSources.ps1 stores them in this secret; we
          # restore them here BEFORE restore/build and FAIL LOUDLY if absent,
          # so an audio-disabled stub build can never be released.
          $b64 = $env:PLAYBACK_SOURCES_ZIP_B64
          if ([string]::IsNullOrWhiteSpace($b64)) {
            throw "PLAYBACK_SOURCES_ZIP_B64 secret is empty. Run signing/Pack-PlaybackSources.ps1 -SetSecret. Refusing to build an audio-disabled stub release."
          }
          # Strip any whitespace/newlines a secret-setter may have injected into
          # the base64 (e.g. PowerShell console-width line wrapping). Base64 has
          # no internal whitespace, so this is always safe and makes decoding
          # independent of how the secret was uploaded.
          $b64 = ($b64 -replace '\s', '')
          $bytes = [Convert]::FromBase64String($b64)
          $zipPath = Join-Path $env:RUNNER_TEMP 'playback-sources.zip'
          [System.IO.File]::WriteAllBytes($zipPath, $bytes)
          Expand-Archive -Path $zipPath -DestinationPath $env:GITHUB_WORKSPACE -Force
          Remove-Item $zipPath -Force
          $required = @(
            'src/Wavee/Core/Crypto/AudioDecryptStream.cs',
            'src/Wavee/Core/Audio/PlayPlayConstants.cs',
            'src/Wavee/Core/Audio/AudioRuntimeProvisioner.cs',
            'src/Wavee/Core/Audio/RuntimeManifest.cs',
            'src/Wavee.AudioHost/PlayPlay/PlayPlayKeyEmulator.cs'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $env:GITHUB_WORKSPACE $_)) }
          if ($missing) { throw "Playback sources missing after restore: $($missing -join ', ')" }
          Write-Host "Restored $($required.Count) proprietary playback sources (audio-enabled build)."

      - name: Clone Klankhuis.Hero (hero carousel control)
        shell: pwsh
        run: |
          # Klankhuis.Hero lives in a separate PUBLIC repo and is referenced by
          # Wavee.UI.WinUI.csproj via $(KlankhuisHeroProject), which defaults to
          # a local sibling checkout that doesn't exist on the runner. Clone it
          # and point the property at the clone via GITHUB_ENV so both the
          # restore and build steps resolve the ProjectReference.
          $dest = Join-Path $env:RUNNER_TEMP 'hero-carousel-winui'
          git clone --depth 1 https://github.com/christosk92/hero-carousel-winui.git $dest
          if ($LASTEXITCODE -ne 0) { throw "Failed to clone hero-carousel-winui" }
          $proj = Join-Path $dest 'src/Klankhuis.Hero/Klankhuis.Hero.csproj'
          if (-not (Test-Path $proj)) { throw "Klankhuis.Hero.csproj not found at $proj after clone" }
          $sha = (git -C $dest rev-parse HEAD).Trim()
          Write-Host "Cloned hero-carousel-winui @ $sha"
          "KlankhuisHeroProject=$proj" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Stamp release version
        shell: pwsh
        run: ./signing/Set-Version.ps1 -Tag "$env:ReleaseTag"

      - name: Set release Publisher in manifest
        shell: pwsh
        run: |
          ./signing/Set-Publisher.ps1 -PublisherSubject "${{ secrets.RELEASE_PUBLISHER_SUBJECT }}"

      - name: Restore
        run: dotnet restore src/Wavee.UI.WinUI/Wavee.UI.WinUI.csproj

      - name: Build & package MSIX (unsigned)
        shell: pwsh
        run: |
          # IMPORTANT: do NOT pass /p:RuntimeIdentifier — that flag triggers
          # WMC9999 in the WinUI XAML compiler. Platform alone is enough.
          # AppxPackageSigningEnabled=false leaves the .msix unsigned for the
          # separate sign job.
          msbuild src/Wavee.UI.WinUI/Wavee.UI.WinUI.csproj `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxBundle=Never `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\AppPackages\\" `
            /restore

      - name: Upload unsigned MSIX
        uses: actions/upload-artifact@v4
        with:
          name: wavee-${{ matrix.platform }}-msix-unsigned
          path: AppPackages/**/*.msix
          if-no-files-found: error
          retention-days: 14

  sign:
    name: Sign MSIX (x64)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download unsigned MSIX (both arches)
        uses: actions/download-artifact@v4
        with:
          pattern: wavee-*-msix-unsigned
          path: AppPackages
          merge-multiple: true

      - name: Sign MSIX with Azure Artifact Signing
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\AppPackages
          files-folder-filter: msix
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload signed MSIX
        uses: actions/upload-artifact@v4
        with:
          name: wavee-signed-msix
          path: AppPackages/**/*.msix
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [version, sign]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: wavee-signed-msix
          path: artifacts

      - name: Generate .appinstaller for auto-update
        shell: pwsh
        run: |
          $channel = if ('${{ needs.version.outputs.prerelease }}' -eq 'true') { 'experimental' } else { 'stable' }
          pwsh ./signing/Generate-AppInstaller.ps1 `
            -Tag "${{ needs.version.outputs.tag }}" `
            -Channel $channel `
            -OutputDirectory ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            artifacts/**/*.msix
            artifacts/*.appinstaller
          generate_release_notes: true
          # Production (master) publishes as a DRAFT for review; pre-releases
          # auto-publish for a fast tester loop.
          draft: ${{ needs.version.outputs.prerelease != 'true' }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

      - name: Update experimental-latest rolling release (auto-update channel)
        if: needs.version.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROLLING=experimental-latest
          # GitHub has no "latest pre-release" download alias, so the experimental
          # .appinstaller auto-update channel points at a FIXED rolling release. Ensure it
          # exists, drop its old versioned MSIX (so they don't accumulate), then upload this
          # build's assets so the stable URLs always serve the newest version. The per-tag
          # v<ver>-<label>.N release above stays as the changelog/history archive.
          if ! gh release view "$ROLLING" >/dev/null 2>&1; then
            gh release create "$ROLLING" \
              --prerelease \
              --title "Experimental (latest)" \
              --notes "Rolling pointer to the newest experimental build, consumed by the .appinstaller auto-update channel. Managed by CI — do not delete."
          fi
          for asset in $(gh release view "$ROLLING" --json assets --jq '.assets[] | select(.name | endswith(".msix")) | .name'); do
            gh release delete-asset "$ROLLING" "$asset" -y || true
          done
          ASSETS=$(find artifacts -type f \( -name '*.msix' -o -name '*.appinstaller' \))
          gh release upload "$ROLLING" $ASSETS --clobber
