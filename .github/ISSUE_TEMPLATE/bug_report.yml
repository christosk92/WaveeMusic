name: Bug report
description: Something doesn't work the way it should
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        - App crashed, froze, or won't launch? Use the **Crash or hang** form instead — it captures the crash
          report the app already saved for you.
        - Rendering glitches, garbled text, blurry UI, or input not landing where you clicked are usually the
          **FluentGpu** engine, not Wavee — please file those at
          [fluent-gpu/issues](https://github.com/christosk92/fluent-gpu/issues/new/choose).
        - Just have a question? Use [Discussions › Q&A](https://github.com/christosk92/WaveeMusic/discussions/categories/q-a)
          instead of an issue.
  - type: input
    id: version
    attributes:
      label: Wavee version
      description: Settings › About
      placeholder: "0.2.5 Breaker (0.2.5.6) — from Settings › About"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - Microsoft Store
        - Sideloaded (.appinstaller or .msix from GitHub)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Not sure
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` if you're not sure
      placeholder: "Windows 11 24H2 (build 26100)"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics info
      description: Settings › Diagnostics › **Copy diagnostics info**, then paste here.
      render: text
  - type: textarea
    id: log-lines
    attributes:
      label: Relevant log lines
      description: |
        Settings › Diagnostics › **Open log folder** → `logs\wavee.log`. Paste only the relevant lines, and please
        remove anything personal before posting.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this one
          required: true
        - label: This also happens in the official Spotify client
          required: false
