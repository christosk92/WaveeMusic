name: Crash or hang
description: Wavee crashes, freezes, or won't launch
title: "[Crash]: "
labels: ["type: crash", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The **Crash report** field below is the most useful thing you can attach —
        please don't skip it.
  - type: input
    id: version
    attributes:
      label: Wavee version
      description: Settings › About
      placeholder: "0.2.5 Breaker (0.2.5.6) — from Settings › About"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - Microsoft Store
        - Sideloaded (.appinstaller or .msix from GitHub)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
        - Not sure
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` if you're not sure
      placeholder: "Windows 11 24H2 (build 26100)"
  - type: dropdown
    id: when
    attributes:
      label: When does it happen
      options:
        - On launch
        - During playback
        - When switching video on or off
        - When navigating pages
        - After an update
        - Randomly
        - Other
    validations:
      required: true
  - type: dropdown
    id: reproduces
    attributes:
      label: Does it reproduce
      options:
        - Every time
        - Sometimes
        - Once so far
  - type: textarea
    id: what-were-you-doing
    attributes:
      label: What were you doing
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report
      description: |
        Settings › Diagnostics shows the last crash report — paste it whole. If the app won't start at all, the
        report is also saved in `logs\wavee.log` inside the log folder.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this one
          required: true
