name: Crash or hang
description: Wavee crashes, freezes, or won't launch
title: "[Crash]: "
labels: ["type: crash", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The **Crash report** field below is the most useful thing you can attach —
        please don't skip it.
  - type: input
    id: version
    attributes:
      label: Wavee version
      description: Settings › About
      placeholder: "0.2.5 Breaker (0.2.5.6) — from Settings › About"
    validations:
      required: true
  - type: input
    id: install-source
    attributes:
      label: Install source
      description: Microsoft Store · Sideloaded (.appinstaller or .msix from GitHub) · Built from source. Wavee's Report a problem… fills this in.
      placeholder: Microsoft Store
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      description: x64 or ARM64 (Settings › About shows it). Wavee's Report a problem… fills this in.
      placeholder: x64
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` if you're not sure
      placeholder: "Windows 11 24H2 (build 26100)"
  - type: dropdown
    id: when
    attributes:
      label: When does it happen
      options:
        - On launch
        - During playback
        - When switching video on or off
        - When navigating pages
        - After an update
        - Randomly
        - Other
    validations:
      required: true
  - type: dropdown
    id: reproduces
    attributes:
      label: Does it reproduce
      options:
        - Every time
        - Sometimes
        - Once so far
  - type: textarea
    id: what-were-you-doing
    attributes:
      label: What were you doing
  # An input, never a dropdown: Wavee prefills it through the issue-form URL (?report-id=…), and GitHub's URL
  # params prefill inputs and textareas but never dropdowns.
  - type: input
    id: report-id
    attributes:
      label: Crash report id
      description: "Settings › Privacy & diagnostics › Crash reports shows it on each report, e.g. 3f9c-2b1a"
      placeholder: "3f9c-2b1a"
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report
      description: |
        In Wavee, open **Settings › About › Report a problem…** (or the prompt shown after a crash) — it copies
        the redacted crash report to your clipboard and saves it as `wavee-report-<date>.txt` next to the logs;
        paste it here whole. Raw reports are listed in **Settings › Privacy & diagnostics › Crash reports** (a
        report's **…** › **View** opens one, **Open folder** shows them all); each one is
        `logs\crash\<stamp>-<kind>\report.txt`. If the app won't start, the folder is `%LOCALAPPDATA%\Wavee\logs\crash` — for a Microsoft Store or MSIX install, the
        package's LocalCache equivalent (`%LOCALAPPDATA%\Packages\cproducts.Wavee_*\LocalCache\Local\Wavee\logs\crash`).
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this one
          required: true
