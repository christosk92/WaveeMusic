name: Crash or hang
description: Wavee crashes, freezes, or won't launch
title: "[Crash]: "
labels: ["type: crash", "status: needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The **Crash report** field below is the most useful thing you can attach —
        please don't skip it.
  - type: input
    id: version
    attributes:
      label: Wavee version
      description: Settings › About
      placeholder: "0.2.5 Breaker (0.2.5.6) — from Settings › About"
    validations:
      required: true
  - type: input
    id: install-source
    attributes:
      label: Install source
      description: Microsoft Store · Sideloaded (.appinstaller or .msix from GitHub) · Built from source. Wavee's Report a problem… fills this in.
      placeholder: Microsoft Store
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      description: x64 or ARM64 (Settings › About shows it). Wavee's Report a problem… fills this in.
      placeholder: x64
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` if you're not sure
      placeholder: "Windows 11 24H2 (build 26100)"
  - type: dropdown
    id: when
    attributes:
      label: When does it happen
      options:
        - On launch
        - During playback
        - When switching video on or off
        - When navigating pages
        - After an update
        - Randomly
        - Other
    validations:
      required: true
  - type: dropdown
    id: reproduces
    attributes:
      label: Does it reproduce
      options:
        - Every time
        - Sometimes
        - Once so far
  - type: textarea
    id: what-were-you-doing
    attributes:
      label: What were you doing
  - type: textarea
    id: crash-report
    attributes:
      label: Crash report
      description: |
        In Wavee, open **Settings › About › Report a problem…** (or the prompt shown after a crash) — it copies
        the redacted crash report to your clipboard and saves it as `wavee-report-<date>.txt` next to the logs;
        paste it here whole. Raw reports: `crash-report-<date>.txt` in the log folder (**Settings › Diagnostics ›
        Crash reports › Open**); if the app won't start, the folder is `%LOCALAPPDATA%\Wavee\logs`.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find this one
          required: true
