// Capture-verified subset of Spotify's Connect TransferState wire schema.
syntax = "proto3";

package transfer;

import "player.proto";

option optimize_for = CODE_SIZE;
option csharp_namespace = "Wavee.Protocol.Transfer";

message TransferState {
  TransferPlayerOptions options = 1;
  TransferPlayback playback = 2;
  TransferSession current_session = 3;
  TransferQueue queue = 4;
}

message TransferPlayerOptions {
  bool shuffling_context = 1;
  bool repeating_context = 2;
  bool repeating_track = 3;
  // Capture-verified (dealer-20260828.bin, an inbound "transfer" command's base64 data blob): field 5 here is the
  // SAME wire-identical map-entry shape as connectstate.ContextPlayerOptions.modes (player.proto) — same field
  // number, same {key,value} encoding, an explicit empty "media" value round-tripping the same way. The captured
  // entries were context_enhancement/jam/media/video_persistence — i.e. our own PutState's ContextPlayerOptions.modes,
  // carried straight through into the TransferState the server hands the target on a Connect hand-off. Reuses
  // connectstate.ModeEntry rather than a proto3 map for the same reason player.proto's own modes field does.
  repeated connectstate.ModeEntry modes = 5;
}

message TransferPlayback {
  int64 timestamp = 1;
  int64 position_as_of_timestamp = 2;
  double speed = 3;
  bool paused = 4;
  TransferContextTrack current_track = 5;
}

message TransferSession {
  string device_id = 1;
  TransferContext context = 2;
  string current_uid = 3;
}

message TransferQueue {
  repeated TransferContextTrack tracks = 1;
  bool is_playing_queue = 2;
}

message TransferContext {
  string uri = 1;
  string url = 2;
  map<string, string> metadata = 3;
  bool loading = 6;
}

message TransferContextTrack {
  string uri = 1;
  string uid = 2;
  bytes gid = 3;
  map<string, string> metadata = 4;
}

