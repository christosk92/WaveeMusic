<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty playlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" sel="library" crumb="Library › Playlists" ctx="My playlist #12" items="Songs|Recommended|About" sub-sel="{{zero}}" hint-size="1440px,136px"></dc-import>
  <main style="height: 740px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px 36px 0 36px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div style="display: flex; gap: 24px; align-items: flex-end">
      <span style="width: 168px; height: 168px; flex-shrink: 0; border-radius: 8px; background: var(--sub); border: 1px dashed var(--strong); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: var(--t2)"><svg width="40" height="40" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12.5V4l7-1.5v8.5M6 12.5a1.8 1.8 0 1 1-3.6 0 1.8 1.8 0 0 1 3.6 0zM13 11a1.8 1.8 0 1 1-3.6 0 1.8 1.8 0 0 1 3.6 0z" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
        <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Playlist · Private</span>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 68px; line-height: 92px; font-weight: 600">My playlist #12</h1>
        <span style="font-size: 14px; line-height: 20px; color: var(--t2)">Christos · 0 songs</span>
        <span style="display: flex; gap: 8px; padding-top: 12px">
          <button disabled style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--accdis); color: var(--dis); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
          <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--t1); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg>Edit details</button>
        </span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 0 20px 0; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb)">
      <span style="width: 64px; height: 64px; border-radius: 32px; background: var(--sub); display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round"></path></svg></span>
      <h2 style="margin: 4px 0 0 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">This playlist is empty</h2>
      <span style="font-size: 14px; line-height: 20px; color: var(--t2)">Find songs to add, or drag them here from anywhere in Wavee.</span>
      <label style="margin-top: 8px; width: 420px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; box-sizing: border-box; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-bottom: 1px solid var(--strong); font-size: 14px; color: var(--t2)"><span style="flex-grow: 1">Search for songs or episodes</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></label>
    </div>
    <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Recommended</h2><span style="font-size: 12px; color: var(--t2)">Based on your Liked Songs</span><span style="flex-grow: 1"></span><button style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--acct); font: inherit; font-size: 14px">Refresh</button></div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{recs}}" as="r" hint-placeholder-count="4">
        <div role="row" style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 320px 88px; align-items: center; height: 52px; margin-top: 2px; padding-left: 8px; border-radius: 4px"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2)">{{r.a}}</span></span><span style="font-size: 14px; color: var(--t2)">{{r.al}}</span><button style="height: 32px; padding: 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px">Add</button></div>
      </sc-for>
    </div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" variant="music" pane="none" hint-size="1440px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', strong: 'rgba(255,255,255,0.5442)', t1: '#ffffff', t2: '#c5c5c5', dis: '#5d5d5d', accdis: 'rgba(255,255,255,0.1581)', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', strong: 'rgba(0,0,0,0.4458)', t1: '#1b1b1b', t2: '#626262', dis: '#ffffff', accdis: 'rgba(0,0,0,0.2169)', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const recs = [['Nightcall', 'Kavinsky', 'OutRun', '#6b2f4a'], ['Midnight City', 'M83', 'Hurry Up, We’re Dreaming', '#3b4a6b'], ['Sunset', 'The Midnight', 'Endless Summer', '#6b4a2f'], ['Resonance', 'HOME', 'Odyssey', '#2f5b6b']].map((d) => ({ t: d[0], a: d[1], al: d[2], art: 'width: 40px; height: 40px; border-radius: 4px; background: ' + d[3] }));
  return { vars, theme, accent, recs, zero: 0 };
}
}
</script>
</body>
</html>
