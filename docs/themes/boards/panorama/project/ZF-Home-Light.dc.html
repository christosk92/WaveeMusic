<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1400px; overflow: hidden; background: #f3f3f3">
  <dc-import name="ZF-Home" theme="light" accent="{{accent}}" panel="none" h="{{h}}" hint-size="1440px,1400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
renderVals() {
  return { accent: this.props.accent ?? 'windows', h: 1400 };
}
}
</script>
</body>
</html>
