<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Show, small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="small" sel="library" ctx="The Rest Is Football" items="Episodes|About" sub-sel="{{zero}}" lower="{{lower}}" hint-size="800px,136px"></dc-import>
  <main style="height: 380px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 0 24px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div style="display: flex; gap: 20px; align-items: flex-end; flex-shrink: 0">
      <span aria-hidden="true" style="width: 112px; height: 112px; flex-shrink: 0; border-radius: 8px; background: linear-gradient(160deg, #3b6b4a, #1f3a2a)"></span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
        <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Podcast · <a href="#" style="color: var(--acct)">Goalhanger</a> · 4.8 · 12K ratings · 812 episodes</span>
        <h1 title="The Rest Is Football" style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The Rest Is Football</h1>
        <span style="display: flex; gap: 8px; align-items: center">
          <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--acc); color: var(--onacc); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Resume · 24 min left</button>
          <button aria-pressed="true" style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="color: var(--acct)"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Following</button>
          <button aria-label="Share" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M5 5.5l3-3 3 3M3.5 9v3.5h9V9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          <button aria-label="More" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
        </span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 32px; flex-shrink: 0">
      <div role="group" aria-label="Filter episodes" style="display: flex; gap: 8px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><button aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button></sc-for>
      </div>
      <span style="flex-grow: 1"></span>
      <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--t1); font: inherit; font-size: 14px">Newest first<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
    <section aria-label="Episodes" style="display: flex; flex-direction: column; margin-top: -4px">
      <sc-for list="{{episodes}}" as="e" hint-placeholder-count="2">
        <div role="row" style="{{e.row}}">
          <span style="{{e.art}}"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <a href="#" style="{{e.title}}">{{e.name}}</a>
            <span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.blurb}}</span>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: var(--t2); font-variant-numeric: tabular-nums"><sc-if value="{{e.isNew}}" hint-placeholder-val="{{ false }}"><span style="color: var(--acct); font-weight: 600">New</span></sc-if>{{e.meta}}<sc-if value="{{e.hasBar}}" hint-placeholder-val="{{ false }}"><span style="width: 64px; height: 3px; border-radius: 2px; background: var(--div); display: block"><span style="{{e.fill}}"></span></span></sc-if><span style="{{e.stateStyle}}">{{e.state}}</span><sc-if value="{{e.cached}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-label="On this PC" role="img"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"></circle><path d="M8 4.8v5.4M5.8 8.2 8 10.4l2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if></span>
          </span>
          <button aria-label="{{e.actionLabel}}" style="{{e.btn}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{e.icon}}" fill="currentColor"></path></svg></button>
        </div>
      </sc-for>
    </section>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="small" variant="podcast" hint-size="800px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', div: 'rgba(255,255,255,0.0837)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', div: 'rgba(0,0,0,0.0803)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const PLAY = 'M4.5 2.8v10.4L13 8z', PAUSE = 'M4 3h3v10H4zM9 3h3v10H9z';
  const chips = [['All', '812'], ['Unplayed', '690'], ['Played', '120']].map((c, i) => ({ label: c[0] + ' · ' + c[1], pressed: i === 0 ? 'true' : 'false',
    style: 'height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 14px; ' + (i === 0 ? 'border: 1px solid transparent; background: var(--acc); color: var(--onacc)' : 'background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1)') }));
  const eps = [
    ['Why the Premier League keeps changing', 'Gary, Alan and Micah on the rule changes nobody asked for, and the ones that worked.', '#812 · Thu 9 Oct · 48 min', 'playing', 49, '24 min left', true],
    ['The north London derby, revisited', 'Ninety minutes, three red cards and a press conference to remember.', '#811 · Wed 8 Oct · 52 min', 'new', 0, '', true]
  ];
  const episodes = eps.map((d) => { const st = d[3]; const playing = st === 'playing'; return { name: d[0], blurb: d[1], meta: d[2], state: d[5], isNew: st === 'new', hasBar: playing, cached: d[6],
    actionLabel: (playing ? 'Pause ' : 'Play ') + d[0], icon: playing ? PAUSE : PLAY,
    row: 'display: grid; grid-template-columns: 72px minmax(0, 1fr) 48px; align-items: center; height: 80px; margin-top: 2px; padding-left: 8px; border-radius: 4px; ' + (playing ? 'background: var(--sub)' : ''),
    art: 'width: 56px; height: 56px; border-radius: 4px; display: block; background: linear-gradient(160deg, #3b6b4a, #1f3a2a)',
    title: 'font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (playing ? 'var(--acct)' : 'var(--t1)'),
    fill: 'display: block; height: 3px; border-radius: 2px; background: var(--acc); width: ' + d[4] + '%',
    stateStyle: 'color: ' + (playing ? 'var(--acct)' : 'var(--t2)'),
    btn: 'width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 18px; font: inherit; ' + (playing ? 'border: 0; background: var(--acc); color: var(--onacc)' : 'background: var(--ctrl); border: 1px solid var(--ctrlb); color: var(--t1)') }; });
  return { vars, theme, accent, chips, episodes, zero: 0, lower: !!(this.props.lower ?? false) };
}
}
</script>
</body>
</html>
