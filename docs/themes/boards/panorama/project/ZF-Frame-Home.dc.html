<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frame: home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; background: #202020">
  <dc-import name="ZF-Home" theme="{{theme}}" accent="{{accent}}" panel="none" lower="{{lower}}" h="{{h}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  return { theme: this.props.theme ?? 'dark', accent: this.props.accent ?? 'windows', lower: !!(this.props.lower ?? false), h: 900 };
}
}
</script>
</body>
</html>
