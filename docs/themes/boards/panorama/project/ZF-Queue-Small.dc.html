<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Queue, small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="small" sel="none" ctx="Play queue" items="Up next|History" sub-sel="{{zero}}" hint-size="800px,136px"></dc-import>
  <main style="height: 380px; flex-shrink: 0; box-sizing: border-box; display: flex; gap: 32px; padding: 16px 24px 0 24px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <section aria-label="Now playing" style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
      <span style="width: 160px; height: 160px; border-radius: 8px; background: linear-gradient(150deg, #8a3b5e, #3b1f33); display: block"></span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 12px; line-height: 16px; color: var(--t2)">Now playing</span><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nightcall</span><span style="font-size: 14px; line-height: 20px"><a href="#" style="color: var(--acct)">Kavinsky</a> · <a href="#" style="color: var(--acct)">OutRun</a></span></span>
      <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Playing from <a href="#" style="color: var(--acct)">late night drive</a> · shuffle on</span>
      <span style="display: flex; gap: 8px">
        <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9.5V7a3 3 0 0 1 3-3M3 9.5h3v3H3zM10 9.5V7a3 3 0 0 1 3-3M10 9.5h3v3h-3z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg>Lyrics</button>
        <button style="height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px">Go to album</button>
      </span>
    </section>
    <section aria-label="Up next" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 4px; height: 36px; flex-shrink: 0">
        <button aria-label="Save as playlist" style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>Save</button>
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--t1); font: inherit; font-size: 14px">Clear queue</button>
        <span style="flex-grow: 1"></span>
        <button aria-label="More" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px; height: 36px; flex-shrink: 0; padding-left: 8px; box-sizing: border-box; padding-top: 4px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Next in queue</h2><span style="font-size: 12px; color: var(--t2)">2 songs you added</span></div>
      <sc-for list="{{queued}}" as="r" hint-placeholder-count="2">
        <div role="row" style="{{r.row}}"><span style="display: flex; justify-content: center; color: var(--t3)"><sc-if value="{{r.hover}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-label="Drag to reorder" role="img"><circle cx="6" cy="4" r="1" fill="currentColor"></circle><circle cx="10" cy="4" r="1" fill="currentColor"></circle><circle cx="6" cy="8" r="1" fill="currentColor"></circle><circle cx="10" cy="8" r="1" fill="currentColor"></circle><circle cx="6" cy="12" r="1" fill="currentColor"></circle><circle cx="10" cy="12" r="1" fill="currentColor"></circle></svg></sc-if></span><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; color: var(--t3); font-variant-numeric: tabular-nums">{{r.n}}</span><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span></span><span style="text-align: right; font-size: 14px; color: var(--t2); font-variant-numeric: tabular-nums">{{r.d}}</span><span style="display: flex; justify-content: center"><sc-if value="{{r.hover}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 16 16" aria-label="Remove" role="img"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></sc-if></span></div>
      </sc-for>
      <div style="display: flex; align-items: baseline; gap: 10px; height: 40px; flex-shrink: 0; padding: 8px 0 0 8px; box-sizing: border-box"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Next up from late night drive</h2><span style="font-size: 12px; color: var(--t2); white-space: nowrap">39 songs</span></div>
      <sc-for list="{{upNext}}" as="r" hint-placeholder-count="2">
        <div role="row" style="{{r.row}}"><span></span><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; color: var(--t3); font-variant-numeric: tabular-nums">{{r.n}}</span><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span></span><span style="text-align: right; font-size: 14px; color: var(--t2); font-variant-numeric: tabular-nums">{{r.d}}</span><span></span></div>
      </sc-for>
    </section>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="small" variant="music" pane="queue" hint-size="800px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  let n = 0;
  const mk = (list) => list.map((d) => { n += 1; return { n: String(n), t: d[0], a: d[1], d: d[2], hover: !!d[4],
    row: 'display: grid; grid-template-columns: 24px 32px 52px minmax(0, 1fr) 48px 32px; align-items: center; height: 52px; flex-shrink: 0; margin-top: 2px; border-radius: 4px; ' + (d[4] ? 'background: var(--sub)' : ''),
    art: 'width: 40px; height: 40px; border-radius: 4px; background: ' + d[3] }; });
  const queued = mk([['Get Lucky', 'Daft Punk, Pharrell Williams', '6:09', '#3a2f22', false], ['Instant Crush', 'Daft Punk, Julian Casablancas', '5:37', '#3a2f22', true]]);
  const upNext = mk([['Resonance', 'HOME', '3:32', '#2f5b6b'], ['Tech Noir', 'Gunship', '4:57', '#5b3b6b']]);
  return { vars, theme, accent, queued, upNext, zero: 0 };
}
}
</script>
</body>
</html>
