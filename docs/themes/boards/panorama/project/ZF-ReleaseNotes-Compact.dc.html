<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What’s new, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="compact" sel="none" items="1.7.0-beta.1|1.6.0|1.5.2|1.5.0|1.4.1|1.4.0" sub-sel="{{one}}" lower="{{lower}}" hint-size="400px,136px"></dc-import>
  <main style="height: 660px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0 16px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <h1 style="margin: 0; flex-shrink: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">What’s new in Aurora</h1>
    <div style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
      <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Since you last looked: 3 releases · 1.4.0 → 1.6.0</span>
      <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Wavee 1.6.0 “Aurora”</h2>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
      <sc-for list="{{highlights}}" as="h" hint-placeholder-count="3">
        <a href="#" style="display: grid; grid-template-columns: 32px minmax(0, 1fr) 24px; column-gap: 12px; align-items: center; min-height: 68px; padding: 10px 12px; box-sizing: border-box; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb); color: var(--t1)"><span style="{{h.swatch}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{h.d}}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600">{{h.title}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2)">{{h.text}}</span></span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      </sc-for>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; flex-shrink: 0">
        <h3 style="margin: 0; height: 32px; display: flex; align-items: flex-end; padding-bottom: 4px; box-sizing: border-box; font-size: 14px; line-height: 20px; font-weight: 600">{{g.title}}</h3>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 60px; padding: 8px 0; box-sizing: border-box; border-top: 1px solid var(--div)">
            <span style="font-size: 14px; line-height: 20px">{{r.text}}</span>
            <span style="display: flex; align-items: center; gap: 8px"><a href="#" style="{{r.chip}}">{{r.issue}}</a><span style="{{r.avatar}}"></span><span style="font-size: 12px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.who}}</span></span>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="compact" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', div: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff', ok: '#6ccb5f' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', div: 'rgba(0,0,0,0.0803)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92', ok: '#0f7b0f' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const highlights = [['Four themes', 'Wavee Classic, WinUI, Zune and Panorama, each with its own options.', 'M8 1.5a6.5 6.5 0 1 0 0 13c1 0 1.3-.8.9-1.5-.5-.9 0-2 1.1-2h1.5a3 3 0 0 0 3-3C14.5 4.3 11.6 1.5 8 1.5z'], ['The pivot band', 'Sections across the top, your pins beside them, no sidebar.', 'M2 4h12M2 8h7M2 12h9'], ['Liked Songs, grouped', 'This week, last week, then the months.', 'M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z']].map((d) => ({ title: d[0], text: d[1], d: d[2],
    swatch: 'width: 32px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; align-self: start; background: var(--sub); color: var(--acct)' }));
  const chip = 'height: 22px; display: inline-flex; align-items: center; padding: 0 8px; border-radius: 11px; white-space: nowrap; flex-shrink: 0; font-size: 12px; background: var(--sub); color: var(--ok)';
  const avatar = (c) => 'width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; background: ' + c;
  const groups = [
    { title: 'Added', rows: [['Themes: Wavee Classic, WinUI, Zune and Panorama, each with its own options', '#210 closed', 'christosk92', '#5b6b3b'], ['Liked Songs groups by week and month when sorted by date added', '#203 closed', 'christosk92', '#5b6b3b'], ['The pivot band shows up to six pins beside the sections', '#205 closed', 'jvisser · first contribution', '#6b2f4a']] },
    { title: 'Changed', rows: [['The right panel sits inline from 1008 wide and floats below that', '#198 closed', 'christosk92', '#5b6b3b'], ['Track rows: the playing song is drawn in the accent, with no plate', '#201 closed', 'christosk92', '#5b6b3b']] }
  ].map((g) => ({ title: g.title, rows: g.rows.map((r) => ({ text: r[0], issue: r[1], who: r[2], avatar: avatar(r[3]), chip })) }));
  return { vars, theme, accent, highlights, groups, one: 1, lower: !!(this.props.lower ?? false) };
}
}
</script>
</body>
</html>
