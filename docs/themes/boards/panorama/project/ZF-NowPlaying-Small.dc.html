<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now playing, small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 800px; height: 600px; box-sizing: border-box; overflow: hidden; color: #ffffff; background: radial-gradient(70% 90% at 22% 42%, #c0613e 0%, #8a4e7a 30%, #2a1424 62%, #141014 100%); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.32)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 4px; padding-left: 4px">
    <button aria-label="Exit full screen" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8h-11M6.5 3.5 2.5 8l4 4.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <span style="font-size: 12px; margin-left: 8px">Wavee</span>
    <span style="flex-grow: 1"></span>
    <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
    <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M13.5 10H10v3.5M2.5 10H6v3.5" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
    <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></span>
  </div>
  <nav aria-label="Full screen views" style="position: absolute; left: 12px; top: 48px; height: 40px; display: flex">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><a href="#" style="{{t.style}}">{{t.label}}<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: var(--acc)"></span></sc-if></a></sc-for>
  </nav>
  <div style="position: absolute; left: 48px; top: 108px; right: 48px; display: flex; gap: 32px; align-items: flex-end">
    <span style="width: 240px; height: 240px; flex-shrink: 0; border-radius: 8px; background: linear-gradient(150deg, #a8456f, #4a1f38); box-shadow: 0 24px 48px rgba(0,0,0,0.37)"></span>
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
      <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.78)">Playing from late night drive</span>
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nightcall</h1>
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; color: rgba(255,255,255,0.86); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kavinsky · OutRun</span>
      <span style="display: flex; gap: 8px; padding-top: 12px">
        <button aria-label="Saved to Liked Songs" style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #ffffff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg>Saved</button>
        <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #ffffff; font: inherit; font-size: 14px">Go to album</button>
      </span>
      <div style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 8px 12px; max-width: 300px; box-sizing: border-box; border-radius: 8px; background: rgba(44,44,44,0.6); border: 1px solid rgba(255,255,255,0.0837)">
        <span style="font-size: 12px; color: rgba(255,255,255,0.78)">Up next</span>
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; background: #3a2f22"></span>
        <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px">Get Lucky</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Daft Punk, Pharrell Williams</span></span>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 80px; bottom: 20px; width: 640px; box-sizing: border-box; padding: 10px 16px 8px 16px; border-radius: 8px; background: rgba(44,44,44,0.78); border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">1:14</span>
      <div style="position: relative; flex-grow: 1; height: 18px; display: flex; align-items: center"><div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></div><div style="position: absolute; left: 0; width: 29%; height: 4px; border-radius: 2px; background: var(--acc)"></div><div style="position: absolute; left: calc(29% - 9px); width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.0698); background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: var(--acc)"></span></div></div>
      <span style="width: 36px; text-align: right; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">-3:04</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
      <span style="display: flex; gap: 2px">
        <button aria-label="Shuffle, on" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--acct)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Repeat" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4H13M11 2l2 2-2 2M13 9v1.5a1.5 1.5 0 0 1-1.5 1.5H3M5 14l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </span>
      <span style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Previous" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3.5v9L5.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Pause" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 24px; background: var(--acc); color: #000000"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button aria-label="Next" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      </span>
      <span style="display: flex; justify-content: flex-end; align-items: center; gap: 2px">
        <button aria-label="Volume" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4h2.5L8 13V3L5 6zM10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="More" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"view":{"editor":"enum","options":["now","lyrics","queue","details"],"default":"now"},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const pink = (this.props.accent ?? 'windows') === 'pink';
  const T = { acc: pink ? '#ff7ac3' : '#60cdff', acct: pink ? '#ffb3dd' : '#99ebff' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const view = this.props.view ?? 'now';
  const tabs = [['now', 'Now playing'], ['lyrics', 'Lyrics'], ['queue', 'Queue'], ['details', 'Details']].map((t) => ({ label: t[1], on: t[0] === view,
    style: 'position: relative; height: 40px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: ' + (t[0] === view ? '#ffffff' : 'rgba(255,255,255,0.78)') }));
  return { vars, tabs };
}
}
</script>
</body>
</html>
