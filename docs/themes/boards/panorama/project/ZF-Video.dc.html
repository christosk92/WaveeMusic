<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video, full screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 1440px; height: 960px; box-sizing: border-box; overflow: hidden; color: #ffffff; background: #000000; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div role="img" aria-label="Nightcall (Official Video), playing" style="position: absolute; left: 0; top: 75px; width: 1440px; height: 810px; overflow: hidden; background: linear-gradient(180deg, #0b1220 0%, #1b2a3a 48%, #3a1f3a 62%, #120c16 100%)">
    <span aria-hidden="true" style="position: absolute; left: 50%; top: 380px; width: 900px; height: 160px; margin-left: -450px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,92,170,0.45), rgba(255,92,170,0))"></span>
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 500px; height: 1px; background: rgba(255,150,210,0.35)"></span>
    <span aria-hidden="true" style="position: absolute; left: 610px; top: 560px; width: 220px; height: 70px; border-radius: 30px 30px 8px 8px; background: #0a0a10; box-shadow: 0 0 0 1px rgba(255,255,255,0.06)"></span>
    <span aria-hidden="true" style="position: absolute; left: 626px; top: 606px; width: 24px; height: 8px; border-radius: 4px; background: #ff4f6a"></span>
    <span aria-hidden="true" style="position: absolute; left: 790px; top: 606px; width: 24px; height: 8px; border-radius: 4px; background: #ff4f6a"></span>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0))"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; gap: 4px; padding-left: 4px">
    <button aria-label="Exit full screen" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8h-11M6.5 3.5 2.5 8l4 4.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <span style="font-size: 12px; margin-left: 8px">Wavee</span>
    <span style="flex-grow: 1"></span>
    <span style="font-size: 14px; line-height: 20px">Nightcall (Official Video) <span style="color: rgba(255,255,255,0.78)">· <a href="#" style="color: inherit">Kavinsky</a></span></span>
    <span style="flex-grow: 1"></span>
    <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; margin-right: 8px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #ffffff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12V3.5l7-1.5v8.5M6 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM13 10.5a2 2 0 1 1-4 0 2 2 0 0 1 4 0z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg>Switch to audio</button>
    <span aria-hidden="true" style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
    <span aria-hidden="true" style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M13.5 10H10v3.5M2.5 10H6v3.5" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
    <span aria-hidden="true" style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></span>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%)"></div>
  <sc-if value="{{menu}}" hint-placeholder-val="{{ true }}">
    <div role="menu" aria-label="Video options" style="position: absolute; right: 288px; bottom: 116px; width: 280px; box-sizing: border-box; padding: 4px; border-radius: 8px; background: rgba(44,44,44,0.96); border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column; font-size: 14px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><button role="menuitemradio" aria-checked="{{m.checked}}" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 4px; background: {{m.bg}}; color: #ffffff; font: inherit; font-size: 14px; text-align: left"><span style="{{m.dot}}"></span><span style="flex-grow: 1">{{m.label}}</span><span style="font-size: 12px; color: #c5c5c5">{{m.key}}</span></button></sc-for>
      <span style="height: 1px; margin: 4px -4px; background: rgba(255,255,255,0.0837)"></span>
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button role="menuitem" aria-haspopup="menu" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 32px; border: 0; border-radius: 4px; background: transparent; color: #ffffff; font: inherit; font-size: 14px; text-align: left"><span style="flex-grow: 1">{{o.label}}</span><span style="font-size: 12px; color: #c5c5c5">{{o.value}}</span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></sc-for>
      <span style="height: 1px; margin: 4px -4px; background: rgba(255,255,255,0.0837)"></span>
      <button role="menuitem" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #ffffff; font: inherit; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4h9v8h-9zM10.5 7l4-2.5v7l-4-2.5M2 2l12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Turn off video</button>
    </div>
  </sc-if>
  <div style="position: absolute; left: 50%; bottom: 32px; width: 1040px; margin-left: -520px; box-sizing: border-box; padding: 12px 20px 10px 20px; border-radius: 8px; background: rgba(44,44,44,0.78); border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 40px; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">1:14</span>
      <div role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="258" aria-valuenow="74" aria-valuetext="1:14 of 4:18" style="position: relative; flex-grow: 1; height: 18px; display: flex; align-items: center"><div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></div><div style="position: absolute; left: 0; width: 29%; height: 4px; border-radius: 2px; background: var(--acc)"></div><div style="position: absolute; left: calc(29% - 9px); width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.0698); background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: var(--acc)"></span></div></div>
      <span style="width: 40px; text-align: right; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">-3:04</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
      <span style="display: flex; align-items: center; gap: 2px">
        <button aria-label="Volume" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4h2.5L8 13V3L5 6zM10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <span role="slider" aria-label="Volume level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" style="position: relative; width: 96px; height: 18px; display: flex; align-items: center"><span style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></span><span style="position: absolute; left: 0; width: 70%; height: 4px; border-radius: 2px; background: var(--acc)"></span><span style="position: absolute; left: calc(70% - 9px); width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.0698); background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--acc)"></span></span></span>
      </span>
      <span style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Previous" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3.5v9L5.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Pause" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 24px; background: var(--acc); color: #000000"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button aria-label="Next" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      </span>
      <span style="display: flex; justify-content: flex-end; align-items: center; gap: 2px">
        <span style="font-size: 12px; color: #c5c5c5; margin-right: 8px">1080p · Fit</span>
        <button aria-label="Save to Liked Songs" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
        <button aria-label="Mini player" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3h13v10h-13zM8.5 8.5h4.5V12H8.5z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Video options" aria-haspopup="menu" aria-expanded="{{menuOpen}}" style="{{moreBtn}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
        <button aria-label="Exit full screen" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M13.5 10H10v3.5M2.5 10H6v3.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"menu":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const pink = (this.props.accent ?? 'windows') === 'pink';
  const T = { acc: pink ? '#ff7ac3' : '#60cdff', acct: pink ? '#ffb3dd' : '#99ebff' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const menu = !!(this.props.menu ?? true);
  const modes = [['Dock in the panel', '', false], ['Play in the mini player', '', false], ['Play in a separate window', '', false], ['Full screen', 'F11', true]].map((m) => ({ label: m[0], key: m[1], checked: m[2] ? 'true' : 'false',
    bg: m[2] ? 'rgba(255,255,255,0.0605)' : 'transparent',
    dot: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; box-sizing: border-box; ' + (m[2] ? 'background: var(--acc)' : 'border: 1px solid rgba(255,255,255,0.5442)') }));
  const opts = [['Aspect ratio', 'Fit'], ['Quality', 'Auto'], ['Playback speed', '1×']].map((o) => ({ label: o[0], value: o[1] }));
  return { vars, menu, menuOpen: menu ? 'true' : 'false', modes, opts,
    moreBtn: 'width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; color: #ffffff; background: ' + (menu ? 'rgba(255,255,255,0.0605)' : 'transparent') };
}
}
</script>
</body>
</html>
