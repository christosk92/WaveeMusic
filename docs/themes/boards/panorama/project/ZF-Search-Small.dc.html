<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search, small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="small" sel="none" query="midnight" search-open="{{yes}}" items="All|Songs:412|Albums:38|Playlists:120|Artists:14|Podcasts &amp; shows:6|Episodes:41|Profiles:3" sub-sel="{{zero}}" hint-size="800px,136px"></dc-import>
  <main style="height: 380px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 16px 24px 0 24px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div style="display: flex; gap: 28px">
      <section style="width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Top result</h2>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb)">
          <span style="width: 120px; height: 120px; border-radius: 4px; background: linear-gradient(135deg, #3b4a6b, #6b2f6b)"></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Midnight City</span><span style="font-size: 14px; line-height: 20px; color: var(--t2)">Song · <a href="#" style="color: var(--acct)">M83</a> · Hurry Up, We're Dreaming</span></span>
          <span style="display: flex; gap: 8px; align-items: center">
            <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--acc); color: var(--onacc); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
            <button aria-label="Add to queue" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h7M2.5 12h7M11.5 9.5v4.5l3.5-2.25z" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
            <button aria-label="Save to Liked Songs" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
          </span>
        </div>
      </section>
      <section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0 0 4px 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Best matches</h2>
        <sc-for list="{{hits}}" as="h" hint-placeholder-count="5"><a href="#" style="{{h.row}}"><span style="{{h.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.sub}}</span></span></a></sc-for>
      </section>
    </div>
    <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Playlists</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all 120</a></div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="small" variant="music" hint-size="800px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const hits = [['The Midnight', 'Artist · 2.1M monthly listeners', '#6b4a2f', true, false], ['Midnights', 'Album · Taylor Swift · 2022', '#4a3b5b', false, true], ['Midnight City (Eric Prydz Remix)', 'Song · M83, Eric Prydz', '#2f4a5b', false, false], ['late night drive', 'Playlist · Christos · 42 songs', '#3b4a6b', false, false], ['Midnight Mass', 'Podcast · 48 episodes', '#2f4a3b', false, false]].map((d) => ({ name: d[0], sub: d[1],
    row: 'display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; height: 52px; padding: 0 8px; border-radius: 4px; color: var(--t1); ' + (d[4] ? 'background: var(--sub)' : ''),
    art: 'width: 40px; height: 40px; border-radius: ' + (d[3] ? '20px' : '4px') + '; background: ' + d[2] }));
  return { vars, theme, accent, hits, zero: 0, yes: true };
}
}
</script>
</body>
</html>
