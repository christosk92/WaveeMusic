<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="compact" sel="library" items="Liked|Playlists|Albums|Artists|Podcasts|Audiobooks" sub-sel="{{zero}}" hint-size="400px,136px"></dc-import>
  <main style="height: 660px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0 16px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div role="status" style="display: grid; grid-template-columns: 28px minmax(0, 1fr) 32px; gap: 0 4px; padding: 12px 4px 12px 12px; box-sizing: border-box; border-radius: 4px; background: var(--warnbg); border: 1px solid var(--cardb)">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="margin-top: 2px"><circle cx="8" cy="8" r="7" fill="var(--warn)"></circle><path d="M8 4.5v4M8 10.8v.4" fill="none" stroke="var(--onwarn)" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600">You're offline</span><span style="font-size: 14px; line-height: 20px">Showing music this device has kept. Wavee reconnects by itself.</span><button style="align-self: flex-start; margin-top: 8px; height: 40px; padding: 0 14px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px">Try now</button></span>
      <button aria-label="Close" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
    </div>
    <div style="display: flex; align-items: flex-end; gap: 12px">
      <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Liked Songs</h1><span style="font-size: 12px; line-height: 16px; color: var(--t2)">412 songs · 288 available offline</span></span>
      <button aria-pressed="true" style="height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: 4px; background: var(--acc); color: var(--onacc); font: inherit; font-size: 14px; white-space: nowrap">Available offline</button>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div role="row" style="{{r.row}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px">{{r.t}}</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--t2)"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="{{r.iconStyle}}"><path d="{{r.icon}}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{r.state}} · {{r.a}}</span></span></div>
      </sc-for>
    </div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="compact" variant="music" hint-size="400px,64px"></dc-import>
  <div style="position: absolute; inset: 0; background: var(--smoke); display: flex; align-items: center; justify-content: center; padding: 0 16px">
    <div role="dialog" aria-modal="true" aria-labelledby="dlg-c" style="width: 100%; border-radius: 8px; overflow: hidden; background: var(--dlg); border: 1px solid var(--flyb); box-shadow: 0 32px 64px rgba(0,0,0,0.37)">
      <div style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <h2 id="dlg-c" style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Can't play “Midnight City” right now</h2>
        <p style="margin: 0; font-size: 14px; line-height: 20px">This device hasn't kept this song and you're offline. Wavee can play it as soon as you're back online.</p>
        <label style="min-height: 40px; display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 4px; background: var(--acc); color: var(--onacc); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></span>Add it to the queue for later</label>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 20px; background: var(--mica); border-top: 1px solid var(--div)">
        <button style="height: 40px; border: 0; border-radius: 4px; background: var(--acc); color: var(--onacc); font: inherit; font-size: 14px">Play offline songs</button>
        <button style="height: 40px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px">Close</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', dlg: '#2b2b2b', stroke: 'rgba(255,255,255,0.0837)', div: 'rgba(255,255,255,0.0837)', cardb: 'rgba(0,0,0,0.1)', flyb: 'rgba(0,0,0,0.2)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', warn: '#fce100', onwarn: '#000000', warnbg: '#433519', smoke: 'rgba(0,0,0,0.3)', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', dlg: '#ffffff', stroke: 'rgba(0,0,0,0.0578)', div: 'rgba(0,0,0,0.0803)', cardb: 'rgba(0,0,0,0.0578)', flyb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', warn: '#9d5d00', onwarn: '#ffffff', warnbg: '#fff4ce', smoke: 'rgba(0,0,0,0.3)', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const kept = 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM8 4.5v6M5.5 8l2.5 2.5L10.5 8';
  const cloud = 'M4.5 12.5h7a3 3 0 0 0 .4-6A4 4 0 0 0 4.3 7a2.8 2.8 0 0 0 .2 5.5zM2 2l12 12';
  const rows = [['Nightcall', 'Kavinsky', '#6b2f4a', true], ['Supernova', 'aespa', '#5b2f4a', true], ['Midnight City', 'M83', '#3b4a6b', false], ['Hostage', 'Gunship', '#2f4a3b', true], ['Get Lucky', 'Daft Punk, Pharrell Williams', '#3a2f22', false], ['Heroes', 'The Midnight', '#2f3b6b', true]].map((d) => ({ t: d[0], a: d[1], state: d[3] ? 'Available offline' : 'Needs a connection', icon: d[3] ? kept : cloud,
    iconStyle: 'flex-shrink: 0; color: ' + (d[3] ? 'var(--acct)' : 'var(--t2)'),
    row: 'display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; height: 52px; margin-top: 2px; border-radius: 4px; ' + (d[3] ? '' : 'opacity: 0.45'),
    art: 'width: 40px; height: 40px; border-radius: 4px; background: ' + d[2] }));
  return { vars, theme, accent, rows, zero: 0 };
}
}
</script>
</body>
</html>
