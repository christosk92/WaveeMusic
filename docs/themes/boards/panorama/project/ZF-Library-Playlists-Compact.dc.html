<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection playlists, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="compact" sel="library" items="Liked|Playlists|Albums:312|Artists:184|Podcasts|Audiobooks" sub-sel="{{one}}" lower="{{lower}}" hint-size="400px,136px"></dc-import>
  <main style="height: 660px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 0 16px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div style="display: flex; align-items: center; gap: 4px; height: 40px; flex-shrink: 0">
      <button style="height: 40px; display: inline-flex; align-items: center; gap: 12px; padding: 0 10px 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px">Recently played<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <span style="flex-grow: 1"></span>
      <span style="font-size: 12px; color: var(--t2); margin-right: 4px">27</span>
      <button aria-label="New playlist or folder" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
      <button aria-label="Find in playlists" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section aria-label="{{g.label}}" style="display: flex; flex-direction: column; flex-shrink: 0">
        <h2 style="margin: 0; height: 40px; display: flex; align-items: flex-end; padding-bottom: 4px; box-sizing: border-box; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">{{g.label}}</h2>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
          <div style="{{r.row}}"><a href="#" style="{{r.link}}"><span style="{{r.art}}"><sc-if value="{{r.folder}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4h4.2l1.5 1.5h7.3v7h-13z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></sc-if></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="{{r.name}}">{{r.n}}</span><span style="{{r.subStyle}}">{{r.sub}}</span></span><sc-if value="{{r.cached}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-label="On this PC" role="img" style="flex-shrink: 0; color: var(--t2)"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"></circle><path d="M8 4.8v5.4M5.8 8.2 8 10.4l2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><sc-if value="{{r.playing}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-label="Playing" role="img" style="flex-shrink: 0"><path d="M3 13V7M6.5 13V3M10 13V8M13.5 13V5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></sc-if></a><button aria-label="{{r.more}}" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><sc-if value="{{r.folder}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><sc-if value="{{r.notFolder}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></sc-if></button></div>
        </sc-for>
      </section>
    </sc-for>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="compact" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const row = (d) => {
    const k = d[3] || '', on = k.indexOf('open') >= 0, folder = k === 'folder', child = k.indexOf('child') >= 0, cached = k.indexOf('pc') >= 0;
    return { n: d[0], sub: d[1], playing: on, folder, notFolder: !folder, cached,
      more: folder ? 'Collapse ' + d[0] : 'More options for ' + d[0],
      row: 'display: flex; align-items: center; gap: 4px; height: 52px; flex-shrink: 0; ' + (child ? 'margin-left: 16px; padding-left: 8px; border-left: 2px solid var(--sub)' : ''),
      link: 'flex-grow: 1; min-width: 0; height: 52px; display: flex; align-items: center; gap: 12px; color: ' + (on ? 'var(--acct)' : 'var(--t1)'),
      art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: var(--t2); ' + (folder ? 'background: var(--ctrl); border: 1px solid var(--ctrlb)' : 'background: ' + d[2]),
      name: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (on ? 'var(--acct); font-weight: 600' : 'var(--t1)'),
      subStyle: 'font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (on ? 'var(--acct)' : 'var(--t2)') };
  };
  const groups = [
    { label: 'Made by you', rows: [['late night drive', 'Christos and 2 others · 42 songs', '#3b4a6b', 'open pc'], ['k-pop gym', 'Christos · 64 songs', '#5b2f6b', 'pc'], ['moods', 'Folder · 3 playlists', '', 'folder'], ['focus flow', '88 songs', '#2f5b4a', 'child'], ['rainy sunday', '31 songs', '#3b4a5b', 'child pc']].map(row) },
    { label: 'Made for you', rows: [['Daily Mix 1', 'Spotify · The Midnight, FM-84', '#4a3b6b', ''], ['Discover Weekly', 'Spotify · Updated Monday', '#2f5b4a', ''], ['Release Radar', 'Spotify · Updated Friday', '#5b4a2f', '']].map(row) },
    { label: 'Followed', rows: [['Synthwave Essentials', 'Spotify · 120 songs', '#2f5b6b', '']].map(row) }
  ];
  return { vars, theme, accent, groups, one: 1, lower: !!(this.props.lower ?? false) };
}
}
</script>
</body>
</html>
