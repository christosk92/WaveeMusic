<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse category</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" sel="browse" crumb="Browse › Genres" ctx="Synthwave" items="Top|For you|Genres|Charts|Concerts" sub-sel="{{two}}" lower="{{lower}}" hint-size="1440px,136px"></dc-import>
  <main style="height: 740px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 16px 36px 0 36px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <section aria-label="Synthwave" style="position: relative; height: 160px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: linear-gradient(120deg, #5b2f6b 0%, #2f2a5b 55%, #1d1826 100%); color: #ffffff">
      <span aria-hidden="true" style="position: absolute; right: 120px; top: 22px; width: 220px; height: 220px; border-radius: 110px; background: linear-gradient(180deg, rgba(255,122,195,0.55), rgba(255,170,90,0.18)); display: block"></span>
      <span aria-hidden="true" style="position: absolute; right: 120px; top: 110px; width: 220px; height: 50px; background: repeating-linear-gradient(180deg, rgba(29,24,38,0) 0px, rgba(29,24,38,0) 6px, rgba(29,24,38,0.9) 6px, rgba(29,24,38,0.9) 10px); display: block"></span>
      <div style="position: absolute; left: 24px; right: 420px; bottom: 14px; display: flex; flex-direction: column">
        <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.86)">Genre · Electronic</span>
        <h1 title="Synthwave" style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 68px; line-height: 92px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Synthwave</h1>
      </div>
      <div style="position: absolute; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 12px">
        <span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.86)">1,240 playlists · updated daily</span>
        <button aria-label="Share Synthwave" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: rgba(255,255,255,0.14); color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M5 5.5l3-3 3 3M3.5 9v3.5h9V9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </div>
    </section>
    <div role="group" aria-label="Styles" style="display: flex; align-items: center; gap: 8px; height: 32px; flex-shrink: 0">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><button aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button></sc-for>
    </div>
    <div style="display: flex; gap: 48px; min-height: 0">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px">
        <section aria-label="Popular playlists" style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: baseline; gap: 12px; height: 28px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Popular playlists</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all</a></div>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
            <sc-for list="{{playlists}}" as="t" hint-placeholder-count="6"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--t1)"><span style="{{t.art}}"></span><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></a></sc-for>
          </div>
        </section>
        <section aria-label="New releases" style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: baseline; gap: 12px; height: 28px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">New releases</h2><span style="font-size: 12px; color: var(--t2)">This week</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all</a></div>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
            <sc-for list="{{releases}}" as="t" hint-placeholder-count="6"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--t1)"><span style="{{t.art}}"></span><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></a></sc-for>
          </div>
        </section>
      </div>
      <section aria-label="Synthwave artists" style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column">
        <div style="display: flex; align-items: baseline; gap: 12px; height: 36px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Synthwave artists</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all</a></div>
        <sc-for list="{{artists}}" as="r" hint-placeholder-count="8"><a href="#" style="{{r.row}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span><span style="{{r.tagStyle}}">{{r.tag}}</span></a></sc-for>
      </section>
    </div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" variant="music" pane="none" hint-size="1440px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', div: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', div: 'rgba(0,0,0,0.0803)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const sq = (c) => 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; display: block; background: ' + c;
  const chips = ['All', 'Outrun', 'Darksynth', 'Dreamwave', 'Synthpop', 'Chillwave'].map((l, i) => ({ label: l, pressed: i === 0 ? 'true' : 'false',
    style: 'height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 14px; ' + (i === 0 ? 'border: 1px solid transparent; background: var(--acc); color: var(--onacc)' : 'background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1)') }));
  const playlists = [['Synthwave Essentials', 'Spotify · 1.2M saves', '#2f5b6b'], ['Outrun Nights', 'Spotify · 640K saves', '#6b2f4a'], ['Darksynth', 'Spotify · 410K saves', '#3b2f2f'], ['Night Drive', 'Spotify · 2.3M saves', '#2f3b6b'], ['Dreamwave', 'Spotify · 290K saves', '#5b3b6b'], ['Neon Focus', 'Spotify · 180K saves', '#4a3b2f']].map((d) => ({ name: d[0], sub: d[1], art: sq(d[2]) }));
  const releases = [['Heroes', 'Album · The Midnight', '#2f3b6b'], ['Hostage', 'Single · Gunship', '#2f4a3b'], ['Leather Teeth', 'Album · Carpenter Brut', '#3b2f2f'], ['Odyssey', 'Album · HOME', '#2f5b6b'], ['Nightdrive', 'Album · FM-84', '#6b2f4a'], ['Atlas', 'Album · Timecop1983', '#4a3b6b']].map((d) => ({ name: d[0], sub: d[1], art: sq(d[2]) }));
  const artists = [['The Midnight', '2.1M monthly listeners', '#5b3b2f', 'Following'], ['Kavinsky', '4.8M monthly listeners', '#6b2f4a', 'Following'], ['HOME', '2.6M monthly listeners', '#2f5b6b', ''], ['Gunship', '980K monthly listeners', '#5b3b6b', 'Following'], ['FM-84', '1.3M monthly listeners', '#4a3b2f', ''], ['Carpenter Brut', '1.1M monthly listeners', '#6b2f2f', ''], ['Perturbator', '1.4M monthly listeners', '#3b2f4a', ''], ['Timecop1983', '760K monthly listeners', '#2f3b4a', '']].map((d, i) => ({ name: d[0], sub: d[1], tag: d[3],
    row: 'display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; height: 52px; margin-top: 2px; padding: 0 8px; border-radius: 4px; color: var(--t1); ' + (i === 2 ? 'background: var(--sub)' : ''),
    art: 'width: 40px; height: 40px; border-radius: 20px; display: block; background: ' + d[2],
    tagStyle: 'font-size: 12px; line-height: 16px; color: var(--acct); white-space: nowrap' }));
  return { vars, theme, accent, chips, playlists, releases, artists, two: 2, lower: !!(this.props.lower ?? false) };
}
}
</script>
</body>
</html>
