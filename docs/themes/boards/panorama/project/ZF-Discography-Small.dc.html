<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discography, small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="small" sel="none" ctx="The Weeknd" items="Overview|Albums|Singles &amp; EPs|Compilations|About" sub-sel="{{none}}" actions="artist" lower="{{lower}}" hint-size="800px,136px"></dc-import>
  <main style="height: 380px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 16px 24px 0 24px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div style="display: flex; gap: 20px; align-items: flex-end; flex-shrink: 0">
      <span aria-hidden="true" style="width: 112px; height: 112px; flex-shrink: 0; border-radius: 56px; background: radial-gradient(120% 120% at 60% 30%, #6b4a7a, #2a2236); display: block"></span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
        <span style="font-size: 12px; line-height: 16px; color: var(--t2)"><a href="#" style="color: var(--acct)">The Weeknd</a> · 34 releases · 2011–2025</span>
        <h1 title="Discography" style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Discography</h1>
        <div style="display: flex; align-items: center; gap: 8px; padding-top: 4px">
          <div role="group" aria-label="Release type" style="display: flex; gap: 8px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button></sc-for>
          </div>
          <span style="flex-grow: 1"></span>
          <div role="group" aria-label="View" style="display: flex; padding: 2px; gap: 2px; border-radius: 6px; background: var(--ctrl); border: 1px solid var(--ctrlb)">
            <button aria-label="List" aria-pressed="true" style="width: 32px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: var(--sub); color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
            <button aria-label="Grid" aria-pressed="false" style="width: 32px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
          </div>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <section aria-label="Hurry Up Tomorrow" style="display: flex; flex-direction: column; padding: 0 8px 4px 8px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb)">
        <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) auto 32px 32px; align-items: center; gap: 4px; height: 56px">
          <span style="width: 40px; height: 40px; border-radius: 4px; background: linear-gradient(160deg, #6a3434, #2a1a1a); display: block"></span>
          <span style="display: flex; flex-direction: column; min-width: 0"><a href="#" style="font-size: 14px; line-height: 20px; font-weight: 600; color: var(--t1)">Hurry Up Tomorrow</a><span style="font-size: 12px; line-height: 16px; color: var(--t2)">Album · 2025 · 22 songs, 84 min</span></span>
          <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--acc); color: var(--onacc); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
          <button aria-label="More" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
          <button aria-label="Hide songs of Hurry Up Tomorrow" aria-expanded="true" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10 8 5.5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        </div>
        <div role="table" aria-label="Songs on Hurry Up Tomorrow" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, auto); grid-auto-flow: column; column-gap: 24px">
          <sc-for list="{{tracks}}" as="r" hint-placeholder-count="6"><div role="row" style="{{r.row}}"><span style="font-size: 14px; color: var(--t3); font-variant-numeric: tabular-nums; padding-left: 8px">{{r.n}}</span><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="text-align: right; padding-right: 8px; font-size: 14px; color: var(--t2); font-variant-numeric: tabular-nums">{{r.d}}</span></div></sc-for>
        </div>
      </section>
      <sc-for list="{{collapsed}}" as="r" hint-placeholder-count="2"><div role="row" style="{{r.row}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><a href="#" style="font-size: 14px; line-height: 20px; font-weight: 600; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</a><span style="font-size: 12px; line-height: 16px; color: var(--t2)">{{r.meta}}</span></span><button aria-label="Show songs of {{r.t}}" aria-expanded="false" style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--t1); font: inherit; font-size: 14px">{{r.count}}<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div></sc-for>
    </div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="small" variant="music" hint-size="800px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const chips = ['All', 'Albums', 'Singles & EPs', 'Compilations'].map((l, i) => ({ label: l, pressed: i === 0 ? 'true' : 'false',
    style: 'height: 32px; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 14px; white-space: nowrap; ' + (i === 0 ? 'border: 1px solid transparent; background: var(--acc); color: var(--onacc)' : 'background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1)') }));
  const tracks = [['Wake Me Up', '5:08'], ['Cry for Me', '3:44'], ['I Can’t Wait to Get There', '3:47'], ['São Paulo', '5:01'], ['Until We’re Skin & Bones', '1:39'], ['Baptized in Fear', '3:52']].map((d, i) => ({ n: String(i + 1), t: d[0], d: d[1],
    row: 'display: grid; grid-template-columns: 32px minmax(0, 1fr) 52px; align-items: center; height: 40px; border-radius: 4px; ' + (i === 3 ? 'background: var(--sub)' : '') }));
  const collapsed = [['Dawn FM', 'Album · 2022', '16 songs', '#2a3a5a'], ['Dancing in the Flames', 'Single · 2024', '1 song', '#5a3a2a']].map((d) => ({ t: d[0], meta: d[1], count: d[2],
    row: 'display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; align-items: center; height: 56px; padding: 0 8px; border-radius: 8px',
    art: 'width: 40px; height: 40px; border-radius: 4px; display: block; background: ' + d[3] }));
  return { vars, theme, accent, chips, tracks, collapsed, none: -1, lower: !!(this.props.lower ?? false) };
}
}
</script>
</body>
</html>
