<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="compact" sel="home" items="All|Music|Podcasts|Audiobooks" sub-sel="{{zero}}" lower="{{lower}}" back="{{no}}" hint-size="400px,136px"></dc-import>
  <main style="height: 660px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 16px 0 0 16px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <section style="display: flex; flex-direction: column; gap: 10px; padding-right: 16px">
      <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Pins</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; line-height: 40px; color: var(--acct)">Edit</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{pins}}" as="p" hint-placeholder-count="4"><a href="#" style="height: 52px; display: flex; align-items: center; gap: 10px; padding-right: 8px; border-radius: 4px; overflow: hidden; background: var(--card); border: 1px solid var(--cardb); color: var(--t1)"><span style="{{p.art}}"></span><span style="{{p.nameStyle}}">{{p.name}}</span></a></sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 12px; padding-right: 16px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">History</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; line-height: 40px; color: var(--acct)">See all</a></div>
      <div style="display: flex; gap: 12px; overflow: hidden">
        <sc-for list="{{history}}" as="t" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; width: 108px; flex-shrink: 0; color: var(--t1)"><span style="{{t.art}}"></span><span style="{{t.nameStyle}}">{{t.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></a></sc-for>
      </div>
    </section>
    <section aria-label="Your daylist" style="margin-right: 16px; display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb)">
      <div style="display: flex; gap: 12px; align-items: center">
        <span style="width: 88px; height: 88px; flex-shrink: 0; border-radius: 4px; background: linear-gradient(135deg, #4a2f5b, #7a3b6b)"></span>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Your daylist · next at 18:00</span>
          <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">sad girl synth-pop tuesday afternoon</span>
          <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Playlist · 50 songs</span>
        </div>
      </div>
      <span style="display: flex; gap: 8px; align-items: center">
        <button style="{{s.acc}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
        <button style="{{s.std}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Shuffle</button>
        <span style="flex-grow: 1"></span>
        <button aria-label="Save to library" style="{{s.icon}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="More" style="{{s.icon}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      </span>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px; padding-right: 16px">
      <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Made for you</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{mixes}}" as="t" hint-placeholder-count="2"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--t1)"><span style="{{t.art}}"></span><span style="font-size: 14px; line-height: 20px">{{t.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></a></sc-for>
      </div>
    </section>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="compact" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const s = {
    acc: 'height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--acc); color: var(--onacc); font: inherit; font-size: 14px',
    std: 'height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px',
    icon: 'width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)'
  };
  const pins = [['late night drive', '#3b4a6b', true], ['Liked Songs', 'linear-gradient(135deg, #4a3b8b, #7a8bd1)', false], ['OutRun', '#6b2f4a', false], ['Odyssey', '#2f5b6b', false]].map((d) => ({ name: d[0],
    art: 'width: 50px; height: 50px; flex-shrink: 0; background: ' + d[1],
    nameStyle: 'font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[2] ? 'var(--acct)' : 'var(--t1)') }));
  const history = [['OutRun', 'Playing', '#6b2f4a', true], ['Endless Summer', 'The Midnight', '#6b4a2f', false], ['Trilogy', 'Carpenter Brut', '#6b2f2f', false], ['Heroes', 'The Midnight', '#2f3b6b', false]].map((d) => ({ name: d[0], sub: d[1],
    art: 'width: 108px; height: 108px; border-radius: 8px; display: block; background: ' + d[2],
    nameStyle: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[3] ? 'var(--acct)' : 'var(--t1)') }));
  const mixes = [['Daily Mix 1', 'The Midnight, FM-84, Timecop1983', '#4a3b6b'], ['Daily Mix 2', 'aespa, NewJeans, ILLIT', '#6b3b5b']].map((d) => ({ name: d[0], sub: d[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; display: block; background: ' + d[2] }));
  return { vars, theme, accent, s, pins, history, mixes, zero: 0, no: false, lower: !!(this.props.lower ?? false) };
}
}
</script>
</body>
</html>
