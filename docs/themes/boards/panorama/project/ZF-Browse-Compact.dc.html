<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="compact" sel="browse" items="Top|For you|Genres|Charts|Concerts" sub-sel="{{zero}}" hint-size="400px,136px"></dc-import>
  <main style="height: 660px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 16px 16px 0 16px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Genres &amp; moods</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all 60</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6"><a href="#" style="{{t.style}}">{{t.name}}</a></sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Charts</h2><span style="font-size: 12px; color: var(--t2)">Updated daily</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">All charts</a></div>
      <sc-for list="{{charts}}" as="c" hint-placeholder-count="4"><a href="#" style="display: grid; grid-template-columns: 32px 52px minmax(0, 1fr); align-items: center; height: 56px; border-radius: 4px; color: var(--t1)"><span style="padding-left: 4px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; color: var(--t3); font-variant-numeric: tabular-nums">{{c.n}}</span><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2)">{{c.sub}}</span></span></a></sc-for>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">New releases</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{releases}}" as="r" hint-placeholder-count="2"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--t1)"><span style="{{r.art}}"></span><span style="font-size: 14px; line-height: 20px">{{r.name}}</span></a></sc-for>
      </div>
    </section>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="compact" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const tiles = [['Pop', '#8d2f5b'], ['Hip-hop', '#2f5b8d'], ['Electronic', '#2f7a6b'], ['Rock', '#8d4a2f'], ['K-pop', '#7a2f8d'], ['Synthwave', '#5b2f6b']].map((t) => ({ name: t[0],
    style: 'height: 64px; box-sizing: border-box; display: flex; align-items: flex-end; padding: 10px 12px; border-radius: 8px; color: #ffffff; font-size: 14px; line-height: 20px; font-weight: 600; background: linear-gradient(135deg, ' + t[1] + ', ' + t[1] + 'cc)' }));
  const charts = [['1', 'Top 50 · Global', 'Playlist · Updated today', '#2f5b8d'], ['2', 'Top 50 · Netherlands', 'Playlist · Updated today', '#8d4a2f'], ['3', 'Viral 50 · Global', 'Playlist · Updated today', '#2f7a6b'], ['4', 'Top Songs · Global', 'Weekly chart', '#5b2f6b']].map((c) => ({ n: c[0], name: c[1], sub: c[2], art: 'width: 44px; height: 44px; border-radius: 4px; background: ' + c[3] }));
  const releases = [['Hurry Up Tomorrow', '#4a2a2a'], ['Heroes', '#2f3b6b']].map((r) => ({ name: r[0], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; display: block; background: ' + r[1] }));
  return { vars, theme, accent, tiles, charts, releases, zero: 0 };
}
}
</script>
</body>
</html>
