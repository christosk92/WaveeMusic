<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" sel="browse" items="Overview|Charts|New releases|Genres &amp; moods|Podcasts|Live events" sub-sel="{{zero}}" hint-size="1440px,136px"></dc-import>
  <main style="height: 740px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; padding: 20px 36px 0 36px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <section style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Genres &amp; moods</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all 60</a></div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="12"><a href="#" style="{{t.style}}">{{t.name}}</a></sc-for>
      </div>
    </section>
    <div style="display: flex; gap: 48px">
      <section style="width: 420px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Charts</h2><span style="font-size: 12px; color: var(--t2)">Updated daily</span></div>
        <sc-for list="{{charts}}" as="c" hint-placeholder-count="6"><a href="#" style="{{c.row}}"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; color: var(--t3); font-variant-numeric: tabular-nums">{{c.n}}</span><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px">{{c.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2)">{{c.sub}}</span></span></a></sc-for>
      </section>
      <section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">New releases</h2><span style="font-size: 12px; color: var(--t2)">This week</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{releases}}" as="r" hint-placeholder-count="10"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--t1)"><span style="{{r.art}}"></span><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></a></sc-for>
        </div>
      </section>
    </div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" variant="music" pane="none" hint-size="1440px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const tiles = [['Pop', '#8d2f5b'], ['Hip-hop', '#2f5b8d'], ['Electronic', '#2f7a6b'], ['Rock', '#8d4a2f'], ['K-pop', '#7a2f8d'], ['Indie', '#4a6b2f'], ['Chill', '#2f6b7a'], ['Workout', '#8d2f2f'], ['Focus', '#3b4a6b'], ['Party', '#8d6b2f'], ['Sleep', '#2f3b5b'], ['Synthwave', '#5b2f6b']].map((t) => ({ name: t[0],
    style: 'height: 96px; box-sizing: border-box; display: flex; align-items: flex-end; padding: 12px 14px; border-radius: 8px; color: #ffffff; font-size: 14px; line-height: 20px; font-weight: 600; background: linear-gradient(135deg, ' + t[1] + ', ' + t[1] + 'cc)' }));
  const charts = [['1', 'Top 50 · Global', 'Playlist · Updated today', '#2f5b8d'], ['2', 'Top 50 · Netherlands', 'Playlist · Updated today', '#8d4a2f'], ['3', 'Viral 50 · Global', 'Playlist · Updated today', '#2f7a6b'], ['4', 'Top Songs · Global', 'Weekly chart', '#5b2f6b'], ['5', 'Top Albums · Netherlands', 'Weekly chart', '#8d2f5b'], ['6', 'Top Podcasts · Netherlands', 'Daily chart', '#3b4a6b']].map((c) => ({ n: c[0], name: c[1], sub: c[2],
    row: 'display: grid; grid-template-columns: 40px 52px minmax(0, 1fr); align-items: center; height: 56px; padding: 0 8px; border-radius: 4px; color: var(--t1)',
    art: 'width: 44px; height: 44px; border-radius: 4px; background: ' + c[3] }));
  const releases = [['Hurry Up Tomorrow', 'The Weeknd', '#4a2a2a'], ['Heroes', 'The Midnight', '#2f3b6b'], ['Supernova', 'aespa', '#5b2f4a'], ['Hostage', 'Gunship', '#2f4a3b'], ['Get Up', 'NewJeans', '#3b5b6b'], ['Leather Teeth', 'Carpenter Brut', '#3b2f2f'], ['Dimension', 'Jacob Banks', '#2f3b5b'], ['Odyssey', 'HOME', '#2f5b6b'], ['Nightdrive', 'FM-84', '#6b2f4a'], ['Atlas', 'Timecop1983', '#4a3b6b']].map((r) => ({ name: r[0], sub: 'Album · ' + r[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + r[2] + '; display: block' }));
  return { vars, theme, accent, tiles, charts, releases, zero: 0 };
}
}
</script>
</body>
</html>
