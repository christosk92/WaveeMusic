<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artist, small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="small" sel="none" ctx="The Weeknd" items="Overview|Albums|Singles &amp; EPs|Compilations|About" sub-sel="{{zero}}" actions="artist" hint-size="800px,136px"></dc-import>
  <main style="height: 380px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 16px 24px 0 24px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <section aria-label="The Weeknd" style="position: relative; height: 160px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: radial-gradient(120% 160% at 75% 30%, #6b4a7a 0%, #3a2f4a 45%, #1d1826 100%); color: #ffffff">
      <span style="position: absolute; right: 260px; top: 16px; width: 130px; height: 144px; border-radius: 65px 65px 0 0; background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03))"></span>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.55))"></div>
      <div style="position: absolute; left: 20px; bottom: 14px; display: flex; flex-direction: column; gap: 0">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 9.8 3l2.3-.2.6 2.2 2 1.2-.9 2.1.9 2.1-2 1.2-.6 2.2-2.3-.2L8 14.5 6.2 13l-2.3.2-.6-2.2-2-1.2.9-2.1-.9-2.1 2-1.2.6-2.2 2.3.2z" fill="#60cdff"></path><path d="M5.5 8.2 7.2 9.9l3.4-3.6" fill="none" stroke="#000000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>Verified artist</span>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">The Weeknd</h1>
        <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.86)">#3 in the world · 118M monthly listeners</span>
      </div>
      <span style="position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center">
        <button style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--acc); color: var(--onacc); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
        <button aria-pressed="true" style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #ffffff; font: inherit; font-size: 14px">Following</button>
        <button aria-label="More" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      </span>
    </section>
    <div style="display: flex; gap: 28px; min-height: 0">
      <section style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Popular</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: var(--acct)">Show 10 more</a></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div role="row" style="{{r.row}}"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; color: var(--t3); font-variant-numeric: tabular-nums; padding-left: 8px">{{r.n}}</span><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2)">{{r.plays}}</span></span><span style="text-align: right; padding-right: 8px; font-size: 14px; color: var(--t2); font-variant-numeric: tabular-nums">{{r.time}}</span></div></sc-for>
      </section>
      <section style="width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Latest release</h2>
        <a href="#" style="display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb); color: var(--t1)"><span style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 4px; background: #4a2a2a"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600">Hurry Up Tomorrow</span><span style="font-size: 12px; line-height: 16px; color: var(--t2)">Album · 2025 · 22 songs</span></span></a>
      </section>
    </div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="small" variant="music" hint-size="800px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', sub: 'rgba(255,255,255,0.0605)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', sub: 'rgba(0,0,0,0.0373)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const data = [['Blinding Lights', '4.9B', '3:20', '#7a2a2a'], ['Starboy', '3.8B', '3:50', '#5a2a3a'], ['Save Your Tears', '3.2B', '3:35', '#3a2a5a']];
  const rows = data.map((d, i) => ({ n: String(i + 1), t: d[0], plays: d[1] + ' plays', time: d[2],
    row: 'display: grid; grid-template-columns: 44px 52px minmax(0, 1fr) 56px; align-items: center; height: 52px; margin-top: 2px; border-radius: 4px; ' + (i === 1 ? 'background: var(--sub)' : ''),
    art: 'width: 40px; height: 40px; border-radius: 4px; background: ' + d[3] }));
  return { vars, theme, accent, rows, zero: 0 };
}
}
</script>
</body>
</html>
