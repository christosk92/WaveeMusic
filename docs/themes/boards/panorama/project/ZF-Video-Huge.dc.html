    <span style="height: 1px; margin: 8px -12px; background: rgba(255,255,255,0.0837)"></span>
    <span style="font-size: 12px; line-height: 16px; color: #c5c5c5; padding: 0 4px">From the album</span>
    <a href="#" style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 4px; border-radius: 4px; color: #ffffff"><span style="width: 56px; height: 56px; border-radius: 4px; background: linear-gradient(150deg, #a8456f, #4a1f38)"></span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px">OutRun</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Kavinsky · 2013 · 13 songs</span></span></a>

      <span style="height: 1px; margin: 4px -4px; background: rgba(255,255,255,0.0837)"></span>
      <button role="menuitem" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #ffffff; font: inherit; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4h9v8h-9zM10.5 7l4-2.5v7l-4-2.5M2 2l12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Turn off video</button>
    </div>
  </sc-if>
  <div style="position: absolute; left: 50%; bottom: 40px; width: 1440px; margin-left: -720px; box-sizing: border-box; padding: 14px 24px 12px 24px; border-radius: 8px; background: rgba(44,44,44,0.78); border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 44px; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">1:14</span>
      <div role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="258" aria-valuenow="74" aria-valuetext="1:14 of 4:18" style="position: relative; flex-grow: 1; height: 18px; display: flex; align-items: center"><div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></div><div style="position: absolute; left: 0; width: 29%; height: 4px; border-radius: 2px; background: var(--acc)"></div><div style="position: absolute; left: calc(29% - 9px); width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.0698); background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: var(--acc)"></span></div></div>
      <span style="width: 44px; text-align: right; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">-3:04</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center">
      <span style="display: flex; align-items: center; gap: 12px; min-width: 0">
        <span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 4px; background: linear-gradient(150deg, #a8456f, #4a1f38)"></span>
        <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nightcall (Official Video)</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Kavinsky</span></span>
        <button aria-label="Save to Liked Songs" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
      </span>
      <span style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Shuffle" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Previous" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3.5v9L5.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Pause" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 24px; background: var(--acc); color: #000000"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button aria-label="Next" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Repeat" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4H13M11 2l2 2-2 2M13 9v1.5a1.5 1.5 0 0 1-1.5 1.5H3M5 14l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </span>
      <span style="display: flex; justify-content: flex-end; align-items: center; gap: 2px">
        <span style="font-size: 12px; color: #c5c5c5; margin-right: 8px">1080p · Fit</span>

        <span role="slider" aria-label="Volume level" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" style="position: relative; width: 140px; height: 18px; margin-right: 8px; display: flex; align-items: center"><span style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></span><span style="position: absolute; left: 0; width: 70%; height: 4px; border-radius: 2px; background: var(--acc)"></span><span style="position: absolute; left: calc(70% - 9px); width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.0698); background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--acc)"></span></span></span>

        <button aria-label="Exit full screen" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M13.5 10H10v3.5M2.5 10H6v3.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"menu":{"editor":"boolean","default":true},"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const pink = (this.props.accent ?? 'windows') === 'pink';
  const T = { acc: pink ? '#ff7ac3' : '#60cdff', acct: pink ? '#ffb3dd' : '#99ebff' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const menu = !!(this.props.menu ?? true);
  const modes = [['Dock in the panel', '', false], ['Play in the mini player', '', false], ['Play in a separate window', '', false], ['Full screen', 'F11', true]].map((m) => ({ label: m[0], key: m[1], checked: m[2] ? 'true' : 'false',
    row: 'height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 4px; color: #ffffff; font: inherit; font-size: 14px; text-align: left; background: ' + (m[2] ? 'rgba(255,255,255,0.0605)' : 'transparent'),
    dot: 'width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; box-sizing: border-box; ' + (m[2] ? 'background: var(--acc)' : 'border: 1px solid rgba(255,255,255,0.5442)') }));
  const opts = [['Aspect ratio', 'Fit'], ['Quality', 'Auto'], ['Playback speed', '1×'], ['Captions', 'Off']].map((o) => ({ label: o[0], value: o[1] }));
  const next = [['Odd Look (Official Video)', 'Kavinsky, The Weeknd', '4:12', 'linear-gradient(150deg, #4a2f3a, #1a1020)'], ['Protovision (Official Video)', 'Kavinsky', '3:58', 'linear-gradient(150deg, #6b2f4a, #20101a)'], ['Starboy (Official Video)', 'The Weeknd, Daft Punk', '4:34', 'linear-gradient(150deg, #3a2f22, #140f0a)'], ['Instant Crush (Official Video)', 'Daft Punk, Julian Casablancas', '5:37', 'linear-gradient(150deg, #4a3a26, #18120a)'], ['Blinding Lights (Official Video)', 'The Weeknd', '4:22', 'linear-gradient(150deg, #6b2f2f, #200a0a)'], ['A Real Hero', 'College, Electric Youth', '4:27', 'linear-gradient(150deg, #5b4a2f, #1a140a)']].map((d) => ({ t: d[0], a: d[1], len: d[2],
    thumb: 'position: relative; width: 128px; height: 72px; border-radius: 4px; display: block; background: ' + d[3] }));
  return { vars, menu, menuOpen: menu ? 'true' : 'false', modes, opts, next,
    moreBtn: 'width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; color: #ffffff; background: ' + (menu ? 'rgba(255,255,255,0.0605)' : 'transparent') };
}
}
</script>
</body>
</html>
