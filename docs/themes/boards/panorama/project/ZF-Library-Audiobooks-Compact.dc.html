<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection audiobooks, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="compact" sel="library" items="Liked|Playlists|Albums:312|Artists:184|Podcasts|Audiobooks" sub-sel="{{five}}" lower="{{lower}}" hint-size="400px,136px"></dc-import>
  <main style="height: 660px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 0 16px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div style="display: flex; align-items: center; gap: 4px; height: 40px; flex-shrink: 0">
      <button style="height: 40px; display: inline-flex; align-items: center; gap: 12px; padding: 0 10px 0 12px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px">Recently played<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <span style="flex-grow: 1"></span>
      <span style="font-size: 12px; color: var(--t2)">6 books</span>
    </div>
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding: 12px 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb)">
      <span style="display: flex; align-items: baseline; gap: 6px; font-size: 14px; line-height: 20px"><span>Listening time this month</span><span style="flex-grow: 1"></span><span style="font-weight: 600">9 h 20 min</span><span style="font-size: 12px; color: var(--t2)">of 15 h left</span></span>
      <span role="progressbar" aria-label="Listening time left this month" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" style="height: 4px; border-radius: 2px; background: var(--strong); position: relative; display: block"><span style="position: absolute; left: 0; top: 0; width: 62%; height: 4px; border-radius: 2px; background: var(--t1)"></span></span>
      <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Resets 1 Nov</span>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section aria-label="{{g.label}}" style="display: flex; flex-direction: column; flex-shrink: 0">
        <h2 style="margin: 0; height: 44px; display: flex; align-items: flex-end; gap: 10px; padding-bottom: 4px; box-sizing: border-box; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">{{g.label}}<span style="font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 12px; line-height: 20px; font-weight: 400; color: var(--t2)">{{g.count}}</span></h2>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 4px; height: 52px; flex-shrink: 0"><a href="#" style="flex-grow: 1; min-width: 0; height: 52px; display: flex; align-items: center; gap: 12px; color: var(--t1)"><span style="{{r.art}}"><sc-if value="{{r.hasBar}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 3px; right: 3px; bottom: 3px; height: 3px; border-radius: 2px; background: rgba(0,0,0,0.5)"><span style="{{r.fill}}"></span></span></sc-if></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="{{r.name}}">{{r.n}}</span><span style="{{r.metaStyle}}">{{r.meta}}</span></span><sc-if value="{{r.cached}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-label="On this PC" role="img" style="flex-shrink: 0; color: var(--t2)"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"></circle><path d="M8 4.8v5.4M5.8 8.2 8 10.4l2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if></a><button aria-label="{{r.actLabel}}" style="{{r.act}}"><sc-if value="{{r.resume}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg></sc-if><sc-if value="{{r.plain}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></sc-if></button></div>
        </sc-for>
      </section>
    </sc-for>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="compact" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"lower":{"editor":"boolean","default":false},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', strong: 'rgba(255,255,255,0.5442)', t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', acc: pink ? '#ff7ac3' : '#60cdff', onacc: '#000000', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', strong: 'rgba(0,0,0,0.4458)', t1: '#1b1b1b', t2: '#626262', t3: '#8a8a8a', acc: pink ? '#c4007a' : '#005fb8', onacc: '#ffffff', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const book = (d) => { const open = d[5] === 'open', done = d[5] === 'done';
    return { n: d[0], meta: d[1] + ' · ' + d[3], hasBar: d[4] > 0 && !done, cached: !!d[6], resume: open, plain: !open,
      actLabel: open ? 'Resume ' + d[0] : 'More options for ' + d[0],
      act: 'width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; ' + (open ? 'border-radius: 20px; background: var(--acc); color: var(--onacc)' : 'border-radius: 4px; background: transparent; color: var(--t1)'),
      art: 'position: relative; width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; overflow: hidden; display: block; background: ' + d[2] + (done ? '; opacity: 0.6' : ''),
      fill: 'position: absolute; left: 0; top: 0; height: 3px; border-radius: 2px; width: ' + d[4] + '%; background: ' + (open ? 'var(--acc)' : '#ffffff'),
      name: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (open ? 'var(--acct); font-weight: 600' : (done ? 'var(--t2)' : 'var(--t1)')),
      metaStyle: 'font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (open ? 'var(--acct)' : 'var(--t2)') }; };
  const groups = [
    { label: 'In progress', count: '2', rows: [['Project Hail Mary', 'Andy Weir', 'linear-gradient(160deg, #1f3a4a, #0f1f2a)', '6 h 12 min left', 62, 'open', true], ['Dune', 'Frank Herbert', '#6b4a2a', '14 h 5 min left', 33, '', true]].map(book) },
    { label: 'Not started', count: '3', rows: [['Atomic Habits', 'James Clear', '#8a7a5a', '5 h 35 min', 0, '', false], ['Sapiens', 'Yuval Noah Harari', '#8a2a2a', '15 h 17 min', 0, '', false], ['Tomorrow, and Tomorrow, and Tomorrow', 'Gabrielle Zevin', '#2a5a7a', '12 h 26 min', 0, '', false]].map(book) },
    { label: 'Finished', count: '1', rows: [['The Hobbit', 'J.R.R. Tolkien', '#3a4a2a', 'Finished in August', 100, 'done', false]].map(book) }
  ];
  return { vars, theme, accent, groups, five: 5, lower: !!(this.props.lower ?? false) };
}
}
</script>
</body>
</html>
