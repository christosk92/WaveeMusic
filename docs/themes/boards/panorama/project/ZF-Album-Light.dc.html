<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Album, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 960px; overflow: hidden; background: #f3f3f3">
  <dc-import name="ZF-Album" theme="light" accent="{{accent}}" panel="{{panel}}" h="{{h}}" hint-size="1440px,960px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"panel":{"editor":"enum","options":["none","queue","lyrics","details"],"default":"none"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  return { accent: this.props.accent ?? 'windows', panel: this.props.panel ?? 'none', h: 960 };
}
}
</script>
</body>
</html>
