<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty playlist, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}} width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--mica); color: var(--t1); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="ZF-Chrome" theme="{{theme}}" accent="{{accent}}" tier="compact" sel="library" ctx="My playlist #12" items="Songs|Recommended|About" sub-sel="{{zero}}" hint-size="400px,136px"></dc-import>
  <main style="height: 660px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0 16px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">
    <div style="display: flex; gap: 16px; align-items: flex-end">
      <span style="width: 96px; height: 96px; flex-shrink: 0; border-radius: 8px; background: var(--sub); border: 1px dashed var(--strong); box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: var(--t2)"><svg width="32" height="32" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 12.5V4l7-1.5v8.5M6 12.5a1.8 1.8 0 1 1-3.6 0 1.8 1.8 0 0 1 3.6 0zM13 11a1.8 1.8 0 1 1-3.6 0 1.8 1.8 0 0 1 3.6 0z" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linejoin="round"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Playlist · Private</span>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">My playlist #12</h1>
        <span style="font-size: 12px; line-height: 16px; color: var(--t2)">Christos · 0 songs</span>
      </span>
    </div>
    <span style="display: flex; gap: 8px">
      <button disabled style="height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: var(--accdis); color: var(--dis); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
      <button style="height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: var(--t1); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.5l3 3-8 8H2.5v-3z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg>Edit details</button>
    </span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 16px 16px 16px; border-radius: 8px; background: var(--card); border: 1px solid var(--cardb); text-align: center">
      <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">This playlist is empty</h2>
      <span style="font-size: 14px; line-height: 20px; color: var(--t2)">Find songs to add, or tap Add on a recommendation below.</span>
      <label style="margin-top: 6px; width: 100%; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-bottom: 1px solid var(--strong); font-size: 14px; color: var(--t2); text-align: left"><span style="flex-grow: 1">Search for songs or episodes</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></label>
    </div>
    <div style="display: flex; align-items: center; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Recommended</h2><span style="flex-grow: 1"></span><button style="height: 40px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: var(--acct); font: inherit; font-size: 14px">Refresh</button></div>
    <div style="display: flex; flex-direction: column; margin-top: -8px">
      <sc-for list="{{recs}}" as="r" hint-placeholder-count="4">
        <div role="row" style="display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: center; height: 52px; margin-top: 2px; border-radius: 4px"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span></span><button style="height: 40px; padding: 0 14px; border-radius: 4px; background: var(--ctrl); border: 1px solid var(--ctrlb); border-top-color: var(--ctrlbt); border-bottom-color: var(--ctrlbb); color: var(--t1); font: inherit; font-size: 14px">Add</button></div>
      </sc-for>
    </div>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" tier="compact" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const theme = this.props.theme ?? 'dark';
  const dark = theme !== 'light';
  const accent = this.props.accent ?? 'windows';
  const pink = accent === 'pink';
  const T = dark
    ? { mica: '#202020', layer: '#282828', stroke: 'rgba(255,255,255,0.0837)', card: 'rgba(255,255,255,0.0512)', cardb: 'rgba(0,0,0,0.1)', ctrl: 'rgba(255,255,255,0.0605)', ctrlb: 'rgba(255,255,255,0.0698)', ctrlbt: 'rgba(255,255,255,0.093)', ctrlbb: 'rgba(255,255,255,0.0698)', sub: 'rgba(255,255,255,0.0605)', strong: 'rgba(255,255,255,0.5442)', t1: '#ffffff', t2: '#c5c5c5', dis: '#5d5d5d', accdis: 'rgba(255,255,255,0.1581)', acct: pink ? '#ffb3dd' : '#99ebff' }
    : { mica: '#f3f3f3', layer: '#f9f9f9', stroke: 'rgba(0,0,0,0.0578)', card: '#fbfbfb', cardb: 'rgba(0,0,0,0.0578)', ctrl: '#fdfdfd', ctrlb: 'rgba(0,0,0,0.0578)', ctrlbt: 'rgba(0,0,0,0.0578)', ctrlbb: 'rgba(0,0,0,0.1622)', sub: 'rgba(0,0,0,0.0373)', strong: 'rgba(0,0,0,0.4458)', t1: '#1b1b1b', t2: '#626262', dis: '#ffffff', accdis: 'rgba(0,0,0,0.2169)', acct: pink ? '#9b0062' : '#003e92' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const recs = [['Nightcall', 'Kavinsky · OutRun', '#6b2f4a'], ['Midnight City', 'M83 · Hurry Up, We’re Dreaming', '#3b4a6b'], ['Sunset', 'The Midnight · Endless Summer', '#6b4a2f'], ['Resonance', 'HOME · Odyssey', '#2f5b6b']].map((d) => ({ t: d[0], a: d[1], art: 'width: 40px; height: 40px; border-radius: 4px; background: ' + d[2] }));
  return { vars, theme, accent, recs, zero: 0 };
}
}
</script>
</body>
</html>
