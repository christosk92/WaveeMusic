<!doctype html>
<html lang="en">

  <main style="height: 740px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 12px 36px 0 36px; overflow: hidden; background: var(--layer); border-top: 1px solid var(--stroke)">

        <button aria-label="Grid" aria-pressed="{{gridPressed}}" style="{{s.gridBtn}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>

            <div style="display: flex; align-items: center; gap: 8px">

            </div>
            <div role="table" aria-label="Songs on Hurry Up Tomorrow" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); grid-auto-flow: column; column-gap: 32px; padding-top: 6px">

        </section>
        <sc-for list="{{collapsed}}" as="r" hint-placeholder-count="4">

            <span style="{{r.art}}"></span>
            <span style="display: flex; flex-direction: column; min-width: 0"><a href="#" style="font-size: 14px; line-height: 20px; font-weight: 600; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</a><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: var(--t2)">{{r.meta}}<sc-if value="{{r.cached}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 16 16" aria-label="On this PC" role="img"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.2"></circle><path d="M8 4.8v5.4M5.8 8.2 8 10.4l2.2-2.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if></span></span>
            <button aria-label="Play {{r.t}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg></button>
            <button aria-label="{{r.saveLabel}}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--t1)"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" style="{{r.heart}}" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
            <button aria-label="Show songs of {{r.t}}" aria-expanded="false" style="height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: var(--t1); font: inherit; font-size: 14px">{{r.count}}<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{isGrid}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 20px 16px">
        <sc-for list="{{grid}}" as="d" hint-placeholder-count="16"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: var(--t1)"><span style="{{d.art}}"></span><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.n}}</span><span style="font-size: 12px; line-height: 16px; color: var(--t2)">{{d.y}}</span></a></sc-for>
      </div>
    </sc-if>
  </main>
  <dc-import name="ZF-PlayBar" theme="{{theme}}" accent="{{accent}}" variant="music" pane="none" hint-size="1440px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"view":{"editor":"enum","options":["list","grid"],"default":"list"},"lower":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>

  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const view = this.props.view ?? 'list';
  const isList = view !== 'grid';
  const seg = (on) => 'width: 36px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; color: var(--t1); background: ' + (on ? 'var(--sub)' : 'transparent');
  const chips = ['All', 'Albums', 'Singles & EPs', 'Compilations'].map((l, i) => ({ label: l, pressed: i === 0 ? 'true' : 'false',

  const tracks = [['Wake Me Up', '5:08', false], ['Cry for Me', '3:44', true], ['I Can’t Wait to Get There', '3:47', false], ['São Paulo', '5:01', true], ['Until We’re Skin & Bones', '1:39', false], ['Baptized in Fear', '3:52', false], ['Open Hearts', '3:54', false], ['Opening Night', '1:46', false], ['Closing Night', '4:21', false], ['Reflections Laughing', '4:46', false]].map((d, i) => ({ n: String(i + 1), t: d[0], d: d[1], liked: d[2],

}
</script>
</body>
