<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now playing sheet, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="{{vars}} position: relative; width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; color: #ffffff; background: radial-gradient(120% 80% at 30% 20%, #5a2340 0%, #2a1424 50%, #141014 100%); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding-left: 4px">
    <button aria-label="Close now playing" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <span style="flex-grow: 1; min-width: 0; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Playing from late night drive</span>
    <span style="display: flex">
      <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
      <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
      <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></span>
    </span>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 24px 0 24px">
    <span style="width: 352px; height: 352px; border-radius: 8px; background: linear-gradient(150deg, #a8456f, #4a1f38); box-shadow: 0 32px 64px rgba(0,0,0,0.37)"></span>
    <div style="display: flex; align-items: center; gap: 8px; padding-top: 4px">
      <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nightcall</span><span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.86)"><a href="#" style="color: inherit">Kavinsky</a> · <a href="#" style="color: inherit">OutRun</a></span></span>
      <button aria-label="Saved to Liked Songs" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="position: relative; height: 18px; display: flex; align-items: center"><div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></div><div style="position: absolute; left: 0; width: 29%; height: 4px; border-radius: 2px; background: var(--acc)"></div><div style="position: absolute; left: calc(29% - 9px); width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.0698); background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: var(--acc)"></span></div></div>
      <span style="display: flex; justify-content: space-between; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums"><span>1:14</span><span>-3:04</span></span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Shuffle, on" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: var(--acct)"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Previous" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3.5v9L5.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Pause" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 32px; background: var(--acc); color: #000000"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
      <button aria-label="Next" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Repeat" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #ffffff"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4H13M11 2l2 2-2 2M13 9v1.5a1.5 1.5 0 0 1-1.5 1.5H3M5 14l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{words}}" as="w" hint-placeholder-count="3"><button style="height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #ffffff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{w.d}}" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{w.label}}</button></sc-for>
    </div>
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; background: rgba(44,44,44,0.6); border: 1px solid rgba(255,255,255,0.0837); color: #ffffff">
      <span style="font-size: 12px; color: rgba(255,255,255,0.78)">Up next</span>
      <span style="width: 32px; height: 32px; border-radius: 4px; background: #3a2f22"></span>
      <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px">Get Lucky</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Daft Punk, Pharrell Williams</span></span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["windows","pink"],"default":"windows"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const pink = (this.props.accent ?? 'windows') === 'pink';
  const T = { acc: pink ? '#ff7ac3' : '#60cdff', acct: pink ? '#ffb3dd' : '#99ebff' };
  const vars = Object.keys(T).map((k) => '--' + k + ': ' + T[k]).join('; ') + ';';
  const words = [['Lyrics', 'M3 9.5V7a3 3 0 0 1 3-3M3 9.5h3v3H3zM10 9.5V7a3 3 0 0 1 3-3M10 9.5h3v3h-3z'], ['Queue', 'M2.5 4h11M2.5 8h7M2.5 12h7M11.5 9.5v4.5l3.5-2.25z'], ['Devices', 'M2 3.5h8.5v6H2zM4.5 12.5h3.5M12 6h2.5v7H12z']].map((w) => ({ label: w[0], d: w[1] }));
  return { vars, words };
}
}
</script>
</body>
</html>
