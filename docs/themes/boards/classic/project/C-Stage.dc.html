<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full screen layouts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 24px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 32px; background: #161616; color: #fff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
    <figcaption style="font-size: 14px; line-height: 20px"><b>Visualizer first</b> <span style="color: rgba(255,255,255,0.7)">(default) · Bloom face, now-playing card, lyric caption</span></figcaption>
    <div style="position: relative; height: 385px; border-radius: 6px; overflow: hidden; background: radial-gradient(circle at 50% 55%, #c0613e 0%, #8a4e7a 22%, #2a1a2a 50%, #0a0a0a 75%)">
      <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.22)"></div>
      <div style="position: absolute; left: 12px; top: 26px; width: 200px; height: 58px; box-sizing: border-box; padding: 8px; border-radius: 6px; background: rgba(44,44,44,0.7); display: flex; gap: 8px; align-items: center"><span style="width: 42px; height: 42px; border-radius: 3px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111)"></span><span style="display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 600">Get Lucky</span><span style="font-size: 9px; color: rgba(255,255,255,0.7)">Daft Punk · Random Access Memories</span></span></div>
      <div style="position: absolute; left: 0; right: 0; bottom: 92px; text-align: center; font-size: 22px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.5)">a light left on <span style="opacity: 0.58">in the hall</span></div>
      <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 48px; border-radius: 6px; background: rgba(44,44,44,0.72)"></div>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
    <figcaption style="font-size: 14px; line-height: 20px"><b>Large cover</b> <span style="color: rgba(255,255,255,0.7)">· cover beside the lyrics, spectrum strip (Bars / Ring / Line / Off)</span></figcaption>
    <div style="position: relative; height: 385px; border-radius: 6px; overflow: hidden; background: #151515">
      <div style="position: absolute; inset: 0; background: radial-gradient(50% 60% at 25% 35%, #555, transparent 70%); opacity: 0.6"></div>
      <span style="position: absolute; left: 40px; top: 30px; width: 190px; height: 190px; border-radius: 6px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111)"></span>
      <span style="position: absolute; left: 40px; top: 228px; font-size: 15px; font-weight: 700">Get Lucky</span>
      <div style="position: absolute; left: 270px; top: 40px; display: flex; flex-direction: column; gap: 8px; font-size: 17px; font-weight: 700"><span style="opacity: 0.19">counting windows, one by one</span><span>a light left on <span style="opacity: 0.58">in the hall</span></span><span style="opacity: 0.45">so the morning finds us here</span><span style="opacity: 0.24">and nothing has to change</span></div>
      <div style="position: absolute; left: 40px; right: 40px; top: 262px; height: 44px; display: flex; align-items: flex-end; gap: 2px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="48"><span style="{{b}}"></span></sc-for></div>
      <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 48px; border-radius: 6px; background: rgba(44,44,44,0.72)"></div>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
    <figcaption style="font-size: 14px; line-height: 20px"><b>Centered cover</b> <span style="color: rgba(255,255,255,0.7)">· the cover in the middle, no lyrics</span></figcaption>
    <div style="position: relative; height: 385px; border-radius: 6px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #333, #0a0a0a 70%); display: flex; flex-direction: column; align-items: center; padding-top: 44px; box-sizing: border-box; gap: 10px">
      <span style="width: 150px; height: 150px; border-radius: 12px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111); box-shadow: 0 0 0 10px rgba(96,205,255,0.15)"></span>
      <span style="font-size: 16px; font-weight: 700">Get Lucky</span><span style="font-size: 11px; color: rgba(255,255,255,0.8)">Daft Punk · Random Access Memories</span>
      <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 48px; border-radius: 6px; background: rgba(44,44,44,0.72)"></div>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
    <figcaption style="font-size: 14px; line-height: 20px"><b>Artist photo</b> <span style="color: rgba(255,255,255,0.7)">· slow pan and zoom, big name, optional lyrics; falls back to Large cover</span></figcaption>
    <div style="position: relative; height: 385px; border-radius: 6px; overflow: hidden; background: linear-gradient(160deg, #6b5b3b, #2a2218 60%, #0a0a0a)">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 60%; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7))"></div>
      <div style="position: absolute; left: 32px; bottom: 76px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.18em">NOW PLAYING</span><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 58px; line-height: 60px; font-weight: 700">Daft Punk</span><span style="display: flex; align-items: center; gap: 8px"><span style="width: 32px; height: 32px; border-radius: 3px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111)"></span><span style="font-size: 12px">Get Lucky · with Pharrell Williams · Random Access Memories</span></span></div>
      <div style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 48px; border-radius: 6px; background: rgba(44,44,44,0.72)"></div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const bars = Array.from({ length: 48 }, (_, i) => 'flex: 1; border-radius: 1px 1px 0 0; background: #60cdff; opacity: 0.7; height: ' + Math.round(6 + 36 * Math.abs(Math.sin(i * 0.41) * Math.cos(i * 0.13))) + 'px');
  return { bars };
}
}
</script>
</body>
</html>
