<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact multi-select</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="heart:Liked Songs" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <header style="padding: 0 16px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em">Liked Songs</h1>
      <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">1,284 songs · 71 hr 3 min</span>
    </header>
    <div style="display: flex; flex-direction: column; flex-shrink: 0">
      <div role="toolbar" aria-label="Selection" style="height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0 4px; display: flex; align-items: center; gap: 4px; background: rgba(96,205,255,0.10); border-bottom: 1px solid rgba(255,255,255,0.082)">
        <button aria-label="Cancel selection" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg></button>
        <span role="status" style="font-size: 14px; font-weight: 600; flex-grow: 1">3 selected</span>
        <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10l8-5z" fill="currentColor"></path></svg>Play</button>
        <button aria-label="Add to playlist" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h8M2.5 8h8M2.5 12h5M12 9.5v5M9.5 12h5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
        <button aria-label="More actions for 3 songs" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </div>
      <dc-import name="C-TrackList" theme="dark" rs="modern" set="liked" tier="compact" n="11" check="{{true}}" marks="2:checked,3:checked,5:checked" hint-size="100%,616px"></dc-import>
    </div>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
