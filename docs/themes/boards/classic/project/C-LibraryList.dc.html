<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library, Artists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="artists:Artists" sel="0" w="1440" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="artists" h="780" hint-size="280px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; display: flex; overflow: hidden">
      <section aria-label="Artists" style="position: relative; width: 280px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 10px"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">Artists</h1><span style="font-size: 14px; color: rgba(255,255,255,0.529)">86</span></div>
        <div style="display: flex; gap: 14px; height: 32px; align-items: center"><span style="position: relative; font-size: 13.5px; color: rgba(255,255,255,0.5)">recents</span><span style="position: relative; font-size: 13.5px; font-weight: 600">alphabetical<span style="position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: #60cdff"></span></span><span style="font-size: 13.5px; color: rgba(255,255,255,0.5)">albums</span></div>
        <div style="height: 32px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); border-bottom-color: rgba(255,255,255,0.545); font-size: 14px; color: rgba(255,255,255,0.773)">Filter</div>
        <div style="display: flex; flex-direction: column; padding-right: 18px">
          <sc-for list="{{list}}" as="r" hint-placeholder-count="10">
            <sc-if value="{{r.h}}" hint-placeholder-val="{{false}}"><div style="height: 28px; display: flex; align-items: center; padding: 0 8px; margin-top: 4px; border-radius: 4px; background: rgba(255,255,255,0.031); font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.773)">{{r.l}}</div></sc-if>
            <sc-if value="{{r.row}}" hint-placeholder-val="{{true}}"><a href="#" style="{{r.s}}"><span style="{{r.pill}}"></span><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.l}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">{{r.sub}}</span></span></a></sc-if>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; right: 2px; top: 160px; width: 18px; display: flex; flex-direction: column; align-items: center; font-size: 10px; line-height: 13px; color: rgba(255,255,255,0.529)"><sc-for list="{{az}}" as="a" hint-placeholder-count="26"><span style="{{a.s}}">{{a.l}}</span></sc-for></div>
      </section>
      <span aria-hidden="true" style="width: 16px; flex-shrink: 0; display: flex; justify-content: center"><span style="width: 1px; background: rgba(255,255,255,0.082)"></span></span>
      <section aria-label="Daft Punk" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
        <div style="height: 100px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 24px 0 8px">
          <span style="width: 72px; height: 72px; border-radius: 36px; background: linear-gradient(135deg, #2f2f2f, #6b5b2f)"></span>
          <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.012em">Daft Punk</span><span style="font-size: 12px; color: rgba(255,255,255,0.773)">In your library: 3 albums · 35 songs</span></span>
          <button style="height: 32px; padding: 0 16px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px; font-weight: 600">▶ Play all</button>
          <button aria-pressed="true" style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 7.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM2 13.5c0-2.5 2-4 4.5-4M10 11.5l1.8 1.8 3-3.3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Following</button>
          <button aria-label="Shuffle" title="Shuffle" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff">⤨</button>
          <button aria-label="Open artist page" title="Open artist page" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff">↗</button>
        </div>
        <div style="height: 49px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 24px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.082); font-size: 13.5px"><span style="font-weight: 600">in your library</span><span style="color: rgba(255,255,255,0.5)">all releases · 142</span><span style="flex-grow: 1"></span><span style="font-weight: 600">newest</span><span style="color: rgba(255,255,255,0.5)">oldest</span><span style="color: rgba(255,255,255,0.5)">alphabetical</span></div>
        <sc-for list="{{blocks}}" as="b" hint-placeholder-count="2">
          <div style="display: flex; gap: 20px; padding: 20px 24px 0 8px">
            <span style="display: flex; flex-direction: column; gap: 6px"><span style="{{b.art}}"></span><span style="font-size: 12px; color: rgba(255,255,255,0.773)">{{b.y}}</span></span>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
              <div style="display: flex; align-items: center; gap: 8px; height: 40px"><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 20px; line-height: 26px; font-weight: 600">{{b.t}}</span><span style="font-size: 12px; color: rgba(255,255,255,0.773)">{{b.m}}</span></span><span style="width: 32px; text-align: center">▶</span><span style="width: 32px; text-align: center; color: #60cdff">♥</span><span style="width: 32px; text-align: center">⋯</span></div>
              <sc-for list="{{b.rows}}" as="r" hint-placeholder-count="4"><div style="height: 36px; display: grid; grid-template-columns: 28px minmax(0, 1fr) 52px; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px"><span style="font-size: 12px; color: rgba(255,255,255,0.529); text-align: center">{{r.n}}</span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; text-align: right; color: rgba(255,255,255,0.773)">{{r.d}}</span></div></sc-for>
            </div>
          </div>
        </sc-for>
      </section>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const L = [['C'], ['Chappell Roan', '1 album · 14 songs', '#c06a8a'], ['Conan Gray', '2 albums · 8 songs', '#8aa0b0'], ['D'], ['Daft Punk', '3 albums · 35 songs', '#6b5b2f', 1], ['Dominic Fike', '1 album · 3 songs', '#c0a080'], ['E'], ['Edward Maya', '1 album · 12 songs', '#3b5b7a'], ['EMIN', '4 songs', '#3a3a4a'], ['F'], ['FINNEAS', '1 album · 9 songs', '#5b4a3b']];
  const list = L.map(r => r.length === 1 ? { h: true, row: false, l: r[0] } : { h: false, row: true, l: r[0], sub: r[1],
    s: 'position: relative; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 8px; border-radius: 4px' + (r[3] ? '; background: rgba(255,255,255,0.059)' : ''),
    pill: r[3] ? 'position: absolute; left: 0; top: 20px; width: 3px; height: 16px; border-radius: 2px; background: #60cdff' : 'display: none',
    art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: ' + r[2] });
  const az = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => ({ l, s: l === 'D' ? 'color: #60cdff; font-weight: 700' : '' }));
  const tr = (arr) => arr.map((r, i) => ({ n: i + 1, t: r[0], d: r[1] }));
  const blocks = [{ t: 'Random Access Memories', y: '2013 · Album', m: '13 songs · 1 hr 14 min', art: 'width: 120px; height: 120px; border-radius: 6px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111)', rows: tr([['Give Life Back to Music', '4:34'], ['Instant Crush', '5:37'], ['Get Lucky', '6:09'], ['Doin’ it Right', '4:11']]) }, { t: 'Discovery', y: '2001 · Album', m: '14 songs · 1 hr 1 min', art: 'width: 120px; height: 120px; border-radius: 6px; background: #6b5b2f', rows: tr([['One More Time', '5:20'], ['Digital Love', '4:58']]) }];
  return { list, az, blocks };
}
}
</script>
</body>
</html>
