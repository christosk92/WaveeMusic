<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liked Songs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="heart:Liked Songs" sel="0" w="1440" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="liked" h="780" hint-size="280px,780px"></dc-import>
    <main style="position: relative; flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
      <header style="height: 156px; flex-shrink: 0; box-sizing: border-box; padding: 24px 36px 4px; display: flex; flex-direction: column">
        <h1 style="margin: 0; height: 52px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">Liked Songs</h1>
        <span style="margin-top: 4px; height: 16px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">1,284 songs · 71 hr 3 min</span>
        <div role="toolbar" aria-label="Liked Songs tools" style="margin-top: 12px; height: 44px; box-sizing: border-box; padding: 6px 0; display: flex; align-items: center; gap: 2px">
          <span style="display: inline-flex; align-items: center; height: 32px; border-radius: 4px; background: #60cdff; color: #000; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.22)"><button style="width: 88px; height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: transparent; color: #000; font: inherit; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10l8-5z" fill="currentColor"></path></svg>Play</button><span style="width: 1px; height: 20px; background: rgba(0,0,0,0.2)"></span><button aria-label="More ways to play" style="width: 32px; height: 32px; border: 0; background: transparent; color: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></button></span>
          <button style="margin-left: 6px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h2.5c3 0 4 7 7 7H14M2 11.5h2.5c1.2 0 2-1 2.6-2.2M9 6.7c.6-1.2 1.4-2.2 2.5-2.2H14M12 2.5l2 2-2 2M12 9.5l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Shuffle</button>
          <span style="width: 17px; display: flex; justify-content: center"><span style="width: 1px; height: 20px; background: rgba(255,255,255,0.082)"></span></span>
          <div style="flex-grow: 1; min-width: 120px; display: flex; gap: 8px; overflow: hidden; margin-right: 8px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent)">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="8"><button aria-pressed="{{c.on}}" style="{{c.s}}">{{c.l}}</button></sc-for>
          </div>
          <button style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 9px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); font: inherit; font-size: 12px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.2V13l-3-1.5V8.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path></svg>Filter<span style="width: 22px"></span></button>
          <button style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 9px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); font: inherit; font-size: 12px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M3 5l2-2 2 2M11 13V3M9 11l2 2 2-2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Date added<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.529)"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button>
          <button aria-label="Find in Liked Songs" style="margin-left: 6px; width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
          <button aria-label="Insights" aria-pressed="true" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: rgba(96,205,255,0.11); color: #60cdff; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7.5 20v-7M12 20V6M16.5 20v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
          <button aria-label="More" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
        </div>
      </header>
      <div style="padding: 0 28px">
        <dc-import name="C-TrackList" theme="dark" rs="modern" set="liked" n="12" groups="{{true}}" marks="2:playing,4:hover" hint-size="100%,560px"></dc-import>
      </div>
      <aside aria-label="Insights" style="position: absolute; right: 0; top: 156px; bottom: 0; width: 320px; box-sizing: border-box; padding: 16px; background: #2a2d35; box-shadow: -12px 0 32px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center"><span style="font-size: 16px; line-height: 22px; font-weight: 600; flex-grow: 1">Insights</span><button aria-label="Close insights" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773)">✕</button></div>
        <div style="padding: 14px 16px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.773)"><span>This week</span><span style="font-weight: 400">last 12 weeks</span></div><div style="display: flex; align-items: flex-end; justify-content: space-between"><span style="display: flex; flex-direction: column"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 36px; line-height: 40px; font-weight: 600">+24</span><span style="font-size: 12px; color: rgba(255,255,255,0.773)">songs liked</span></span><span style="display: flex; align-items: flex-end; gap: 3px; height: 40px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="12"><span style="{{b}}"></span></sc-for></span></div></div>
        <div style="padding: 14px 16px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 8px"><span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.773)">Tempo</span><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">60 – 240 <span style="font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.773)">bpm</span></span><span style="display: flex; height: 8px; border-radius: 4px; overflow: hidden"><span style="flex: 2; background: #3b6b9b"></span><span style="flex: 5; background: #60cdff"></span><span style="flex: 3; background: #a6d8ff"></span><span style="flex: 1; background: #e0f2ff"></span></span><span style="font-size: 12px; color: rgba(255,255,255,0.773)">Slow · Medium · Fast · Very fast</span></div>
        <div style="padding: 14px 16px; border-radius: 8px; background: rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.773)">Rediscover</span><span style="font-size: 14px; line-height: 20px">9 songs you liked this week last year</span><button style="align-self: flex-start; height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px">Play them</button></div>
      </aside>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const chips = ['All', 'Pop', 'Slow', 'K-Pop', 'Nostalgia', 'Gaming', 'Relaxing', 'Emotional', 'Soundtrack'].map((l, i) => ({ l, on: i === 0 ? 'true' : 'false', s: 'height: 32px; flex-shrink: 0; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 14px; ' + (i === 0 ? 'border: 0; background: #60cdff; color: #000' : 'background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff') }));
  const bars = [4, 6, 3, 10, 7, 14, 9, 16, 11, 6, 13, 24].map((h, i) => 'width: 5px; height: ' + h + 'px; border-radius: 1px; background: #60cdff; opacity: ' + (i === 11 ? 1 : 0.55));
  return { chips, bars };
}
}
</script>
</body>
</html>
