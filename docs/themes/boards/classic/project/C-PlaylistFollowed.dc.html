<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playlist, followed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="playlist:Today’s Top Hits" sel="0" w="1440" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="tth" h="780" hint-size="280px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(52,66,44,0.32); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; display: flex; overflow: hidden">
      <aside aria-label="About this playlist" style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 24px 8px 24px 16px; display: flex; flex-direction: column; gap: 14px; background: rgba(58,58,58,0.298); border-top-left-radius: 8px">
        <span style="width: 216px; height: 216px; border-radius: 8px; background: linear-gradient(180deg, #6b8a5a 0%, #3b5a2f 60%), #3b5a2f; box-shadow: 0 2px 8px rgba(0,0,0,0.33); display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 30px; font-weight: 700; color: #f0e040">Today’s Top Hits</span>
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 24px; height: 24px; border-radius: 12px; background: #1db954"></span><span style="font-size: 14px; font-weight: 600">Spotify</span></div>
        <h1 style="margin: -4px 0 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em">Today’s Top Hits</h1>
        <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); margin-top: -6px">50 songs · 33.9M saves · 2 hr 36 min</span>
        <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px">
          <span style="display: inline-flex; align-items: center; height: 32px; border-radius: 4px; background: #9bd67a; color: #000; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.22); margin-right: 4px"><button style="width: 88px; height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: transparent; color: #000; font: inherit; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z" fill="currentColor"></path></svg>Pause</button><span style="width: 1px; height: 20px; background: rgba(0,0,0,0.2)"></span><button aria-label="More ways to play" style="width: 32px; height: 32px; border: 0; background: transparent; color: rgba(0,0,0,0.8)">⌄</button></span>
          <button aria-label="Shuffle" style="width: 32px; height: 32px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff">⤨</button>
          <button aria-label="Unfollow" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #9bd67a"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
          <button aria-label="Share" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #fff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          <button aria-label="More" style="width: 32px; height: 32px; border: 0; background: transparent; color: #fff">⋯</button>
        </div>
        <span style="font-size: 12px; line-height: 18px; color: rgba(255,255,255,0.773)">The hottest 50. Cover: Olivia Rodrigo</span>
        <div style="padding: 12px 12px 11px; border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098); box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.773)"><span>This week</span><span style="font-weight: 400">last 12 weeks</span></div>
          <div style="display: flex; align-items: flex-end; justify-content: space-between"><span style="display: flex; flex-direction: column"><span style="font-size: 28px; line-height: 36px; font-weight: 600">+1</span><span style="font-size: 12px; color: rgba(255,255,255,0.773)">new songs</span></span><span style="display: flex; align-items: flex-end; gap: 3px; height: 36px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="12"><span style="{{b}}"></span></sc-for></span></div>
        </div>
      </aside>
      <span aria-hidden="true" style="width: 16px; flex-shrink: 0"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding-top: 12px">
        <div role="toolbar" aria-label="List tools" style="height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 6px 14px 6px 6px; display: flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.773)">
          <span style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 9px">≡ Play next <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.082); margin: 0 4px"></span><span style="color: rgba(255,255,255,0.529)">⌄</span></span>
          <span style="height: 32px; display: flex; align-items: center; padding: 0 10px 0 9px">⤨ Shuffle</span>
          <span style="flex-grow: 1"></span>
          <span style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 28px 0 9px">⏚ Filter</span>
          <span style="height: 32px; display: flex; align-items: center; padding: 0 10px 0 9px">⇅ Custom order <span style="color: rgba(255,255,255,0.529); margin-left: 6px">⌄</span></span>
          <span style="width: 32px; height: 32px; margin-left: 6px; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></span>
          <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7.5 20v-7M12 20V6M16.5 20v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></span>
          <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center">⋯</span>
        </div>
        <div style="padding-right: 8px">
          <dc-import name="C-TrackList" theme="dark" rs="classic" set="followed" n="11" marks="3:playing,6:hover,9:selected,11:versions" accent="#9bd67a" hint-size="100%,520px"></dc-import>
        </div>
      </div>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const bars = [6, 4, 10, 8, 14, 6, 20, 9, 12, 7, 16, 24].map((h, i) => 'width: 5px; height: ' + h + 'px; border-radius: 1px; background: #9bd67a; opacity: ' + (i === 11 ? 1 : 0.55));
  return { bars };
}
}
</script>
</body>
</html>
