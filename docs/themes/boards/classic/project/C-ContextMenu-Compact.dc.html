<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact song menu, bottom sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="playlist:Summer Songs 2026" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main aria-hidden="true" style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <span style="margin: 0 16px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Summer Songs 2026</span>
    <dc-import name="C-TrackList" theme="dark" rs="modern" set="playlist" tier="compact" n="12" marks="4:selected" hint-size="100%,672px"></dc-import>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0; background: rgba(0,0,0,0.4)"></div>
  <section role="menu" aria-label="Song options" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 0 8px 12px; border-top-left-radius: 8px; border-top-right-radius: 8px; border-top: 1px solid rgba(255,255,255,0.08); background: #282828; box-shadow: 0 -8px 24px rgba(0,0,0,0.35); display: flex; flex-direction: column">
    <div aria-hidden="true" style="height: 16px; display: flex; align-items: center; justify-content: center"><span style="width: 32px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: #b0b0b0"></span><span style="display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px; font-weight: 600">Loser</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">Tame Impala</span></span></div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px 0 8px"><sc-for list="{{strip}}" as="s" hint-placeholder-count="4"><button role="menuitem" style="{{s.s}}"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="{{s.d}}" fill="{{s.f}}" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 12px">{{s.l}}</span></button></sc-for></div>
    <span style="display: block; height: 1px; margin: 0 8px 4px; background: rgba(255,255,255,0.082)"></span>
    <sc-for list="{{tm}}" as="i" hint-placeholder-count="9"><sc-if value="{{i.sep}}" hint-placeholder-val="{{false}}"><span style="display: block; height: 1px; margin: 4px 8px; background: rgba(255,255,255,0.082)"></span></sc-if><sc-if value="{{i.item}}" hint-placeholder-val="{{true}}"><button role="menuitem" style="{{i.s}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{i.d}}" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex-grow: 1; text-align: left">{{i.l}}</span><sc-if value="{{i.sub}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.529)"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></sc-if></button></sc-if></sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const I = { play: 'M5 3v10l8-5z', next: 'M2.5 4h7M2.5 8h7M2.5 12h4M12 6v7M9.5 10.5l2.5 2.5 2.5-2.5', share: 'M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10', del: 'M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.7 9h5.6l.7-9', add: 'M8 3v10M3 8h10', album: 'M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2zM8 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z', artist: 'M8 2.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 13.5c0-2.5 2.2-4 5-4s5 1.5 5 4', credits: 'M3 2.5h10v11H3zM5.5 6h5M5.5 8.5h5M5.5 11h3', radio: 'M8 7.5v6.5M5.2 4.8a4 4 0 0 0 0 5.4M10.8 4.8a4 4 0 0 1 0 5.4', video: 'M2.5 3.5h11v9h-11zM5 3.5v9M11 3.5v9', info: 'M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2zM8 7.5v3.5M8 5v.01', heart: 'M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z', after: 'M2.5 4h11M2.5 8h7M2.5 12h7M12 7v6' };
  const row = (l, d, sub) => ({ item: true, sep: false, sub: !!sub, l, d: I[d], s: 'height: 44px; width: 100%; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px' });
  const sep = { sep: true, item: false, sub: false };
  const tm = [row('Add to playlist', 'add', 1), row('Go to album', 'album'), row('Go to artist', 'artist'), row('Share', 'share', 1), row('View credits', 'credits'), row('Go to song radio', 'radio'), row('Video', 'video', 1), sep, row('Track details', 'info'), sep, row('Remove from this playlist', 'del')];
  const strip = [['Play', 'play', 'currentColor'], ['Play next', 'next', 'none'], ['Play after', 'after', 'none'], ['Saved', 'heart', 'currentColor', 1]].map(s => ({ l: s[0], d: I[s[1]], f: s[2], s: 'height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.04); font: inherit; color: ' + (s[3] ? '#60cdff' : '#fff') }));
  return { tm, strip };
}
}
</script>
</body>
</html>
