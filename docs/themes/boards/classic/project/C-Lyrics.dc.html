<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full screen lyrics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div style="position: absolute; inset: -60px; background: radial-gradient(50% 60% at 25% 35%, #6d6d6d, transparent 70%), radial-gradient(45% 55% at 75% 70%, #3a3a3a, transparent 70%), #151515; filter: blur(40px)"></div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.56)"></div>
  <header style="position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; padding: 0 18px; gap: 10px; background: linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0))">
    <span style="width: 18px; height: 18px; border-radius: 4px; background: #60cdff"></span><span style="font-size: 12px; font-weight: 600">Wavee</span><span style="font-size: 12px; color: rgba(255,255,255,0.6)">Now playing · full screen</span>
    <span style="flex-grow: 1"></span>
    <div role="tablist" aria-label="Full screen view" style="display: flex; gap: 4px; padding: 2px; border-radius: 6px; background: rgba(255,255,255,0.1)"><sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><button role="tab" aria-selected="{{m.sel}}" style="{{m.s}}">{{m.l}}</button></sc-for></div>
    <span style="flex-grow: 1"></span>
    <button aria-label="Full screen options" style="width: 32px; height: 32px; border: 0; background: transparent; color: #fff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font: inherit; font-size: 13px">Exit full screen</button>
  </header>
  <div style="position: absolute; left: 84px; top: 64px; width: 396px; display: flex; flex-direction: column; gap: 10px">
    <span style="width: 396px; height: 396px; border-radius: 8px; background: linear-gradient(135deg, #111 0%, #3a3a3a 40%, #bdbdbd 52%, #3a3a3a 64%, #111 100%); box-shadow: 0 16px 48px rgba(0,0,0,0.5)"></span>
    <span style="font-size: 26px; line-height: 30px; font-weight: 700; margin-top: 8px">Get Lucky</span>
    <span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.8)">Daft Punk, Pharrell Williams, Nile Rodgers · Random Access Memories</span>
    <div style="display: flex; gap: 6px"><span style="height: 24px; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); font-size: 12px">▮▮▮ Very high</span><span style="height: 24px; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); font-size: 12px">Synced lyrics</span><span style="height: 24px; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); font-size: 12px">116 BPM</span></div>
  </div>
  <div style="position: absolute; left: 564px; top: 70px; width: 792px; height: 520px; overflow: hidden; display: flex; flex-direction: column; gap: 16px; -webkit-mask-image: linear-gradient(180deg, transparent, #000 15%, #000 80%, transparent)">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="8"><div style="position: relative"><span style="{{l.pill}}"></span><p style="{{l.s}}">{{l.a}}<span style="opacity: 0.58">{{l.b}}</span></p></div></sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 84px; right: 84px; top: 600px; height: 96px; display: flex; align-items: flex-end; gap: 4px"><sc-for list="{{bars}}" as="b" hint-placeholder-count="72"><span style="{{b}}"></span></sc-for></div>
  <section aria-label="Playback" style="position: absolute; left: 18px; right: 18px; bottom: 18px; height: 112px; box-sizing: border-box; padding: 12px 20px; border-radius: 8px; background: rgba(44,44,44,0.72); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: rgba(255,255,255,0.8)"><span>2:40</span><span style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 43%; border-radius: 2px; background: #60cdff"></span></span><span>-3:29</span></div>
    <div style="display: flex; align-items: center">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: rgba(255,255,255,0.6)">Playing from album</span><span style="font-size: 14px; font-weight: 600">Random Access Memories</span></span>
      <span style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; text-align: center; color: #60cdff">⤨</span><span style="width: 40px; text-align: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M13 3 6 8l7 5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="width: 56px; height: 56px; border-radius: 28px; background: #60cdff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 20px">❚❚</span><span style="width: 40px; text-align: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3v10M3 3l7 5-7 5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="width: 40px; text-align: center">↻</span></span>
      <span style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 10px"><span style="color: #60cdff">♥</span><span style="display: flex"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5zM11 5.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><span style="width: 128px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; background: #60cdff; border-radius: 2px"></span></span><span style="height: 32px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; background: rgba(255,255,255,0.08); font-size: 13px">System default ⌄</span><span>⋯</span></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const modes = ['Lyrics', 'Visualizer', 'Up next', 'Artist'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', s: 'height: 32px; padding: 0 14px; border: 0; border-radius: 4px; font: inherit; font-size: 13px; background: ' + (i === 0 ? '#60cdff' : 'transparent') + '; color: ' + (i === 0 ? '#000' : '#fff') }));
  const L = ['we walk the long way home', 'counting windows, one by one', 'a light left on in the hall', 'so the morning finds us here', 'and nothing has to change', 'hold the moment, let it stay', 'until the record ends'];
  const op = [0.13, 0.19, 1, 0.45, 0.24, 0.14, 0.11];
  const lines = L.map((t, i) => {
    const active = i === 2;
    return { a: active ? 'a light left on ' : t, b: active ? 'in the hall' : '',
      s: 'margin: 0; padding-left: 20px; font-size: 36px; line-height: 46px; font-weight: 700; opacity: ' + op[i] + (active ? '; text-shadow: 0 0 20px rgba(255,255,255,0.25)' : '; transform: scale(0.98); transform-origin: left center'),
      pill: active ? 'position: absolute; left: 0; top: 9px; width: 3px; height: 28px; border-radius: 2px; background: #60cdff' : 'display: none' };
  });
  const bars = Array.from({ length: 72 }, (_, i) => 'flex: 1; border-radius: 2px 2px 0 0; background: #60cdff; opacity: 0.7; height: ' + Math.round(14 + 70 * Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11))) + 'px');
  return { modes, lines, bars };
}
}
</script>
</body>
</html>
