<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact Library, Albums</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="albums:Albums" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div role="tablist" aria-label="Library" style="display: flex; gap: 8px; height: 40px; align-items: center; margin-right: -16px; flex-shrink: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent)">
      <sc-for list="{{pivots}}" as="p" hint-placeholder-count="5"><button role="tab" aria-selected="{{p.sel}}" style="{{p.s}}">{{p.l}}</button></sc-for>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; flex-shrink: 0"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">Albums</h1><span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.529)">214</span></div>
    <div style="display: flex; align-items: center; gap: 4px; height: 40px; flex-shrink: 0">
      <button aria-label="Sort by" style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px; margin-left: -8px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 13.5px; font-weight: 600"><span style="position: relative">recents<span style="position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: #60cdff"></span></span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.529)"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button>
      <span style="flex-grow: 1"></span>
      <span role="radiogroup" aria-label="View as" style="display: flex; gap: 2px">
        <button role="radio" aria-checked="false" aria-label="List" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
        <button role="radio" aria-checked="true" aria-label="Grid" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.059); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="More views" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </span>
    </div>
    <label style="height: 40px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); border-bottom-color: rgba(255,255,255,0.545); font-size: 14px; color: rgba(255,255,255,0.773)"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.2V13l-3-1.5V8.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path></svg><input aria-label="Filter albums" placeholder="Filter" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; color: #fff; font: inherit; font-size: 14px; outline: none"></label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; margin-top: 4px">
      <sc-for list="{{grid}}" as="g" hint-placeholder-count="6"><a href="#" style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="{{g.art}}"></span><span style="margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">{{g.a}}</span></a></sc-for>
    </div>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const pivots = ['Albums', 'Artists', 'Podcasts', 'Audiobooks', 'Liked Songs'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', s: 'height: 40px; flex-shrink: 0; padding: 0 16px; border-radius: 20px; font: inherit; font-size: 14px; ' + (i === 0 ? 'border: 0; background: #60cdff; color: #000; font-weight: 600' : 'background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff') }));
  const G = [['Random Access Memories', 'Daft Punk', 'linear-gradient(135deg,#111,#bdbdbd 52%,#111)', 1], ['HIT ME HARD AND SOFT', 'Billie Eilish', '#2f4a6b'], ['Whiplash', 'aespa', '#8a8a9b'], ['Short n’ Sweet', 'Sabrina Carpenter', '#4a7ab0'], ['Discovery', 'Daft Punk', '#6b5b2f'], ['Blue Neighbourhood', 'Troye Sivan', '#5a8ab0']];
  const grid = G.map(g => ({ t: g[0], a: g[1], art: 'display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; background: ' + g[2] + (g[3] ? '; box-shadow: 0 0 0 3px #60cdff' : '') }));
  return { pivots, grid };
}
}
</script>
</body>
</html>
