<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concert, Small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="concert:Billie Eilish · Ziggo Dome" sel="0" w="800" hint-size="800px,48px"></dc-import>
  <div style="display: flex; height: 480px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="rail" sel="home" h="480" hint-size="48px,480px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; padding: 16px 32px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <nav aria-label="Breadcrumb" style="height: 20px; display: flex; align-items: flex-end; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600; flex-shrink: 0"><a href="#" style="color: rgba(255,255,255,0.773)">Browse</a><span aria-hidden="true" style="color: rgba(255,255,255,0.529)">›</span><a href="#" style="color: rgba(255,255,255,0.773)">Concerts</a><span aria-hidden="true" style="color: rgba(255,255,255,0.529)">›</span><a href="#" style="color: rgba(255,255,255,0.773)">Billie Eilish</a></nav>
      <section aria-label="Billie Eilish at Ziggo Dome" style="height: 240px; flex-shrink: 0; display: grid; grid-template-columns: 56fr 44fr; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098)">
        <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-width: 0">
          <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; color: #a6d8ff">Concert</span>
          <h1 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">Billie Eilish — HIT ME HARD AND SOFT: THE TOUR</h1>
          <span style="align-self: flex-start; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #393d1b; color: #6ccb5f">On sale</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13px; line-height: 18px; color: rgba(255,255,255,0.773)">
            <sc-for list="{{facts}}" as="f" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="{{f.g}}" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{f.l}}</span></sc-for>
          </div>
        </div>
        <span role="img" aria-label="Billie Eilish on stage" style="background: radial-gradient(60% 70% at 60% 40%, #6c8fb8 0%, rgba(108,143,184,0) 70%), linear-gradient(160deg, #3b5574, #0e1828)"></span>
      </section>
      <section aria-label="Tickets" style="flex-shrink: 0; padding: 12px 16px; border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098); display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Tickets</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{tickets}}" as="t" hint-placeholder-count="2"><div style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600">{{t.p}} · <span style="font-weight: 600">{{t.price}}</span></span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.w}}</span></span><a href="#" style="{{t.btn}}">Buy tickets<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg></a></div></sc-for>
        </div>
      </section>
      <section aria-label="Lineup" style="flex-shrink: 0; padding: 12px 16px; border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098); display: flex; flex-direction: column">
        <h2 style="margin: 0 0 4px; font-size: 20px; line-height: 28px; font-weight: 600">Lineup</h2>
        <sc-for list="{{lineup}}" as="l" hint-placeholder-count="3"><div style="height: 60px; display: flex; align-items: center; gap: 12px"><span style="{{l.a}}"></span><span style="display: flex; flex-direction: column; flex-grow: 1"><a href="#" style="font-size: 14px; font-weight: 600">{{l.n}}</a><span style="font-size: 12px; color: rgba(255,255,255,0.773)">{{l.r}}</span></span><button aria-pressed="{{l.on}}" style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 13px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{l.g}}" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{l.f}}</button></div></sc-for>
      </section>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="800" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const facts = [['Sat, Mar 14, 2026', 'M2.5 3.5h11v10h-11zM2.5 6.5h11M5.5 2v3M10.5 2v3'], ['Doors open 18:30', 'M8 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zM8 5v3l2 1.5'], ['Ziggo Dome, Amsterdam', 'M8 14s4.5-4.2 4.5-7.5a4.5 4.5 0 0 0-9 0C3.5 9.8 8 14 8 14zM8 5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z'], ['Ages 18+', 'M8 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zM8 7v4M8 5h.01']].map(f => ({ l: f[0], g: f[1] }));
  const tickets = [['Ticketmaster', 'from €89', 'On sale until Mar 13', 1], ['Resale', 'from €120', 'Verified fan-to-fan resale', 0]].map(t => ({ p: t[0], price: t[1], w: t[2], btn: 'flex-shrink: 0; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; box-sizing: border-box; border-radius: 4px; font-size: 14px; font-weight: 600; ' + (t[3] ? 'background: #60cdff; color: #000' : 'background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff') }));
  const follow = 'M7 2.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM2 13.5c0-2.5 2.2-4 5-4 1 0 1.9.2 2.6.5M12.5 9.5v4M10.5 11.5h4';
  const following = 'M6.5 7.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM2 13.5c0-2.5 2-4 4.5-4M10 11.5l1.8 1.8 3-3.3';
  const lineup = [['Billie Eilish', 'Headliner', '#2f4a6b', 'Following', 1], ['Nat & Alex Wolff', 'Support', '#6b5b3b', 'Follow', 0], ['TV Girl', 'Support', '#8a3b5b', 'Follow', 0]].map(l => ({ n: l[0], r: l[1], f: l[3], on: l[4] ? 'true' : 'false', g: l[4] ? following : follow, a: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: ' + l[2] }));
  return { facts, tickets, lineup };
}
}
</script>
</body>
</html>
