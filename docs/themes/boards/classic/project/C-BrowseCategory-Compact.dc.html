<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact Browse category</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="browse:K-Pop" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: radial-gradient(90% 40% at 0% 0%, rgba(192,138,176,0.12), rgba(192,138,176,0) 70%), rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding: 12px 16px 0; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
    <header style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
      <nav aria-label="Breadcrumb" style="height: 28px; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600"><a href="#" style="color: rgba(255,255,255,0.773); padding: 6px 0">Browse</a><span style="color: rgba(255,255,255,0.529)">›</span><a href="#" style="color: rgba(255,255,255,0.773); padding: 6px 0">Genres</a></nav>
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">K-Pop</h1>
    </header>
    <sc-for list="{{shelves}}" as="sh" hint-placeholder-count="3">
      <section aria-label="{{sh.t}}" style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
        <a href="#" style="height: 40px; display: flex; align-items: center; gap: 6px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">{{sh.t}}<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></a>
        <div style="display: flex; gap: 12px; margin-right: -16px; overflow: hidden">
          <sc-for list="{{sh.cards}}" as="c" hint-placeholder-count="3"><a href="#" style="width: 148px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="{{c.art}}"></span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.s}}</span></a></sc-for>
        </div>
      </section>
    </sc-for>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const pal = ['#c08ab0', '#5b3b6b', '#3b5b6b', '#9b7a3b', '#6b2f3b', '#2f6b6b', '#4a4a6b'];
  const S = [['Popular K-Pop playlists', ['K-Pop ON! (온)', 'K-Pop Daebak', 'Girl Power'], 'Playlist · Spotify'], ['New releases', ['Whiplash', 'MAGNETIC', 'How Sweet'], 'Album · aespa'], ['K-Pop by decade', ['2020s K-Pop', '2010s K-Pop', '2000s K-Pop'], 'Playlist · Spotify']];
  const subs = { 'Whiplash': 'EP · aespa', 'MAGNETIC': 'Single · ILLIT', 'How Sweet': 'Single · NewJeans' };
  const shelves = S.map((s, si) => ({ t: s[0], cards: s[1].map((t, i) => ({ t, s: subs[t] || s[2], art: 'display: block; width: 148px; height: 148px; margin-bottom: 6px; border-radius: 8px; background: linear-gradient(160deg, ' + pal[(i + si * 2) % 7] + ', #1a1a1a)' })) }));
  return { shelves };
}
}
</script>
</body>
</html>
