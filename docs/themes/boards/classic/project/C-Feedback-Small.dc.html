<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a problem, Small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a6d8ff;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="settings:Settings" sel="0" w="800" hint-size="800px,48px"></dc-import>
  <div style="display: flex; height: 480px; flex-shrink: 0"><dc-import name="C-Sidebar" theme="dark" layout="rail" sel="none" h="480" hint-size="48px,480px"></dc-import><main style="flex-grow: 1; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px"></main></div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="800" hint-size="800px,72px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.3)"></div>
  <section role="dialog" aria-modal="true" aria-label="Report a problem" style="position: absolute; left: 126px; top: 24px; width: 548px; height: 552px; box-sizing: border-box; border-radius: 8px; background: #2b2b2b; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 16px 64px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column">
    <div style="position: relative; flex-grow: 1; min-height: 0; overflow: hidden">
      <div style="padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Report a problem</h1>
        <p style="margin: 0; font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.773)">Opens a prefilled GitHub form. Nothing is sent until you submit it there.</p>
        <div role="radiogroup" aria-label="Kind" style="display: flex; padding: 2px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); align-self: flex-start"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><button role="radio" aria-checked="{{k.on}}" style="{{k.s}}">{{k.l}}</button></sc-for></div>
        <sc-for list="{{fields}}" as="f" hint-placeholder-count="5"><label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px">{{f.l}}<span style="{{f.box}}">{{f.p}}</span></label></sc-for>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px"><span role="checkbox" aria-checked="true" style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 4px; background: #60cdff; color: #000; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>Include diagnostics and the last 200 log lines</label>
        <button aria-expanded="false" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.051); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px; text-align: left"><span style="flex-grow: 1">Report preview</span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.6)"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button>
      </div>
      <span aria-hidden="true" style="position: absolute; right: 3px; top: 6px; width: 3px; height: 300px; border-radius: 2px; background: rgba(255,255,255,0.45)"></span>
    </div>
    <footer style="height: 80px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 8px; background: rgba(32,32,32,0.6); border-top: 1px solid rgba(255,255,255,0.06)"><button style="flex: 1; height: 32px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px; font-weight: 600">Open GitHub</button><button style="flex: 1; height: 32px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px">Cancel</button></footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const kinds = ['Bug', 'Feature', 'Question', 'Idea'].map((l, i) => ({ l, on: i === 0 ? 'true' : 'false', s: 'height: 28px; padding: 0 14px; display: flex; align-items: center; border: 0; border-radius: 3px; font: inherit; font-size: 13px; ' + (i === 0 ? 'background: #60cdff; color: #000' : 'background: transparent; color: #fff') }));
  const box = (h) => 'min-height: ' + h + 'px; box-sizing: border-box; padding: 6px 10px; border-radius: 4px; background: rgba(30,30,30,0.7); border: 1px solid rgba(255,255,255,0.071); border-bottom-color: rgba(255,255,255,0.545); font-size: 14px; color: rgba(255,255,255,0.6)';
  const fields = [['Title', 'One line that says what’s wrong', 32], ['What happened', 'Queue disappears from the player bar when the window is narrow', 64], ['Steps to reproduce', '1. Make the window 800 px wide…', 64], ['Expected behaviour', 'The Queue button stays in the player bar', 32], ['Area', 'Player bar', 32]].map(f => ({ l: f[0], p: f[1], box: box(f[2]) }));
  return { kinds, fields };
}
}
</script>
</body>
</html>
