<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact Liked Songs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="heart:Liked Songs" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <header style="padding: 0 16px; display: flex; gap: 16px; align-items: flex-end; flex-shrink: 0">
      <button aria-label="Cover style" style="position: relative; width: 160px; height: 160px; flex-shrink: 0; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: #2a2a3a; box-shadow: 0 2px 8px rgba(0,0,0,0.33)">
        <span aria-hidden="true" style="position: absolute; inset: -8px; display: grid; grid-template-columns: repeat(3, 1fr); filter: blur(6px)"><sc-for list="{{lens}}" as="c" hint-placeholder-count="9"><span style="{{c}}"></span></sc-for></span>
        <span aria-hidden="true" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.92)"><svg width="88" height="88" viewBox="0 0 16 16"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="rgba(255,255,255,0.18)" stroke="currentColor" stroke-width="0.6" stroke-linejoin="round"></path></svg></span>
      </button>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 2px">
        <span style="font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; color: rgba(255,255,255,0.529)">Your Library</span>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.02em">Liked Songs</h1>
        <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">1,284 songs · 71 hr 3 min</span>
      </div>
    </header>
    <div style="display: flex; align-items: center; gap: 4px; padding: 0 16px; height: 40px; flex-shrink: 0">
      <span style="display: inline-flex; align-items: center; height: 40px; border-radius: 4px; background: #60cdff; color: #000; box-shadow: inset 0 -1px 0 rgba(0,0,0,0.22); margin-right: 8px"><button style="width: 96px; height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; background: transparent; color: #000; font: inherit; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10l8-5z" fill="currentColor"></path></svg>Play</button><span style="width: 1px; height: 20px; background: rgba(0,0,0,0.2)"></span><button aria-label="More ways to play" style="width: 40px; height: 40px; border: 0; background: transparent; color: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></button></span>
      <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h2.5c3 0 4 7 7 7H14M2 11.5h2.5c1.2 0 2-1 2.6-2.2M9 6.7c.6-1.2 1.4-2.2 2.5-2.2H14M12 2.5l2 2-2 2M12 9.5l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Shuffle</button>
      <span style="flex-grow: 1"></span>
      <button aria-label="Share" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
    <div role="group" aria-label="Genres" style="display: flex; gap: 8px; height: 40px; align-items: center; padding-left: 16px; flex-shrink: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent)">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><button aria-pressed="{{c.on}}" style="{{c.s}}">{{c.l}}</button></sc-for>
    </div>
    <div style="display: flex; flex-direction: column; flex-shrink: 0">
      <div role="toolbar" aria-label="List tools" style="height: 48px; flex-shrink: 0; padding: 0 4px 0 8px; display: flex; align-items: center; gap: 2px; border-bottom: 1px solid rgba(255,255,255,0.082); font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.773)">
        <button style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: inherit; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M3 5l2-2 2 2M11 13V3M9 11l2 2 2-2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Date added<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.529)"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button aria-label="Filter" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12l-4.5 5.2V13l-3-1.5V8.2z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Find in Liked Songs" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
        <button aria-label="Insights" aria-pressed="false" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7.5 20v-7M12 20V6M16.5 20v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg></button>
        <button aria-label="More list options" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </div>
      <dc-import name="C-TrackList" theme="dark" rs="modern" set="liked" tier="compact" n="8" groups="{{true}}" marks="2:playing" hint-size="100%,432px"></dc-import>
    </div>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const lens = ['#3a3a4a', '#4a3a5a', '#6a5a4a', '#8a7a6a', '#5a8ab0', '#e0e0e0', '#3a5a7a', '#c0c0b0', '#7a5a8a'].map(c => 'background: ' + c);
  const chips = ['All', 'Pop', 'Slow', 'K-Pop', 'Nostalgia', 'Gaming', 'Relaxing', 'Emotional'].map((l, i) => ({ l, on: i === 0 ? 'true' : 'false', s: 'height: 40px; flex-shrink: 0; padding: 0 14px; border-radius: 4px; font: inherit; font-size: 14px; ' + (i === 0 ? 'border: 0; background: #60cdff; color: #000' : 'background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff') }));
  return { lens, chips };
}
}
</script>
</body>
</html>
