<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact Recents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="recents:Recents" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding: 12px 16px 0; display: flex; flex-direction: column; overflow: hidden">
    <header style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 8px"><h1 style="margin: 0; flex-grow: 1; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">Recents</h1><button style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 10px; margin-right: -8px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v10h-11zM2.5 6.5h11M5.5 2v3M10.5 2v3" fill="none" stroke="currentColor" stroke-width="1.1"></path></svg>Overview</button></div>
      <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.529)">84 items · Monday – Today · grouped from 212 plays</span>
    </header>
    <div role="tablist" aria-label="Kinds" style="display: flex; gap: 4px; margin: 8px -16px 0 -8px; flex-shrink: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent)"><sc-for list="{{pivots}}" as="p" hint-placeholder-count="4"><button role="tab" aria-selected="{{p.sel}}" style="{{p.s}}"><span style="position: relative; display: inline-block; padding-bottom: 6px">{{p.l}}<span style="{{p.bar}}"></span></span></button></sc-for></div>
    <div style="height: 48px; display: flex; align-items: center; gap: 12px; flex-shrink: 0"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Today</h2><span style="flex-grow: 1; height: 1px; background: rgba(255,255,255,0.082)"></span><span style="font-size: 12px; color: rgba(255,255,255,0.529)">6 items</span></div>
    <div role="list" style="display: flex; flex-direction: column; margin: 0 -8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div role="listitem" style="{{r.s}}"><a href="#" style="display: flex; align-items: center; gap: 12px; flex-grow: 1; min-width: 0"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="{{r.subS}}">{{r.sub}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.529)">{{r.k}} · {{r.time}}</span></span></a><button aria-label="{{r.cl}}" aria-expanded="{{r.ex}}" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="{{r.cd}}" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button></div>
        <sc-if value="{{r.open}}" hint-placeholder-val="{{false}}"><div style="margin: 0 0 8px 32px; padding-left: 12px; border-left: 1px solid #60cdff; display: flex; flex-direction: column"><sc-for list="{{r.kids}}" as="k" hint-placeholder-count="3"><div style="height: 44px; display: flex; align-items: center; gap: 12px; font-size: 14px"><span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; background: #4a4a4a"></span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{k.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{k.a}}</span></span><span style="font-size: 12px; color: rgba(255,255,255,0.529); padding-right: 12px">{{k.d}}</span></div></sc-for></div></sc-if>
      </sc-for>
    </div>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const pivots = ['All', 'Music', 'Podcasts', 'Artists'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', s: "height: 40px; flex-shrink: 0; padding: 8px 8px 0; border: 0; background: transparent; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 19px; line-height: 25px; font-weight: 350; color: " + (i === 0 ? '#fff' : 'rgba(255,255,255,0.6)'), bar: i === 0 ? 'position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #60cdff' : 'display: none' }));
  const R = [['Random Access Memories', 'Played 6 tracks · Daft Punk', 'Album', '14:32', 'linear-gradient(135deg,#111,#bdbdbd 52%,#111)', 1, 0], ['Liked Songs', '✓ 3 songs added', 'Playlist', '13:05', 'linear-gradient(135deg,#4a3b8a,#6fa3c8)', 0, 1], ['Billie Eilish', 'Played 4 tracks', 'Artist', '11:48', '#2f4a6b', 0, 0, 1], ['Coffee & Code', 'Played 1 episode · 23 min left', 'Podcast', '09:12', '#4a5b3b'], ['K-Pop Duets (러블리 듀엣)', 'Played 9 tracks · Chris', 'Playlist', '08:40', '#6b3b4a']];
  const rows = R.map((r, i) => ({ t: r[0], sub: r[1], k: r[2], time: r[3], open: !!r[5], ex: r[5] ? 'true' : 'false', cl: (r[5] ? 'Collapse ' : 'Expand ') + r[0],
    s: 'min-height: 64px; box-sizing: border-box; padding: 8px 0 8px 8px; display: flex; align-items: center; gap: 4px; border-radius: 8px; flex-shrink: 0' + (i === 0 ? '; background: rgba(255,255,255,0.059)' : ''),
    art: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: ' + (r[7] ? 24 : 4) + 'px; background: ' + r[4],
    subS: 'font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (r[6] ? '#6ccb5f' : 'rgba(255,255,255,0.773)'),
    cd: r[5] ? 'M4 10l4-4 4 4' : 'M4 6l4 4 4-4',
    kids: [{ t: 'Get Lucky', a: 'Daft Punk, Pharrell Williams', d: '14:32' }, { t: 'Instant Crush', a: 'Daft Punk, Julian Casablancas', d: '14:26' }, { t: 'Lose Yourself to Dance', a: 'Daft Punk', d: '14:20' }] }));
  return { pivots, rows };
}
}
</script>
</body>
</html>
