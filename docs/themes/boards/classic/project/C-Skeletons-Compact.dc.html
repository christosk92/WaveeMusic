<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact loading skeleton, album</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home|album:Random Access Memories" sel="1" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main aria-busy="true" aria-label="Loading album" style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding-top: 16px; display: flex; flex-direction: column; overflow: hidden">
    <header style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <span role="img" aria-label="Random Access Memories cover" style="align-self: center; width: 280px; height: 280px; border-radius: 8px; background: linear-gradient(135deg, #111 0%, #3a3a3a 40%, #bdbdbd 52%, #3a3a3a 64%, #111 100%); opacity: 0.9"></span>
      <span style="{{b.eyebrow}}"></span>
      <span style="{{b.title}}"></span>
      <span style="{{b.artist}}"></span>
      <span style="{{b.meta}}"></span>
      <span style="display: flex; gap: 4px; margin-top: 8px"><span style="{{b.cta}}"></span><span style="{{b.sq}}"></span><span style="{{b.sq}}"></span><span style="{{b.sq}}"></span><span style="{{b.sq}}"></span></span>
    </header>
    <div style="height: 48px; flex-shrink: 0; margin-top: 12px; box-sizing: border-box; border-bottom: 1px solid rgba(255,255,255,0.082)"></div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8"><div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px"><span style="{{b.art}}"></span><span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1"><span style="{{r.t}}"></span><span style="{{r.s}}"></span></span><span style="{{b.more}}"></span></div></sc-for>
    </div>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const g = 'rgba(255,255,255,0.07)';
  const bar = (w, h) => 'display: block; width: ' + w + '; height: ' + (h || 12) + 'px; border-radius: 4px; background: ' + g;
  const b = { eyebrow: bar('28%', 12) + '; margin-top: 8px', title: bar('82%', 24), artist: bar('36%', 14), meta: bar('48%', 10),
    cta: 'width: 121px; height: 40px; margin-right: 8px; border-radius: 4px; background: ' + g, sq: 'width: 40px; height: 40px; border-radius: 4px; background: ' + g,
    art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: ' + g, more: 'width: 16px; height: 4px; margin-right: 12px; border-radius: 2px; background: ' + g };
  const rows = [52, 38, 61, 44, 57, 35, 49, 42].map((w, i) => ({ t: bar(w + '%', 12), s: bar((24 + (i * 7) % 18) + '%', 10) }));
  return { b, rows };
}
}
</script>
</body>
</html>
