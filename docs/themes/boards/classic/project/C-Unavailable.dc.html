<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unavailable tracks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a6d8ff;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="playlist:Today’s Top Hits" sel="0" w="1440" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="rail" sel="tth" h="780" hint-size="48px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(52,66,44,0.32); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; display: flex; overflow: hidden">
      <aside style="width: 240px; flex-shrink: 0; box-sizing: border-box; padding: 24px 8px 24px 16px; display: flex; flex-direction: column; gap: 14px; background: rgba(58,58,58,0.298); border-top-left-radius: 8px">
        <span style="width: 216px; height: 216px; border-radius: 8px; background: linear-gradient(180deg, #6b8a5a, #3b5a2f)"></span>
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Today’s Top Hits</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.773)">50 songs · 2 hr 36 min</span>
      </aside>
      <span style="width: 16px; flex-shrink: 0"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 12px 8px 0 0">
        <div role="status" style="margin: 0 8px 8px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 4px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098); font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="color: #60cdff"><path d="M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2zM8 7.5v3.5M8 5v.01" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg><span style="flex-grow: 1">2 songs here can’t be played: one isn’t available in your country, one isn’t out yet.</span><button style="height: 28px; padding: 0 10px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 13px">Hide them</button></div>
        <dc-import name="C-TrackList" theme="dark" rs="modern" set="playlist" n="9" marks="3:unavailable,6:unreleased,4:hover,1:playing" accent="#9bd67a" hint-size="100%,520px"></dc-import>
      </div>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
  <div role="tooltip" style="position: absolute; left: 640px; top: 330px; padding: 6px 10px; border-radius: 4px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 4px 16px rgba(0,0,0,0.26); font-size: 12px">Not available in your country</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
