<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact toasts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a6d8ff;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: radial-gradient(90% 50% at 10% 0%, rgba(176,110,190,0.10), rgba(176,110,190,0) 70%), rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding: 12px 16px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div role="tablist" aria-label="Home" style="display: flex; align-items: center; gap: 8px; height: 40px; margin: 0 -16px 0 -8px; flex-shrink: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent)">
      <sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button role="tab" aria-selected="{{f.sel}}" style="{{f.style}}">{{f.l}}</button></sc-for>
    </div>
    <section aria-label="Your daylist" style="position: relative; height: 320px; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.098); background: radial-gradient(60% 90% at 60% 30%, #c0613e 0%, rgba(192,97,62,0) 70%), linear-gradient(115deg, #7a5a38 0%, #8a4e7a 55%, #9b6ac0 100%)">
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(74,52,40,0) 30%, rgba(74,52,40,0.96) 100%)"></div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.773)">Good evening, Chris · your daylist</span><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">korean r&amp;b k-indie sunday evening</span></div>
    </section>
    <section aria-label="Recently played" style="display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
      <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.006em">Recently played</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><sc-for list="{{recent}}" as="r" hint-placeholder-count="4"><a href="#" style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 8px; box-sizing: border-box; border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098); min-width: 0; color: #fff"><span style="{{r.art}}"></span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span></a></sc-for></div>
    </section>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
  <div aria-live="polite" style="position: absolute; left: 16px; right: 16px; bottom: 64px; display: flex; flex-direction: column; gap: 8px">
    <div role="status" style="min-height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 16px; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); font-size: 14px; line-height: 20px"><span style="flex-grow: 1; min-width: 0">Added to Liked Songs</span><button style="height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #a6d8ff; font: inherit; font-size: 14px; font-weight: 600">Change</button></div>
    <div role="status" style="min-height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 16px; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); font-size: 14px; line-height: 20px"><span style="flex-grow: 1; min-width: 0">Unpinned “Summer Songs 2026” from the sidebar</span><button style="height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #a6d8ff; font: inherit; font-size: 14px; font-weight: 600">Undo</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const facets = ['All', 'Music', 'Podcasts', 'Audiobooks'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', style: "height: 40px; flex-shrink: 0; padding: 2px 8px; border: 0; border-radius: 4px; background: transparent; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: " + (i === 0 ? 600 : 400) + '; color: ' + (i === 0 ? '#ffffff' : 'rgba(255,255,255,0.773)') }));
  const recent = [['Random Access Memories', 'linear-gradient(135deg,#1c1c1c,#6d6d6d 55%,#c9c9c9)'], ['Hype Cleaning Mix', '#3b4a9b'], ['Liked Songs', 'linear-gradient(135deg,#4a3b8a,#6fa3c8)'], ['Summer Songs 2026', '#b8862f']].map(r => ({ t: r[0], art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: ' + r[1] }));
  return { facets, recent };
}
}
</script>
</body>
</html>
