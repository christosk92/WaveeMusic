<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="search:daft punk" sel="0" w="1440" search="focus" query="daft pu" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="none" h="780" hint-size="280px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; padding: 24px 36px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">daft punk</h1>
      <div role="tablist" aria-label="Result types" style="display: flex; flex-wrap: wrap; column-gap: 4px; margin-left: -12px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="9"><button role="tab" aria-selected="{{t.sel}}" style="{{t.style}}">{{t.l}}<span style="font-size: 12px; color: rgba(255,255,255,0.529); margin-left: 6px">{{t.c}}</span><span style="{{t.bar}}"></span></button></sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 16px">
        <sc-for list="{{songs}}" as="s" hint-placeholder-count="12"><div style="{{s.row}}"><span style="{{s.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="{{s.ts}}">{{s.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Song · {{s.a}}</span></span><span style="{{s.more}}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></span><button aria-label="{{s.sl}}" style="{{s.save}}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="{{s.sd}}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg></button></div></sc-for>
      </div>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
  <div role="listbox" aria-label="Suggestions" style="position: absolute; left: 480px; top: 44px; width: 480px; padding: 4px; box-sizing: border-box; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column">
    <sc-for list="{{queries}}" as="q" hint-placeholder-count="3"><div role="option" style="{{q.s}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.773)"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.1"></path></svg><span><b style="font-weight: 700">daft pu</b><span style="color: rgba(255,255,255,0.773)">{{q.rest}}</span></span></div></sc-for>
    <span style="height: 1px; margin: 4px 8px; background: rgba(255,255,255,0.082)"></span>
    <sc-for list="{{rich}}" as="r" hint-placeholder-count="4"><div role="option" style="height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 8px; border-radius: 4px"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">{{r.s}}</span></span><span style="{{r.btn}}">{{r.b}}</span></div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const tabs = [['All', ''], ['Songs', '612'], ['Albums', '48'], ['Playlists', '1000'], ['Artists', '24'], ['Podcasts & shows', '31'], ['Episodes', '1000'], ['Profiles', '212'], ['Genres', '3']].map((t, i) => ({ l: t[0], c: t[1], sel: i === 1 ? 'true' : 'false', style: 'position: relative; height: 36px; padding: 8px 12px 4px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (i === 1 ? '#fff' : 'rgba(255,255,255,0.773)'), bar: i === 1 ? 'position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' }));
  const S = [['Get Lucky', 'Daft Punk, Pharrell Williams, Nile Rodgers', 1], ['One More Time', 'Daft Punk', 0], ['Instant Crush', 'Daft Punk, Julian Casablancas', 1], ['Harder, Better, Faster, Stronger', 'Daft Punk', 0], ['Around the World', 'Daft Punk', 0], ['Lose Yourself to Dance', 'Daft Punk, Pharrell Williams', 0], ['Starboy', 'The Weeknd, Daft Punk', 1], ['Digital Love', 'Daft Punk', 0], ['Something About Us', 'Daft Punk', 0], ['Derezzed', 'Daft Punk', 0], ['Veridis Quo', 'Daft Punk', 0], ['Robot Rock', 'Daft Punk', 0]];
  const pal = ['#6d6d6d', '#3b3b6b', '#555', '#6b5b2f', '#2f2f2f', '#4a4a4a', '#8a2f2f', '#3b5b9b', '#5b3b6b', '#1d3a5a', '#3b6b4a', '#6b5b2f'];
  const songs = S.map((s, i) => ({ t: s[0], a: s[1], sl: s[2] ? 'Saved to Liked Songs' : 'Save to Liked Songs', sd: s[2] ? 'M3 8.5l3 3 7-7' : 'M8 3v10M3 8h10',
    row: 'height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 8px; border-radius: 8px; min-width: 0' + (i === 4 ? '; background: rgba(255,255,255,0.059)' : ''),
    art: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: 4px; background: ' + pal[i],
    ts: 'font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis' + (i === 0 ? '; color: #a6d8ff' : ''),
    more: 'display: flex; color: rgba(255,255,255,0.773); opacity: ' + (i === 4 ? 1 : 0),
    save: 'width: 32px; height: 32px; flex-shrink: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; color: ' + (s[2] ? '#60cdff' : 'rgba(255,255,255,0.773)') }));
  const queries = ['nk', 'nk random access memories', 'nk get lucky'].map((rest, i) => ({ rest, s: 'height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-radius: 4px; font-size: 14px' + (i === 0 ? '; background: rgba(255,255,255,0.059)' : '') }));
  const rich = [['Daft Punk', 'Artist', '#2f2f2f', 'Following', 1], ['Random Access Memories', 'Album · Daft Punk', '#6d6d6d', 'Saved', 0], ['Discovery', 'Album · Daft Punk', '#6b5b2f', 'Save', 0], ['Get Lucky', 'Song · Daft Punk', '#555', '', 0]].map(r => ({ t: r[0], s: r[1], b: r[3], art: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: ' + (r[4] ? 22 : 4) + 'px; background: ' + r[2], btn: r[3] ? 'height: 28px; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071)' : 'display: none' }));
  return { tabs, songs, queries, rich };
}
}
</script>
</body>
</html>
