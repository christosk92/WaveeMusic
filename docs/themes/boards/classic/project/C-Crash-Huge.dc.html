<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crash prompt, Huge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a6d8ff;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 2560px; height: 1440px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home" sel="0" w="2560" tier="huge" hint-size="2560px,48px"></dc-import>
  <div style="display: flex; height: 1320px; flex-shrink: 0"><dc-import name="C-Sidebar" theme="dark" layout="classic" sel="home" w="320" h="1320" hint-size="320px,1320px"></dc-import><main style="flex-grow: 1; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px"></main></div>
  <dc-import name="C-PlayerBar" theme="dark" variant="idle" w="2560" tier="huge" hint-size="2560px,72px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.3)"></div>
  <section role="dialog" aria-modal="true" aria-label="Wavee closed unexpectedly" style="position: absolute; left: 760px; top: 420px; width: 1040px; height: 600px; box-sizing: border-box; border-radius: 8px; background: #2b2b2b; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 16px 64px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column">
    <div style="flex-grow: 1; min-height: 0; display: flex">
      <div style="width: 520px; flex-shrink: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 14px">
        <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600">Wavee closed unexpectedly</h1>
        <div role="status" style="display: flex; gap: 10px; padding: 12px; border-radius: 4px; background: #433519; font-size: 14px; line-height: 20px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px; color: #fce100"><path d="M8 2l6.5 11.5h-13zM8 6.5v3M8 11.5v.01" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg><span>Sending the report helps fix it. You can read everything in it first.</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px">
          <span style="font-weight: 600">What’s in the report</span>
          <sc-for list="{{items}}" as="i" hint-placeholder-count="4"><span style="{{i.s}}"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="{{i.g}}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{i.l}}</span></sc-for>
        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px"><span role="checkbox" aria-checked="false" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 4px; border: 1px solid rgba(255,255,255,0.6)"></span>Include a memory snapshot</label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px"><span role="checkbox" aria-checked="false" style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 4px; border: 1px solid rgba(255,255,255,0.6)"></span>Always send reports, don’t ask again</label>
      </div>
      <span aria-hidden="true" style="width: 1px; flex-shrink: 0; background: rgba(255,255,255,0.06)"></span>
      <section aria-label="The full report" style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 24px 24px 18px; display: flex; flex-direction: column; gap: 10px; background: rgba(32,32,32,0.35)">
        <div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; flex-grow: 1; font-size: 14px; line-height: 20px; font-weight: 600">The full report</h2><button aria-label="Copy report" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: rgba(255,255,255,0.773); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5h7v7h-7zM3.5 10.5v-7h7" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"></path></svg></button></div>
        <pre style="margin: 0; flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 12px 14px; border-radius: 4px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.071); font-family: Consolas, 'Cascadia Mono', monospace; font-size: 12px; line-height: 18px; color: rgba(255,255,255,0.85); white-space: pre-wrap"><sc-for list="{{lines}}" as="l" hint-placeholder-count="18"><span style="{{l.s}}">{{l.t}}</span>
</sc-for></pre>
      </section>
    </div>
    <footer style="height: 80px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; background: rgba(32,32,32,0.6); border-top: 1px solid rgba(255,255,255,0.06)"><button style="width: 200px; height: 32px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px; font-weight: 600">Send report</button><button style="width: 200px; height: 32px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px">Not now</button></footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const ok = 'M3 8.5l3 3 7-7', no = 'M4 4l8 8M12 4l-8 8';
  const items = [['What Wavee was doing and the error', 1], ['Your Windows version and graphics adapter', 1], ['The last log lines', 1], ['No account details, no listening history', 0]].map(i => ({ l: i[0], g: i[1] ? ok : no, s: 'display: flex; align-items: center; gap: 8px; color: ' + (i[1] ? '#fff' : 'rgba(255,255,255,0.773)') }));
  const H = 'color: #a6d8ff; font-weight: 700', D = 'color: rgba(255,255,255,0.529)', E = 'color: #ff99a4', N = '';
  const L = [['Wavee closed unexpectedly', H], ['Wavee 0.3.0 “Themes” · stable · wavee-v0.3.0', D], ['', N], ['What Wavee was doing', H], ['[WHAT WAVEE WAS DOING]', N], ['', N], ['The error', H], ['[EXCEPTION TYPE]', E], ['  at [STACK FRAME]', E], ['  at [STACK FRAME]', E], ['', N], ['This PC', H], ['[WINDOWS VERSION] · [GRAPHICS ADAPTER] · [DRIVER VERSION]', N], ['', N], ['Last log lines', H], ['[LOG LINE]', D], ['[LOG LINE]', D], ['[LOG LINE]', D]];
  const lines = L.map(l => ({ t: l[0], s: l[1] }));
  return { items, lines };
}
}
</script>
</body>
</html>
