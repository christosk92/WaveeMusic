<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, scrolled</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(90% 70% at 58% 100%, rgba(60,160,120,0.085), rgba(60,160,120,0) 66%), #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home" sel="0" w="1440" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="home" h="780" hint-size="280px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; padding: 12px 36px 0; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 24px; height: 40px; margin-left: -8px; flex-shrink: 0">
        <sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><span style="{{f.s}}">{{f.l}}</span></sc-for>
      </div>
      <section aria-label="Made for you" style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
        <div style="height: 32px; display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.006em; flex-grow: 1">Made for you<span style="font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; letter-spacing: 0; color: rgba(255,255,255,0.529)">  Daily Mixes and moods picked for you</span></h2><a href="#" style="font-size: 14px; color: #a6d8ff">See all</a><span style="width: 1px; height: 16px; background: rgba(255,255,255,0.082)"></span><span style="font-size: 12px; color: rgba(255,255,255,0.6)">‹ ● ○ ○ ›</span></div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="6"><a href="#" style="{{c.plate}}"><span style="{{c.art}}"><sc-if value="{{c.hover}}" hint-placeholder-val="{{false}}"><span style="position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 22px; background: #60cdff; color: #000; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3)"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10l8-5z" fill="currentColor"></path></svg></span><span style="position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; border-radius: 15px; background: rgba(0,0,0,0.43); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"></path></svg></span></sc-if></span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.s}}</span></a></sc-for>
        </div>
      </section>
      <section aria-label="From artists you follow" style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
        <div style="height: 32px; display: flex; align-items: center"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.006em">From artists you follow<span style="font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; letter-spacing: 0; color: rgba(255,255,255,0.529)">  Fresh playlists and releases from artists you follow</span></h2></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px">
          <sc-for list="{{releases}}" as="r" hint-placeholder-count="4"><a href="#" style="height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 8px; border-radius: 8px; min-width: 0"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">{{r.a}}</span></span><span style="font-size: 11px; line-height: 15px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.059); color: rgba(255,255,255,0.773)">{{r.k}}</span><span style="width: 64px; text-align: right; font-size: 12px; color: rgba(255,255,255,0.529)">{{r.d}}</span></a></sc-for>
        </div>
      </section>
      <section aria-label="Because you like" style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
        <div style="height: 32px; display: flex; align-items: center"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.006em">Because you like<span style="font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; letter-spacing: 0; color: rgba(255,255,255,0.529)">  Grouped from the artists you play most</span></h2></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{clusters}}" as="c" hint-placeholder-count="3"><div style="padding: 16px; border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098); display: flex; flex-direction: column; gap: 8px"><span style="display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px; font-weight: 600">{{c.n}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.529)">{{c.p}}</span></span><sc-for list="{{c.rows}}" as="r" hint-placeholder-count="3"><span style="height: 48px; display: flex; align-items: center; gap: 10px"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">{{r.s}}</span></span></span></sc-for></div></sc-for>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const facets = ['All', 'Music', 'Podcasts', 'Audiobooks'].map((l, i) => ({ l, s: "padding: 2px 8px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: " + (i ? 400 : 600) + '; color: ' + (i ? 'rgba(255,255,255,0.773)' : '#fff') }));
  const cd = [['Discover Weekly', 'Your weekly mixtape of fresh music', '#3b4a8a'], ['Daily Mix 1', 'IVE, Red Velvet, IU and more', '#5b3b6b'], ['Daily Mix 2', 'aespa, ILLIT, NewJeans and more', '#3b5b6b'], ['Release Radar', 'New music from artists you follow', '#2f6b6b'], ['On Repeat', 'Songs you can’t stop playing', '#6b2f3b'], ['Time Capsule', 'Songs from your past', '#4a4a6b']];
  const cards = cd.map((c, i) => ({ t: c[0], s: c[1], hover: i === 1,
    plate: 'display: flex; flex-direction: column; gap: 2px; padding: 8px; margin-top: 4px; border-radius: 8px; min-width: 0' + (i === 1 ? '; background: rgba(255,255,255,0.059)' : ''),
    art: 'position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; margin-bottom: 6px; border-radius: 8px; background: linear-gradient(160deg, ' + c[2] + ', #1a1a1a)' }));
  const releases = [['HIT ME HARD AND SOFT', 'Billie Eilish', 'Album', '3 d ago', '#2f4a6b'], ['Whiplash', 'aespa', 'EP', '5 d ago', '#8a8a9b'], ['Supernova', 'aespa', 'Single', '1 w ago', '#9b7a3b'], ['Short n’ Sweet', 'Sabrina Carpenter', 'Album', '2 w ago', '#4a7ab0']].map(r => ({ t: r[0], a: r[1], k: r[2], d: r[3], art: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: 4px; background: ' + r[4] }));
  const cl = [['Daft Punk', 'French touch and disco revival', [['Justice', 'Artist', '#2f2f2f', 1], ['Discovery', 'Album · Daft Punk', '#6b5b2f'], ['Midnight City', 'Song · M83', '#4a3b8a']]], ['Billie Eilish', 'Soft, close, cinematic', [['FINNEAS', 'Artist', '#5b4a3b', 1], ['Glimpse of Us', 'Song · Joji', '#6b6b6b'], ['Ocean Eyes', 'Song · Billie Eilish', '#3b6b8a']]], ['aespa', 'Hyperpop K-pop', [['ILLIT', 'Artist', '#c08ab0', 1], ['Magnetic', 'Song · ILLIT', '#d0a0c0'], ['Supernova', 'Song · aespa', '#9b7a3b']]]];
  const clusters = cl.map(c => ({ n: c[0], p: c[1], rows: c[2].map(r => ({ t: r[0], s: r[1], art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: ' + (r[3] ? 20 : 4) + 'px; background: ' + r[2] })) }));
  return { facets, cards, releases, clusters };
}
}
</script>
</body>
</html>
