<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full screen, Visualizer first, Huge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 2560px; height: 1440px; overflow: hidden; background: #0a0a0a; color: #fff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; right: 492px; background: radial-gradient(circle at 50% 54%, #c0613e 0%, #8a4e7a 20%, #2a1a2a 46%, #0a0a0a 72%)"></div>
  <div aria-hidden="true" style="position: absolute; left: -80px; top: -80px; bottom: -80px; right: 412px; background: radial-gradient(30% 16% at 30% 64%, rgba(255,255,255,0.09), transparent 70%), radial-gradient(34% 18% at 70% 34%, rgba(255,220,240,0.07), transparent 70%), radial-gradient(50% 22% at 50% 82%, rgba(180,140,200,0.09), transparent 70%); filter: blur(40px)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.22)"></div>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; padding: 0 12px 0 24px; gap: 10px; background: linear-gradient(180deg, rgba(0,0,0,0.42), rgba(0,0,0,0))">
    <span aria-hidden="true" style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px; background: #60cdff"></span><span style="font-size: 12px; font-weight: 600">Wavee</span><span style="font-size: 12px; color: rgba(255,255,255,0.7)">Now playing · full screen</span>
    <span style="flex-grow: 1"></span>
    <div role="tablist" aria-label="Full screen view" style="display: flex; gap: 4px; padding: 2px; border-radius: 6px; background: rgba(255,255,255,0.1)"><sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><button role="tab" aria-selected="{{m.sel}}" style="{{m.s}}">{{m.l}}</button></sc-for></div>
    <span style="flex-grow: 1"></span>
    <button aria-label="Full screen options" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font: inherit; font-size: 13px">Exit full screen</button>
  </header>

  <a href="#" style="position: absolute; left: 24px; top: 64px; width: 460px; height: 136px; box-sizing: border-box; padding: 20px; border-radius: 8px; background: rgba(44,44,44,0.7); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(30px); display: flex; gap: 16px; align-items: center">
    <span role="img" aria-label="Random Access Memories cover" style="width: 96px; height: 96px; flex-shrink: 0; border-radius: 4px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111)"></span>
    <span style="display: flex; flex-direction: column; min-width: 0; gap: 4px"><span style="font-size: 20px; line-height: 28px; font-weight: 600">Get Lucky</span><span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Daft Punk · Random Access Memories</span><span style="display: flex; gap: 6px; margin-top: 4px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><span style="height: 24px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.25); font-size: 12px">{{c}}</span></sc-for></span></span>
  </a>

  <div aria-live="polite" style="position: absolute; left: 0; width: 2068px; bottom: 296px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <span style="font-size: 28px; line-height: 36px; font-weight: 600; opacity: 0.35">counting windows, one by one</span>
    <span style="max-width: 1489px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 56px; line-height: 64px; font-weight: 600; text-shadow: 0 0 10px rgba(96,205,255,0.45), 0 2px 10px rgba(0,0,0,0.5)">a light left on <span style="opacity: 0.45">in the hall</span></span>
    <span style="font-size: 28px; line-height: 36px; font-weight: 600; opacity: 0.45">so the morning finds us here</span>
  </div>

  <section aria-label="Playback" style="position: absolute; left: 24px; right: 516px; bottom: 24px; height: 112px; box-sizing: border-box; padding: 14px 24px; border-radius: 8px; background: rgba(44,44,44,0.72); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.8); font-variant-numeric: tabular-nums"><span>2:40</span><span role="slider" aria-label="Seek" aria-valuenow="43" style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 43%; border-radius: 2px; background: #60cdff"></span></span><span>-3:29</span></div>
    <div style="display: flex; align-items: center">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.6)">Playing from album</span><a href="#" style="font-size: 14px; line-height: 20px; font-weight: 600">Random Access Memories</a></span>
      <span style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Shuffle" aria-pressed="true" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #60cdff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h2.5c3 0 4 7 7 7H14M2 11.5h2.5c1.2 0 2-1 2.6-2.2M9 6.7c.6-1.2 1.4-2.2 2.5-2.2H14M12 2.5l2 2-2 2M12 9.5l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Previous" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M13 3 6 8l7 5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Pause" style="width: 56px; height: 56px; border: 0; border-radius: 28px; background: #60cdff; color: #000; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z" fill="currentColor"></path></svg></button>
        <button aria-label="Next" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3v10M3 3l7 5-7 5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Repeat" aria-pressed="false" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7V6a2 2 0 0 1 2-2h8M11 2l2 2-2 2M13 9v1a2 2 0 0 1-2 2H3M5 14l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </span>
      <span style="flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 8px">
        <button aria-label="Remove from Liked Songs" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #60cdff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
        <button aria-label="Mute" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5zM11 5.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <span role="slider" aria-label="Volume" aria-valuenow="70" style="width: 128px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; background: #60cdff; border-radius: 2px"></span></span>
        <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.08); color: #fff; font: inherit; font-size: 13px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v7h-11zM6 13h4M8 10.5V13" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg>This PC</button>
        <button aria-label="More" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </span>
    </div>
  </section>

  <aside aria-label="Visualizer gallery" style="position: absolute; right: 24px; top: 64px; bottom: 24px; width: 444px; box-sizing: border-box; border-radius: 8px; background: rgba(44,44,44,0.82); border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 24px rgba(0,0,0,0.35); backdrop-filter: blur(30px); display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px 0 20px"><h2 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 28px; font-weight: 600">Visualizers</h2><button aria-label="Close gallery" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button></div>
    <div style="padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <h3 style="margin: 8px 0 0; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; color: rgba(255,255,255,0.7)">{{g.n}}</h3>
        <div role="radiogroup" aria-label="{{g.n}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{g.tiles}}" as="t" hint-placeholder-count="2"><button role="radio" aria-checked="{{t.on}}" style="{{t.s}}"><span style="{{t.prev}}"></span><span style="display: flex; align-items: center; gap: 6px; padding: 8px 10px 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600; flex-grow: 1; text-align: left">{{t.n}}</span><span style="font-size: 11px; color: rgba(255,255,255,0.7)">{{t.k}}</span></span><span style="padding: 0 10px 10px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.7); text-align: left">{{t.b}}</span></button></sc-for>
        </div>
      </sc-for>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const modes = ['Lyrics', 'Visualizer', 'Up next', 'Artist'].map((l, i) => ({ l, sel: i === 1 ? 'true' : 'false', s: 'height: 32px; padding: 0 14px; border: 0; border-radius: 4px; font: inherit; font-size: 13px; background: ' + (i === 1 ? '#60cdff' : 'transparent') + '; color: ' + (i === 1 ? '#000' : '#fff') }));
  const chips = ['Very high', 'Synced lyrics', '116 BPM'];
  const P = {
    Verse: 'linear-gradient(180deg, #1a1a1a, #2a2a2a)', Bloom: 'radial-gradient(circle at 50% 55%, #c0613e, #8a4e7a 30%, #1a0f1a 70%)', Bars: 'repeating-linear-gradient(90deg, #60cdff 0 4px, transparent 4px 8px), #101820', Ring: 'radial-gradient(circle, transparent 30%, #60cdff 32%, transparent 36%), #101018', Orbit: 'radial-gradient(circle at 30% 40%, #9b6ac0 0 6%, transparent 7%), radial-gradient(circle at 70% 60%, #60cdff 0 5%, transparent 6%), #0e0e18', Aurora: 'linear-gradient(170deg, #1a3a3a, #3b8a6a 40%, #6a4a9b 70%, #101010)', Timeline: 'linear-gradient(90deg, #2a2a2a 0 60%, #60cdff 60% 61%, #1a1a1a 61%)',
    Classic: 'repeating-linear-gradient(0deg, #3b6b9b 0 3px, transparent 3px 6px), #0a0a14', Warp: 'repeating-radial-gradient(circle, #5b3b9b 0 4px, #0a0a0a 4px 12px)', Tunnel: 'repeating-radial-gradient(circle at 50% 50%, #2f6b6b 0 6px, #0a0a0a 6px 14px)', Ambience: 'radial-gradient(60% 80% at 40% 60%, #3b4a6b, #0a0a0a)', Kaleido: 'conic-gradient(#c0613e, #9b6ac0, #60cdff, #6ccb5f, #c0613e)', Scope: 'linear-gradient(180deg, transparent 48%, #6ccb5f 49% 51%, transparent 52%), #050a05', Drift: 'linear-gradient(135deg, #2a1a2a, #4a3b6b 50%, #1a2a3a)',
    Type: 'linear-gradient(180deg, #111, #222)', Mosaic: 'repeating-linear-gradient(90deg, #3a3a3a 0 18px, #555 18px 20px), #222', Spotlight: 'radial-gradient(circle at 50% 30%, rgba(255,255,255,0.5), transparent 50%), #0a0a0a',
    Magneto: 'radial-gradient(circle at 50% 50%, #ff99a4, #6b2f3b 40%, #0a0a0a 70%)', Flow: 'linear-gradient(120deg, #2f4a6b, #60cdff 50%, #2f4a6b)' };
  const G = [
    ['LYRICS', [['Verse', 'Calm', 'Lines set large over the cover colors']]],
    ['FLUENT', [['Bloom', 'Calm', 'Color that breathes with the beat'], ['Bars', 'Lively', 'Spectrum bars in your accent'], ['Ring', 'Lively', 'A ring that pulses round the cover'], ['Orbit', 'Calm', 'Points circling on the bass'], ['Aurora', 'Calm', 'Slow curtains of light'], ['Timeline', 'Calm', 'The song as a moving line']]],
    ['CLASSICS', [['Classic', 'Lively', 'The old spectrum, rebuilt'], ['Warp', 'Lively', 'Rings rushing outward'], ['Tunnel', 'Lively', 'Fly through the beat'], ['Ambience', 'Calm', 'Soft glow, barely moving'], ['Kaleido', 'Lively', 'Mirrored color wheel'], ['Scope', 'Lively', 'The waveform, live'], ['Drift', 'Calm', 'Color sliding slowly']]],
    ['ZUNE', [['Type', 'Calm', 'Big words from the song'], ['Mosaic', 'Calm', 'Your covers as a wall'], ['Spotlight', 'Lively', 'Light that follows the beat']]],
    ['ITUNES', [['Magneto', 'Lively', 'Fields pulled by the bass'], ['Flow', 'Calm', 'Ribbons of color']]]
  ];
  const groups = G.map(g => ({ n: g[0], tiles: g[1].map(t => ({ n: t[0], k: t[1], b: t[2], on: t[0] === 'Bloom' ? 'true' : 'false',
    s: 'padding: 0; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; color: #fff; font: inherit; ' + (t[0] === 'Bloom' ? 'background: rgba(96,205,255,0.16); border: 2px solid #60cdff' : 'background: rgba(255,255,255,0.051); border: 1px solid rgba(255,255,255,0.08)'),
    prev: 'display: block; height: 78px; background: ' + P[t[0]] })) }));
  return { modes, chips, groups };
}
}
</script>
</body>
</html>
