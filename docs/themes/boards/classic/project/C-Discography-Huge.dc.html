<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discography, Huge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 2560px; height: 1440px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home|artist:Billie Eilish · Albums" sel="1" w="2560" tier="huge" hint-size="2560px,48px"></dc-import>
  <div style="display: flex; height: 1320px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="artists" w="320" h="1320" hint-size="320px,1320px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; padding: 24px 36px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <header style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
        <nav aria-label="Breadcrumb" style="height: 28px; display: flex; align-items: flex-end; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600"><a href="#" style="color: rgba(255,255,255,0.773)">Billie Eilish</a><span style="color: rgba(255,255,255,0.529)">›</span><span>Albums</span></nav>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">Albums</h1>
      </header>
      <div role="tablist" aria-label="Release type" style="display: flex; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.082); flex-shrink: 0"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{t.sel}}" style="{{t.s}}">{{t.l}}<span style="{{t.bar}}"></span></button></sc-for></div>
      <div style="height: 40px; display: flex; align-items: center; gap: 10px; flex-shrink: 0"><span style="width: 3px; height: 22px; border-radius: 2px; background: #60cdff"></span><span style="font-size: 20px; line-height: 28px; font-weight: 600">Albums</span><span style="font-size: 12px; color: rgba(255,255,255,0.529)">5 releases</span><span style="flex-grow: 1"></span><button aria-label="Jump to section" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button></div>
      <div style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 20px 16px; flex-shrink: 0">
        <sc-for list="{{albums}}" as="c" hint-placeholder-count="5"><a href="#" style="{{c.plate}}"><span style="{{c.art}}"></span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.t}}</span><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden">{{c.s}}<svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="{{c.chev}}" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></span></a></sc-for>
      </div>
      <div style="position: relative; flex-shrink: 0; margin-top: -8px">
        <span aria-hidden="true" style="position: absolute; left: 84px; top: -7px; width: 16px; height: 8px; background: rgba(255,255,255,0.031); clip-path: polygon(50% 0, 100% 100%, 0 100%)"></span>
        <div style="border-radius: 8px; background: rgba(255,255,255,0.031); border: 1px solid rgba(255,255,255,0.06); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 12px"><button aria-label="Play HIT ME HARD AND SOFT" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: #60cdff; color: #000; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10l8-5z" fill="currentColor"></path></svg></button><span style="width: 28px; height: 28px; border-radius: 4px; background: #2f4a6b"></span><span style="font-size: 14px; font-weight: 600; flex-grow: 1">HIT ME HARD AND SOFT <span style="font-weight: 400; color: rgba(255,255,255,0.773)">· Album · 2024 · 10 tracks · 44 min</span></span><a href="#" style="height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); font-size: 12px; display: flex; align-items: center; gap: 6px">Go to album<svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg></a></div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(3, 32px); gap: 0 32px">
            <sc-for list="{{drawer}}" as="r" hint-placeholder-count="10"><div style="height: 32px; display: grid; grid-template-columns: 26px 28px minmax(0, 1fr) 44px 32px; align-items: center; font-size: 13px"><span style="color: rgba(255,255,255,0.529); font-size: 12px; font-variant-numeric: tabular-nums">{{r.n}}</span><span style="{{r.h}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="text-align: right; color: rgba(255,255,255,0.773); font-size: 12px; font-variant-numeric: tabular-nums">{{r.d}}</span><span></span></div></sc-for>
          </div>
        </div>
      </div>
      <div style="height: 40px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-top: 12px"><span style="width: 3px; height: 22px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span><span style="font-size: 20px; line-height: 28px; font-weight: 600">Singles &amp; EPs</span></div>
      <div style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 20px 16px; flex-shrink: 0">
        <sc-for list="{{singles}}" as="c" hint-placeholder-count="11"><a href="#" style="{{c.plate}}"><span style="{{c.art}}"></span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.s}}</span></a></sc-for>
      </div>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="2560" tier="huge" panel="none" hint-size="2560px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const tabs = ['Albums', 'Singles & EPs', 'Compilations'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', s: 'position: relative; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (i === 0 ? '#fff' : 'rgba(255,255,255,0.773)'), bar: i === 0 ? 'position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' }));
  const plate = (on) => 'display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 8px; min-width: 0' + (on ? '; background: rgba(255,255,255,0.059)' : '');
  const art = (c) => 'display: block; width: 100%; aspect-ratio: 1 / 1; margin-bottom: 6px; border-radius: 8px; background: linear-gradient(160deg, ' + c + ', #151515)';
  const R = [['HIT ME HARD AND SOFT', 'May 17, 2024 · 10 tracks', '#2f4a6b'], ['Happier Than Ever', 'Jul 30, 2021 · 16 tracks', '#c0a080'], ['WHEN WE ALL FALL ASLEEP…', 'Mar 29, 2019 · 14 tracks', '#2a2a2a'], ['dont smile at me', 'Aug 11, 2017 · 9 tracks', '#d0c030'], ['Live at the Steve Jobs Theater', 'Apr 2, 2021 · 6 tracks', '#3b3b3b']];
  const albums = R.map((r, i) => ({ t: r[0], s: r[1], chev: i === 0 ? 'M4 10l4-4 4 4' : 'M4 6l4 4 4-4', plate: plate(i === 0), art: art(r[2]) }));
  const D = [['SKINNY', '3:39'], ['LUNCH', '3:00'], ['CHIHIRO', '5:03'], ['BIRDS OF A FEATHER', '3:30', 1], ['WILDFLOWER', '4:21'], ['THE GREATEST', '4:53'], ['L’AMOUR DE MA VIE', '5:33'], ['THE DINER', '3:06'], ['BITTERSUITE', '4:58'], ['BLUE', '5:43']];
  const drawer = D.map((d, i) => ({ n: i + 1, t: d[0], d: d[1], h: 'display: flex; color: ' + (d[2] ? '#60cdff' : 'transparent') }));
  const S = [['WILDFLOWER (Live)', '2026 · Single', '#3b5b7a'], ['What Was I Made For?', '2023 · Single', '#d0c060'], ['Guitar Songs', '2022 · EP', '#5b5b4a'], ['Lost Cause', '2021 · Single', '#4a3b2f'], ['Your Power', '2021 · Single', '#6b5b3b'], ['Therefore I Am', '2020 · Single', '#3b3b3b'], ['my future', '2020 · Single', '#3b6b6b'], ['No Time To Die', '2020 · Single', '#2a2a2a'], ['everything i wanted', '2019 · Single', '#2f3b5b'], ['lovely (with Khalid)', '2018 · Single', '#c0c0b0'], ['ocean eyes', '2016 · Single', '#3b6b8a']];
  const singles = S.map(s => ({ t: s[0], s: s[1], plate: plate(false), art: art(s[2]) }));
  return { tabs, albums, drawer, singles };
}
}
</script>
</body>
</html>
