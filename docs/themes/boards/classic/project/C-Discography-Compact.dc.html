<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact Discography</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="artist:Billie Eilish · Albums" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <header style="display: flex; flex-direction: column; gap: 0; flex-shrink: 0">
      <nav aria-label="Breadcrumb" style="height: 28px; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600"><a href="#" style="color: rgba(255,255,255,0.773); padding: 6px 0">Billie Eilish</a><svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.529)"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg><span>Albums</span></nav>
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">Albums</h1>
    </header>
    <div role="tablist" aria-label="Release type" style="display: flex; gap: 0; margin: 0 -16px; padding: 0 4px; border-bottom: 1px solid rgba(255,255,255,0.082); flex-shrink: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent)"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{t.sel}}" style="{{t.s}}">{{t.l}}<span style="{{t.bar}}"></span></button></sc-for></div>
    <button aria-label="Jump to era" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0; border: 0; background: transparent; color: #fff; font: inherit; flex-shrink: 0"><span style="width: 3px; height: 22px; border-radius: 2px; background: #60cdff"></span><span style="font-size: 20px; line-height: 28px; font-weight: 600">Albums</span><span style="font-size: 12px; color: rgba(255,255,255,0.529)">2020s · 3 releases</span><span style="flex-grow: 1"></span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex-shrink: 0; margin: 0 -8px">
      <sc-for list="{{row1}}" as="c" hint-placeholder-count="2"><a href="#" style="{{c.plate}}"><span style="{{c.art}}"></span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.t}}</span><span style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">{{c.s}}<svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path d="{{c.chev}}" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></span></a></sc-for>
    </div>
    <div style="position: relative; flex-shrink: 0; margin: -4px -8px 0">
      <span aria-hidden="true" style="position: absolute; left: 80px; top: -7px; width: 16px; height: 8px; background: rgba(255,255,255,0.051); clip-path: polygon(50% 0, 100% 100%, 0 100%)"></span>
      <div style="border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(255,255,255,0.06); padding: 8px 4px 8px 12px; display: flex; flex-direction: column">
        <div style="height: 48px; display: flex; align-items: center; gap: 10px">
          <button aria-label="Play HIT ME HARD AND SOFT" style="width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 20px; background: #60cdff; color: #000; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10l8-5z" fill="currentColor"></path></svg></button>
          <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">HIT ME HARD AND SOFT</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">Album · 2024 · 10 tracks · 44 min</span></span>
          <a href="#" aria-label="Go to album" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #fff"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        </div>
        <sc-for list="{{drawer}}" as="r" hint-placeholder-count="6"><div style="height: 40px; display: grid; grid-template-columns: 24px 24px minmax(0, 1fr) 40px 40px; align-items: center; column-gap: 4px; font-size: 14px"><span style="color: rgba(255,255,255,0.529); font-size: 12px; text-align: center; font-variant-numeric: tabular-nums">{{r.n}}</span><span style="{{r.h}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="text-align: right; color: rgba(255,255,255,0.773); font-size: 12px; font-variant-numeric: tabular-nums">{{r.d}}</span><button aria-label="More options for {{r.t}}" style="width: 40px; height: 40px; border: 0; background: transparent; color: rgba(255,255,255,0.529); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button></div></sc-for>
      </div>
    </div>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const tabs = ['Albums', 'Singles & EPs', 'Compilations'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', s: 'position: relative; flex-shrink: 0; height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (i === 0 ? '#fff' : 'rgba(255,255,255,0.773)'), bar: i === 0 ? 'position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' }));
  const R = [['HIT ME HARD AND SOFT', 'May 17, 2024 · 10 tracks', '#2f4a6b'], ['Happier Than Ever', 'Jul 30, 2021 · 16 tracks', '#c0a080']];
  const row1 = R.map((r, i) => ({ t: r[0], s: r[1], chev: i === 0 ? 'M4 10l4-4 4 4' : 'M4 6l4 4 4-4',
    plate: 'display: flex; flex-direction: column; gap: 2px; padding: 8px; border-radius: 8px; min-width: 0' + (i === 0 ? '; background: rgba(255,255,255,0.059)' : ''),
    art: 'display: block; width: 100%; aspect-ratio: 1 / 1; margin-bottom: 6px; border-radius: 8px; background: linear-gradient(160deg, ' + r[2] + ', #151515)' }));
  const D = [['SKINNY', '3:39'], ['LUNCH', '3:00'], ['CHIHIRO', '5:03'], ['BIRDS OF A FEATHER', '3:30', 1], ['WILDFLOWER', '4:21'], ['THE GREATEST', '4:53'], ['L’AMOUR DE MA VIE', '5:33']];
  const drawer = D.map((d, i) => ({ n: i + 1, t: d[0], d: d[1], h: 'display: flex; justify-content: center; color: ' + (d[2] ? '#60cdff' : 'transparent') }));
  return { tabs, row1, drawer };
}
}
</script>
</body>
</html>
