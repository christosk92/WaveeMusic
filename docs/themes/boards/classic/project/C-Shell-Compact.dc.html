<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact shell, drawer open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home|album:Random Access Memories" sel="0" w="400" tier="compact" drawer="{{true}}" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: radial-gradient(90% 60% at 10% 0%, rgba(176,110,190,0.10), rgba(176,110,190,0) 70%), rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); padding: 12px 16px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div role="tablist" aria-label="Home" style="display: flex; align-items: center; gap: 8px; height: 40px; margin-left: -8px; flex-shrink: 0">
      <sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button role="tab" aria-selected="{{f.sel}}" style="{{f.style}}">{{f.l}}</button></sc-for>
    </div>
    <section aria-label="Your daylist" style="position: relative; height: 360px; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.098); background: radial-gradient(60% 90% at 70% 30%, #c0613e 0%, rgba(192,97,62,0) 70%), linear-gradient(115deg, #7a5a38 0%, #8a4e7a 55%, #9b6ac0 100%)"></section>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 48px; height: 756px; background: rgba(0,0,0,0.2)"></div>
  <div style="position: absolute; left: 0; top: 48px; width: 320px; height: 756px; box-sizing: border-box; border-top-right-radius: 8px; border-bottom-right-radius: 8px; border: 1px solid rgba(0,0,0,0.098); border-left: 0; box-shadow: 0 8px 16px rgba(0,0,0,0.26); overflow: hidden">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="home" w="320" h="756" account="{{true}}" hint-size="320px,756px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const facets = ['All', 'Music', 'Podcasts', 'Audiobooks'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', style: "height: 40px; flex-shrink: 0; padding: 2px 8px; border: 0; border-radius: 4px; background: transparent; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: " + (i === 0 ? 600 : 400) + '; color: ' + (i === 0 ? '#ffffff' : 'rgba(255,255,255,0.773)') }));
  return { facets };
}
}
</script>
</body>
</html>
