</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a6d8ff;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="tag:What’s new" sel="0" w="800" hint-size="800px,48px"></dc-import>
  <div style="display: flex; height: 480px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="rail" sel="none" h="480" hint-size="48px,480px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; padding: 16px 32px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; flex-shrink: 0">
        <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h5.2l6 6-5.2 5.2-6-6zM5.2 5.2h.01" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <h1 style="margin: 0; flex-grow: 1; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">What’s new</h1>
        <button aria-label="Release: 0.3.0, Oct 2026" style="height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px">0.3.0 · Oct 2026<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: rgba(255,255,255,0.6)"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"></path></svg></button>
      </div>
      <section aria-label="Wavee 0.3" style="flex-shrink: 0; padding: 16px 20px; border-radius: 12px; background: rgba(255,255,255,0.031); border: 1px solid rgba(0,0,0,0.098); display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; gap: 6px"><span style="font-size: 11px; line-height: 16px; font-weight: 600; padding: 1px 8px; border-radius: 4px; background: #60cdff; color: #000">Latest</span><span style="font-size: 11px; line-height: 16px; font-weight: 600; padding: 1px 8px; border-radius: 4px; background: rgba(255,255,255,0.08)">Stable</span></div>
        <h2 style="margin: 0; font-size: 28px; line-height: 36px; font-weight: 600">Wavee 0.3 “Themes”</h2>
        <span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.773)">Pick how Wavee looks: Classic, WinUI, Zune or Zune Fluent.</span>
        <span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.529)">Released Oct 2026 · Requires Windows 10 1809 or later · wavee-v0.3.0</span>
        <div style="display: flex; gap: 8px; margin-top: 4px"><a href="#" style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font-size: 14px">Open on GitHub<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a><button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px">Copy link</button></div>
      </section>
      <section aria-label="Highlights" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex-shrink: 0">
        <sc-for list="{{hl}}" as="h" hint-placeholder-count="2"><div style="display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098); min-width: 0"><span style="{{h.poster}}"></span><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="{{h.pill}}">{{h.k}}</span><span style="font-size: 13.5px; line-height: 18px; font-weight: 600">{{h.t}}</span><a href="#" style="font-size: 12px; line-height: 16px">Read more</a></div></div></sc-for>
      </section>
      <section aria-label="Fixed" style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px"><span style="width: 22px; height: 22px; border-radius: 11px; background: #fce100; color: #000; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span><h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600">Fixed</h2></div>
        <div style="border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid rgba(0,0,0,0.098)"><sc-for list="{{fixed}}" as="f" hint-placeholder-count="3"><div style="min-height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; line-height: 20px"><span style="flex-grow: 1; min-width: 0">{{f.t}}</span><a href="#" style="font-size: 11px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.773)">{{f.i}}</a></div></sc-for></div>
      </section>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="800" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const pill = c => 'align-self: flex-start; font-size: 11px; line-height: 16px; font-weight: 600; padding: 0 6px; border-radius: 4px; background: ' + c + '; color: #000';
  const hl = [['New', 'Themes', '#6ccb5f', 'linear-gradient(135deg,#3b4a8a,#8a4e7a)'], ['Improved', 'Smoother sidebar sections', '#60cdff', 'linear-gradient(135deg,#2f4a6b,#60cdff)']].map(h => ({ k: h[0], t: h[1], pill: pill(h[2]), poster: 'display: block; width: 120px; height: 68px; flex-shrink: 0; border-radius: 4px; background: ' + h[3] }));
  const fixed = [['Queue stays in the player bar on narrow windows', '#205'], ['The window can no longer shrink below a usable height', '#197'], ['Player style is hidden until it changes Now playing', '#199']].map(f => ({ t: f[0], i: f[1] }));
  return { hl, fixed };
}
}
</script>
</body>
