<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Sidebar" style="{{s.root}}">
  <sc-if value="{{account}}" hint-placeholder-val="{{false}}">
    <div style="{{s.acct}}">

      <button aria-label="Friend activity" style="{{s.acctBtn}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 7.5a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6zM1.8 13c.3-2.4 2-3.7 4.2-3.7s3.9 1.3 4.2 3.7M10.5 3.2a2.2 2.2 0 0 1 0 4.2M11.8 9.6c1.4.4 2.3 1.6 2.5 3.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"></path></svg></button>
    </div>

    <sc-if value="{{it.isSep}}" hint-placeholder-val="{{false}}"><span style="{{it.style}}"></span></sc-if>
    <sc-if value="{{it.isHead}}" hint-placeholder-val="{{false}}">
      <div style="{{it.style}}"><span style="flex-grow: 1; min-width: 0">{{it.label}}</span><span style="{{it.tools}}"><span style="{{s.inline}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg></span><span style="{{s.inline}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></span></span><span style="{{s.inline}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="{{it.chev}}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></div>

        <span style="{{s.rule}}"></span>
        <sc-if value="{{failed}}" hint-placeholder-val="{{false}}"><div role="alert" style="{{s.fail}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="M8 2a6 6 0 1 1 0 12A6 6 0 0 1 8 2zM8 5v3.5M8 11v.01" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path></svg><span style="flex-grow: 1">Couldn’t refresh your library. Showing what was loaded.</span><button style="{{s.retry}}">Retry</button></div></sc-if>
        <sc-if value="{{grid}}" hint-placeholder-val="{{false}}"><div style="{{s.grid}}"><sc-for list="{{tiles}}" as="g" hint-placeholder-count="6"><span style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{g.art}}"></span><span style="{{g.t}}">{{g.l}}</span></span></sc-for></div></sc-if>
      </div>
    </sc-if>
  </sc-for>
</nav>
</x-dc>

  s.acctBadge = 'position: absolute; right: 6px; top: 6px; min-width: 14px; height: 14px; border-radius: 7px; background: ' + T.acc + '; color: ' + T.onAcc + '; font-size: 9px; font-weight: 600; display: flex; align-items: center; justify-content: center';
  return { s, account, items, chips, tiles, grid: tiles.length > 0, failed: state === 'failed', listOn: gridOn ? 'false' : 'true', gridOn: gridOn ? 'true' : 'false' };
}
