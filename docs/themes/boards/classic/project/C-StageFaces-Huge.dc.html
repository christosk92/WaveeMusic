<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full screen, Mosaic face, Huge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 2560px; height: 1440px; overflow: hidden; background: #0a0a0a; color: #fff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: -20px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="45"><span style="{{t}}"></span></sc-for>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.42)"></div>

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 48px; display: flex; align-items: center; padding: 0 12px 0 24px; gap: 10px; background: linear-gradient(180deg, rgba(0,0,0,0.6), rgba(0,0,0,0))">
    <span aria-hidden="true" style="width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px; background: #60cdff"></span><span style="font-size: 12px; font-weight: 600">Wavee</span><span style="font-size: 12px; color: rgba(255,255,255,0.7)">Now playing · full screen</span>
    <span style="flex-grow: 1"></span>
    <div role="tablist" aria-label="Full screen view" style="display: flex; gap: 4px; padding: 2px; border-radius: 6px; background: rgba(255,255,255,0.1)"><sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><button role="tab" aria-selected="{{m.sel}}" style="{{m.s}}">{{m.l}}</button></sc-for></div>
    <span style="flex-grow: 1"></span>
    <button aria-label="Full screen options" aria-expanded="true" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.14); color: #fff; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.1); color: #fff; font: inherit; font-size: 13px">Exit full screen</button>
  </header>

  <a href="#" style="position: absolute; left: 24px; top: 64px; width: 460px; height: 136px; box-sizing: border-box; padding: 20px; border-radius: 8px; background: rgba(44,44,44,0.7); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(30px); display: flex; gap: 16px; align-items: center">
    <span role="img" aria-label="Random Access Memories cover" style="width: 96px; height: 96px; flex-shrink: 0; border-radius: 4px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111)"></span>
    <span style="display: flex; flex-direction: column; min-width: 0; gap: 4px"><span style="font-size: 20px; line-height: 28px; font-weight: 600">Get Lucky</span><span style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.8)">Daft Punk · Random Access Memories</span></span>
  </a>

  <div aria-live="polite" style="position: absolute; left: 0; right: 488px; bottom: 296px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <span style="font-size: 28px; line-height: 36px; font-weight: 600; opacity: 0.35">counting windows, one by one</span>
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 56px; line-height: 64px; font-weight: 600; text-shadow: 0 0 10px rgba(96,205,255,0.45), 0 2px 10px rgba(0,0,0,0.6)">a light left on <span style="opacity: 0.45">in the hall</span></span>
  </div>

  <section aria-label="Playback" style="position: absolute; left: 24px; right: 24px; bottom: 24px; height: 112px; box-sizing: border-box; padding: 14px 24px; border-radius: 8px; background: rgba(44,44,44,0.72); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.8); font-variant-numeric: tabular-nums"><span>2:40</span><span role="slider" aria-label="Seek" aria-valuenow="43" style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 43%; border-radius: 2px; background: #60cdff"></span></span><span>-3:29</span></div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px">
      <button aria-label="Previous" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M13 3 6 8l7 5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Pause" style="width: 56px; height: 56px; border: 0; border-radius: 28px; background: #60cdff; color: #000; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 3h2.4v10H4.5zM9.1 3h2.4v10H9.1z" fill="currentColor"></path></svg></button>
      <button aria-label="Next" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3v10M3 3l7 5-7 5z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
  </section>

  <section role="dialog" aria-label="Full screen" style="position: absolute; right: 24px; top: 56px; width: 440px; height: 720px; box-sizing: border-box; border-radius: 8px; background: rgba(44,44,44,0.88); border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 24px rgba(0,0,0,0.35); backdrop-filter: blur(30px); display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 8px 0 20px"><h2 style="margin: 0; flex-grow: 1; font-size: 20px; line-height: 28px; font-weight: 600">Full screen</h2><button aria-label="Close" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button></div>
    <div role="tablist" aria-label="Options" style="height: 40px; flex-shrink: 0; display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid rgba(255,255,255,0.082)"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button role="tab" aria-selected="{{t.sel}}" style="{{t.s}}">{{t.l}}<span style="{{t.bar}}"></span></button></sc-for></div>
    <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px; flex-grow: 1; min-height: 0">
      <div style="display: flex; gap: 12px; align-items: center"><span style="width: 136px; height: 76px; flex-shrink: 0; border-radius: 4px; background: repeating-linear-gradient(90deg, #3a3a3a 0 14px, #555 14px 16px), #222; box-shadow: inset 0 0 0 2px #60cdff"></span><span style="display: flex; flex-direction: column"><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.7)">Now showing</span><span style="font-size: 16px; line-height: 22px; font-weight: 600">Mosaic</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.7)">Zune · Calm</span></span></div>
      <div role="tablist" aria-label="Visualizer groups" style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{groups}}" as="g" hint-placeholder-count="6"><button role="tab" aria-selected="{{g.sel}}" style="{{g.s}}">{{g.l}}</button></sc-for></div>
      <div role="radiogroup" aria-label="Zune visualizers" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{faces}}" as="f" hint-placeholder-count="3"><button role="radio" aria-checked="{{f.on}}" style="{{f.s}}"><span style="{{f.prev}}"></span><span style="display: flex; align-items: center; gap: 4px; padding: 6px 8px"><span style="font-size: 13px; line-height: 18px; font-weight: 600; flex-grow: 1; text-align: left">{{f.n}}</span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="{{f.check}}"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button></sc-for>
      </div>
      <span style="flex-grow: 1"></span>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0 16px; border-top: 1px solid rgba(255,255,255,0.082)"><span style="flex-grow: 1; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.7)">Every visualizer works with every layout</span><button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px">Open gallery<span style="font-size: 11px; padding: 0 5px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7)">G</span></button></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const modes = ['Lyrics', 'Visualizer', 'Up next', 'Artist'].map((l, i) => ({ l, sel: i === 1 ? 'true' : 'false', s: 'height: 32px; padding: 0 14px; border: 0; border-radius: 4px; font: inherit; font-size: 13px; background: ' + (i === 1 ? '#60cdff' : 'transparent') + '; color: ' + (i === 1 ? '#000' : '#fff') }));
  const pal = ['#2f4a6b', '#8a8a9b', '#9b7a3b', '#4a7ab0', '#d0a0c0', '#b05a3b', '#b0b0b0', '#a05a5a', '#3b6b8a', '#6b3b4a', '#3b7a6b', '#5b3b6b', '#6b5b2f', '#3a3a4a', '#c06a8a'];
  const tiles = Array.from({ length: 45 }, (_, i) => i === 22
    ? 'display: block; border-radius: 4px; background: linear-gradient(135deg,#111,#bdbdbd 52%,#111); box-shadow: 0 0 0 3px #60cdff, 0 0 60px 12px rgba(96,205,255,0.45); z-index: 1'
    : 'display: block; border-radius: 4px; background: linear-gradient(160deg, ' + pal[(i * 7) % pal.length] + ', #141414); opacity: ' + (0.55 + ((i * 13) % 5) * 0.08));
  const tabs = ['Visualizer', 'Layout'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', s: 'position: relative; height: 40px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: ' + (i === 0 ? 600 : 400) + '; color: ' + (i === 0 ? '#fff' : 'rgba(255,255,255,0.7)'), bar: i === 0 ? 'position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' }));
  const groups = ['All', 'Lyrics', 'Fluent', 'Classics', 'Zune', 'iTunes'].map(l => ({ l, sel: l === 'Zune' ? 'true' : 'false', s: 'height: 32px; padding: 0 12px; border-radius: 16px; font: inherit; font-size: 13px; ' + (l === 'Zune' ? 'border: 0; background: #60cdff; color: #000; font-weight: 600' : 'background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff') }));
  const F = [['Type', 'linear-gradient(180deg, #111, #222)'], ['Mosaic', 'repeating-linear-gradient(90deg, #3a3a3a 0 14px, #555 14px 16px), #222'], ['Spotlight', 'radial-gradient(circle at 50% 30%, rgba(255,255,255,0.5), transparent 50%), #0a0a0a']];
  const faces = F.map(f => ({ n: f[0], on: f[0] === 'Mosaic' ? 'true' : 'false',
    s: 'padding: 0; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; color: #fff; font: inherit; ' + (f[0] === 'Mosaic' ? 'background: rgba(96,205,255,0.16); border: 2px solid #60cdff' : 'background: rgba(255,255,255,0.051); border: 1px solid rgba(255,255,255,0.08)'),
    prev: 'display: block; aspect-ratio: 16 / 9; background: ' + f[1],
    check: f[0] === 'Mosaic' ? 'color: #60cdff' : 'opacity: 0' }));
  return { modes, tiles, tabs, groups, faces };
}
}
</script>
</body>
</html>
