<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading skeletons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home|album:Random Access Memories" sel="1" w="1440" search="focus" query="daft" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="albums" h="780" hint-size="280px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; display: flex; overflow: hidden">
      <aside aria-label="Loading album" style="width: 280px; flex-shrink: 0; box-sizing: border-box; padding: 24px 8px 24px 16px; display: flex; flex-direction: column; gap: 14px; background: rgba(58,58,58,0.298); border-top-left-radius: 8px">
        <span style="width: 256px; height: 256px; border-radius: 8px; background: linear-gradient(135deg, #111 0%, #3a3a3a 40%, #bdbdbd 52%, #3a3a3a 64%, #111 100%); opacity: 0.9"></span>
        <span style="{{b.w32}}"></span>
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; margin-top: -6px">Random Access Memories</span>
        <span style="{{b.w40}}"></span>
        <span style="{{b.w62}}"></span>
        <span style="display: flex; gap: 8px"><span style="{{b.cta}}"></span><span style="{{b.sq}}"></span><span style="{{b.sq}}"></span><span style="{{b.sq}}"></span><span style="{{b.sq}}"></span></span>
        <span style="{{b.card110}}"></span>
      </aside>
      <span aria-hidden="true" style="width: 16px; flex-shrink: 0"></span>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 12px 24px 0 0">
        <div style="height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 8px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.45)"><span>Play next ⌄</span><span>Shuffle</span><span style="flex-grow: 1"></span><span>Filter</span><span>Album order ⌄</span><span>⋯</span></div>
        <div style="height: 36px; margin: 0 8px; border-bottom: 1px solid rgba(255,255,255,0.082)"></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6"><div style="{{r.s}}"><span style="{{b.num}}"></span><span style="{{r.t}}"></span><span style="flex-grow: 1"></span><span style="{{b.dur}}"></span></div></sc-for>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 8px 0">
          <span style="{{b.h160}}"></span>
          <div style="display: flex; gap: 12px"><sc-for list="{{fans}}" as="f" hint-placeholder-count="5"><span style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 148px"><span style="{{b.circle}}"></span><span style="{{b.w60}}"></span></span></sc-for></div>
          <span style="{{b.h160}}"></span>
          <sc-for list="{{feat}}" as="f" hint-placeholder-count="2"><span style="display: flex; align-items: center; gap: 12px; height: 64px"><span style="{{b.cover48}}"></span><span style="{{b.w30}}"></span></span></sc-for>
        </div>
      </div>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
  <div role="listbox" aria-label="Suggestions, loading" aria-busy="true" style="position: absolute; left: 480px; top: 44px; width: 480px; height: 386px; padding: 4px; box-sizing: border-box; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column">
    <span style="height: 2px; margin: 0 8px; border-radius: 1px; background: linear-gradient(90deg, transparent 20%, #60cdff 20% 50%, transparent 50%)"></span>
    <sc-for list="{{q}}" as="x" hint-placeholder-count="3"><span style="height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px"><span style="{{b.g16}}"></span><span style="{{x}}"></span></span></sc-for>
    <span style="height: 1px; margin: 4px 8px; background: rgba(255,255,255,0.082)"></span>
    <sc-for list="{{rich}}" as="x" hint-placeholder-count="4"><span style="height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 8px"><span style="{{b.c44}}"></span><span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1"><span style="{{x}}"></span><span style="{{b.w30}}"></span></span></span></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const g = 'rgba(255,255,255,0.07)';
  const bar = (w, h) => 'display: block; width: ' + w + '; height: ' + (h || 12) + 'px; border-radius: 4px; background: ' + g;
  const b = { w32: bar('32%'), w40: bar('40%', 14), w62: bar('62%'), w60: bar('60%'), w30: bar('40%', 10), h160: bar('160px', 18),
    cta: 'width: 121px; height: 32px; border-radius: 4px; background: ' + g, sq: 'width: 32px; height: 32px; border-radius: 4px; background: ' + g,
    card110: 'display: block; height: 110px; border-radius: 8px; background: ' + g, num: 'width: 14px; height: 10px; border-radius: 3px; background: ' + g,
    dur: 'width: 32px; height: 10px; border-radius: 3px; background: ' + g, circle: 'width: 132px; height: 132px; border-radius: 66px; background: ' + g,
    cover48: 'width: 48px; height: 48px; border-radius: 4px; background: ' + g, g16: 'width: 16px; height: 16px; border-radius: 8px; background: ' + g, c44: 'width: 44px; height: 44px; border-radius: 4px; background: ' + g };
  const rows = [52, 38, 61, 44, 57, 35].map((w, i) => ({ s: 'height: 48px; margin: 0 8px; display: flex; align-items: center; gap: 24px; padding: 0 8px; border-radius: 6px' + (i % 2 ? '; background: rgba(255,255,255,0.039)' : ''), t: bar(w + '%', 12) }));
  const fans = [1, 2, 3, 4, 5];
  const feat = [1, 2];
  const q = ['55%', '70%', '62%'].map(w => bar(w, 12));
  const rich = ['45%', '60%', '52%', '40%'].map(w => bar(w, 12));
  return { b, rows, fans, feat, q, rich };
}
}
</script>
</body>
</html>
