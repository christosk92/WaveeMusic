<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="profile:Chris" sel="0" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: linear-gradient(180deg, rgba(110,80,60,0.32), rgba(58,58,58,0.298) 380px); border-top: 1px solid rgba(0,0,0,0.098); padding-top: 20px; display: flex; flex-direction: column; overflow: hidden">
    <section aria-label="Chris" style="padding: 0 16px; display: flex; flex-direction: column; align-items: center; text-align: center; flex-shrink: 0">
      <span role="img" aria-label="Chris" style="width: 128px; height: 128px; flex-shrink: 0; border-radius: 64px; background: linear-gradient(135deg, #8a5a44, #3b5b7a); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 600">C</span>
      <span style="margin-top: 12px; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.03em; color: rgba(255,255,255,0.773)">Profile</span>
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.01em">Chris</h1>
      <div style="margin-top: 8px; display: flex; justify-content: center; gap: 4px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="3"><a href="#" style="min-width: 96px; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px 6px; border-radius: 4px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 350">{{s.n}}</span><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: rgba(255,255,255,0.529)">{{s.l}}</span></a></sc-for>
      </div>
      <div style="margin-top: 12px; display: flex; justify-content: center; gap: 8px">
        <a href="#" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); font-size: 14px">Open account<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
        <button aria-label="Share" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5h3.5V6M13.5 2.5 8 8M6 3.5H3v9.5h9.5V10" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="More" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </div>
    </section>
    <nav aria-label="Sections" style="margin-top: 16px; height: 48px; flex-shrink: 0; display: flex; align-items: stretch; gap: 0; padding: 0 4px; border-bottom: 1px solid rgba(255,255,255,0.082); overflow: hidden; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent)"><sc-for list="{{pivots}}" as="p" hint-placeholder-count="5"><a href="#" style="{{p.s}}">{{p.l}}<span style="{{p.bar}}"></span></a></sc-for></nav>
    <section aria-label="Top artists this month" style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
      <div style="padding: 0 16px; display: flex; align-items: center; gap: 10px"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.006em">Top artists this month</h2><span style="width: 20px; height: 2px; background: #60cdff"></span></span><span style="font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: rgba(255,255,255,0.059); color: rgba(255,255,255,0.773); white-space: nowrap">Only visible to you</span></div>
      <div style="display: flex; gap: 12px; padding-left: 16px; overflow: hidden"><sc-for list="{{artists}}" as="a" hint-placeholder-count="3"><a href="#" style="position: relative; width: 148px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px"><span style="{{a.art}}"></span><span style="font-size: 14px; line-height: 20px; font-weight: 600">{{a.n}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">Artist</span><span style="position: absolute; left: 0; top: -4px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 350; text-shadow: 0 2px 6px rgba(0,0,0,0.6)">{{a.r}}</span></a></sc-for></div>
    </section>
    <section aria-label="Public playlists" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
      <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.006em">Public playlists</h2><span style="width: 20px; height: 2px; background: #60cdff"></span></div>
      <div style="display: flex; gap: 12px; padding-left: 16px; overflow: hidden"><sc-for list="{{lists}}" as="l" hint-placeholder-count="3"><span style="{{l}}"></span></sc-for></div>
    </section>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const stats = [['42', 'Followers'], ['118', 'Following'], ['23', 'Public playlists']].map(s => ({ n: s[0], l: s[1] }));
  const pivots = ['Top artists', 'Playlists', 'Artists', 'Following', 'Followers'].map((l, i) => ({ l, s: 'position: relative; flex-shrink: 0; display: flex; align-items: center; padding: 0 12px; font-size: 14px; font-weight: 600; color: ' + (i === 0 ? '#fff' : 'rgba(255,255,255,0.6)'), bar: i === 0 ? 'position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: #60cdff' : 'display: none' }));
  const artists = [['Daft Punk', '#2f2f2f'], ['Billie Eilish', '#2f4a6b'], ['aespa', '#8a8a9b']].map((a, i) => ({ n: a[0], r: i + 1, art: 'display: block; width: 148px; height: 148px; border-radius: 50%; background: ' + a[1] }));
  const lists = ['#6b3b4a', '#5b5b5b', '#2f5b6b'].map(c => 'display: block; width: 148px; height: 148px; flex-shrink: 0; border-radius: 8px; background: linear-gradient(160deg, ' + c + ', #1a1a1a)');
  return { stats, pivots, artists, lists };
}
}
</script>
</body>
</html>
