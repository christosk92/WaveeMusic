<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small shell, pane open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home|album:Random Access Memories" sel="0" w="800" hint-size="800px,48px"></dc-import>
  <div style="display: flex; height: 480px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="rail" sel="home" h="480" hint-size="48px,480px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; padding: 16px 32px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div role="tablist" aria-label="Home" style="display: flex; align-items: center; gap: 16px; height: 40px; margin-left: -8px; flex-shrink: 0">
        <sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button role="tab" aria-selected="{{f.sel}}" style="{{f.style}}">{{f.l}}</button></sc-for>
      </div>
      <section aria-label="Your daylist" style="position: relative; height: 216px; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.098); background: radial-gradient(60% 90% at 30% 70%, #c0613e 0%, rgba(192,97,62,0) 70%), linear-gradient(115deg, #7a5a38 0%, #8a4e7a 55%, #9b6ac0 100%)">
        <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(74,52,40,0.96) 0%, rgba(74,52,40,0.9) 42%, rgba(74,52,40,0.3) 72%, rgba(74,52,40,0) 100%)"></div>
        <div style="position: relative; width: 372px; box-sizing: border-box; padding: 18px 8px 16px 24px; display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 14px; line-height: 20px; color: rgba(255,255,255,0.773)">Good evening, Chris · your daylist</div>
          <div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.012em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">korean r&amp;b k-indie sunday evening</div>
        </div>
      </section>
      <section aria-label="Recently played" style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
        <div style="height: 32px; display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.006em">Recently played</h2><span style="flex-grow: 1"></span><a href="#" style="font-size: 14px; color: #a6d8ff">Listening history</a></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px">
          <sc-for list="{{recent}}" as="r" hint-placeholder-count="6"><a href="#" style="{{r.style}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.s}}</span></span></a></sc-for>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="800" hint-size="800px,72px"></dc-import>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 48px; height: 480px; background: rgba(0,0,0,0.2)"></div>
  <div style="position: absolute; left: 0; top: 48px; width: 320px; height: 480px; box-sizing: border-box; border-top-right-radius: 8px; border-bottom-right-radius: 8px; border: 1px solid rgba(0,0,0,0.2); border-left: 0; box-shadow: 0 8px 16px rgba(0,0,0,0.26); overflow: hidden">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="home" w="320" h="480" hint-size="320px,480px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const facets = ['All', 'Music', 'Podcasts', 'Audiobooks'].map((l, i) => ({ l, sel: i === 0 ? 'true' : 'false', style: "height: 40px; flex-shrink: 0; padding: 2px 8px; border: 0; border-radius: 4px; background: transparent; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: " + (i === 0 ? 600 : 400) + '; color: ' + (i === 0 ? '#ffffff' : 'rgba(255,255,255,0.773)') }));
  const rc = [['Random Access Memories', 'Album · Daft Punk', 'linear-gradient(135deg,#1c1c1c,#6d6d6d 55%,#c9c9c9)', 1], ['Hype Cleaning Mix', 'Playlist · 50 songs', '#3b4a9b'], ['Vacation Mix', 'Playlist · 50 songs', '#5b7a3b'], ['Liked Songs', 'Playlist · 1,284 songs', 'linear-gradient(135deg,#4a3b8a,#6fa3c8)'], ['K-Pop Duets (러블리 듀엣)', 'Playlist · 312 songs', '#6b3b4a'], ['Billie Eilish', 'Artist', '#2f4a6b']];
  const recent = rc.map(r => ({ t: r[0], s: r[1], style: 'display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 12px 0 8px; box-sizing: border-box; border-radius: 8px; background: rgba(255,255,255,0.051); border: 1px solid ' + (r[3] ? 'rgba(96,205,255,0.5)' : 'rgba(0,0,0,0.098)') + '; min-width: 0', art: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: ' + (r[1] === 'Artist' ? 24 : 4) + 'px; background: ' + r[2] }));
  return { facets, recent };
}
}
</script>
</body>
</html>
