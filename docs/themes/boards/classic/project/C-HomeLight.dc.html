<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(74% 92% at 6% 0%, rgba(176,110,190,0.055), rgba(176,110,190,0) 62%), radial-gradient(58% 78% at 92% 10%, rgba(60,140,200,0.05), rgba(60,140,200,0) 64%), #ededed; color: rgba(0,0,0,0.894); font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="light" tabs="home:Home" sel="0" w="1440" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="light" layout="classic" sel="home" h="780" hint-size="280px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(255,255,255,0.5); border-top: 1px solid rgba(0,0,0,0.059); border-left: 1px solid rgba(0,0,0,0.059); border-top-left-radius: 8px; padding: 24px 36px 0; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
      <div style="display: flex; flex-direction: column; flex-shrink: 0"><div style="display: flex; align-items: center; gap: 24px; height: 40px; margin-left: -8px"><sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><span style="{{f.s}}">{{f.l}}</span></sc-for></div><span style="height: 3px"></span></div>
      <section aria-label="Your daylist" style="position: relative; min-height: 320px; flex-shrink: 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,0.059); background: radial-gradient(60% 90% at 30% 70%, #e0a080 0%, rgba(224,160,128,0) 70%), linear-gradient(115deg, #d8b890 0%, #c89ab8 55%, #b89ad8 100%)">
        <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(250,240,232,0.96) 0%, rgba(250,240,232,0.92) 30%, rgba(250,240,232,0.35) 62%, rgba(250,240,232,0) 100%)"></div>
        <div style="position: relative; width: 544px; box-sizing: border-box; padding: 32px 12px 24px 32px; display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 14px; line-height: 20px; color: rgba(0,0,0,0.62)">Good evening, Chris · your daylist</div>
          <div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600; letter-spacing: -0.012em">korean r&amp;b k-indie sunday evening</div>
          <div style="font-size: 14px; line-height: 20px; color: rgba(0,0,0,0.62)">korean r&amp;b · k-indie · smooth · chill study · coffee house · unwinding</div>
          <div style="font-size: 12px; line-height: 16px; color: rgba(0,0,0,0.5)">Playlist · Spotify · 50 songs</div>
          <div style="display: flex; gap: 8px; align-items: center; margin-top: 14px"><button style="min-width: 120px; height: 32px; border: 0; border-radius: 4px; background: #005fb8; color: #fff; font: inherit; font-size: 14px; font-weight: 600">▶ Play</button><button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.702); border: 1px solid rgba(0,0,0,0.09); color: rgba(0,0,0,0.894); font: inherit; font-size: 14px">⤨ Shuffle</button><button aria-label="Save to Your Library" style="width: 32px; height: 32px; border: 0; background: transparent; color: rgba(0,0,0,0.894)">♡</button><button aria-label="More" style="width: 32px; height: 32px; border: 0; background: transparent; color: rgba(0,0,0,0.894)">⋯</button></div>
          <div style="font-size: 14px; line-height: 20px; margin-top: 18px">Next daylist in <b style="font-weight: 600">01:35:05</b></div>
          <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px"><sc-for list="{{dayparts}}" as="d" hint-placeholder-count="5"><span style="display: flex; flex-direction: column; gap: 4px"><span style="height: 4px; border-radius: 2px; background: rgba(0,0,0,0.1); position: relative; overflow: hidden"><span style="{{d.fill}}"></span></span><span style="{{d.lab}}">{{d.l}}</span></span></sc-for></div>
        </div>
      </section>
      <section aria-label="Recently played" style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
        <div style="height: 32px; display: flex; align-items: center"><h2 style="margin: 0; flex-grow: 1; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Recently played<span style="font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; color: rgba(0,0,0,0.447)">  Pick up where you left off</span></h2><a href="#" style="font-size: 14px; color: #005fb8">Listening history</a></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px"><sc-for list="{{recent}}" as="r" hint-placeholder-count="8"><a href="#" style="{{r.style}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(0,0,0,0.62); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.s}}</span></span></a></sc-for></div>
      </section>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="light" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const facets = ['All', 'Music', 'Podcasts', 'Audiobooks'].map((l, i) => ({ l, s: "padding: 2px 8px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: " + (i ? 400 : 600) + '; color: ' + (i ? 'rgba(0,0,0,0.62)' : 'rgba(0,0,0,0.894)') }));
  const dayparts = [['Early morning', 100], ['Morning', 100], ['Afternoon', 100], ['Evening', 62], ['Night', 0]].map(d => ({ l: d[0], fill: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + d[1] + '%; background: ' + (d[1] === 100 ? 'rgba(0,0,0,0.35)' : '#005fb8'), lab: 'font-size: 11px; line-height: 15px; color: ' + (d[1] > 0 && d[1] < 100 ? 'rgba(0,0,0,0.894); font-weight: 600' : 'rgba(0,0,0,0.55)') }));
  const rc = [['Random Access Memories', 'Album · Daft Punk · Playing now', 'linear-gradient(135deg,#111,#bdbdbd 52%,#111)', 1], ['Hype Cleaning Mix', 'Playlist · 6 min ago', '#3b4a9b'], ['Vacation Mix', 'Playlist · 30 min ago', '#5b7a3b'], ['Liked Songs', 'Playlist · 2 h ago', 'linear-gradient(135deg,#4a3b8a,#6fa3c8)'], ['K-Pop Duets (러블리 듀엣)', 'Playlist · Yesterday', '#6b3b4a'], ['Billie Eilish', 'Artist · Yesterday', '#2f4a6b'], ['Coffee & Code', 'Podcast · Mon', '#4a5b3b'], ['Listening history', '38 plays this week', 'rgba(0,95,184,0.14)']];
  const recent = rc.map((r, i) => ({ t: r[0], s: r[1], style: 'display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 12px 0 8px; box-sizing: border-box; border-radius: 8px; min-width: 0; ' + (i === 7 ? 'border: 1px dashed rgba(0,0,0,0.16)' : 'background: rgba(255,255,255,0.702); border: 1px solid ' + (r[3] ? 'rgba(0,95,184,0.5)' : 'rgba(0,0,0,0.059)')), art: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: ' + (r[1].indexOf('Artist') === 0 ? 24 : 4) + 'px; background: ' + r[2] }));
  return { facets, dayparts, recent };
}
}
</script>
</body>
</html>
