<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact Queue sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="home:Home|album:Random Access Memories" sel="1" w="400" tier="compact" hint-size="400px,48px"></dc-import>
  <main aria-hidden="true" style="height: 756px; flex-shrink: 0; box-sizing: border-box; background: linear-gradient(180deg, rgba(110,110,110,0.22), rgba(58,58,58,0.298) 420px); border-top: 1px solid rgba(0,0,0,0.098); padding: 16px 16px 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
    <span style="align-self: center; width: 280px; height: 280px; flex-shrink: 0; border-radius: 8px; background: linear-gradient(135deg, #111 0%, #3a3a3a 40%, #bdbdbd 52%, #3a3a3a 64%, #111 100%)"></span>
    <span style="margin-top: 14px; font-size: 12px; line-height: 16px; font-weight: 600; color: rgba(255,255,255,0.529)">Album · 2013</span>
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Random Access Memories</span>
  </main>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="400" tier="mini" hint-size="400px,56px"></dc-import>
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0; background: rgba(0,0,0,0.4)"></div>
  <div role="dialog" aria-label="Queue" style="position: absolute; left: 0; right: 0; top: 56px; height: 804px">
    <dc-import name="C-Rail" theme="dark" mode="queue" rs="modern" sheet="{{true}}" w="400" h="804" hint-size="400px,804px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  return {};
}
}
</script>
</body>
</html>
