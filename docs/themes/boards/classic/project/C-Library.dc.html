<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library, Albums</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="C-TitleBar" theme="dark" tabs="albums:Albums" sel="0" w="1440" hint-size="1440px,48px"></dc-import>
  <div style="display: flex; height: 780px; flex-shrink: 0">
    <dc-import name="C-Sidebar" theme="dark" layout="classic" sel="albums" h="780" hint-size="280px,780px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: rgba(58,58,58,0.298); border-top: 1px solid rgba(0,0,0,0.098); border-left: 1px solid rgba(0,0,0,0.098); border-top-left-radius: 8px; display: flex; overflow: hidden">
      <section aria-label="Albums" style="width: 340px; flex-shrink: 0; box-sizing: border-box; padding: 24px 16px 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 10px"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 400; letter-spacing: -0.012em">Albums</h1><span style="font-size: 14px; color: rgba(255,255,255,0.529)">214</span></div>
        <div style="display: flex; align-items: center; gap: 14px; height: 32px">
          <sc-for list="{{words}}" as="w" hint-placeholder-count="3"><span style="{{w.s}}">{{w.l}}<span style="{{w.bar}}"></span></span></sc-for>
          <span style="flex-grow: 1"></span>
          <span style="display: flex; gap: 2px"><span aria-label="List" style="width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.773)">≡</span><span aria-label="Grid" style="width: 28px; height: 28px; border-radius: 4px; background: rgba(255,255,255,0.059); display: flex; align-items: center; justify-content: center">▦</span><span aria-label="More views" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.773)">⋯</span></span>
        </div>
        <div style="height: 32px; box-sizing: border-box; display: flex; align-items: center; padding: 0 10px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); border-bottom-color: rgba(255,255,255,0.545); font-size: 14px; color: rgba(255,255,255,0.773)">Filter</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
          <sc-for list="{{grid}}" as="g" hint-placeholder-count="6"><a href="#" style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="{{g.art}}"></span><span style="font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.t}}</span><span style="font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.773)">{{g.a}}</span></a></sc-for>
        </div>
      </section>
      <span aria-hidden="true" style="width: 16px; flex-shrink: 0; display: flex; justify-content: center"><span style="width: 1px; background: rgba(255,255,255,0.082)"></span></span>
      <section aria-label="Random Access Memories" style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px 24px 0 8px; display: flex; flex-direction: column; gap: 12px">
        <div style="height: 160px; display: flex; gap: 20px; align-items: flex-end; flex-shrink: 0">
          <span style="width: 128px; height: 128px; border-radius: 8px; background: linear-gradient(135deg, #111 0%, #3a3a3a 40%, #bdbdbd 52%, #3a3a3a 64%, #111 100%); box-shadow: 0 2px 8px rgba(0,0,0,0.33)"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.03em; color: rgba(255,255,255,0.529)">Album · 2013</span><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Random Access Memories</span><span style="font-size: 14px; font-weight: 600; color: #a6d8ff">Daft Punk</span><span style="font-size: 12px; color: rgba(255,255,255,0.773)">13 songs · 1 hr 14 min · saved 2024</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0"><button style="min-width: 120px; height: 32px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px; font-weight: 600">▶ Play</button><button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.059); border: 1px solid rgba(255,255,255,0.071); color: #fff; font: inherit; font-size: 14px">⤨ Shuffle</button><button aria-label="Remove from Your Library" style="width: 32px; height: 32px; border: 0; background: transparent; color: #60cdff">♥</button><button aria-label="More" style="width: 32px; height: 32px; border: 0; background: transparent; color: #fff">⋯</button><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px; color: #a6d8ff">Open album ↗</a></div>
        <dc-import name="C-TrackList" theme="dark" rs="modern" set="album" n="9" density="compact" marks="8:playing" hint-size="100%,420px"></dc-import>
      </section>
    </main>
  </div>
  <dc-import name="C-PlayerBar" theme="dark" variant="music" w="1440" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const words = ['recents', 'alphabetical', 'artist'].map((l, i) => ({ l, s: 'position: relative; font-size: 13.5px; line-height: 18px; font-weight: ' + (i === 0 ? 600 : 400) + '; color: ' + (i === 0 ? '#fff' : 'rgba(255,255,255,0.5)'), bar: i === 0 ? 'position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: #60cdff' : 'display: none' }));
  const G = [['Random Access Memories', 'Daft Punk', 'linear-gradient(135deg,#111,#bdbdbd 52%,#111)', 1], ['HIT ME HARD AND SOFT', 'Billie Eilish', '#2f4a6b'], ['Whiplash', 'aespa', '#8a8a9b'], ['Short n’ Sweet', 'Sabrina Carpenter', '#4a7ab0'], ['Discovery', 'Daft Punk', '#6b5b2f'], ['Blue Neighbourhood', 'Troye Sivan', '#5a8ab0']];
  const grid = G.map(g => ({ t: g[0], a: g[1], art: 'display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; background: ' + g[2] + (g[3] ? '; box-shadow: 0 0 0 3px #60cdff' : '') }));
  return { words, grid };
}
}
</script>
</body>
</html>
