<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune state: loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 0 0 48px; gap: 12px">
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 350; letter-spacing: -0.2px; color: #a8a8a8">wavee</span>
    <button aria-label="back" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    <span style="font-size: 13px; color: #7a7a7a">search › <span style="color: #a8a8a8">the weeknd</span></span>
    <span style="flex-grow: 1"></span>
    <label style="display: flex; align-items: center; gap: 8px; width: 220px; height: 32px; box-sizing: border-box; padding: 0 10px 0 12px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.18); color: #7a7a7a"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input type="search" placeholder="search" style="border: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; width: 100%; outline: none; min-width: 0"><span style="font-size: 10px; color: #7a7a7a; border: 1px solid rgba(255,255,255,0.14); padding: 1px 4px; white-space: nowrap">ctrl f</span></label>
    <button style="display: flex; align-items: center; gap: 8px; height: 32px; border: 0; background: transparent; color: #ffffff; font: inherit; font-size: 13px; padding: 0 8px; margin-left: 8px"><span style="width: 24px; height: 24px; border-radius: 12px; background: #5b6b3b; display: block"></span>christos</button>
    <button aria-label="notifications" style="width: 32px; height: 32px; border: 0; background: transparent; color: #a8a8a8; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1H3z"/><path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg></button>
    <span style="display: flex; color: #a8a8a8; font-size: 12px; margin-left: 8px"><span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center">─</span><span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center">☐</span><span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center">✕</span></span>
  </div>
  <div style="height: 84px; flex-shrink: 0; display: flex; flex-direction: column; padding: 0 16px 0 48px; position: relative">
    <div style="height: 44px; box-sizing: border-box; padding: 4px 0; display: flex; align-items: center; gap: 24px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; letter-spacing: -0.3px">
      <a href="#" style="color: #7a7a7a; font-weight: 350">home</a><a href="#" style="color: #7a7a7a; font-weight: 350">browse</a><a href="#" style="color: #7a7a7a; font-weight: 350">library</a><a href="#" style="color: #7a7a7a; font-weight: 350">recents</a>
      <span style="flex-grow: 1"></span>
      <span style="display: flex; align-items: flex-start; gap: 8px; font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif"><span style="font-size: 11px; line-height: 32px; color: #7a7a7a; margin-right: 4px">pinned</span>
        <sc-for list="{{pins}}" as="p" hint-placeholder-count="6"><span style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="{{p.tile}}"></span><span style="{{p.dot}}"></span></span></sc-for>
      </span>
    </div>
    <div style="height: 32px; display: flex; align-items: center; gap: 20px; font-size: 14px; line-height: 20px; padding-right: 32px">
      <span style="color: #ffffff; font-weight: 600">the weeknd</span><span style="width: 1px; height: 16px; background: rgba(255,255,255,0.14)"></span>
      <span style="color: #4f4f4f">albums</span><span style="color: #4f4f4f">singles &amp; eps</span><span style="color: #4f4f4f">compilations</span><span style="color: #4f4f4f">details</span>
      <span style="flex-grow: 1"></span>
      <span style="display: flex; gap: 14px; align-items: center"><button aria-label="play" style="{{miniPlay}}">▶</button><button aria-label="shuffle" style="width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; border: 2px solid #4f4f4f; background: transparent; color: #4f4f4f; font-size: 12px; padding: 0">⇄</button><span style="width: 84px; height: 28px; box-sizing: border-box; border-radius: 14px; border: 2px solid #3a3a3a; display: block"></span></span>
    </div>
    <span style="position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; display: block; overflow: hidden"><sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="{{d.style}}"></span></sc-for></span>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 300px; flex-shrink: 0; position: relative; overflow: hidden; background: linear-gradient(180deg, #242424 0%, #1c1c1c 70%, #161616 100%)">
      <div style="position: absolute; left: 48px; top: 36px; width: 96px; height: 12px; background: rgba(255,255,255,0.06)"></div>
      <div style="position: absolute; left: 40px; bottom: 44px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 120px; font-weight: 200; line-height: 130px; letter-spacing: -2px; white-space: nowrap; color: #ffffff">the weeknd</div>
      <div style="position: absolute; left: 48px; bottom: 18px; width: 380px; height: 12px; background: rgba(255,255,255,0.06)"></div>
    </div>
    <div style="display: flex; gap: 48px; padding: 24px 48px 0 48px">
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">popular</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
            <div style="display: grid; grid-template-columns: 52px 60px minmax(0, 1fr) 56px; align-items: center; height: 60px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-weight: 300; font-size: 28px; padding-left: 4px; color: #3f3f3f">{{r.n}}</span><span style="width: 48px; height: 48px; background: rgba(255,255,255,0.06); display: block"></span><span style="display: flex; flex-direction: column; gap: 8px"><span style="{{r.bar}}"></span><span style="width: 72px; height: 8px; background: rgba(255,255,255,0.04); display: block"></span></span><span style="width: 32px; height: 8px; background: rgba(255,255,255,0.04); display: block; justify-self: end"></span></div>
          </sc-for>
        </div>
      </div>
      <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">latest release</span>
        <span style="display: flex; gap: 14px; align-items: center"><span style="width: 96px; height: 96px; background: rgba(255,255,255,0.06); display: block; flex-shrink: 0"></span><span style="display: flex; flex-direction: column; gap: 8px"><span style="width: 140px; height: 12px; background: rgba(255,255,255,0.06); display: block"></span><span style="width: 100px; height: 8px; background: rgba(255,255,255,0.04); display: block"></span></span></span>
      </div>
    </div>
  </div>
  <div style="height: 72px; flex-shrink: 0; background: #111111; position: relative; display: flex; align-items: center; padding: 0 12px 0 24px; gap: 24px">
    <div style="position: absolute; left: 0; top: 0; right: 0; height: 2px; background: rgba(255,255,255,0.12)"><div style="{{progress}}"></div></div>
    <div style="display: flex; align-items: center; gap: 12px; width: 320px; flex-shrink: 0"><span style="width: 48px; height: 48px; border-radius: 2px; background: #6b2f4a; flex-shrink: 0"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="font-size: 15px; line-height: 20px">Nightcall</span><span style="font-size: 13px; line-height: 18px; color: #a8a8a8">Kavinsky · OutRun</span></span><button aria-label="save to liked songs" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; font-size: 16px; padding: 0">♡</button></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><div style="display: flex; align-items: center; gap: 16px"><button aria-label="previous" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3 6 8l7 5z"/></svg></button><button aria-label="pause" style="{{playDisc}}"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button><button aria-label="next" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button></div><span style="font-size: 12px; color: #a8a8a8; font-variant-numeric: tabular-nums">1:14 · -3:04</span></div>
    <div style="display: flex; align-items: center; gap: 2px; width: 440px; flex-shrink: 0; justify-content: flex-end; font-size: 13px"><button aria-label="shuffle" style="width: 32px; height: 32px; border: 0; background: transparent; color: {{accent}}; font-size: 16px; padding: 0">⇄</button><button aria-label="repeat" style="width: 32px; height: 32px; border: 0; background: transparent; color: #a8a8a8; font-size: 16px; padding: 0">↻</button><button aria-label="mute" style="width: 32px; height: 32px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg></button><span style="width: 96px; height: 2px; background: rgba(255,255,255,0.18); margin: 0 10px 0 2px; display: block"><span style="display: block; width: 70%; height: 2px; background: #ffffff"></span></span><button style="height: 32px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 13px; padding: 0 8px">lyrics</button><button style="height: 32px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 13px; padding: 0 8px">queue</button><button style="height: 32px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 13px; padding: 0 8px">devices</button><button aria-label="full screen" style="width: 32px; height: 32px; border: 0; background: transparent; color: #a8a8a8; font-size: 16px; padding: 0">⤢</button><button aria-label="more" style="width: 32px; height: 32px; border: 0; background: transparent; color: #a8a8a8; font-size: 16px; padding: 0">⋯</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f","#b983ff"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const pins = ['#3b4a6b', '#6b2f4a', '#2f5b6b', '#5b3b6b', '#6b4a2f', '#4a6b2f'].map((c, i) => ({ tile: 'width: 32px; height: 32px; border-radius: 4px; background: ' + c + '; display: block', dot: 'width: 4px; height: 4px; border-radius: 2px; display: block; background: ' + (i === 1 ? accent : 'transparent') }));
  const dots = [38, 41, 44, 47, 50].map((x) => ({ style: 'position: absolute; top: 0; left: ' + x + '%; width: 4px; height: 4px; display: block; background: ' + accent }));
  const widths = [180, 150, 200, 120, 170, 140, 190, 160, 130, 175];
  const rows = widths.map((w, i) => ({ n: String(i + 1), bar: 'width: ' + w + 'px; height: 12px; background: rgba(255,255,255,0.06); display: block' }));
  return {
    accent, pins, dots, rows,
    miniPlay: 'width: 28px; height: 28px; border-radius: 14px; border: 0; background: ' + accent + '; color: #000; font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0',
    progress: 'width: 29%; height: 2px; background: ' + accent,
    playDisc: 'width: 40px; height: 40px; border-radius: 20px; border: 0; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; padding: 0',
  };
}
}
</script>
</body>
</html>
