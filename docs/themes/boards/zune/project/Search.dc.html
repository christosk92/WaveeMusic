<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune search songs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#c8c8c8;text-decoration:none}a:hover{color:#ffffff;text-decoration:underline}
</style>
</helmet>
<div style="width: 1280px; height: 620px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; padding: 32px 48px; display: flex; gap: 56px">
  <div style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px">
    <div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300">best match</div>
    <div style="display: flex; gap: 18px; align-items: flex-end; padding: 8px 0">
      <div style="width: 120px; height: 120px; background: #4a2f5b; flex-shrink: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 32px; font-weight: 300; line-height: 38px">Midnight City</div>
        <div style="font-size: 14px; color: #a8a8a8">song · M83</div>
        <div style="display: flex; gap: 16px; padding-top: 8px; font-size: 14px"><a href="#">play</a><a href="#">add to queue</a></div>
      </div>
    </div>
  </div>
  <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; margin-bottom: 6px">songs</div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="{{r.rowStyle}}">
        <span style="{{r.artStyle}}"></span>
        <span style="display: flex; flex-direction: column; min-width: 0; gap: 1px">
          <span style="{{r.titleStyle}}">{{r.title}}</span>
          <span style="font-size: 13px; color: #9c9c9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
        </span>
        <span style="font-size: 13px; color: #9c9c9c; text-align: right; font-variant-numeric: tabular-nums">{{r.time}}</span>
      </div>
    </sc-for>
    <a href="#" style="font-size: 14px; padding-top: 8px">see all songs</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":620}}'>
class Component extends DCLogic {
renderVals() {
  const data = [
    ['Midnight City', 'M83 · Hurry Up, We’re Dreaming', '4:03', '#4a2f5b'],
    ['Midnight City (Eric Prydz Remix)', 'M83, Eric Prydz', '7:12', '#2f4a5b'],
    ['Midnight City', 'Joe Hertz', '3:21', '#5b4a2f'],
    ['Midnight City – Acoustic', 'Hollow Coves', '3:48', '#2f5b3b'],
    ['City of Midnight', 'The Midnight', '4:44', '#5b2f3b'],
    ['Midnight in the City', 'Dreamers', '3:09', '#3b3b5b'],
  ];
  const rows = data.map((d, i) => ({
    title: d[0], sub: d[1], time: d[2],
    rowStyle: 'display: grid; grid-template-columns: 56px minmax(0, 1fr) 56px; align-items: center; height: 56px; ' + (i === 1 ? 'background: rgba(255,255,255,0.05)' : ''),
    artStyle: 'width: 40px; height: 40px; border-radius: 2px; background: ' + d[3],
    titleStyle: 'font-size: 15px; line-height: 20px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis',
  }));
  return { rows };
}
}
</script>
</body>
</html>
