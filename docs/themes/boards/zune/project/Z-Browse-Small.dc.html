<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune browse: small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="small" accent="{{accent}}" hint-size="800px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="small" section="browse" sub="top,for you,genres,charts,concerts" on="top" accent="{{accent}}" hint-size="800px,84px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 4px 24px 0 24px; overflow: hidden">
    <div style="display: flex; gap: 32px; flex-shrink: 0">
      <div style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">charts</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <a href="#" style="display: flex; align-items: flex-end; height: 104px; padding: 10px 12px; box-sizing: border-box; background: #8d2f5b; color: #ffffff; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 26px">charts</a>
          <a href="#" style="display: flex; align-items: flex-end; height: 104px; padding: 10px 12px; box-sizing: border-box; background: #2f5b8d; color: #ffffff; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 26px">podcast charts</a>
        </div>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">for you</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">all 10</a></div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; font-size: 15px">
          <sc-for list="{{forYou}}" as="f" hint-placeholder-count="6"><a href="#" style="height: 36px; display: flex; align-items: center; gap: 12px; color: #ffffff; white-space: nowrap; overflow: hidden"><span style="{{f.dot}}"></span>{{f.name}}</a></sc-for>
        </div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">genres</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">A–Z</a></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 24px; font-size: 15px">
        <sc-for list="{{genres}}" as="g" hint-placeholder-count="12"><a href="#" style="height: 32px; display: flex; align-items: center; color: #c8c8c8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g}}</a></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">mood &amp; activity</span>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="5"><a href="#" style="{{m.style}}">{{m.name}}</a></sc-for>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="medium" title="Nightcall" artist="Kavinsky" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const forYou = [['Discover', '#2f8d6b'], ['Made For You', '#2f5b8d'], ['EQUAL', '#8d2f5b'], ['New Releases', '#8d2f2f'], ['Fresh Finds', '#8d6b2f'], ['RADAR', '#2f8d8d']].map((d) => ({ name: d[0], dot: 'width: 10px; height: 10px; background: ' + d[1] + '; display: block; flex-shrink: 0' }));
  const genres = ['Afro', 'Alternative', 'Ambient', 'Blues', 'Classical', 'Country', 'Dance / Electronic', 'Folk & Acoustic', 'Hip-Hop', 'Indie', 'Jazz', 'K-Pop'];
  const moods = [['chill', '#2f5b6b'], ['focus', '#3b4a6b'], ['party', '#8d5b2f'], ['workout', '#6b2f8d'], ['sleep', '#2f3b6b']].map((d) => ({ name: d[0], style: 'display: flex; align-items: flex-end; height: 80px; padding: 10px 12px; box-sizing: border-box; background: ' + d[1] + '; color: #ffffff; font-size: 15px' }));
  return { accent, forYou, genres, moods };
}
}
</script>
</body>
</html>
