<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune now playing: compact sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #0a0a0a; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <sc-if value="{{isBloom}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 400px; height: 860px; overflow: hidden">
      <span style="position: absolute; left: -140px; top: 60px; width: 420px; height: 420px; border-radius: 210px; background: #6b2f4a; filter: blur(80px); opacity: 0.95"></span>
      <span style="{{bloomAccent}}"></span>
      <span style="position: absolute; left: 80px; top: 520px; width: 420px; height: 380px; border-radius: 210px; background: #3b2f5b; filter: blur(90px); opacity: 0.85"></span>
      <span style="position: absolute; left: 0; top: 0; width: 400px; height: 860px; background: rgba(10,10,10,0.42)"></span>
    </div>
  </sc-if>
  <sc-if value="{{isMosaic}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 400px; height: 860px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 100px; grid-auto-flow: dense; gap: 3px; padding: 2px; box-sizing: border-box; overflow: hidden">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="36"><span style="{{t.s}}"></span></sc-for>
    </div>
    <div style="position: absolute; left: 0; top: 0; width: 400px; height: 860px; background: rgba(10,10,10,0.62)"></div>
  </sc-if>
  <sc-if value="{{isType}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: -20px; top: 80px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 200px; font-weight: 300; line-height: 200px; letter-spacing: -5px; white-space: nowrap; color: rgba(255,255,255,0.07)">kavinsky</div>
    <div aria-hidden="true" style="{{typeAccent}}">nightcall</div>
  </sc-if>
  <sc-if value="{{isSpotlight}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 400px; height: 860px; background: linear-gradient(170deg, #3a2a4a 0%, #1f2a3a 50%, #0f1a2a 100%)"></div>
  </sc-if>
  <div style="position: relative; height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 4px 0 4px">
    <button aria-label="close now playing" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg></button>
    <span style="flex-grow: 1; min-width: 0; font-size: 13px; color: #a8a8a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">playing from <a href="#" style="color: #ffffff">late night drive</a></span>
    <button aria-label="full screen options" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; font-size: 16px; padding: 0">⋯</button>
  </div>
  <nav aria-label="now playing views" style="position: relative; height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding-left: 16px; overflow: hidden; white-space: nowrap; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; letter-spacing: -0.3px; -webkit-mask-image: linear-gradient(90deg, #000 84%, transparent); mask-image: linear-gradient(90deg, #000 84%, transparent)">
    <a href="#" style="color: #ffffff; font-weight: 600; flex-shrink: 0">visualizer</a><a href="#" style="color: #7a7a7a; font-weight: 350; flex-shrink: 0">lyrics</a><a href="#" style="color: #7a7a7a; font-weight: 350; flex-shrink: 0">up next</a><a href="#" style="color: #7a7a7a; font-weight: 350; flex-shrink: 0">artist</a>
  </nav>
  <div style="position: relative; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 0 16px">
    <span role="img" aria-label="OutRun cover" style="width: 304px; height: 304px; border-radius: 2px; background: #6b2f4a; display: block; box-shadow: 0 16px 40px rgba(0,0,0,0.45); flex-shrink: 0"></span>
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; font-weight: 300; line-height: 48px; letter-spacing: -0.5px; margin-top: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">nightcall</span>
    <a href="#" style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; color: {{accent}}">Kavinsky</a>
    <span style="font-size: 15px; line-height: 20px; color: #a8a8a8">OutRun · 2013</span>
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 18px; flex-shrink: 0">
      <span style="height: 40px; display: flex; align-items: center"><span style="flex-grow: 1; height: 2px; background: rgba(255,255,255,0.14); display: block; position: relative"><span style="{{progress}}"></span><span style="{{thumb}}"></span></span></span>
      <span style="display: flex; justify-content: space-between; font-size: 12px; color: #a8a8a8; font-variant-numeric: tabular-nums; margin-top: -10px"><span>1:14</span><span>-3:04</span></span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 72px; margin-top: 4px; flex-shrink: 0">
      <button aria-label="shuffle" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{accent}}; font-size: 18px; padding: 0">⇄</button>
      <button aria-label="previous" style="width: 48px; height: 48px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3 6 8l7 5z"/></svg></button>
      <button aria-label="pause" style="{{playDisc}}"><svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
      <button aria-label="next" style="width: 48px; height: 48px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button>
      <button aria-label="repeat" style="width: 44px; height: 44px; border: 0; background: transparent; color: #a8a8a8; font-size: 18px; padding: 0">↻</button>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 48px; flex-shrink: 0; font-size: 13px">
      <button aria-label="save to liked songs" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; font-size: 17px; padding: 0">♡</button>
      <button style="height: 40px; border: 0; background: transparent; color: #a8a8a8; font: inherit; padding: 0 8px; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="3" width="12" height="8"/><path d="M5 14h6"/></svg>this computer</button>
      <span style="flex-grow: 1"></span>
      <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 6px">{{faceName}}</a>
      <a href="#" style="height: 40px; display: flex; align-items: center; padding: 0 6px; color: #7a7a7a">card</a>
    </div>
  </div>
  <a href="#" style="position: relative; height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; background: rgba(10,10,10,0.6); color: #ffffff">
    <span style="width: 44px; height: 44px; border-radius: 2px; background: #3a2f22; display: block; flex-shrink: 0"></span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 11px; line-height: 14px; color: #7a7a7a">up next</span><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Get Lucky <span style="color: #a8a8a8">· Daft Punk</span></span></span>
    <span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #a8a8a8; font-size: 16px">›</span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"face":{"editor":"enum","default":"bloom","options":["bloom","mosaic","type","spotlight","none"]},"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const face = this.props.face ?? 'bloom';
  const colors = ['#6b2f4a', '#3b4a6b', '#2f5b6b', '#5b3b6b', '#6b4a2f', '#6b2f2f', '#4a6b2f', '#2f3b6b', '#3a2f22', '#5b2f6b', '#2f4a3b', '#4a2f3b'];
  let seed = 11;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const tiles = [];
  for (let i = 0; i < 36; i++) tiles.push({ s: 'display: block; background: ' + colors[Math.floor(rnd() * colors.length)] + (i === 0 || i === 13 ? '; grid-column: span 2; grid-row: span 2' : '') });
  const faceNames = { bloom: 'face · bloom', mosaic: 'face · mosaic', type: 'face · type', spotlight: 'face · spotlight', none: 'face · none' };
  return {
    accent, tiles,
    isBloom: face === 'bloom', isMosaic: face === 'mosaic', isType: face === 'type', isSpotlight: face === 'spotlight',
    faceName: faceNames[face] || 'face · bloom',
    bloomAccent: 'position: absolute; left: 200px; top: -100px; width: 360px; height: 360px; border-radius: 180px; background: ' + accent + '; filter: blur(100px); opacity: 0.3',
    typeAccent: 'position: absolute; left: 8px; top: 560px; font-family: \'Segoe UI Variable Display\', \'Segoe UI\', sans-serif; font-size: 120px; font-weight: 600; line-height: 120px; letter-spacing: -3px; white-space: nowrap; opacity: 0.22; color: ' + accent,
    progress: 'position: absolute; left: 0; top: 0; width: 29%; height: 2px; background: ' + accent + '; display: block',
    thumb: 'position: absolute; left: 29%; top: -5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px; background: #ffffff; display: block',
    playDisc: 'width: 64px; height: 64px; border-radius: 32px; border: 0; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; padding: 0',
  };
}
}
</script>
</body>
</html>
