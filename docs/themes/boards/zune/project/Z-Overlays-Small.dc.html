<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune overlays, small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="small" accent="{{accent}}" hint-size="800px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="small" section="home" sub="all,music,podcasts,audiobooks" on="all" accent="{{accent}}" hint-size="800px,84px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding: 4px 24px 0 24px; overflow: hidden">
    <div style="display: flex; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">pins</span>
        <div style="display: flex; gap: 12px"><sc-for list="{{pins}}" as="t" hint-placeholder-count="3"><a href="#" style="display: flex; flex-direction: column; gap: 6px; width: 88px; color: #ffffff"><span style="{{t.art}}"></span><span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span></a></sc-for></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; flex-grow: 1">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">history</span>
        <div style="display: flex; gap: 12px"><sc-for list="{{history}}" as="t" hint-placeholder-count="3"><a href="#" style="display: flex; flex-direction: column; gap: 6px; width: 88px; color: #ffffff"><span style="{{t.art}}"></span><span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span></a></sc-for></div>
      </div>
    </div>
    <div style="height: 112px; flex-shrink: 0; display: flex; background: #1b1b1b; overflow: hidden">
      <div style="width: 140px; flex-shrink: 0; background: linear-gradient(135deg, #4a2f5b, #7a3b6b 60%, #1b1b1b)"></div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; gap: 4px">
        <span style="font-size: 13px; color: #a8a8a8">good afternoon · your daylist</span>
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">sad girl synth-pop tuesday afternoon</span>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="medium" title="Nightcall" artist="Kavinsky" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="800px,72px"></dc-import>
  <span style="position: absolute; left: 556px; top: 4px; width: 44px; height: 40px; background: #161616; display: block"></span>
  <label style="position: absolute; left: 143px; top: 8px; width: 320px; height: 32px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 16px; border: 1px solid #ffffff; background: #161616; color: #a8a8a8"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input type="search" value="midnight" aria-label="search" style="border: 0; background: transparent; color: #fff; font: inherit; font-size: 13px; width: 100%; outline: none; min-width: 0"><span style="font-size: 10px; color: #7a7a7a; border: 1px solid rgba(255,255,255,0.14); padding: 1px 4px; white-space: nowrap">esc</span></label>
  <div style="position: absolute; left: 143px; top: 44px; width: 320px; background: #242424; box-shadow: 0 16px 40px rgba(0,0,0,0.5); padding: 8px 0; display: flex; flex-direction: column; font-size: 14px">
    <sc-for list="{{suggest}}" as="s" hint-placeholder-count="6">
      <a href="#" style="{{s.row}}"><span style="{{s.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span><span style="font-size: 12px; color: #a8a8a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.sub}}</span></span><span style="font-size: 11px; color: #7a7a7a; text-align: right">{{s.kind}}</span></a>
    </sc-for>
    <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; font-size: 13px; color: #a8a8a8">see all results for "midnight"</a>
  </div>
  <div style="position: absolute; right: 16px; top: 44px; width: 304px; background: #242424; box-shadow: 0 16px 40px rgba(0,0,0,0.5); padding: 16px 0 8px 0; display: flex; flex-direction: column; font-size: 14px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px 12px 16px"><span style="width: 40px; height: 40px; border-radius: 20px; background: #5b6b3b; display: block"></span><span style="display: flex; flex-direction: column"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; font-weight: 300">christos</span><span style="{{premium}}">spotify premium</span></span></div>
    <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; color: #ffffff">profile</a>
    <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; color: #ffffff">settings</a>
    <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; color: #ffffff; justify-content: space-between">play <span style="color: #7a7a7a">▸</span></a>
    <span style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 16px; display: block"></span>
    <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; color: #ffffff">light theme</a>
    <span style="height: 1px; background: rgba(255,255,255,0.08); margin: 6px 16px; display: block"></span>
    <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 16px; color: #ffffff">log out</a>
  </div>
  <div style="position: absolute; right: 24px; bottom: 84px; width: 360px; background: #242424; box-shadow: 0 16px 40px rgba(0,0,0,0.5); padding: 14px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; font-size: 14px"><span style="flex-grow: 1">added 3 to queue</span><a href="#" style="{{toastAction}}">open queue</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const sq = (c) => 'width: 100%; aspect-ratio: 1 / 1; border-radius: 2px; background: ' + c + '; display: block';
  const pins = [['late night drive', '#3b4a6b'], ['Liked Songs', '#5b2f6b'], ['OutRun', '#6b2f4a']].map((d) => ({ name: d[0], art: sq(d[1]) }));
  const history = [['OutRun', '#6b2f4a'], ['Endless Summer', '#6b4a2f'], ['Trilogy', '#6b2f2f']].map((d) => ({ name: d[0], art: sq(d[1]) }));
  const suggest = [['Midnight City', 'M83', 'song', '#3b4a6b', false], ['The Midnight', '2.1M listeners', 'artist', '#6b4a2f', true], ['Midnights', 'Taylor Swift', 'album', '#4a3b5b', false], ['late night drive', 'christos · 42 songs', 'playlist', '#2f3b6b', false], ['Nightcall', 'Kavinsky', 'song', '#6b2f4a', false], ['Midnight Mass', 'podcast · 48 episodes', 'podcast', '#2f4a3b', false]].map((d) => ({
    name: d[0], sub: d[1], kind: d[2],
    row: 'display: grid; grid-template-columns: 36px minmax(0, 1fr) 56px; align-items: center; gap: 12px; height: 44px; padding: 0 16px; ' + (d[4] ? 'background: rgba(255,255,255,0.05)' : ''),
    art: 'width: 28px; height: 28px; display: block; background: ' + d[3] + '; ' + (d[2] === 'artist' ? 'border-radius: 14px' : 'border-radius: 2px'),
  }));
  return {
    accent, pins, history, suggest,
    premium: 'font-size: 12px; color: ' + accent,
    toastAction: 'color: ' + accent,
  };
}
}
</script>
</body>
</html>
