<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune concert: compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" crumb="browse › live events › the midnight · live" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="browse" sub="details,lineup,related concerts" on="details" title="the midnight · live" actions="interested" collapsed="false" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  <div style="position: relative; flex-grow: 1; min-height: 0; overflow: hidden">
    <div style="position: absolute; left: 10px; top: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; color: #ffffff; opacity: 0.92">the midnight · live</div>
    <div style="position: absolute; left: 16px; right: 16px; top: 80px; bottom: 0; display: flex; flex-direction: column">
      <span style="{{saleInk}}">concert · on sale</span>
      <div style="display: flex; align-items: flex-end; gap: 16px; margin-top: 6px; flex-shrink: 0">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 64px">14</span>
        <span style="display: flex; flex-direction: column; padding-bottom: 6px"><span style="font-size: 15px; line-height: 20px">november</span><span style="font-size: 13px; line-height: 18px; color: #a8a8a8">saturday · 2026</span></span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font-size: 15px; line-height: 22px; flex-shrink: 0">
        <span>20:00 · <span style="color: #a8a8a8">doors open 19:00</span></span>
        <span>Paradiso · <span style="color: #a8a8a8">Amsterdam</span></span>
        <span style="color: #a8a8a8; font-size: 13px">ages 18+</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; height: 40px; margin-top: 16px; flex-shrink: 0">
        <button aria-label="interested" style="{{ring}}">♡</button>
        <button aria-label="share" style="{{ring}}">↗</button>
        <button style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: #ffffff; font: inherit; font-size: 14px; padding: 0"><span style="{{ringSpan}}">▶</span>play the lineup</button>
      </div>
      <div style="display: flex; flex-direction: column; background: #1b1b1b; margin: 20px -16px 0 -16px; padding: 14px 16px 16px 16px; flex-shrink: 0">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px; margin-bottom: 4px">tickets</span>
        <sc-for list="{{offers}}" as="o" hint-placeholder-count="3"><a href="#" style="display: flex; justify-content: space-between; align-items: center; height: 48px; font-size: 15px; color: #ffffff; border-top: 1px solid rgba(255,255,255,0.08)"><span>{{o.name}}</span><span style="color: #a8a8a8; font-size: 13px">{{o.price}}</span></a></sc-for>
        <button style="{{buyBtn}}">buy tickets →</button>
        <span style="font-size: 12px; line-height: 16px; color: #7a7a7a; margin-top: 8px">on sale from 1 october · prices from the providers, not wavee</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 14px; margin-top: 20px; flex-shrink: 0"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">lineup</span><span style="font-size: 13px; color: #7a7a7a">2 artists</span></div>
      <sc-for list="{{lineup}}" as="l" hint-placeholder-count="2"><a href="#" style="display: grid; grid-template-columns: 60px minmax(0, 1fr) 40px; align-items: center; height: 64px; color: #ffffff"><span style="{{l.art}}"></span><span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; line-height: 20px">{{l.name}}</span><span style="font-size: 13px; line-height: 18px; color: #9c9c9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.role}}</span></span><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #7a7a7a">›</span></a></sc-for>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Sunset" artist="The Midnight · Endless Summer" art="#6b4a2f" progress="72" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const offers = [['Ticketmaster', 'from €45'], ['Eventim', 'from €48'], ['Paradiso box office', '€45 · at the door']].map((d) => ({ name: d[0], price: d[1] }));
  const lineup = [['The Midnight', 'headliner · 2.1m monthly listeners', '#6b4a2f'], ['FM-84', 'support', '#2f4a6b']].map((d) => ({ name: d[0], role: d[1], art: 'width: 48px; height: 48px; border-radius: 24px; background: ' + d[2] + '; display: block' }));
  const ringBase = 'width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 2px solid #ffffff; background: transparent; color: #ffffff; font-size: 14px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0';
  return {
    accent, offers, lineup,
    saleInk: 'font-size: 13px; line-height: 18px; color: ' + accent,
    ring: ringBase,
    ringSpan: ringBase,
    buyBtn: 'height: 48px; margin-top: 10px; border: 0; background: ' + accent + '; color: #000000; font: inherit; font-size: 15px; font-weight: 600; padding: 0; width: 100%',
  };
}
}
</script>
</body>
</html>
