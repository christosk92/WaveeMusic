<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune frame: compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="home" sub="all,music,podcasts,audiobooks" on="all" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 22px; padding: 8px 16px 0 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">pins</span><a href="#" style="font-size: 13px">edit</a></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{pins}}" as="t" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: #ffffff"><span style="{{t.art}}"></span><span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span></a></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">history</span><a href="#" style="font-size: 13px">see all</a></div>
      <sc-for list="{{history}}" as="h" hint-placeholder-count="3"><a href="#" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; color: #ffffff"><span style="{{h.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="{{h.nameStyle}}">{{h.name}}</span><span style="{{h.subStyle}}">{{h.sub}}</span></span><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #a8a8a8; font-size: 16px">⋯</span></a></sc-for>
    </div>
    <div style="height: 112px; flex-shrink: 0; display: flex; background: #1b1b1b; overflow: hidden; margin: 0 -16px">
      <div style="width: 112px; flex-shrink: 0; background: linear-gradient(135deg, #4a2f5b, #7a3b6b 60%, #1b1b1b)"></div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; gap: 4px">
        <span style="font-size: 12px; color: #a8a8a8">your daylist · afternoon</span>
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">sad girl synth-pop tuesday afternoon</span>
      </div>
      <button aria-label="play your daylist" style="{{playRing}}">▶</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">made for you</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">see all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{mixes}}" as="t" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{t.art}}"></span><span style="font-size: 13px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="font-size: 12px; color: #a8a8a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></a></sc-for>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Nightcall" artist="Kavinsky · OutRun" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const sq = (c) => 'width: 100%; aspect-ratio: 1 / 1; border-radius: 2px; background: ' + c + '; display: block';
  const pins = [['late night drive', '#3b4a6b'], ['Liked Songs', '#5b2f6b'], ['OutRun', '#6b2f4a'], ['Odyssey', '#2f5b6b']].map((d) => ({ name: d[0], art: sq(d[1]) }));
  const history = [['OutRun', 'playing · Kavinsky', '#6b2f4a', true], ['Endless Summer', 'album · The Midnight', '#6b4a2f', false], ['Trilogy', 'album · Carpenter Brut', '#6b2f2f', false]].map((d) => ({
    name: d[0], sub: d[1], art: 'width: 44px; height: 44px; border-radius: 2px; background: ' + d[2] + '; display: block',
    nameStyle: 'font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[3] ? accent : '#ffffff'),
    subStyle: 'font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[3] ? accent : '#9c9c9c'),
  }));
  const mixes = [['Daily Mix 1', 'The Midnight, FM-84, Timecop1983', '#4a3b6b'], ['Daily Mix 2', 'aespa, NewJeans, ILLIT', '#6b3b5b'], ['Discover Weekly', 'your weekly mixtape', '#2f5b4a'], ['Release Radar', 'new from artists you follow', '#5b4a2f']].map((d) => ({ name: d[0], sub: d[1], art: sq(d[2]) }));
  return {
    accent, pins, history, mixes,
    playRing: 'width: 40px; height: 40px; border-radius: 20px; border: 0; background: ' + accent + '; color: #000; font-size: 13px; padding: 0; align-self: center; margin-right: 16px; flex-shrink: 0',
  };
}
}
</script>
</body>
</html>
