<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune theme options · small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="small" crumb="settings › appearance › zune" accent="{{accent}}" hint-size="800px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="small" section="none" sub="" collapsed="true" accent="{{accent}}" hint-size="800px,52px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; position: relative; overflow: hidden">
    <div style="position: absolute; left: 18px; top: -6px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; color: #ffffff; opacity: 0.92">settings</div>
    <div style="position: absolute; left: 24px; top: 70px; right: 24px; bottom: 0; display: flex; gap: 28px">
      <nav aria-label="settings sections" style="width: 150px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden">
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="12"><a href="#" style="{{s.style}}">{{s.n}}</a></sc-for>
      </nav>
      <div style="width: 380px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden">
        <div style="display: flex; align-items: baseline; gap: 14px; flex-shrink: 0"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; font-weight: 300; line-height: 48px; letter-spacing: -0.5px; white-space: nowrap">zune options</span><a href="#" style="font-size: 13px">reset</a></div>
        <div style="display: grid; grid-template-columns: 110px minmax(0, 1fr); column-gap: 14px; row-gap: 12px; align-items: center; margin-top: 10px; flex-shrink: 0">
          <span style="font-size: 14px">accent</span>
          <span style="display: flex; align-items: center; gap: 8px"><sc-for list="{{accents}}" as="a" hint-placeholder-count="5"><button aria-label="{{a.name}}" style="{{a.style}}"></button></sc-for></span>
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
            <span style="font-size: 14px">{{g.label}}</span>
            <span style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{g.chips}}" as="c" hint-placeholder-count="3"><button style="{{c.style}}">{{c.label}}</button></sc-for></span>
          </sc-for>
          <span style="font-size: 14px">track numbers</span>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span style="{{switchOn}}"><span style="position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; background: #000000; display: block"></span></span>big light numbers</label>
        </div>
      </div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 14px">
        <span style="font-size: 12px; color: #7a7a7a">preview</span>
        <div style="width: 100%; height: 236px; background: #161616; box-shadow: 0 0 0 1px rgba(255,255,255,0.08); position: relative; overflow: hidden">
          <div style="position: absolute; left: 0; top: 0; right: 0; height: 130px; background: linear-gradient(180deg, #3a2f22 0%, #161616 100%)"></div>
          <div style="position: absolute; left: 10px; top: 8px; display: flex; gap: 6px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 10px"><span style="color: #ffffff; font-weight: 600">library</span><span style="color: #7a7a7a">recents</span></div>
          <div style="position: absolute; left: 6px; top: 20px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 30px; font-weight: 200; line-height: 34px; white-space: nowrap; letter-spacing: -0.5px">random access<br>memories</div>
          <span style="position: absolute; left: 10px; top: 96px; width: 44px; height: 44px; border-radius: 2px; background: #3a2f22; box-shadow: 0 0 0 1px rgba(255,255,255,0.08)"></span>
          <div style="position: absolute; left: 10px; top: 150px; right: 8px; display: flex; flex-direction: column">
            <sc-for list="{{previewRows}}" as="r" hint-placeholder-count="3"><span style="{{r.row}}"><span style="{{r.num}}">{{r.n}}</span><span style="{{r.title}}">{{r.t}}</span></span></sc-for>
          </div>
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #111111"><span style="{{previewProgress}}"></span><span style="{{previewDisc}}"></span></div>
        </div>
        <span style="font-size: 11px; color: #7a7a7a">changes apply at once</span>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="medium" title="Get Lucky" artist="Daft Punk" art="#3a2f22" progress="41" accent="{{accent}}" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const D = '\'Segoe UI Variable Display\', \'Segoe UI\', sans-serif';
  const sections = ['account', 'appearance', 'playback', 'audio', 'lyrics', 'devices & connect', 'storage', 'notifications', 'keyboard', 'privacy', 'feedback & help', 'about'].map((n) => ({ n, style: 'height: 30px; flex-shrink: 0; display: flex; align-items: center; white-space: nowrap; font-family: ' + D + '; font-size: 18px; line-height: 24px; ' + (n === 'appearance' ? 'color: #ffffff; font-weight: 400' : 'color: #7a7a7a; font-weight: 300') }));
  const accents = [['pink', '#ff3ca6'], ['orange', '#ff7a1a'], ['blue', '#60cdff'], ['green', '#8fd14f'], ['purple', '#b983ff']].map((d) => ({ name: d[0], style: 'width: 28px; height: 28px; border: 0; padding: 0; flex-shrink: 0; background: ' + d[1] + (d[1] === accent ? '; outline: 2px solid #ffffff; outline-offset: 2px' : '') }));
  const chips = (labels, on) => labels.map((l, i) => ({ label: l, style: 'height: 28px; padding: 0 9px; border: 0; font: inherit; font-size: 13px; white-space: nowrap; ' + (i === on ? 'background: ' + accent + '; color: #000000' : 'background: rgba(255,255,255,0.06); color: #ffffff') }));
  const groups = [
    ['ground', ['dark', 'light', 'follow windows'], 0],
    ['background', ['artwork wash', 'mix', 'none'], 0],
    ['panorama titles', ['bleed off the edge', 'fit'], 0],
    ['row size', ['44', '52', '60'], 1],
    ['now playing', ['bloom', 'mosaic', 'type', 'spotlight'], 0],
  ].map((d) => ({ label: d[0], chips: chips(d[1], d[2]) }));
  const previewRows = [['3', 'Giorgio by Moroder'], ['▮▮▮', 'Get Lucky'], ['9', 'Beyond']].map((d) => { const play = d[0] === '▮▮▮'; return {
    n: d[0], t: d[1], row: 'display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; height: 18px',
    num: 'font-family: ' + D + '; font-weight: 300; font-size: ' + (play ? 7 : 12) + 'px; color: ' + (play ? accent : '#7a7a7a'),
    title: 'font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (play ? accent : '#ffffff'),
  }; });
  return {
    accent, sections, accents, groups, previewRows,
    switchOn: 'width: 40px; height: 20px; background: ' + accent + '; position: relative; display: block; flex-shrink: 0',
    previewProgress: 'position: absolute; left: 0; top: 0; width: 41%; height: 1px; background: ' + accent,
    previewDisc: 'position: absolute; left: 50%; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px; background: ' + accent,
  };
}
}
</script>
</body>
</html>
