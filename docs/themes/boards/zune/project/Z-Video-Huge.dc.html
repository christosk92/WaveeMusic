<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune video, full screen: huge window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 2560px; height: 1440px; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; padding: 0 24px 0 64px; gap: 28px; font-size: 14px; color: #a8a8a8">
    <span>video · full screen</span>
    <span style="font-size: 15px; color: #ffffff">Nightcall <span style="color: #a8a8a8">· official video · Kavinsky</span></span>
    <span style="flex-grow: 1"></span>
    <a href="#">switch to audio</a><a href="#" style="color: #ffffff">exit full screen</a>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex; gap: 40px; padding: 8px 40px 0 64px">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
      <div role="img" aria-label="Nightcall official video" style="width: 1984px; height: 1116px; flex-shrink: 0; position: relative; overflow: hidden; background: linear-gradient(160deg, #1a1020 0%, #3a1a3a 40%, #6b2f4a 70%, #1a0a14 100%)">
        <span style="position: absolute; left: 0; right: 0; bottom: 0; height: 360px; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.6))"></span>
        <span style="position: absolute; left: 1100px; top: 300px; width: 520px; height: 520px; border-radius: 260px; background: #ff7a5a; opacity: 0.35; filter: blur(60px)"></span>
      </div>
      <div style="display: flex; flex-direction: column; padding: 4px 0 0 0">
        <div style="display: flex; align-items: center; gap: 16px; height: 40px; font-size: 13px; color: #a8a8a8; font-variant-numeric: tabular-nums"><span>1:14</span><span style="flex-grow: 1; height: 2px; background: rgba(255,255,255,0.14); display: block"><span style="{{progress}}"></span></span><span>-3:04</span></div>
        <div style="display: flex; align-items: center; gap: 24px; height: 72px">
          <button aria-label="previous" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3 6 8l7 5z"/></svg></button>
          <button aria-label="pause" style="{{playDisc}}"><svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
          <button aria-label="next" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button>
          <span style="display: flex; flex-direction: column; margin-left: 12px"><span style="font-size: 17px">Nightcall</span><span style="font-size: 14px; color: {{accent}}">Kavinsky · OutRun</span></span>
          <span style="flex-grow: 1"></span>
          <button aria-label="mute" style="width: 44px; height: 44px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg></button>
          <span style="width: 160px; height: 2px; background: rgba(255,255,255,0.18); display: block"><span style="display: block; width: 70%; height: 2px; background: #ffffff"></span></span>
          <button style="height: 44px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 14px; padding: 0 10px">1080p · fit</button>
          <button style="height: 44px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 14px; padding: 0 10px">mini player</button>
          <button aria-label="more video options" style="width: 44px; height: 44px; border: 0; background: transparent; color: #a8a8a8; font-size: 20px; padding: 0">⋯</button>
        </div>
      </div>
    </div>
    <div style="width: 432px; flex-shrink: 0; display: flex; flex-direction: column">
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px; height: 48px">up next</span>
      <sc-for list="{{next}}" as="v" hint-placeholder-count="7">
        <a href="#" style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; color: #ffffff"><span style="{{v.thumb}}"><span style="{{v.badge}}">{{v.kind}}</span></span><span style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.title}}</span><span style="font-size: 13px; color: #9c9c9c">{{v.artist}}</span></a>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const next = [['Get Lucky', 'Daft Punk', 'video', '#3a2f22'], ['Instant Crush', 'Daft Punk, Julian Casablancas', 'video', '#3a2f22'], ['Resonance', 'HOME', 'audio', '#2f5b6b'], ['Tech Noir', 'Gunship', 'video', '#5b3b6b'], ['Sunset', 'The Midnight', 'audio', '#6b4a2f']].map((d) => ({
    title: d[0], artist: d[1], kind: d[2],
    thumb: 'width: 432px; height: 162px; display: block; position: relative; background: ' + d[3],
    badge: 'position: absolute; left: 8px; bottom: 8px; height: 20px; padding: 0 6px; display: flex; align-items: center; font-size: 11px; background: rgba(0,0,0,0.6); color: #ffffff',
  }));
  return {
    accent, next,
    progress: 'display: block; width: 29%; height: 2px; background: ' + accent,
    playDisc: 'width: 64px; height: 64px; border-radius: 32px; border: 0; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; padding: 0',
  };
}
}
</script>
</body>
</html>
