<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune loading: compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" crumb="search › the weeknd" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="browse" sub="popular,albums,singles &amp; eps,details" on="popular" title="the weeknd" collapsed="false" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 220px; flex-shrink: 0; position: relative; overflow: hidden; background: #1b1b1b">
      <span style="{{sweep}}"></span>
      <div style="position: absolute; left: 10px; bottom: 34px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; color: #ffffff">the weeknd</div>
      <span style="position: absolute; left: 16px; bottom: 14px; width: 200px; height: 10px; background: rgba(255,255,255,0.08); display: block"></span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; height: 40px; padding: 8px 16px 0 16px; flex-shrink: 0">
      <span style="{{discDim}}">▶</span>
      <span style="{{ringDim}}">⇄</span>
      <span style="width: 104px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 2px solid rgba(255,255,255,0.14); display: block"></span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 14px; height: 40px; padding: 14px 16px 0 16px; flex-shrink: 0"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px; color: #7a7a7a">popular</span></div>
    <div style="display: flex; flex-direction: column; padding: 0 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: 40px 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; padding-left: 8px">
          <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; font-weight: 300; line-height: 32px; color: #3a3a3a">{{r.n}}</span>
          <span style="{{r.art}}"></span>
          <span style="display: flex; flex-direction: column; gap: 8px; min-width: 0"><span style="{{r.l1}}"></span><span style="{{r.l2}}"></span></span>
          <span></span>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Nightcall" artist="Kavinsky · OutRun" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const widths = [[62, 34], [48, 28], [70, 30], [54, 36], [44, 26], [66, 32], [50, 30]];
  const rows = widths.map((w, i) => ({
    n: String(i + 1),
    art: 'width: 44px; height: 44px; border-radius: 2px; background: rgba(255,255,255,' + (i < 3 ? 0.08 : 0.05) + '); display: block',
    l1: 'width: ' + w[0] + '%; height: 10px; background: rgba(255,255,255,' + (i < 3 ? 0.1 : 0.06) + '); display: block',
    l2: 'width: ' + w[1] + '%; height: 8px; background: rgba(255,255,255,' + (i < 3 ? 0.06 : 0.04) + '); display: block',
  }));
  return {
    accent, rows,
    sweep: 'position: absolute; left: 0; top: 0; width: 160px; height: 220px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.05), rgba(255,255,255,0)); display: block; transform: translateX(120px)',
    discDim: 'width: 40px; height: 40px; border-radius: 20px; background: ' + accent + '; opacity: 0.35; color: #000; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0',
    ringDim: 'width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0',
  };
}
}
</script>
</body>
</html>
