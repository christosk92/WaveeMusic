<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune collection: podcasts · compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="library" sub="liked,playlists,albums,artists,podcasts,audiobooks" on="podcasts" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 0 0 16px; overflow: hidden">
    <div style="height: 40px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 12px; padding-right: 16px">
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px">followed shows</span>
      <span style="font-size: 13px; color: #7a7a7a; line-height: 24px">14</span>
      <span style="flex-grow: 1"></span>
      <a href="#" style="font-size: 13px; line-height: 24px">all shows</a>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 10px; flex-shrink: 0; overflow: hidden">
      <sc-for list="{{shows}}" as="s" hint-placeholder-count="5"><a href="#" style="display: flex; flex-direction: column; gap: 6px; width: 84px; flex-shrink: 0"><span style="{{s.art}}"><span style="{{s.dot}}"></span></span><span style="font-size: 12px; line-height: 16px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span></a></sc-for>
    </div>
    <div style="display: flex; flex-direction: column; padding-right: 16px; margin-top: 18px; min-height: 0">
      <div style="height: 40px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 12px">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">your episodes</span>
        <span style="font-size: 13px; color: #7a7a7a; line-height: 26px">24 · 6 hr 12 min</span>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 10px; flex-shrink: 0; overflow: hidden"><sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button style="{{c.style}}">{{c.label}}</button></sc-for></div>
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; flex-shrink: 0">
          <div style="height: 40px; display: flex; align-items: flex-end; gap: 10px; padding-bottom: 2px; box-sizing: border-box"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px">{{g.title}}</span><span style="font-size: 13px; color: #7a7a7a; line-height: 24px">{{g.count}}</span></div>
          <sc-for list="{{g.rows}}" as="e" hint-placeholder-count="3">
            <a href="#" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; align-items: center; height: 72px; color: #ffffff">
              <span style="{{e.art}}"></span>
              <span style="display: flex; flex-direction: column; min-width: 0; gap: 2px"><span style="{{e.title}}">{{e.name}}</span><span style="font-size: 13px; line-height: 18px; color: #9c9c9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.meta}}</span><span style="{{e.state}}"><span style="{{e.bar}}"><span style="{{e.fill}}"></span></span>{{e.stateText}}</span></span>
              <span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #a8a8a8; font-size: 16px">⋯</span>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" kind="podcast" title="The hidden history of the synthesizer" artist="Twenty Thousand Hertz" art="#4a2f3b" progress="62" saved="true" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const shows = [['The Rest Is Football', '#2f4a3b', true], ['Twenty Thousand Hertz', '#4a2f3b', true], ['Hurry Slowly', '#3b3b2f', false], ['Planet Money', '#2f3b4a', true], ['Song Exploder', '#4a3b2f', false]].map((d) => ({
    name: d[0],
    art: 'width: 84px; height: 84px; border-radius: 2px; background: ' + d[1] + '; display: block; position: relative',
    dot: 'position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 4px; display: block; background: ' + (d[2] ? accent : 'transparent'),
  }));
  const chips = [['all', true], ['unplayed', false], ['in progress', false], ['played', false]].map((d) => ({ label: d[0], style: 'height: 40px; padding: 0 14px; border: 0; font: inherit; font-size: 14px; white-space: nowrap; flex-shrink: 0; ' + (d[1] ? 'background: ' + accent + '; color: #000000' : 'background: rgba(255,255,255,0.06); color: #ffffff') }));
  const mk = (list) => list.map((d) => ({
    name: d[0], meta: d[1], stateText: d[3],
    art: 'width: 44px; height: 44px; border-radius: 2px; background: ' + d[2] + '; display: block',
    title: 'font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[4] ? accent : '#ffffff'),
    state: 'display: flex; align-items: center; gap: 8px; font-size: 11px; line-height: 14px; color: ' + (d[4] ? accent : '#7a7a7a'),
    bar: d[5] ? 'width: 48px; height: 2px; background: rgba(255,255,255,0.14); display: block' : 'display: none',
    fill: 'width: ' + (d[5] || 0) + '%; height: 2px; display: block; background: ' + (d[4] ? accent : '#a8a8a8'),
  }));
  const groups = [
    { title: 'today', count: '3', rows: mk([['The hidden history of the synthesizer', 'Twenty Thousand Hertz · 32 min', '#4a2f3b', '12 min left', true, 62], ['Why the Premier League keeps changing', 'The Rest Is Football · 48 min', '#2f4a3b', 'unplayed', false, 0], ['What the Fed did next', 'Planet Money · 24 min', '#2f3b4a', 'unplayed', false, 0]]) },
    { title: 'this week', count: '9', rows: mk([['Episode 312: slow mornings', 'Hurry Slowly · 54 min', '#3b3b2f', 'unplayed', false, 0], ['Deep dive: the 1993 title race', 'The Rest Is Football · 47 min', '#2f4a3b', '6 min left', false, 88]]) },
  ];
  return { accent, shows, chips, groups };
}
}
</script>
</body>
</html>
