<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune collection: playlists · compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="library" sub="liked,playlists,albums,artists,podcasts,audiobooks" on="playlists" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden">
    <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px">
      <button style="height: 40px; border: 0; background: transparent; color: #ffffff; font: inherit; font-size: 15px; padding: 0; display: flex; align-items: center; gap: 6px">recently played <span style="font-size: 11px; color: #a8a8a8">▾</span></button>
      <span style="flex-grow: 1"></span>
      <span style="font-size: 13px; color: #7a7a7a; margin-right: 4px">27</span>
      <button aria-label="new playlist or folder" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
      <button aria-label="find in playlists" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; display: flex; align-items: center; justify-content: center; padding: 0; margin-right: -12px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
    </div>
    <sc-for list="{{lists}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; flex-shrink: 0">
        <span style="{{g.headStyle}}">{{g.label}}</span>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="4">
          <a href="#" style="{{r.row}}"><span style="{{r.indent}}"></span><span style="{{r.art}}">{{r.glyph}}</span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="{{r.name}}">{{r.n}}</span><span style="{{r.subStyle}}">{{r.sub}}</span></span><span style="{{r.trail}}">{{r.t}}</span></a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Nightcall" artist="Kavinsky · OutRun" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const D = '\'Segoe UI Variable Display\', \'Segoe UI\', sans-serif';
  const row = (d) => {
    const playing = d[3] === 'open', folder = d[3] === 'folder', child = d[3] === 'child';
    return {
      n: d[0], sub: d[1], glyph: folder ? '▤' : '', t: folder ? '▾' : (playing ? '▮▮▮' : '⋯'),
      row: 'display: grid; grid-template-columns: ' + (child ? '16px' : '0px') + ' 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; flex-shrink: 0; color: #ffffff',
      indent: child ? 'width: 2px; height: 40px; background: rgba(255,255,255,0.08); display: block' : 'display: block',
      art: 'width: 44px; height: 44px; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #a8a8a8; font-size: 16px; box-sizing: border-box; ' + (folder ? 'border: 1px solid rgba(255,255,255,0.18)' : 'background: ' + d[2]),
      name: 'font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (playing ? accent : '#ffffff'),
      subStyle: 'font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (playing ? accent : '#9c9c9c'),
      trail: 'width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: ' + (playing ? '10px; letter-spacing: 1px' : '16px') + '; color: ' + (playing ? accent : '#a8a8a8'),
    };
  };
  const head = 'height: 40px; display: flex; align-items: flex-end; padding-bottom: 4px; box-sizing: border-box; font-family: ' + D + '; font-size: 22px; font-weight: 300; line-height: 28px; color: #ffffff';
  const lists = [
    { label: 'made by you', rows: [['late night drive', 'christos and 2 others · 42 songs', '#3b4a6b', 'open'], ['k-pop gym', 'christos · 64 songs', '#5b2f6b', ''], ['moods', 'folder · 3 playlists', '', 'folder'], ['focus flow', '88 songs', '#2f5b4a', 'child'], ['rainy sunday', '31 songs', '#3b4a5b', 'child']].map(row) },
    { label: 'made for you', rows: [['Daily Mix 1', 'Spotify · The Midnight, FM-84', '#4a3b6b', ''], ['Discover Weekly', 'Spotify · updated monday', '#2f5b4a', ''], ['Release Radar', 'Spotify · updated friday', '#5b4a2f', '']].map(row) },
    { label: 'followed', rows: [['synthwave essentials', 'Spotify · 120 songs', '#2f3b6b', '']].map(row) },
  ].map((g) => ({ label: g.label, rows: g.rows, headStyle: head }));
  return { accent, lists };
}
}
</script>
</body>
</html>
