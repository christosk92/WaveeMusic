<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune settings: appearance, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="small" crumb="settings › appearance" accent="{{accent}}" hint-size="800px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="small" section="none" sub="" collapsed="true" accent="{{accent}}" hint-size="800px,52px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; position: relative; overflow: hidden">
    <div style="position: absolute; left: 18px; top: -6px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; color: #ffffff; opacity: 0.92">settings</div>
    <div style="position: absolute; left: 24px; top: 70px; right: 24px; bottom: 0; display: flex; gap: 32px">
      <nav aria-label="settings sections" style="width: 180px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden">
        <sc-for list="{{sections}}" as="s" hint-placeholder-count="12"><a href="#" style="{{s.style}}">{{s.n}}</a></sc-for>
      </nav>
      <div style="width: 520px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden">
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; font-weight: 300; line-height: 48px; letter-spacing: -0.5px; flex-shrink: 0">appearance</span>
        <span style="display: flex; align-items: baseline; gap: 12px; margin-top: 8px; flex-shrink: 0; white-space: nowrap; overflow: hidden"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px">theme</span><span style="font-size: 13px; color: #7a7a7a">changes every page, the player and how you move around</span></span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 8px; flex-shrink: 0">
          <button style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
            <span style="width: 100%; height: 68px; background: #1c1c1c; position: relative; display: block; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 26px; background: #242424"></span><span style="position: absolute; left: 5px; top: 8px; width: 16px; height: 4px; border-radius: 2px; background: #5a5a5a"></span><span style="position: absolute; left: 5px; top: 16px; width: 13px; height: 4px; border-radius: 2px; background: #5a5a5a"></span><span style="position: absolute; left: 34px; top: 9px; width: 36px; height: 36px; border-radius: 6px; background: #3b4a6b"></span><span style="position: absolute; left: 76px; top: 9px; width: 36px; height: 36px; border-radius: 6px; background: #6b2f4a"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #121212"></span></span>
            <span style="font-size: 14px; line-height: 20px">wavee</span>
          </button>
          <button style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
            <span style="width: 100%; height: 68px; background: #202020; position: relative; display: block; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 30px; background: #1c1c1c"></span><span style="position: absolute; left: 5px; top: 9px; width: 20px; height: 7px; border-radius: 4px; background: #2d2d2d"></span><span style="position: absolute; left: 5px; top: 9px; width: 2px; height: 7px; background: #60cdff"></span><span style="position: absolute; left: 38px; top: 9px; right: 8px; height: 30px; border-radius: 4px; background: #2b2b2b; box-shadow: 0 0 0 1px rgba(255,255,255,0.06)"></span><span style="position: absolute; left: 38px; top: 45px; width: 24px; height: 8px; border-radius: 4px; background: #60cdff"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #1a1a1a"></span></span>
            <span style="font-size: 14px; line-height: 20px">winui</span>
          </button>
          <button aria-pressed="true" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
            <span style="{{zuneTile}}"><span style="position: absolute; left: 7px; top: 5px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 8px; color: #7a7a7a; white-space: nowrap"><span style="color: #ffffff; font-weight: 600">home</span>  browse  library</span><span style="position: absolute; left: 5px; top: 13px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 30px; font-weight: 200; line-height: 34px; white-space: nowrap; color: #ffffff">quickplay</span><span style="position: absolute; left: 7px; top: 47px; width: 13px; height: 13px; border-radius: 1px; background: #6b2f4a"></span><span style="position: absolute; left: 24px; top: 47px; width: 13px; height: 13px; border-radius: 1px; background: #3b4a6b"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #111111"></span></span>
            <span style="{{zuneName}}">zune</span>
          </button>
          <button style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
            <span style="width: 100%; height: 68px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 32px; font-weight: 200; color: #a8a8a8">+</span>
            <span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">add from a folder</span>
          </button>
        </div>
        <span style="display: flex; align-items: baseline; gap: 12px; margin-top: 16px; flex-shrink: 0"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px">zune options</span><a href="#" style="font-size: 13px">all options ›</a></span>
        <div style="display: grid; grid-template-columns: 140px minmax(0, 1fr); column-gap: 16px; row-gap: 12px; align-items: center; margin-top: 8px; flex-shrink: 0">
          <span style="font-size: 15px">accent</span>
          <span style="display: flex; align-items: center; gap: 10px; white-space: nowrap"><sc-for list="{{accents}}" as="a" hint-placeholder-count="5"><button aria-label="{{a.name}}" style="{{a.style}}"></button></sc-for><span style="font-size: 13px; color: #a8a8a8; margin-left: 4px">pink</span></span>
          <span style="font-size: 15px">ground</span>
          <span style="display: flex; gap: 8px; white-space: nowrap"><sc-for list="{{ground}}" as="c" hint-placeholder-count="3"><button style="{{c.style}}">{{c.label}}</button></sc-for></span>
          <span style="font-size: 15px">background</span>
          <span style="display: flex; gap: 8px; white-space: nowrap"><sc-for list="{{background}}" as="c" hint-placeholder-count="3"><button style="{{c.style}}">{{c.label}}</button></sc-for></span>        </div>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="medium" title="Get Lucky" artist="Daft Punk" art="#3a2f22" progress="41" accent="{{accent}}" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const D = '\'Segoe UI Variable Display\', \'Segoe UI\', sans-serif';
  const sections = ['account', 'appearance', 'playback', 'audio', 'lyrics', 'devices & connect', 'storage', 'notifications', 'keyboard', 'privacy', 'feedback & help', 'about'].map((n) => ({ n, style: 'height: 30px; flex-shrink: 0; display: flex; align-items: center; white-space: nowrap; font-family: ' + D + '; font-size: 18px; line-height: 24px; ' + (n === 'appearance' ? 'color: #ffffff; font-weight: 400' : 'color: #7a7a7a; font-weight: 300') }));
  const accents = [['pink', '#ff3ca6'], ['orange', '#ff7a1a'], ['blue', '#60cdff'], ['green', '#8fd14f'], ['purple', '#b983ff']].map((d) => ({ name: d[0], style: 'width: 28px; height: 28px; border: 0; padding: 0; flex-shrink: 0; background: ' + d[1] + (d[1] === accent ? '; outline: 2px solid #ffffff; outline-offset: 2px' : '') }));
  const chips = (labels, on) => labels.map((l, i) => ({ label: l, style: 'height: 32px; padding: 0 12px; border: 0; font: inherit; font-size: 14px; white-space: nowrap; flex-shrink: 0; ' + (i === on ? 'background: ' + accent + '; color: #000000' : 'background: rgba(255,255,255,0.06); color: #ffffff') }));
  return {
    accent, sections, accents,
    ground: chips(['dark', 'light', 'follow windows'], 0),
    background: chips(['artwork wash', 'mix', 'none'], 0),
    zuneTile: 'width: 100%; height: 68px; background: #161616; position: relative; display: block; overflow: hidden; outline: 2px solid ' + accent + '; outline-offset: 2px',
    zuneName: 'font-size: 14px; line-height: 20px; color: ' + accent,
  };
}
}
</script>
</body>
</html>
