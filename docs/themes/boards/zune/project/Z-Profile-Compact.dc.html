<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune profile: compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 420px; background: linear-gradient(180deg, #252b1d 0%, #1d211a 50%, #161616 100%)"></div>
  <div style="position: relative; flex-shrink: 0; display: flex; flex-direction: column">
    <dc-import name="Z-Part-TitleBar" tier="compact" crumb="christos" accent="{{accent}}" hint-size="400px,48px"></dc-import>
    <dc-import name="Z-Part-Band" tier="compact" section="none" sub="top artists,playlists,artists,following,followers" on="top artists" title="christos" actions="open account" collapsed="false" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  </div>
  <div style="position: relative; flex-grow: 1; min-height: 0; overflow: hidden">
    <div style="position: absolute; left: 10px; top: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; color: #ffffff; opacity: 0.92">christos · profile</div>
    <div style="position: absolute; left: 16px; right: 16px; top: 80px; bottom: 0; display: flex; flex-direction: column">
      <div style="display: flex; gap: 16px; align-items: center; flex-shrink: 0">
        <span style="width: 96px; height: 96px; border-radius: 48px; background: #5b6b3b; display: block; flex-shrink: 0"></span>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 12px; line-height: 16px; color: #a8a8a8">profile · spotify premium</span>
          <span style="font-size: 15px; line-height: 20px"><a href="#" style="color: #ffffff">12 followers</a> · <a href="#" style="color: #ffffff">48 following</a></span>
          <span style="font-size: 13px; line-height: 18px; color: #a8a8a8">6 public playlists</span>
        </div>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; height: 40px; margin-top: 16px; flex-shrink: 0">
        <a href="#" style="{{acctPill}}">open account</a>
        <span style="flex-grow: 1"></span>
        <button aria-label="share" style="{{ring}}">↗</button>
        <button aria-label="more" style="{{ring}}">⋯</button>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px; margin-top: 20px; height: 36px; flex-shrink: 0"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">this month</span><span style="font-size: 12px; color: #7a7a7a">only visible to you</span></div>
      <sc-for list="{{top}}" as="t" hint-placeholder-count="5">
        <a href="#" style="display: grid; grid-template-columns: 40px 56px minmax(0, 1fr) 40px; align-items: center; height: 64px; color: #ffffff">
          <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; font-weight: 200; line-height: 36px; color: #7a7a7a">{{t.n}}</span>
          <span style="{{t.art}}"></span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="font-size: 13px; line-height: 18px; color: #9c9c9c">{{t.plays}}</span></span>
          <span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #7a7a7a; font-size: 15px">›</span>
        </a>
      </sc-for>
      <div style="display: flex; align-items: baseline; gap: 14px; margin-top: 18px; flex-shrink: 0"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">public playlists</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">see all 6</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 10px">
        <sc-for list="{{lists}}" as="l" hint-placeholder-count="2"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{l.art}}"></span><span style="font-size: 13px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.name}}</span><span style="font-size: 12px; color: #a8a8a8">{{l.sub}}</span></a></sc-for>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Nightcall" artist="Kavinsky · OutRun" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const top = [['The Midnight', '212 plays', '#6b4a2f'], ['aespa', '140 plays', '#5b2f6b'], ['Daft Punk', '98 plays', '#3a2f22'], ['Kavinsky', '77 plays', '#6b2f4a'], ['HOME', '61 plays', '#2f5b6b']].map((d, i) => ({ n: String(i + 1), name: d[0], plays: d[1], art: 'width: 48px; height: 48px; border-radius: 24px; background: ' + d[2] + '; display: block' }));
  const lists = [['late night drive', '42 songs', '#3b4a6b'], ['gym · 2026', '88 songs', '#6b2f2f']].map((d) => ({ name: d[0], sub: d[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 2px; background: ' + d[2] + '; display: block' }));
  return {
    accent, top, lists,
    acctPill: 'height: 40px; padding: 0 16px; box-sizing: border-box; border-radius: 20px; border: 2px solid ' + accent + '; color: ' + accent + '; font-size: 14px; display: flex; align-items: center',
    ring: 'width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 2px solid #ffffff; background: transparent; color: #ffffff; font-size: 14px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0',
  };
}
}
</script>
</body>
</html>
