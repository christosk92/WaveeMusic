<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune home, light: compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#5a5a5a;text-decoration:none}a:hover{color:#111111}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #f5f5f5; color: #111111; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 0 0 16px">
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 350; color: #5a5a5a">wavee</span>
    <button aria-label="back" style="width: 40px; height: 40px; border: 0; background: transparent; color: #111111; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
    <span style="flex-grow: 1"></span>
    <button aria-label="search" style="width: 40px; height: 40px; border: 0; background: transparent; color: #5a5a5a; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
    <button aria-label="account" style="width: 40px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0"><span style="width: 24px; height: 24px; border-radius: 12px; background: #5b6b3b; display: block"></span></button>
    <span style="display: flex; color: #5a5a5a; font-size: 12px"><span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center">─</span><span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center">☐</span><span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center">✕</span></span>
  </div>
  <nav aria-label="sections" style="height: 92px; flex-shrink: 0; display: flex; flex-direction: column; padding-left: 16px">
    <div style="height: 44px; display: flex; align-items: center; gap: 24px; overflow: hidden; white-space: nowrap; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; letter-spacing: -0.3px; -webkit-mask-image: linear-gradient(90deg, #000 84%, transparent); mask-image: linear-gradient(90deg, #000 84%, transparent)">
      <a href="#" style="color: #111111; font-weight: 600; flex-shrink: 0">home</a><a href="#" style="color: #8a8a8a; font-weight: 350; flex-shrink: 0">browse</a><a href="#" style="color: #8a8a8a; font-weight: 350; flex-shrink: 0">library</a><a href="#" style="color: #8a8a8a; font-weight: 350; flex-shrink: 0">recents</a>
    </div>
    <div style="height: 40px; display: flex; align-items: center; gap: 22px; font-size: 14px; white-space: nowrap; overflow: hidden">
      <a href="#" style="color: #111111; font-weight: 600">all</a><a href="#">music</a><a href="#">podcasts</a><a href="#">audiobooks</a>
    </div>
  </nav>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 22px; padding: 8px 16px 0 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">pins</span><a href="#" style="font-size: 13px">edit</a></div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{pins}}" as="t" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; color: #111111"><span style="{{t.art}}"></span><span style="font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span></a></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">history</span><a href="#" style="font-size: 13px">see all</a></div>
      <sc-for list="{{history}}" as="h" hint-placeholder-count="3"><a href="#" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; color: #111111"><span style="{{h.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="{{h.nameStyle}}">{{h.name}}</span><span style="{{h.subStyle}}">{{h.sub}}</span></span><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #5a5a5a; font-size: 16px">⋯</span></a></sc-for>
    </div>
    <div style="height: 112px; flex-shrink: 0; display: flex; background: #ffffff; overflow: hidden; margin: 0 -16px">
      <div style="width: 112px; flex-shrink: 0; background: linear-gradient(135deg, #b98fd0, #e08fb8 60%, #ffffff)"></div>
      <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; gap: 4px">
        <span style="font-size: 12px; color: #5a5a5a">your daylist · afternoon</span>
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">sad girl synth-pop tuesday afternoon</span>
      </div>
      <button aria-label="play your daylist" style="{{playRing}}">▶</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">made for you</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">see all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{mixes}}" as="t" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{t.art}}"></span><span style="font-size: 13px; color: #111111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="font-size: 12px; color: #5a5a5a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></a></sc-for>
      </div>
    </div>
  </div>
  <div style="height: 64px; flex-shrink: 0; background: #ebebeb; position: relative; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px">
    <span style="position: absolute; left: 0; top: 0; right: 0; height: 2px; background: rgba(0,0,0,0.12)"><span style="{{progress}}"></span></span>
    <span style="width: 44px; height: 44px; border-radius: 2px; background: #6b2f4a; display: block; flex-shrink: 0"></span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nightcall</span><span style="font-size: 13px; line-height: 18px; color: #5a5a5a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Kavinsky · OutRun</span></span>
    <button aria-label="pause" style="{{disc}}"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
    <button aria-label="next" style="width: 40px; height: 40px; border: 0; background: transparent; color: #111111; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e0197f","options":["#e0197f","#d65a00","#0a7fb5","#4f8f1a","#8a4fd6"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#e0197f';
  const sq = (c) => 'width: 100%; aspect-ratio: 1 / 1; border-radius: 2px; background: ' + c + '; display: block';
  const pins = [['late night drive', '#3b4a6b'], ['Liked Songs', '#5b2f6b'], ['OutRun', '#6b2f4a'], ['Odyssey', '#2f5b6b']].map((d) => ({ name: d[0], art: sq(d[1]) }));
  const history = [['OutRun', 'playing · Kavinsky', '#6b2f4a', true], ['Endless Summer', 'album · The Midnight', '#6b4a2f', false], ['Trilogy', 'album · Carpenter Brut', '#6b2f2f', false]].map((d) => ({
    name: d[0], sub: d[1], art: 'width: 44px; height: 44px; border-radius: 2px; background: ' + d[2] + '; display: block',
    nameStyle: 'font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[3] ? accent : '#111111'),
    subStyle: 'font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[3] ? accent : '#5a5a5a'),
  }));
  const mixes = [['Daily Mix 1', 'The Midnight, FM-84, Timecop1983', '#4a3b6b'], ['Daily Mix 2', 'aespa, NewJeans, ILLIT', '#6b3b5b'], ['Discover Weekly', 'your weekly mixtape', '#2f5b4a'], ['Release Radar', 'new from artists you follow', '#5b4a2f']].map((d) => ({ name: d[0], sub: d[1], art: sq(d[2]) }));
  return {
    accent, pins, history, mixes,
    playRing: 'width: 40px; height: 40px; border-radius: 20px; border: 0; background: ' + accent + '; color: #ffffff; font-size: 13px; padding: 0; align-self: center; margin-right: 16px; flex-shrink: 0',
    progress: 'display: block; width: 29%; height: 2px; background: ' + accent,
    disc: 'width: 40px; height: 40px; border-radius: 20px; border: 0; background: ' + accent + '; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0',
  };
}
}
</script>
</body>
</html>
