<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune profile: small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="small" crumb="christos" accent="{{accent}}" hint-size="800px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="small" section="none" sub="top artists,playlists,artists,following,followers" on="top artists" title="christos" actions="open account" collapsed="true" accent="{{accent}}" hint-size="800px,52px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 20px; padding: 12px 24px 0 24px; overflow: hidden">
    <div style="display: flex; gap: 24px; align-items: center; flex-shrink: 0">
      <span style="width: 112px; height: 112px; border-radius: 56px; background: #5b6b3b; display: block; flex-shrink: 0"></span>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
        <span style="font-size: 13px; line-height: 18px; color: #a8a8a8">profile · spotify premium</span>
        <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; font-weight: 300; line-height: 48px; letter-spacing: -0.5px">christos</span>
        <span style="font-size: 14px; line-height: 20px; color: #a8a8a8"><a href="#" style="color: #ffffff">12 followers</a> · <a href="#" style="color: #ffffff">48 following</a> · 6 public playlists</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; flex-shrink: 0">
        <a href="#" style="{{acctPill}}">open account</a>
        <button aria-label="share" style="{{ring}}">↗</button>
        <button aria-label="more" style="{{ring}}">⋯</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; flex-shrink: 0">
      <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">top artists this month</span><span style="font-size: 13px; color: #7a7a7a">only visible to you</span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px">
        <sc-for list="{{top}}" as="t" hint-placeholder-count="6">
          <a href="#" style="display: grid; grid-template-columns: 40px 60px minmax(0, 1fr); align-items: center; height: 56px; color: #ffffff">
            <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; font-weight: 200; line-height: 36px; color: #7a7a7a">{{t.n}}</span>
            <span style="{{t.art}}"></span>
            <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="font-size: 13px; line-height: 18px; color: #9c9c9c">{{t.plays}}</span></span>
          </a>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">public playlists</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">see all 6</a></div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{lists}}" as="l" hint-placeholder-count="5"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{l.art}}"></span><span style="font-size: 13px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.name}}</span><span style="font-size: 12px; color: #a8a8a8">{{l.sub}}</span></a></sc-for>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="medium" title="Nightcall" artist="Kavinsky" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const top = [['The Midnight', '212 plays', '#6b4a2f'], ['aespa', '140 plays', '#5b2f6b'], ['Daft Punk', '98 plays', '#3a2f22'], ['Kavinsky', '77 plays', '#6b2f4a'], ['HOME', '61 plays', '#2f5b6b'], ['Gunship', '54 plays', '#5b3b6b']].map((d, i) => ({ n: String(i + 1), name: d[0], plays: d[1], art: 'width: 44px; height: 44px; border-radius: 22px; background: ' + d[2] + '; display: block' }));
  const lists = [['late night drive', '42 songs', '#3b4a6b'], ['gym · 2026', '88 songs', '#6b2f2f'], ['sunday slow', '31 songs', '#2f5b4a'], ['k-pop on repeat', '120 songs', '#5b2f6b'], ['road trip', '64 songs', '#5b4a2f']].map((d) => ({ name: d[0], sub: d[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 2px; background: ' + d[2] + '; display: block' }));
  return {
    accent, top, lists,
    acctPill: 'height: 36px; padding: 0 14px; box-sizing: border-box; border-radius: 18px; border: 2px solid ' + accent + '; color: ' + accent + '; font-size: 13px; display: flex; align-items: center; white-space: nowrap',
    ring: 'width: 36px; height: 36px; box-sizing: border-box; border-radius: 18px; border: 2px solid #ffffff; background: transparent; color: #ffffff; font-size: 13px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0',
  };
}
}
</script>
</body>
</html>
