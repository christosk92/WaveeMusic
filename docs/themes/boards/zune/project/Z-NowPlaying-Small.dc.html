<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune now playing: small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #0a0a0a; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; overflow: hidden; position: relative">
  <sc-if value="{{isBloom}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; overflow: hidden">
      <span style="position: absolute; left: -120px; top: 80px; width: 520px; height: 520px; border-radius: 260px; background: #6b2f4a; filter: blur(100px); opacity: 0.95"></span>
      <span style="{{bloomAccent}}"></span>
      <span style="position: absolute; left: 360px; top: 340px; width: 520px; height: 420px; border-radius: 260px; background: #3b2f5b; filter: blur(110px); opacity: 0.85"></span>
      <span style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; background: rgba(10,10,10,0.4)"></span>
    </div>
  </sc-if>
  <sc-if value="{{isMosaic}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-auto-rows: 100px; grid-auto-flow: dense; gap: 3px; padding: 2px; box-sizing: border-box; overflow: hidden">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="48"><span style="{{t.s}}"></span></sc-for>
    </div>
    <div style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; background: rgba(10,10,10,0.6)"></div>
  </sc-if>
  <sc-if value="{{isType}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: -30px; top: 30px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 280px; font-weight: 300; line-height: 280px; letter-spacing: -6px; white-space: nowrap; color: rgba(255,255,255,0.07)">kavinsky</div>
    <div aria-hidden="true" style="{{typeAccent}}">nightcall</div>
  </sc-if>
  <sc-if value="{{isSpotlight}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 800px; height: 600px; background: linear-gradient(160deg, #3a2a4a 0%, #1f2a3a 45%, #0f1a2a 100%)"></div>
  </sc-if>
  <div style="position: absolute; left: 0; top: 0; width: 800px; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 20px; padding: 0 8px 0 24px; font-size: 13px; color: #a8a8a8">
    <span style="display: flex; gap: 20px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 350; white-space: nowrap"><a href="#">lyrics</a><a href="#" style="color: #ffffff; font-weight: 600">visualizer</a><a href="#">up next</a><a href="#">artist</a></span>
    <span style="flex-grow: 1"></span>
    <a href="#" style="white-space: nowrap">large art</a><a href="#" style="white-space: nowrap">{{faceName}}</a>
    <button aria-label="full screen options" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; font-size: 16px; padding: 0">⋯</button>
    <button aria-label="exit full screen" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M6 13.5V10H2.5M10 13.5V10h3.5"/></svg></button>
  </div>
  <span role="img" aria-label="OutRun cover" style="position: absolute; left: 24px; top: 64px; width: 360px; height: 360px; border-radius: 2px; background: #6b2f4a; display: block; box-shadow: 0 16px 40px rgba(0,0,0,0.45)"></span>
  <div style="position: absolute; left: 416px; top: 64px; width: 360px; display: flex; flex-direction: column">
    <span style="font-size: 13px; color: #7a7a7a">playing from playlist · <a href="#" style="color: #ffffff">late night drive</a></span>
    <span style="display: flex; align-items: center; gap: 12px; margin-top: 14px; height: 44px"><span style="width: 44px; height: 44px; border-radius: 2px; background: #3a2f22; display: block; flex-shrink: 0"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 11px; color: #7a7a7a">next</span><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Get Lucky <span style="color: #a8a8a8">· Daft Punk</span></span></span></span>
  </div>
  <div style="position: absolute; left: 416px; right: 0; top: 196px; display: flex; flex-direction: column">
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 600; line-height: 28px; color: {{accent}}">kavinsky</span>
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; margin-left: -3px">nightcall</span>
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; color: #a8a8a8">outrun · 2013</span>
  </div>
  <div style="position: absolute; left: 416px; top: 344px; width: 360px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 14px; height: 32px; font-size: 12px; color: #a8a8a8; font-variant-numeric: tabular-nums"><span>1:14</span><span style="flex-grow: 1; height: 2px; background: rgba(255,255,255,0.12); display: block"><span style="{{progress}}"></span></span><span>-3:04</span></div>
    <div style="display: flex; align-items: center; height: 56px; gap: 18px">
      <button aria-label="shuffle" style="width: 40px; height: 40px; border: 0; background: transparent; color: {{accent}}; font-size: 17px; padding: 0">⇄</button>
      <button aria-label="previous" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3 6 8l7 5z"/></svg></button>
      <button aria-label="pause" style="{{playDisc}}"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
      <button aria-label="next" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button>
      <button aria-label="repeat" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; font-size: 17px; padding: 0">↻</button>
      <span style="flex-grow: 1"></span>
      <button aria-label="save to liked songs" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; font-size: 17px; padding: 0">♡</button>
    </div>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 800px; height: 112px; box-sizing: border-box; padding: 0 24px 16px 24px; display: flex; align-items: flex-end; gap: 24px; background: linear-gradient(180deg, rgba(10,10,10,0), rgba(10,10,10,0.7))">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; color: #7a7a7a">lyrics</span>
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{accent}}">[THE LINE BEING SUNG NOW]</span>
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; font-weight: 300; line-height: 26px; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[THE NEXT LINE]</span>
    </div>
    <span style="display: flex; align-items: center; gap: 4px; font-size: 13px; flex-shrink: 0">
      <button aria-label="mute" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg></button>
      <span style="width: 96px; height: 2px; background: rgba(255,255,255,0.18); display: block"><span style="display: block; width: 70%; height: 2px; background: #ffffff"></span></span>
      <button style="height: 40px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 13px; padding: 0 8px">this computer ▾</button>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"face":{"editor":"enum","default":"bloom","options":["bloom","mosaic","type","spotlight","none"]},"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const face = this.props.face ?? 'bloom';
  const colors = ['#6b2f4a', '#3b4a6b', '#2f5b6b', '#5b3b6b', '#6b4a2f', '#6b2f2f', '#4a6b2f', '#2f3b6b', '#3a2f22', '#5b2f6b', '#2f4a3b', '#4a2f3b'];
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const tiles = [];
  for (let i = 0; i < 48; i++) tiles.push({ s: 'display: block; background: ' + colors[Math.floor(rnd() * colors.length)] + (i === 0 || i === 19 ? '; grid-column: span 2; grid-row: span 2' : '') });
  const faceNames = { bloom: 'face · bloom', mosaic: 'face · mosaic', type: 'face · type', spotlight: 'face · spotlight', none: 'face · none' };
  return {
    accent, tiles,
    isBloom: face === 'bloom', isMosaic: face === 'mosaic', isType: face === 'type', isSpotlight: face === 'spotlight',
    faceName: faceNames[face] || 'face · bloom',
    bloomAccent: 'position: absolute; left: 440px; top: -140px; width: 460px; height: 460px; border-radius: 230px; background: ' + accent + '; filter: blur(120px); opacity: 0.28',
    typeAccent: 'position: absolute; left: 40px; top: 300px; font-family: \'Segoe UI Variable Display\', \'Segoe UI\', sans-serif; font-size: 180px; font-weight: 600; line-height: 180px; letter-spacing: -4px; white-space: nowrap; opacity: 0.2; color: ' + accent,
    progress: 'display: block; width: 29%; height: 2px; background: ' + accent,
    playDisc: 'width: 52px; height: 52px; border-radius: 26px; border: 0; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; padding: 0',
  };
}
}
</script>
</body>
</html>
