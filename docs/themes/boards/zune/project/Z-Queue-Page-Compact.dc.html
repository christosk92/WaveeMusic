<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune up next (full screen) · compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #0f0f0f; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px 0 4px; gap: 4px; font-size: 13px; color: #7a7a7a">
    <button aria-label="exit full screen" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg></button>
    <span>now playing</span>
    <span style="flex-grow: 1"></span>
    <button aria-label="options" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; font-size: 16px; padding: 0">⋯</button>
  </div>
  <nav aria-label="now playing views" style="{{pivotRow}}">
    <sc-for list="{{pivots}}" as="p" hint-placeholder-count="4"><a href="#" style="{{p.style}}">{{p.name}}</a></sc-for>
  </nav>
  <div style="height: 96px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 16px">
    <span style="width: 72px; height: 72px; background: #6b2f4a; display: block; flex-shrink: 0"></span>
    <span style="display: flex; flex-direction: column; min-width: 0; gap: 2px">
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">nightcall</span>
      <span style="{{artistInk}}">Kavinsky · OutRun</span>
      <span style="font-size: 12px; color: #7a7a7a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">playing from playlist · late night drive</span>
    </span>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden">
    <div style="display: flex; gap: 8px; flex-shrink: 0"><sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><button style="{{c.style}}">{{c.label}}</button></sc-for></div>
    <div style="display: flex; align-items: flex-end; gap: 12px; height: 48px; flex-shrink: 0; padding-bottom: 4px; box-sizing: border-box"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px">next in queue</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px; line-height: 24px">clear</a></div>
    <sc-for list="{{queue}}" as="r" hint-placeholder-count="2">
      <div style="{{r.row}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 13px; color: #9c9c9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span><button aria-label="{{r.removeLabel}}" style="width: 40px; height: 40px; border: 0; background: transparent; color: #c8c8c8; font-size: 13px; padding: 0">✕</button></div>
    </sc-for>
    <div style="display: flex; align-items: flex-end; gap: 12px; height: 48px; flex-shrink: 0; padding-bottom: 4px; box-sizing: border-box"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px">next up</span><span style="font-size: 13px; color: #7a7a7a; line-height: 24px">from late night drive · 36 more</span></div>
    <sc-for list="{{next}}" as="r" hint-placeholder-count="4">
      <div style="{{r.row}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 13px; color: #9c9c9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span><button aria-label="{{r.moreLabel}}" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; font-size: 16px; padding: 0">⋯</button></div>
    </sc-for>
  </div>
  <div style="height: 152px; flex-shrink: 0; background: #0a0a0a; display: flex; flex-direction: column; padding: 0 16px">
    <div style="display: flex; align-items: center; gap: 12px; height: 36px; font-size: 12px; color: #a8a8a8; font-variant-numeric: tabular-nums"><span>1:14</span><span style="flex-grow: 1; height: 2px; background: rgba(255,255,255,0.12); display: block"><span style="{{progress}}"></span></span><span>-3:04</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 68px">
      <button aria-label="shuffle" style="{{shuffle}}">⇄</button>
      <button aria-label="previous" style="width: 48px; height: 48px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3 6 8l7 5z"/></svg></button>
      <button aria-label="pause" style="{{playDisc}}"><svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
      <button aria-label="next" style="width: 48px; height: 48px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button>
      <button aria-label="repeat" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; font-size: 18px; padding: 0">↻</button>
    </div>
    <div style="display: flex; align-items: center; height: 44px; gap: 4px; font-size: 13px">
      <button aria-label="save to liked songs" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; font-size: 18px; padding: 0; margin-left: -8px">♡</button>
      <span style="flex-grow: 1"></span>
      <button style="{{device}}">living room ▾</button>
      <button aria-label="more" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; font-size: 18px; padding: 0; margin-right: -8px">⋯</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const D = '\'Segoe UI Variable Display\', \'Segoe UI\', sans-serif';
  const pivots = ['up next', 'artist', 'lyrics', 'visualizer'].map((n, i) => ({ name: n, style: 'flex-shrink: 0; white-space: nowrap; text-decoration: none; color: ' + (i === 0 ? '#ffffff; font-weight: 600' : '#6f6f6f; font-weight: 350') }));
  const chips = [['shuffle', true], ['repeat', false], ['autoplay', false]].map((d) => ({ label: d[0], style: 'height: 40px; padding: 0 14px; border: 0; font: inherit; font-size: 14px; white-space: nowrap; ' + (d[1] ? 'background: ' + accent + '; color: #000000' : 'background: rgba(255,255,255,0.06); color: #ffffff') }));
  const mk = (list) => list.map((d) => ({
    title: d[0], sub: d[1] + ' · ' + d[2], removeLabel: 'remove ' + d[0] + ' from queue', moreLabel: 'more for ' + d[0],
    row: 'display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; flex-shrink: 0; ' + (d[4] ? 'background: rgba(255,255,255,0.05); margin: 0 -16px; padding: 0 16px' : ''),
    art: 'width: 44px; height: 44px; border-radius: 2px; display: block; background: ' + d[3],
  }));
  const queue = mk([['Get Lucky', 'Daft Punk', '6:09', '#3a2f22', false], ['Instant Crush', 'Daft Punk', '5:37', '#3a2f22', true]]);
  const next = mk([['Resonance', 'HOME', '3:32', '#2f5b6b', false], ['Tech Noir', 'Gunship', '4:56', '#5b3b6b', false], ['Sunset', 'The Midnight', '5:07', '#6b4a2f', false], ['Turbo Killer', 'Carpenter Brut', '3:16', '#6b2f2f', false], ['A Real Hero', 'College, Electric Youth', '4:28', '#4a6b2f', false]]);
  return {
    accent, pivots, chips, queue, next,
    pivotRow: 'height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 24px; padding-left: 16px; overflow: hidden; font-family: ' + D + '; font-size: 28px; line-height: 36px; letter-spacing: -0.3px; -webkit-mask-image: linear-gradient(90deg, #000 84%, transparent); mask-image: linear-gradient(90deg, #000 84%, transparent)',
    artistInk: 'font-size: 15px; line-height: 20px; color: ' + accent,
    progress: 'display: block; width: 29%; height: 2px; background: ' + accent,
    shuffle: 'width: 40px; height: 40px; border: 0; background: transparent; color: ' + accent + '; font-size: 18px; padding: 0',
    playDisc: 'width: 56px; height: 56px; border-radius: 28px; border: 0; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; padding: 0',
    device: 'height: 40px; border: 0; background: transparent; color: ' + accent + '; font: inherit; font-size: 13px; padding: 0 8px',
  };
}
}
</script>
</body>
</html>
