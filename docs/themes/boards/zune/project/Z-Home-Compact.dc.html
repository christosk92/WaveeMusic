<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune home: compact, scrolled</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="home" sub="all,music,podcasts,audiobooks" on="all" collapsed="true" accent="{{accent}}" hint-size="400px,52px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 22px; padding: 8px 16px 0 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">new music</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">see all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{wide}}" as="t" hint-placeholder-count="2"><a href="#" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{t.art}}"></span><span style="font-size: 13px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span><span style="font-size: 12px; color: #a8a8a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.sub}}</span></a></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px; white-space: nowrap">from artists you follow</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px">see all</a></div>
      <sc-for list="{{releases}}" as="r" hint-placeholder-count="3"><a href="#" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; color: #ffffff"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 13px; color: #9c9c9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #a8a8a8; font-size: 16px">⋯</span></a></sc-for>
    </div>
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">because you like</span><span style="font-size: 13px; color: #7a7a7a; white-space: nowrap">the midnight</span></div>
      <sc-for list="{{similar}}" as="r" hint-placeholder-count="3"><a href="#" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; color: #ffffff"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 13px; color: #9c9c9c">{{r.sub}}</span></span><span style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #a8a8a8; font-size: 16px">⋯</span></a></sc-for>
      <a href="#" style="font-size: 13px; height: 32px; display: flex; align-items: center">for fans of aespa · 3 more</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; gap: 14px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">browse</span><span style="font-size: 13px; color: #7a7a7a">this week's picks</span></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{tiles}}" as="t" hint-placeholder-count="4"><a href="#" style="{{t.style}}">{{t.name}}</a></sc-for>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Nightcall" artist="Kavinsky · OutRun" art="#6b2f4a" progress="31" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const a44 = (c, round) => 'width: 44px; height: 44px; border-radius: ' + (round ? 22 : 2) + 'px; background: ' + c + '; display: block';
  const wide = [['Synthwave Essentials', 'playlist · spotify', '#2f3b6b'], ['Heroes', 'album · The Midnight', '#5b3b2f']].map((d) => ({ name: d[0], sub: d[1], art: 'width: 100%; aspect-ratio: 16 / 9; border-radius: 2px; background: ' + d[2] + '; display: block' }));
  const releases = [['Heroes', 'album · The Midnight · friday', '#2f3b6b'], ['Leather Teeth', 'album · Carpenter Brut · last week', '#3b2f2f'], ['Hostage', 'single · Gunship · last week', '#2f4a3b']].map((d) => ({ name: d[0], sub: d[1], art: a44(d[2], false) }));
  const similar = [['FM-84', 'artist', '#4a3b2f', true], ['Timecop1983', 'artist', '#2f3b4a', true], ['The Midnight Radio', 'radio', '#3b3b3b', false]].map((d) => ({ name: d[0], sub: d[1], art: a44(d[2], d[3]) }));
  const tiles = [['today\'s top hits', '#8d2f5b'], ['rap caviar', '#2f5b8d'], ['mint', '#2f8d6b'], ['rock this', '#8d5b2f']].map((d) => ({ name: d[0], style: 'display: flex; align-items: flex-end; height: 88px; padding: 10px 12px; box-sizing: border-box; background: ' + d[1] + '; color: #ffffff; font-size: 15px' }));
  return { accent, wide, releases, similar, tiles };
}
}
</script>
</body>
</html>
