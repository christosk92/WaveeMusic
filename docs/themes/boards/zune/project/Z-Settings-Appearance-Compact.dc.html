<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune settings: appearance, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" crumb="settings › appearance" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="none" sub="" collapsed="true" accent="{{accent}}" hint-size="400px,52px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden">
    <a href="#" style="height: 40px; flex-shrink: 0; align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 14px; color: #a8a8a8; padding-right: 12px"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>settings</a>
    <div style="height: 72px; flex-shrink: 0; margin: -6px -16px 0 -4px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; overflow: hidden">appearance</div>
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px; margin-top: 8px; flex-shrink: 0">theme</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin-top: 12px; flex-shrink: 0">
      <button style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
        <span style="width: 100%; height: 88px; background: #1c1c1c; position: relative; display: block; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 34px; background: #242424"></span><span style="position: absolute; left: 6px; top: 10px; width: 22px; height: 4px; border-radius: 2px; background: #5a5a5a"></span><span style="position: absolute; left: 6px; top: 20px; width: 18px; height: 4px; border-radius: 2px; background: #5a5a5a"></span><span style="position: absolute; left: 44px; top: 12px; width: 44px; height: 44px; border-radius: 6px; background: #3b4a6b"></span><span style="position: absolute; left: 96px; top: 12px; width: 44px; height: 44px; border-radius: 6px; background: #6b2f4a"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 16px; background: #121212"></span></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px">wavee</span><span style="font-size: 12px; line-height: 16px; color: #7a7a7a">the original look</span></span>
      </button>
      <button style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
        <span style="width: 100%; height: 88px; background: #202020; position: relative; display: block; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 40px; background: #1c1c1c"></span><span style="position: absolute; left: 6px; top: 12px; width: 28px; height: 8px; border-radius: 4px; background: #2d2d2d"></span><span style="position: absolute; left: 6px; top: 12px; width: 2px; height: 8px; background: #60cdff"></span><span style="position: absolute; left: 48px; top: 12px; right: 10px; height: 40px; border-radius: 4px; background: #2b2b2b; box-shadow: 0 0 0 1px rgba(255,255,255,0.06)"></span><span style="position: absolute; left: 48px; top: 58px; width: 30px; height: 10px; border-radius: 4px; background: #60cdff"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #1a1a1a"></span></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px">winui</span><span style="font-size: 12px; line-height: 16px; color: #7a7a7a">windows 11, fluent</span></span>
      </button>
      <button aria-pressed="true" style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
        <span style="{{zuneTile}}"><span style="position: absolute; left: 8px; top: 6px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 9px; color: #7a7a7a; white-space: nowrap"><span style="color: #ffffff; font-weight: 600">home</span>  browse  library</span><span style="position: absolute; left: 6px; top: 16px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; font-weight: 200; line-height: 44px; white-space: nowrap; color: #ffffff">quickplay</span><span style="position: absolute; left: 8px; top: 58px; width: 18px; height: 18px; border-radius: 1px; background: #6b2f4a"></span><span style="position: absolute; left: 30px; top: 58px; width: 18px; height: 18px; border-radius: 1px; background: #3b4a6b"></span><span style="{{zuneDot}}"></span><span style="position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #111111"></span></span>
        <span style="display: flex; flex-direction: column"><span style="{{zuneName}}">zune</span><span style="font-size: 12px; line-height: 16px; color: #7a7a7a">metro, panorama, pivots</span></span>
      </button>
      <button style="display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0; text-align: left">
        <span style="width: 100%; height: 88px; background: rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; font-weight: 200; color: #a8a8a8">+</span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 14px; line-height: 20px">add a theme</span><span style="font-size: 12px; line-height: 16px; color: #7a7a7a">from a folder</span></span>
      </button>
    </div>
    <span style="font-size: 13px; line-height: 18px; color: #7a7a7a; margin-top: 12px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">community themes · none yet · <a href="#">open the folder</a></span>
    <span style="display: flex; align-items: baseline; gap: 12px; margin-top: 24px; flex-shrink: 0"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px">zune options</span><span style="flex-grow: 1"></span><a href="#" style="font-size: 13px; height: 28px; display: flex; align-items: center">all options ›</a></span>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px; flex-shrink: 0">
      <span style="font-size: 15px; line-height: 20px">accent</span>
      <span style="display: flex; align-items: center; gap: 12px"><sc-for list="{{accents}}" as="a" hint-placeholder-count="5"><button aria-label="{{a.name}}" style="{{a.style}}"></button></sc-for><span style="font-size: 13px; color: #a8a8a8; margin-left: 4px">pink</span></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px; flex-shrink: 0">
      <span style="font-size: 15px; line-height: 20px">ground</span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{ground}}" as="c" hint-placeholder-count="3"><button style="{{c.style}}">{{c.label}}</button></sc-for></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px; flex-shrink: 0">
      <span style="display: flex; flex-direction: column"><span style="font-size: 15px; line-height: 20px">background</span><span style="font-size: 12px; line-height: 16px; color: #7a7a7a">what sits behind page titles</span></span>
      <span style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{background}}" as="c" hint-placeholder-count="3"><button style="{{c.style}}">{{c.label}}</button></sc-for></span>
    </div>
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px; margin-top: 24px; flex-shrink: 0">window</span>
    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 12px; flex-shrink: 0">
      <span style="font-size: 15px; line-height: 20px">language</span>
      <span style="display: flex; align-items: center; min-height: 40px; font-size: 14px; color: #a8a8a8">english · follows windows <a href="#" style="font-size: 13px; margin-left: 12px; height: 40px; display: flex; align-items: center">change</a></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 12px; flex-shrink: 0">
      <span style="font-size: 15px; line-height: 20px">on close</span>
      <label style="display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: 14px"><span style="width: 40px; height: 20px; background: rgba(255,255,255,0.14); position: relative; display: block; flex-shrink: 0"><span style="position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: #ffffff; display: block"></span></span>off · keep playing in the notification area</label>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Get Lucky" artist="Daft Punk · Random Access Memories" art="#3a2f22" progress="41" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const accents = [['pink', '#ff3ca6'], ['orange', '#ff7a1a'], ['blue', '#60cdff'], ['green', '#8fd14f'], ['purple', '#b983ff']].map((d) => ({ name: d[0], style: 'width: 40px; height: 40px; border: 0; padding: 0; flex-shrink: 0; background: ' + d[1] + (d[1] === accent ? '; outline: 2px solid #ffffff; outline-offset: 2px' : '') }));
  const chips = (labels, on) => labels.map((l, i) => ({ label: l, style: 'height: 40px; padding: 0 14px; border: 0; font: inherit; font-size: 14px; white-space: nowrap; ' + (i === on ? 'background: ' + accent + '; color: #000000' : 'background: rgba(255,255,255,0.06); color: #ffffff') }));
  return {
    accent, accents,
    ground: chips(['dark', 'light', 'follow windows'], 0),
    background: chips(['artwork wash', 'mix', 'none'], 0),
    zuneTile: 'width: 100%; height: 88px; background: #161616; position: relative; display: block; overflow: hidden; outline: 2px solid ' + accent + '; outline-offset: 2px',
    zuneDot: 'position: absolute; left: 15px; top: 79px; width: 4px; height: 4px; border-radius: 2px; background: ' + accent,
    zuneName: 'font-size: 14px; line-height: 20px; color: ' + accent,
  };
}
}
</script>
</body>
</html>
