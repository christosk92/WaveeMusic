<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune video (full screen) · small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; overflow: hidden; position: relative">
  <div style="position: absolute; left: 0; top: 75px; width: 800px; height: 450px; background: linear-gradient(135deg, #0b1220 0%, #1b2a3a 50%, #2a1b3a 100%)"></div>
  <div style="position: absolute; left: 0; top: 0; width: 800px; height: 48px; box-sizing: border-box; display: flex; align-items: center; padding: 0 12px 0 24px; gap: 20px; font-size: 13px; color: #a8a8a8">
    <span style="font-size: 15px; color: #ffffff; white-space: nowrap">Nightcall <span style="color: #a8a8a8">· official video · Kavinsky</span></span>
    <span style="flex-grow: 1"></span>
    <a href="#">switch to audio</a><a href="#" style="color: #ffffff">exit full screen</a>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 800px; height: 140px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 55%)"></div>
  <div style="position: absolute; left: 24px; right: 24px; bottom: 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: #a8a8a8; font-variant-numeric: tabular-nums"><span>1:14</span><span style="flex-grow: 1; height: 2px; background: rgba(255,255,255,0.2); display: block; position: relative"><span style="{{progress}}"></span><span style="{{knob}}"></span></span><span>-3:04</span></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <button aria-label="previous" style="width: 36px; height: 36px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3 6 8l7 5z"/></svg></button>
      <button aria-label="pause" style="{{playDisc}}"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
      <button aria-label="next" style="width: 36px; height: 36px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button>
      <button aria-label="mute" style="width: 36px; height: 36px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg></button>
      <span style="width: 80px; height: 2px; background: rgba(255,255,255,0.2); display: block"><span style="display: block; width: 70%; height: 2px; background: #ffffff"></span></span>
      <span style="flex-grow: 1"></span>
      <span style="font-size: 12px; color: #a8a8a8">1080p · fit</span>
      <button style="height: 36px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 13px; padding: 0 8px">mini player</button>
      <button aria-label="more" style="width: 36px; height: 36px; border: 0; background: transparent; color: #ffffff; font-size: 18px; padding: 0">⋯</button>
    </div>
  </div>
  <div style="position: absolute; right: 24px; bottom: 76px; width: 248px; background: #242424; box-shadow: 0 16px 40px rgba(0,0,0,0.5); padding: 6px 0; display: flex; flex-direction: column; font-size: 13px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><a href="#" style="{{m.row}}"><span style="{{m.dot}}"></span>{{m.label}}<span style="margin-left: auto; font-size: 11px; opacity: 0.7">{{m.key}}</span></a></sc-for>
    <span style="height: 1px; background: rgba(255,255,255,0.08); margin: 4px 14px"></span>
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 14px; color: #ffffff; justify-content: space-between">{{o.label}}<span style="color: #7a7a7a">{{o.value}}</span></a></sc-for>
    <span style="height: 1px; background: rgba(255,255,255,0.08); margin: 4px 14px"></span>
    <a href="#" style="height: 32px; display: flex; align-items: center; padding: 0 14px; color: #ffffff">turn off video</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const modes = [['dock in panel', '', false], ['play in a mini player', '', false], ['play in a separate window', '', false], ['full screen', 'f11', true]].map((d) => ({
    label: d[0], key: d[1],
    row: 'height: 32px; display: flex; align-items: center; gap: 12px; padding: 0 14px; color: ' + (d[2] ? accent : '#ffffff'),
    dot: 'width: 8px; height: 8px; border-radius: 4px; box-sizing: border-box; flex-shrink: 0; display: block; ' + (d[2] ? 'background: ' + accent : 'border: 1px solid #7a7a7a'),
  }));
  const opts = [['aspect ratio', 'fit ▸'], ['quality', 'auto ▸'], ['playback speed', '1× ▸']].map((d) => ({ label: d[0], value: d[1] }));
  return {
    accent, modes, opts,
    progress: 'display: block; width: 29%; height: 2px; background: ' + accent,
    knob: 'position: absolute; left: 29%; top: -5px; width: 12px; height: 12px; border-radius: 6px; background: ' + accent + '; margin-left: -6px; display: block',
    playDisc: 'width: 44px; height: 44px; border-radius: 22px; border: 0; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; padding: 0',
  };
}
}
</script>
</body>
</html>
