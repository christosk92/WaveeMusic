<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune album: compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 520px; background: linear-gradient(180deg, #3a2f22 0%, #2a241c 45%, #161616 100%)"></div>
  <div style="position: relative; flex-shrink: 0; display: flex; flex-direction: column">
    <dc-import name="Z-Part-TitleBar" tier="compact" crumb="daft punk › random access memories" accent="{{accent}}" hint-size="400px,48px"></dc-import>
    <dc-import name="Z-Part-Band" tier="compact" section="library" sub="songs,more by daft punk,credits,fans also like" on="songs" title="random access memories" actions="saved" collapsed="false" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  </div>
  <div style="position: relative; flex-grow: 1; min-height: 0; overflow: hidden">
    <div style="position: absolute; left: 10px; top: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 64px; font-weight: 200; line-height: 72px; letter-spacing: -1px; white-space: nowrap; color: #ffffff; opacity: 0.92">random access memories</div>
    <div style="position: absolute; left: 16px; right: 16px; top: 80px; bottom: 0; display: flex; flex-direction: column">
      <div style="display: flex; gap: 16px; align-items: flex-end; flex-shrink: 0">
        <span style="width: 144px; height: 144px; border-radius: 2px; background: #3a2f22; display: block; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,0.06)"></span>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; padding-bottom: 4px">
          <a href="#" style="font-size: 18px; line-height: 24px; color: #ffffff">Daft Punk</a>
          <span style="font-size: 13px; line-height: 18px; color: #a8a8a8">album · 2013 · 13 songs · 74 min</span>
          <span style="font-size: 12px; line-height: 16px; color: #7a7a7a">disco · funk · electronic</span>
        </div>
      </div>
      <div style="display: flex; gap: 16px; align-items: center; height: 40px; margin-top: 16px; flex-shrink: 0; font-size: 14px">
        <button style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0"><span style="{{playRing}}">▶</span>play</button>
        <button style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; color: #ffffff; font: inherit; padding: 0"><span style="{{ringOn}}">♥</span>saved</button>
        <span style="flex-grow: 1"></span>
        <button aria-label="share" style="{{ring}}">↗</button>
        <button aria-label="more" style="{{ring}}">⋯</button>
      </div>
      <div style="display: flex; flex-direction: column; margin-top: 12px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
          <div style="{{r.rowStyle}}">
            <span style="{{r.numStyle}}">{{r.num}}</span>
            <span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="{{r.titleStyle}}">{{r.title}}</span><span style="{{r.subStyle}}">{{r.sub}}</span></span>
            <button aria-label="more" style="{{r.moreStyle}}">⋯</button>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Get Lucky" artist="Daft Punk · Random Access Memories" art="#3a2f22" progress="41" saved="false" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const D = '\'Segoe UI Variable Display\', \'Segoe UI\', sans-serif';
  const data = [['Give Life Back to Music', 'Daft Punk', '4:34'], ['The Game of Love', 'Daft Punk', '5:21'], ['Giorgio by Moroder', 'Daft Punk', '9:04'], ['Within', 'Daft Punk', '3:48'], ['Instant Crush', 'feat. Julian Casablancas', '5:37'], ['Lose Yourself to Dance', 'feat. Pharrell Williams', '5:53'], ['Touch', 'feat. Paul Williams', '8:18']];
  const rows = data.map((d, i) => {
    const hover = i === 4;
    return {
      num: String(i + 1), title: d[0], sub: d[1] + ' · ' + d[2],
      rowStyle: 'display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; height: 56px; margin: 0 -8px; padding: 0 0 0 8px; ' + (hover ? 'background: rgba(255,255,255,0.05)' : ''),
      numStyle: 'font-family: ' + D + '; font-weight: 300; font-size: 22px; line-height: 28px; color: #7a7a7a; font-variant-numeric: tabular-nums',
      titleStyle: 'font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff',
      subStyle: 'font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #9c9c9c; font-variant-numeric: tabular-nums',
      moreStyle: 'width: 40px; height: 40px; border: 0; background: transparent; color: ' + (hover ? '#ffffff' : '#a8a8a8') + '; font-size: 16px; padding: 0',
    };
  });
  return {
    accent, rows,
    playRing: 'width: 40px; height: 40px; border-radius: 20px; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0',
    ringOn: 'width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 2px solid ' + accent + '; color: ' + accent + '; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0',
    ring: 'width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 2px solid #ffffff; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; font: inherit; font-size: 14px; padding: 0; flex-shrink: 0',
  };
}
}
</script>
</body>
</html>
