<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune collection: artists · compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #161616; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <dc-import name="Z-Part-TitleBar" tier="compact" accent="{{accent}}" hint-size="400px,48px"></dc-import>
  <dc-import name="Z-Part-Band" tier="compact" section="library" sub="liked,playlists,albums,artists,podcasts,audiobooks" on="artists" accent="{{accent}}" hint-size="400px,92px"></dc-import>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 16px; overflow: hidden">
    <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; margin-left: -12px">
      <button aria-label="back to library" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
      <span style="font-size: 13px; color: #a8a8a8; white-space: nowrap">library ›</span><span style="font-size: 13px; color: #ffffff; white-space: nowrap">artists</span><span style="font-size: 13px; color: #7a7a7a; margin-left: 6px">184</span>
      <span style="flex-grow: 1"></span>
      <button style="height: 40px; border: 0; background: transparent; color: #ffffff; font: inherit; font-size: 13px; padding: 0 4px; display: flex; align-items: center; gap: 6px">a–z <span style="font-size: 10px; color: #a8a8a8">▾</span></button>
      <button aria-label="find in artists" style="width: 40px; height: 40px; border: 0; background: transparent; color: #a8a8a8; display: flex; align-items: center; justify-content: center; padding: 0; margin-right: -12px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg></button>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; flex-shrink: 0">
        <a href="#" aria-label="{{g.label}}" style="{{g.headStyle}}">{{g.letter}}</a>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <a href="#" style="display: grid; grid-template-columns: 56px minmax(0, 1fr) 40px; align-items: center; height: 56px; color: #ffffff"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; gap: 1px"><span style="font-size: 15px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.n}}</span><span style="font-size: 13px; color: #9c9c9c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span><span style="font-size: 12px; color: #7a7a7a; text-align: right">{{r.count}}</span></a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <dc-import name="Z-Part-PlayBar" tier="mini" title="Nightcall" artist="Kavinsky · OutRun" art="#6b2f4a" progress="29" accent="{{accent}}" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const D = '\'Segoe UI Variable Display\', \'Segoe UI\', sans-serif';
  const row = (d) => ({ n: d[0], sub: d[1], count: String(d[2]), art: 'width: 44px; height: 44px; border-radius: 22px; background: ' + d[3] + '; display: block' });
  const groups = [
    ['a', [['aespa', '3 albums · following', 3, '#5b3b6b'], ['Arcade Fire', '2 albums', 2, '#4a3b2f']]],
    ['c', [['Carpenter Brut', '4 albums · following', 4, '#6b2f2f'], ['College', '1 album', 1, '#2f4a5b']]],
    ['d', [['Daft Punk', '6 albums · 2 singles · following', 6, '#3a2f22'], ['Depeche Mode', '5 albums', 5, '#2a2a2a']]],
    ['f', [['FM-84', '2 albums · following', 2, '#4a3b2f']]],
    ['g', [['Gunship', '3 albums · following', 3, '#2f4a3b']]],
  ].map((g) => ({
    letter: g[0], label: 'jump from ' + g[0], rows: g[1].map(row),
    headStyle: 'height: 48px; display: flex; align-items: flex-end; padding-bottom: 2px; box-sizing: border-box; font-family: ' + D + '; font-size: 40px; font-weight: 200; line-height: 44px; color: ' + accent + '; letter-spacing: -0.5px',
  }));
  return { accent, groups };
}
}
</script>
</body>
</html>
