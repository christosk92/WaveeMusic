<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zune video (full screen) · compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a8a8a8;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; background: #000000; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; padding: 0 4px; gap: 4px; font-size: 13px; color: #a8a8a8">
    <button aria-label="exit full screen" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 6 5 5 5-5"/></svg></button>
    <span>video</span>
    <span style="flex-grow: 1"></span>
    <button style="height: 40px; border: 0; background: transparent; color: #a8a8a8; font: inherit; font-size: 13px; padding: 0 12px">switch to audio</button>
  </div>
  <div style="width: 400px; height: 225px; flex-shrink: 0; position: relative; background: linear-gradient(135deg, #0b1220 0%, #1b2a3a 50%, #2a1b3a 100%)">
    <button aria-label="rotate to landscape" style="position: absolute; right: 8px; bottom: 8px; width: 40px; height: 40px; border: 0; background: rgba(0,0,0,0.45); color: #ffffff; font-size: 16px; padding: 0">⤢</button>
  </div>
  <div style="display: flex; flex-direction: column; padding: 14px 16px 0 16px; flex-shrink: 0">
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 26px; font-weight: 300; line-height: 32px">Nightcall</span>
    <span style="font-size: 13px; color: #a8a8a8; line-height: 18px">official video · <a href="#" style="color: #ffffff">Kavinsky</a></span>
    <div style="display: flex; align-items: center; gap: 12px; height: 40px; margin-top: 6px; font-size: 12px; color: #a8a8a8; font-variant-numeric: tabular-nums"><span>1:14</span><span style="flex-grow: 1; height: 2px; background: rgba(255,255,255,0.2); display: block; position: relative"><span style="{{progress}}"></span><span style="{{knob}}"></span></span><span>-3:04</span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 64px">
      <button aria-label="mute" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11.5 5.5a3.5 3.5 0 0 1 0 5"/></svg></button>
      <button aria-label="previous" style="width: 48px; height: 48px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 3h2v10H3zM13 3 6 8l7 5z"/></svg></button>
      <button aria-label="pause" style="{{playDisc}}"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg></button>
      <button aria-label="next" style="width: 48px; height: 48px; border: 0; background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11 3h2v10h-2zM3 3l7 5-7 5z"/></svg></button>
      <button aria-label="save to liked songs" style="width: 40px; height: 40px; border: 0; background: transparent; color: #ffffff; font-size: 18px; padding: 0">♡</button>
    </div>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 16px 0 16px; overflow: hidden">
    <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; font-weight: 300; line-height: 28px; height: 40px; display: flex; align-items: flex-end; padding-bottom: 4px; box-sizing: border-box; flex-shrink: 0">play video</span>
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><a href="#" style="{{m.row}}"><span style="{{m.dot}}"></span>{{m.label}}<span style="margin-left: auto; font-size: 12px; color: #7a7a7a">{{m.key}}</span></a></sc-for>
    <span style="height: 1px; background: rgba(255,255,255,0.08); margin: 8px 0; flex-shrink: 0"></span>
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><a href="#" style="height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; font-size: 15px; color: #ffffff">{{o.label}}<span style="font-size: 14px; color: #7a7a7a">{{o.value}}</span></a></sc-for>
    <a href="#" style="height: 48px; flex-shrink: 0; display: flex; align-items: center; font-size: 15px; color: #ffffff">turn off video</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff3ca6","options":["#ff3ca6","#ff7a1a","#60cdff","#8fd14f"]},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const accent = this.props.accent ?? '#ff3ca6';
  const modes = [['full screen', 'f11', true], ['in a mini player', '', false], ['in a separate window', '', false], ['docked in the panel', '', false]].map((d) => ({
    label: d[0], key: d[1],
    row: 'height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; font-size: 15px; color: ' + (d[2] ? accent : '#ffffff'),
    dot: 'width: 10px; height: 10px; border-radius: 5px; box-sizing: border-box; flex-shrink: 0; display: block; ' + (d[2] ? 'background: ' + accent : 'border: 1px solid #7a7a7a'),
  }));
  const opts = [['aspect ratio', 'fit ▸'], ['quality', 'auto · 1080p ▸'], ['playback speed', '1× ▸']].map((d) => ({ label: d[0], value: d[1] }));
  return {
    accent, modes, opts,
    progress: 'display: block; width: 29%; height: 2px; background: ' + accent,
    knob: 'position: absolute; left: 29%; top: -5px; width: 12px; height: 12px; border-radius: 6px; background: ' + accent + '; margin-left: -6px; display: block',
    playDisc: 'width: 56px; height: 56px; border-radius: 28px; border: 0; background: ' + accent + '; color: #000; display: flex; align-items: center; justify-content: center; padding: 0',
  };
}
}
</script>
</body>
</html>
