<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recents, huge window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 2560px; height: 1440px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="huge" width="2560" tabs="home:Home|recents:Recents" sel="1" hint-size="2560px,88px"></dc-import>
  <div style="display: flex; height: 1280px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="" height="1280" hint-size="280px,1280px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 32px 48px 0 48px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; align-items: flex-end; gap: 12px"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600; flex-grow: 1">Recents</h1><button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px; margin-bottom: 8px">Overview</button></div>
      <div role="tablist" aria-label="Filter recents" style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="4"><button role="tab" aria-selected="{{v.on}}" style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 48px; min-height: 0">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{items}}" as="r" hint-placeholder-count="16">
            <sc-if value="{{r.day}}" hint-placeholder-val="{{ false }}"><div style="height: 40px; display: flex; align-items: flex-end; padding-bottom: 6px; font-size: 14px; font-weight: 600">{{r.label}}</div></sc-if>
            <sc-if value="{{r.row}}" hint-placeholder-val="{{ true }}">
              <div style="{{r.style}}">
                <span style="{{r.art}}"></span>
                <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5">{{r.kind}}</span></span><span style="font-size: 14px; line-height: 20px; color: #c5c5c5">{{r.meta}}</span></span>
                <button aria-label="Play {{r.label}}" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
                <span style="width: 64px; text-align: right; font-size: 14px; color: #9e9e9e; white-space: nowrap; font-variant-numeric: tabular-nums">{{r.when}}</span>
                <button aria-label="{{r.toggle}}" aria-expanded="{{r.open}}" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #c5c5c5; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="{{r.chev}}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
              </div>
            </sc-if>
            <sc-if value="{{r.sub}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: 48px minmax(0, 1.2fr) minmax(0, 1fr) 80px; align-items: center; height: 40px; margin-left: 76px; border-radius: 4px"><span style="padding-left: 8px; font-size: 14px; color: #9e9e9e; font-variant-numeric: tabular-nums">{{r.n}}</span><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span><a href="#" style="font-size: 14px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.artist}}</a><span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.when}}</span></div>
            </sc-if>
          </sc-for>
        </div>
        <aside aria-label="Listening calendar and top plays" style="display: flex; flex-direction: column; gap: 16px; padding-top: 12px">
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
            <div style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">October 2026</span><button aria-label="Previous month" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button><button aria-label="Next month" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #5d5d5d; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: #9e9e9e; text-align: center"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
              <sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><span style="{{c.style}}">{{c.d}}</span></sc-for>
            </div>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c5c5c5"><span>Quieter</span><span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(96,205,255,0.15)"></span><span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(96,205,255,0.4)"></span><span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(96,205,255,0.7)"></span><span style="width: 12px; height: 12px; border-radius: 2px; background: #60cdff"></span><span>Busier</span></div>
            <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.0837)"><span style="font-size: 14px">212 plays · So far</span><span style="font-size: 12px; color: #c5c5c5">10 Oct · 12 plays · top: Stereo Love</span></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 20px 8px 20px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
            <span style="font-size: 14px; line-height: 20px; font-weight: 600; padding-bottom: 4px">Most played in October</span>
            <sc-for list="{{top}}" as="t" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 12px; height: 52px"><span style="width: 16px; font-size: 14px; color: #9e9e9e; font-variant-numeric: tabular-nums">{{t.n}}</span><span style="{{t.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">{{t.a}}</span></span></div></sc-for>
          </div>
        </aside>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="huge" width="2560" variant="music" pane="none" hint-size="2560px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, on: s ? 'true' : 'false', style: 'position: relative; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const views = [vs('All', true), vs('Music', false), vs('Podcasts', false), vs('Artists', false)];
  const day = (l) => ({ day: true, row: false, sub: false, label: l });
  const row = (l, kind, meta, when, c, open, round) => ({ day: false, row: true, sub: false, label: l, kind, meta, when, open: open ? 'true' : 'false', toggle: (open ? 'Collapse ' : 'Expand ') + l,
    chev: open ? 'M3.5 10 8 5.5l4.5 4.5' : 'M3.5 6 8 10.5 12.5 6',
    style: 'display: flex; align-items: center; gap: 16px; height: 64px; margin-top: 2px; padding: 0 8px; border-radius: 4px; ' + (open ? 'background: rgba(255,255,255,0.0605)' : ''),
    art: 'width: 56px; height: 56px; flex-shrink: 0; border-radius: ' + (round ? '28px' : '4px') + '; background: ' + c });
  const sub = (n, l, a, d) => ({ day: false, row: false, sub: true, n, label: l, artist: a, when: d });
  const items = [
    day('Today'),
    row('The Stereo Love Show', 'Album', 'Edward Maya · Played 5 tracks', '20:14', '#3b5b7a', true, false),
    sub('1', 'Stereo Love', 'Edward Maya, Vika Jigulina', '4:07'), sub('2', 'This Is My Life', 'Edward Maya', '3:50'), sub('3', 'Mono in Love', 'Edward Maya, Andreea Banica', '3:17'), sub('4', 'Happy for You', 'Edward Maya', '3:51'), sub('5', 'Friends Forever', 'Edward Maya', '3:35'),
    row('Latency, Honestly', 'Episode', 'Coffee & Code · 23 min left', '17:40', '#4a5b3b', false, false),
    row('Arash', 'Artist', 'Played 3 tracks', '12:02', '#4a3b2f', false, true),
    day('Yesterday'),
    row('LoL Worlds Songs 2014–2026', 'Playlist', 'Played 12 tracks · grouped from 4 plays', '22:51', '#5b5b5b', false, false),
    row('Supernova', 'Song', 'aespa · Armageddon', '18:20', '#5b2f6b', false, false),
    row('Days of Thunder', 'Song', 'The Midnight · Endless Summer', '08:05', '#6b4a2f', false, false),
    day('Thursday 8 October'),
    row('Armageddon', 'Album', 'aespa · Played 10 tracks', '21:33', '#5b2f6b', false, false),
    row('Magnetic', 'Song', 'ILLIT · SUPER REAL ME', '19:02', '#6b5b2f', false, false),
    row('Odyssey', 'Album', 'HOME · Played 4 tracks', '07:48', '#2f5b6b', false, false)
  ];
  const lv = [0, 1, 0, 2, 1, 3, 2, 1, 0, 1, 2, 4, 3, 2, 1, 2, 0, 1, 3, 2, 1, 0, 1, 2, 1, 3, 4, 2, 1, 0, 1, 0, 0, 0, 0];
  const bg = ['rgba(255,255,255,0.0605)', 'rgba(96,205,255,0.15)', 'rgba(96,205,255,0.4)', 'rgba(96,205,255,0.7)', '#60cdff'];
  const cells = lv.map((l, i) => ({ d: i < 31 ? String(i + 1) : '',
    style: 'aspect-ratio: 1 / 1; display: flex; align-items: flex-start; justify-content: flex-end; padding: 4px 6px; box-sizing: border-box; border-radius: 4px; font-size: 12px; font-variant-numeric: tabular-nums; color: ' + (l === 4 ? '#000000' : '#c5c5c5') + '; background: ' + (i > 30 ? 'transparent' : bg[l]) + (i === 9 ? '; outline: 2px solid #ffffff; outline-offset: -2px' : '') }));
  const top = [['1', 'Stereo Love', 'Edward Maya, Vika Jigulina', '#3b5b7a'], ['2', 'Supernova', 'aespa', '#5b2f6b'], ['3', 'Broken Angel (feat. Helena)', 'Arash', '#4a3b2f'], ['4', 'Days of Thunder', 'The Midnight', '#6b4a2f']].map(t => ({ n: t[0], t: t[1], a: t[2], art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: ' + t[3] }));
  return { views, items, cells, top };
}
}
</script>
</body>
</html>
