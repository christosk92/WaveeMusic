<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const mode = (l, s) => ({ label: l, style: 'position: relative; height: 38px; padding: 0 16px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 16px; right: 16px; bottom: 3px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const modes = [mode('Lyrics', true), mode('Visualizer', false), mode('Up next', false), mode('Artist', false)];
  const cx = 1280, cy = 568, r0 = 276, n = 96;
  const ring = Array.from({ length: n }, (_, i) => {
    const h = Math.round(16 + 112 * Math.abs(Math.sin(i * 0.39) * Math.cos(i * 0.1 + 0.4)));
    return { style: 'position: absolute; left: ' + (cx - 3) + 'px; top: ' + (cy - r0 - h) + 'px; width: 6px; height: ' + h + 'px; border-radius: 3px; transform-origin: 3px ' + (r0 + h) + 'px; transform: rotate(' + (i * 360 / n).toFixed(2) + 'deg); background: ' + (i % 2 === 0 ? 'rgba(96,205,255,0.9)' : 'rgba(153,235,255,0.55)') };
  });
  return { modes, ring };
}
}
