<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Narrow window tier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; padding: 16px 40px 40px 40px; display: grid; grid-template-columns: 640px 640px; gap: 80px; overflow: hidden; background: #141414; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <sc-for list="{{wins}}" as="w" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; line-height: 16px; color: #9e9e9e">{{w.caption}}</span>
      <div style="position: relative; height: 872px; display: flex; flex-direction: column; border-radius: 8px; overflow: hidden; background: #202020; border: 1px solid rgba(255,255,255,0.0837); box-shadow: 0 32px 64px rgba(0,0,0,0.4)">
        <div style="height: 40px; flex-shrink: 0; display: flex; align-items: flex-end; padding-left: 8px; background: #1c1c1c">
          <div style="height: 36px; width: 36px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 8px 8px 0 0; color: #c5c5c5"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 8 3l5.5 5.5M4 7.5V13h8V7.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
          <div style="height: 36px; width: 140px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; font-size: 12px; border-radius: 8px 8px 0 0; background: #202020"><span style="width: 16px; height: 16px; border-radius: 4px; background: #3b5b7a; flex-shrink: 0"></span><span style="flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The Stereo Love Show</span></div>
          <span style="flex-grow: 1"></span>
          <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
          <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
          <span style="width: 46px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></span>
        </div>
        <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px">
          <button aria-label="Open navigation" aria-expanded="{{w.open}}" style="{{w.burger}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
          <button aria-label="Back" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8h-11M6.5 3.5 2.5 8l4 4.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          <span style="flex-grow: 1"></span>
          <button aria-label="Search" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
          <button aria-label="Notifications" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2a4 4 0 0 1 4 4v3l1.5 2h-11L4 9V6a4 4 0 0 1 4-4zM6.5 13a1.5 1.5 0 0 0 3 0" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          <span role="img" aria-label="Chris" style="width: 32px; height: 32px; margin-left: 4px; border-radius: 16px; background: #6b5b4a"></span>
        </div>
        <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
          <div style="display: flex; gap: 16px; align-items: flex-end">
            <div style="width: 128px; height: 128px; border-radius: 8px; background: #3b5b7a; flex-shrink: 0"></div>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <div style="font-size: 12px; line-height: 16px; color: #c5c5c5">Album · 2012</div>
              <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">The Stereo Love Show</h1>
              <div style="font-size: 14px; line-height: 20px; color: #c5c5c5"><a href="#">Edward Maya</a> · 15 songs · 57 min</div>
            </div>
          </div>
          <div style="display: flex; gap: 8px; align-items: center">
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
            <button aria-label="Shuffle" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
            <button aria-label="Save" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
            <span style="flex-grow: 1"></span>
            <button aria-label="More" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
          </div>
          <div role="table" aria-label="Tracks" style="display: flex; flex-direction: column">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
              <div role="row" style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 52px 32px; align-items: center; height: 48px; margin-top: 2px; border-radius: 4px">
                <span style="{{r.num}}">{{r.n}}</span>
                <span style="display: flex; flex-direction: column; min-width: 0"><span style="{{r.title}}">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span></span>
                <span style="text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.d}}</span>
                <span style="display: flex; align-items: center; justify-content: center; color: #fff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></span>
              </div>
            </sc-for>
          </div>
        </main>
        <div style="position: relative; height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 12px; background: #202020; border-top: 1px solid rgba(255,255,255,0.0837)">
          <span style="position: absolute; left: 0; top: -1px; width: 48%; height: 2px; background: #60cdff"></span>
          <span style="width: 40px; height: 40px; border-radius: 4px; background: #3b5b7a; flex-shrink: 0"></span>
          <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600">Stereo Love</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Edward Maya, Vika Jigulina</span></span>
          <button aria-label="Saved to Liked Songs" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
          <button aria-label="Pause" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 18px; background: #60cdff; color: #000; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
          <button aria-label="Next" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
          <button aria-label="More player controls" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
        </div>
        <sc-if value="{{w.overlay}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 0; top: 88px; bottom: 0; width: 280px; overflow: hidden; background: #2c2c2c; border-right: 1px solid rgba(0,0,0,0.2); border-top-right-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.26)">
            <dc-import name="Shell-Nav" theme="dark" mode="open" sel="albums" height="784" hint-size="280px,784px"></dc-import>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const tool = (on) => 'width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; color: #fff; font: inherit; background: ' + (on ? 'rgba(255,255,255,0.0605)' : 'transparent');
  const wins = [
    { caption: 'Compact tier, below 641 px and down to the 300 × 330 minimum window: pane hidden (LeftMinimal), hamburger in the toolbar, selected tab 140 with its label and the others as 36 px icon tabs, search collapses to a button, detail stacks, player shrinks to 64 with a 2 px progress edge', open: 'false', overlay: false, burger: tool(false) },
    { caption: 'Same window, hamburger pressed: the pane slides over the content as a light-dismiss overlay (acrylic, flyout shadow), never pushing the page', open: 'true', overlay: true, burger: tool(true) }
  ];
  const data = [['Stereo Love', 'Edward Maya, Vika Jigulina', '4:07', true], ['This Is My Life', 'Edward Maya', '3:50'], ['Mono in Love', 'Edward Maya, Andreea Banica', '3:17'], ['Happy for You', 'Edward Maya', '3:51'], ['Friends Forever', 'Edward Maya', '3:35'], ['Twinheart', 'Edward Maya', '3:59'], ['Nostalgy', 'Edward Maya', '3:30'], ['Stay Longer', 'Edward Maya', '3:40'], ['Back Home', 'Edward Maya', '3:37'], ['Close Your Eyes', 'Edward Maya', '4:30']];
  const rows = data.map((d, i) => ({ n: d[3] ? '▮▮▮' : String(i + 1), t: d[0], a: d[1], d: d[2],
    num: 'padding-left: 8px; font-variant-numeric: tabular-nums; font-size: ' + (d[3] ? '10px' : '14px') + '; color: ' + (d[3] ? '#60cdff' : '#9e9e9e'),
    title: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[3] ? '#99ebff' : '#ffffff') }));
  return { wins, rows };
}
}
</script>
</body>
</html>
