<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Queue pane as overlay, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|album:The Stereo Love Show:#3b5b7a" sel="1" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="albums" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; gap: 20px; align-items: flex-end">
        <div style="width: 128px; height: 128px; border-radius: 8px; background: #3b5b7a; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
          <div style="font-size: 12px; line-height: 16px; color: #c5c5c5">Album · 2012 · Cat Music</div>
          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">The Stereo Love Show</h1>
          <div style="font-size: 14px; line-height: 20px; color: #c5c5c5"><a href="#">Edward Maya</a>, <a href="#">Vika Jigulina</a> · 15 songs · 57 min</div>
          <div style="display: flex; gap: 8px; align-items: center; padding-top: 10px">
            <div style="display: flex; height: 32px; border-radius: 4px; overflow: hidden; background: #60cdff; color: #000; font-size: 14px"><button style="display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; background: transparent; color: #000; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Pause</button><span style="width: 1px; background: rgba(0,0,0,0.2)"></span><button aria-label="More play options" style="width: 32px; border: 0; background: transparent; color: #000; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
            <button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Shuffle</button>
            <button aria-label="Save" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
            <button aria-label="More" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
          </div>
        </div>
      </div>
      <div role="table" aria-label="Tracks" style="display: flex; flex-direction: column">
        <div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px 56px; align-items: center; height: 32px; border-bottom: 1px solid rgba(255,255,255,0.0837); font-size: 12px; color: #c5c5c5"><span style="padding-left: 10px">#</span><span>Title</span><span></span><span style="text-align: right; padding-right: 8px">Time</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
          <div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px 56px; align-items: center; height: 40px; margin-top: 2px; border-radius: 4px"><span style="{{r.num}}">{{r.n}}</span><span style="display: flex; flex-direction: column; min-width: 0"><span style="{{r.title}}">{{r.t}}</span></span><span style="text-align: center; color: #fff">{{r.heart}}</span><span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span></div>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" pane="queue" hint-size="800px,72px"></dc-import>

  <aside aria-label="Queue" style="position: absolute; right: 0; top: 88px; width: 340px; height: 440px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: rgba(44,44,44,0.94); backdrop-filter: blur(30px); border-left: 1px solid rgba(0,0,0,0.2); border-top-left-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.26)">
    <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{t.sel}}" style="{{t.style}}">{{t.label}}<span style="{{t.bar}}"></span></button></sc-for>
      <span style="flex-grow: 1"></span>
      <button aria-label="More pane tabs: Friends" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      <button aria-label="Close queue" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
    </div>
    <div style="flex-grow: 1; min-height: 0; padding: 8px 12px 0 12px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
      <div style="display: flex; gap: 12px; align-items: center; padding: 8px; flex-shrink: 0; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
        <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: #3b5b7a"></span>
        <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; font-weight: 600; color: #99ebff">Stereo Love</span><span style="font-size: 12px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Playing from <a href="#">The Stereo Love Show</a></span></span>
        <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 14px; padding-right: 4px"><span style="width: 3px; height: 8px; background: #60cdff"></span><span style="width: 3px; height: 14px; background: #60cdff"></span><span style="width: 3px; height: 5px; background: #60cdff"></span><span style="width: 3px; height: 11px; background: #60cdff"></span></span>
      </div>
      <div style="display: flex; align-items: center; height: 36px; flex-shrink: 0; padding: 0 4px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">Next in queue</span><a href="#" style="font-size: 12px">Clear</a></div>
      <sc-for list="{{queued}}" as="q" hint-placeholder-count="2">
        <div style="{{q.style}}"><span style="{{q.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.t}}</span><span style="font-size: 12px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.a}}</span></span><span style="{{q.trail}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></span></div>
      </sc-for>
      <div style="display: flex; align-items: center; height: 36px; flex-shrink: 0; padding: 0 4px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">Next up</span><span style="font-size: 12px; color: #c5c5c5">13 more</span></div>
      <sc-for list="{{next}}" as="q" hint-placeholder-count="4">
        <div style="{{q.style}}"><span style="{{q.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.t}}</span><span style="font-size: 12px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.a}}</span></span><span style="font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{q.d}}</span></div>
      </sc-for>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const data = [['Stereo Love', '4:07', true], ['This Is My Life', '3:50'], ['Mono in Love', '3:17'], ['Happy for You', '3:51'], ['Friends Forever', '3:35'], ['Twinheart', '3:59']];
  const rows = data.map((d, i) => ({ n: d[2] ? '▮▮▮' : String(i + 1), t: d[0], time: d[1], heart: d[2] ? '♥' : '',
    num: 'padding-left: 10px; font-variant-numeric: tabular-nums; font-size: ' + (d[2] ? '10px' : '14px') + '; color: ' + (d[2] ? '#60cdff' : '#9e9e9e'),
    title: 'font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[2] ? '#99ebff' : '#ffffff') }));
  const tab = (l, s) => ({ label: l, sel: s ? 'true' : 'false', style: 'position: relative; height: 40px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const tabs = [tab('Queue', true), tab('Lyrics', false), tab('Now playing', false)];
  const row = (t, a, c, hover, d) => ({ t, a, d: d || '', style: 'display: flex; align-items: center; gap: 12px; height: 48px; flex-shrink: 0; padding: 0 4px 0 8px; border-radius: 4px; ' + (hover ? 'background: rgba(255,255,255,0.0605)' : ''), art: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; background: ' + c, trail: (hover ? 'display: flex' : 'display: none') + '; gap: 12px; align-items: center; color: #fff; padding-right: 4px' });
  const queued = [row('Supernova', 'aespa', '#5b2f6b', true), row('Days of Thunder', 'The Midnight', '#6b4a2f', false)];
  const next = [row('This Is My Life', 'Edward Maya', '#3b5b7a', false, '3:50'), row('Mono in Love', 'Edward Maya, Andreea Banica', '#3b5b7a', false, '3:17'), row('Happy for You', 'Edward Maya', '#3b5b7a', false, '3:51'), row('Friends Forever', 'Edward Maya', '#3b5b7a', false, '3:35')];
  return { rows, tabs, queued, next };
}
}
</script>
</body>
</html>
