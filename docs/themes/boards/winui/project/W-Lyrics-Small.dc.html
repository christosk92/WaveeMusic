<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lyrics full screen, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; box-sizing: border-box; overflow: hidden; background: #141414; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
    <span style="position: absolute; left: -89px; top: 67px; width: 422px; height: 422px; border-radius: 211px; background: #3b5b7a; filter: blur(89px); opacity: 0.9"></span>
    <span style="position: absolute; left: 478px; top: -78px; width: 389px; height: 389px; border-radius: 194px; background: #60cdff; filter: blur(100px); opacity: 0.26"></span>
    <span style="position: absolute; left: 356px; top: 289px; width: 456px; height: 344px; border-radius: 172px; background: #2f4a6b; filter: blur(89px); opacity: 0.85"></span>
    <span style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></span>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; padding: 0 8px 0 16px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 12px"><span style="width: 16px; height: 16px; border-radius: 4px; background: #60cdff"></span><span>Wavee</span></div>
    <div style="display: flex; gap: 2px; height: 40px; padding: 0 4px; border-radius: 8px; background: rgba(44,44,44,0.7); border: 1px solid rgba(0,0,0,0.2)">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><button style="{{m.style}}">{{m.label}}<span style="{{m.bar}}"></span></button></sc-for>
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 4px">
      <button aria-label="Layout: Large art" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5h12v11H2zM3.5 4.5h5v5h-5zM10 5h2.5M10 7h2.5M10 9h2.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"></path></svg></button>
      <button aria-label="Exit full screen" style="width: 40px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M6 13.5V10H2.5M10 13.5V10h3.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
  </div>

  <div style="position: absolute; left: 48px; top: 48px; bottom: 128px; width: 272px; display: flex; flex-direction: column; justify-content: center; gap: 12px">
    <span role="img" aria-label="The Stereo Love Show cover" style="width: 272px; height: 272px; border-radius: 8px; background: #3b5b7a; box-shadow: 0 16px 32px rgba(0,0,0,0.4)"></span>
    <span style="display: flex; flex-direction: column"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 34px; line-height: 40px; font-weight: 600">Stereo Love</span><span style="font-size: 14px; line-height: 20px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><a href="#">Edward Maya</a>, <a href="#">Vika Jigulina</a></span></span>
  </div>

  <div style="position: absolute; left: 368px; right: 40px; top: 48px; bottom: 128px; display: flex; flex-direction: column; justify-content: center; gap: 12px; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 22px; line-height: 30px; font-weight: 600">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="{{l.style}}"><span style="color: {{l.doneColor}}">{{l.done}}</span><span>{{l.rest}}</span></span>
        <sc-if value="{{l.second}}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif; font-size: 14px; line-height: 20px; font-weight: 400; color: rgba(255,255,255,0.6)">{{l.secondText}}</span></sc-if>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 104px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; background: rgba(44,44,44,0.75); border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: grid; grid-template-columns: minmax(0, 1fr) 400px minmax(0, 1fr); align-items: center; gap: 12px">
    <div style="display: flex; align-items: center; gap: 4px; min-width: 0">
      <button aria-label="Saved to Liked Songs" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #60cdff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
      <button aria-pressed="true" aria-label="Show translation" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: rgba(255,255,255,0.0605); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h7M5.5 2v1.5M3.5 3.5c.5 2.5 2.3 4.4 4.5 5.2M7.5 3.5c-.6 2.6-2.4 4.6-5 5.5M8.5 14l3-7 3 7M9.5 11.8h4" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Shuffle" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Previous" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3.5v9L5.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Pause" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 24px; background: #60cdff; color: #000; font: inherit"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button aria-label="Next" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Repeat" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4H13M11 2l2 2-2 2M13 9v1.5a1.5 1.5 0 0 1-1.5 1.5H3M5 14l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; width: 100%; font-size: 12px; color: #c5c5c5"><span style="width: 32px; text-align: right; font-variant-numeric: tabular-nums">1:59</span><div style="position: relative; flex-grow: 1; height: 18px; display: flex; align-items: center"><div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></div><div style="position: absolute; left: 0; width: 48%; height: 4px; border-radius: 2px; background: #60cdff"></div></div><span style="width: 32px; font-variant-numeric: tabular-nums">-2:08</span></div>
    </div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 2px">
      <button aria-label="Volume" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4h2.5L8 13V3L5 6zM10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Devices: This PC" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h8.5v6H2zM4.5 12.5h3.5M12 6h2.5v7H12z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="More" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const mode = (l, s) => ({ label: l, style: 'position: relative; height: 38px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 3px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const modes = [mode('Lyrics', true), mode('Visualizer', false), mode('Up next', false), mode('Artist', false)];
  const src = [['I don’t wanna be another one', -2], ['Paying for the things I never done', -1], ['Don’t let go, don’t let go', 0, 'Don’t let go,', ' don’t let go', 'Nu mă lăsa, nu mă lăsa'], ['To my love', 1], ['Can I get to your soul', 2]];
  const lines = src.map(s => {
    const d = s[1], active = d === 0;
    const a = Math.max(0.3, 1 - Math.abs(d) * 0.25);
    return { done: active ? s[2] : s[0], rest: active ? s[3] : '', doneColor: active ? '#ffffff' : 'rgba(255,255,255,' + a.toFixed(2) + ')',
      style: active ? 'color: rgba(255,255,255,0.45); font-size: 28px; line-height: 36px' : 'color: rgba(255,255,255,' + a.toFixed(2) + ')',
      second: active, secondText: s[4] || '' };
  });
  return { modes, lines };
}
}
</script>
</body>
</html>
