<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse category: Pop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|browse:Pop" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="browse" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 16px 36px 0 36px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
      <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 4px; height: 32px; font-size: 14px">
        <a href="#" style="color: #c5c5c5; padding: 4px 4px; border-radius: 4px">Browse</a>
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #9e9e9e"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="padding: 4px 4px; font-weight: 600">Pop</span>
      </nav>
      <div style="display: flex; align-items: flex-end; gap: 24px">
        <span style="width: 96px; height: 96px; border-radius: 8px; background: #E8115B; flex-shrink: 0"></span>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Genre</span>
          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">Pop</h1>
          <span style="font-size: 14px; line-height: 20px; color: #c5c5c5">Official playlists, new albums and the charts, updated weekly.</span>
        </div>
      </div>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Popular Pop playlists</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{playlists}}" as="c" hint-placeholder-count="6"><a href="#" style="display: flex; flex-direction: column; gap: 8px; color: #fff"><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span></span></a></sc-for>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Pop albums</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{albums}}" as="c" hint-placeholder-count="6"><a href="#" style="display: flex; flex-direction: column; gap: 8px; color: #fff"><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span></span></a></sc-for>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Explore more genres</h2>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{more}}" as="t" hint-placeholder-count="6"><a href="#" style="{{t.style}}">{{t.label}}</a></sc-for>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const card = (t, s, c) => ({ title: t, sub: s, art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + c });
  const playlists = [card('Today’s Top Hits', 'Spotify · 50 songs', '#6b2f3b'), card('Pop Rising', 'Spotify · 80 songs', '#2f5b6b'), card('Fresh Pop', 'Spotify · 60 songs', '#6b5b2f'), card('Teen Beats', 'Spotify · 75 songs', '#5b2f6b'), card('Pop Remix', 'Spotify · 50 songs', '#2f6b5b'), card('Soft Pop Hits', 'Spotify · 100 songs', '#6b4a2f')];
  const albums = [card('Armageddon', 'aespa · 2024', '#5b2f6b'), card('How Sweet', 'NewJeans · 2024', '#6b2f3b'), card('SUPER REAL ME', 'ILLIT · 2024', '#6b5b2f'), card('Sticky', 'KISS OF LIFE · 2024', '#2f6b5b'), card('Odyssey', 'HOME · 2014', '#2f5b6b'), card('Endless Summer', 'The Midnight · 2016', '#6b4a2f')];
  const more = [['K-pop', '#8D67AB'], ['Dance/Electronic', '#0D73EC'], ['Indie', '#148A08'], ['R&B', '#503750'], ['Hip-Hop', '#BA5D07'], ['Rock', '#E91429']].map(t => ({ label: t[0], style: 'display: flex; align-items: flex-end; height: 88px; padding: 12px; box-sizing: border-box; border-radius: 8px; background: ' + t[1] + '; color: #fff; font-size: 16px; line-height: 20px; font-weight: 600' }));
  return { playlists, albums, more };
}
}
</script>
</body>
</html>
