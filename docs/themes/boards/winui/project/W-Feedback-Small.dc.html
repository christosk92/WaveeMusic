<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a problem, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|settings:Settings" sel="1" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="settings" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Settings</h1>
      <div style="display: flex; align-items: center; gap: 2px; margin-right: -24px; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.0837)"><sc-for list="{{tabs}}" as="v" hint-placeholder-count="6"><button style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for></div>
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 16px; min-height: 68px; padding: 12px 16px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px">{{c.label}}</span><span style="font-size: 12px; color: #c5c5c5">{{c.desc}}</span></span><span style="{{c.ctl}}">{{c.value}}</span></div>
      </sc-for>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" hint-size="800px,72px"></dc-import>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: rgba(0,0,0,0.3)"></div>
  <div role="dialog" aria-label="Report a problem" style="position: absolute; left: 106px; top: 56px; width: 588px; height: 520px; box-sizing: border-box; border-radius: 8px; overflow: hidden; background: #2b2b2b; border: 1px solid rgba(117,117,117,0.4); box-shadow: 0 32px 64px rgba(0,0,0,0.4); display: flex; flex-direction: column">
    <div style="position: relative; flex-grow: 1; min-height: 0; padding: 24px 24px 0 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Report a problem</h1><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Opens a prefilled GitHub form in your browser and copies the redacted report to your clipboard. Nothing is sent until you click.</span></div>
      <div role="radiogroup" aria-label="Kind" style="display: flex; gap: 20px; font-size: 14px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><label style="display: flex; align-items: center; gap: 8px"><span style="{{k.ring}}"><span style="{{k.dot}}"></span></span>{{k.label}}</label></sc-for>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Title<span style="height: 32px; display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom: 2px solid #60cdff; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Queue pane keeps the old theme for one frame after switching</span></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">What happened<span style="height: 68px; padding: 6px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #c5c5c5; font-size: 14px; line-height: 20px">Switched to the Zune theme while the queue pane was open; the pane painted one frame in WinUI colours.</span></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Steps to reproduce<span style="height: 68px; padding: 6px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #9e9e9e; font-size: 14px; line-height: 20px">1. Open the queue pane 2. Settings › Appearance › Theme › Zune 3. Watch the pane</span></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Expected behaviour<span style="height: 48px; padding: 6px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #9e9e9e; font-size: 14px; line-height: 20px">Never paint a frame in the wrong theme.</span></label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; flex-shrink: 0"><span style="width: 20px; height: 20px; border-radius: 4px; background: #60cdff; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="#000" stroke-width="1.6"></path></svg></span>Include diagnostics and the last 200 log lines</label>
      <span aria-hidden="true" style="position: absolute; right: 3px; top: 8px; width: 2px; height: 260px; border-radius: 1px; background: rgba(255,255,255,0.5442)"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 24px; background: #202020; border-top: 1px solid rgba(255,255,255,0.0837)">
      <button style="height: 32px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px">Report on GitHub</button>
      <button style="height: 32px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Copy report</button>
      <button style="height: 32px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Not now</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; flex-shrink: 0; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 10px; right: 10px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const tabs = ['General', 'Appearance', 'Playback', 'Notifications', 'Storage & cache', 'Privacy & diagnostics'].map((l, i) => vs(l, i === 5));
  const btn = 'height: 32px; flex-shrink: 0; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); font-size: 14px';
  const cards = [{ label: 'Report a problem', desc: 'Opens a prefilled GitHub form', value: 'Report…', ctl: btn }, { label: 'Diagnostics', desc: 'Keep the last 200 log lines on this PC', value: 'On', ctl: 'font-size: 14px; color: #c5c5c5' }, { label: 'Crash reports', desc: 'Ask before sending after a crash', value: 'Ask', ctl: 'font-size: 14px; color: #c5c5c5' }];
  const kinds = ['Bug', 'Feature', 'Question', 'Idea'].map((l, i) => ({ label: l, ring: 'width: 20px; height: 20px; border-radius: 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (i === 0 ? 'background: #60cdff' : 'border: 1px solid rgba(255,255,255,0.5442)'), dot: i === 0 ? 'width: 8px; height: 8px; border-radius: 4px; background: #000' : 'display: none' }));
  return { tabs, cards, kinds };
}
}
</script>
</body>
</html>
