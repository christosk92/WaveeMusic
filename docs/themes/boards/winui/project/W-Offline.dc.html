<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline and errors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home" sel="0" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="home" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 16px 36px 0 36px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
      <div role="status" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 8px 0 16px; box-sizing: border-box; border-radius: 4px; background: #433519; border: 1px solid rgba(0,0,0,0.1)">
        <span style="width: 16px; height: 16px; border-radius: 8px; background: #fce100; color: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 700">!</span>
        <span style="font-size: 14px; font-weight: 600; white-space: nowrap">You’re offline</span>
        <span style="font-size: 14px; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Cached content still works; playback and edits resume when you’re back.</span>
        <button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Retry</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">Good evening, Chris</h1>
        <div style="display: flex; align-items: center; gap: 4px"><sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button style="{{f.style}}">{{f.label}}<span style="{{f.bar}}"></span></button></sc-for></div>
      </div>
      <section aria-label="Jump back in" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-direction: column"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Jump back in</h2><span style="font-size: 12px; color: #c5c5c5">Cached on this PC</span></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{recent}}" as="r" hint-placeholder-count="8">
            <a href="#" aria-disabled="{{r.dis}}" style="{{r.style}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span></a>
          </sc-for>
        </div>
      </section>
      <section aria-label="Made for you" style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Made for you</h2>
        <div style="height: 248px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
          <span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.0605); color: #c5c5c5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 6a9.5 9.5 0 0 1 13 0M3.5 8.4a6.5 6.5 0 0 1 9 0M5.8 10.7a3.2 3.2 0 0 1 4.4 0M8 13.2v.1M2 2l12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></span>
          <span style="font-size: 14px; line-height: 20px; font-weight: 600">Couldn’t load this section</span>
          <span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Check your connection and try again.</span>
          <button style="margin-top: 4px; height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Retry</button>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const fs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const facets = [fs('All', true), fs('Music', false), fs('Podcasts', false), fs('Audiobooks', false)];
  const rec = [['The Stereo Love Show', 'Album · Cached', '#3b5b7a', false], ['LoL Worlds Songs 2014–2026', 'Playlist · Cached', '#5b5b5b', false], ['Liked Songs', '1,284 songs · 412 cached', '#4a3b6b', false], ['K-Pop Duets (러블리 듀엣)', 'Playlist · Cached', '#6b3b4a', false], ['Arash', 'Artist · Not cached', '#4a3b2f', true, true], ['Coffee & Code', 'Podcast · Not cached', '#4a5b3b', true], ['Armageddon', 'Album · Not cached', '#5b2f6b', true], ['Daily Mix 1', 'Playlist · Not cached', '#5b3b6b', true]];
  const recent = rec.map(r => ({ title: r[0], sub: r[1], dis: r[3] ? 'true' : 'false',
    style: 'display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 12px 0 8px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1); color: #fff' + (r[3] ? '; opacity: 0.45' : ''),
    art: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: ' + (r[4] ? '24px' : '4px') + '; background: ' + r[2] }));
  return { facets, recent };
}
}
</script>
</body>
</html>
