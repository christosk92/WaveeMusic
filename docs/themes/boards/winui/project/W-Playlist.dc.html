<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playlist, owned</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">

        <div style="width: 168px; height: 168px; border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); flex-shrink: 0"><span style="background: #3b4a7a"></span><span style="background: #7a5a3b"></span><span style="background: #2f4a6b"></span><span style="background: #6b3b2f"></span></div>

          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">LoL Worlds Songs 2014–2026</h1>
          <div style="font-size: 14px; line-height: 20px; color: #9e9e9e">Add an optional description</div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #c5c5c5"><span style="width: 24px; height: 24px; border-radius: 12px; background: #6b5b4a"></span><span><a href="#">Luhkas</a> · 70 songs · 1,203 saves · 4 hr 32 min</span></div>

            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Shuffle</button>
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.8a2.2 2.2 0 1 1 0 4.4A2.2 2.2 0 0 1 6 2.8zM1.5 13c0-2.3 2-3.8 4.5-3.8s4.5 1.5 4.5 3.8M12.5 6v5M10 8.5h5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>Invite</button>

            <button aria-label="More" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
          </div>
        </div>
      </div>
      <div role="table" aria-label="Tracks" style="display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 8px; height: 40px">
          <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>Find</button>

          <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4.5 8h7M7 12.5h2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>Filter</button>
          <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Select</button>
        </div>
        <div role="row" style="display: grid; grid-template-columns: 48px minmax(0, 1.6fr) minmax(0, 1fr) 140px 40px 72px 40px; align-items: center; height: 36px; border-bottom: 1px solid rgba(255,255,255,0.0837); font-size: 12px; color: #c5c5c5">
          <span style="padding-left: 14px">#</span><span>Title</span><span>Album</span><button style="justify-self: start; border: 0; background: transparent; color: #c5c5c5; font: inherit; font-size: 12px; padding: 0">Date added</button><span></span><span style="text-align: right; padding-right: 8px">Time</span><span></span>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
          <div role="row" style="{{r.style}}">
            <span style="{{r.num}}">{{r.n}}</span>
            <span style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="{{r.title}}">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span></span></span>
            <span style="font-size: 14px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px">{{r.album}}</span>
            <span style="font-size: 14px; color: #c5c5c5">{{r.added}}</span>
            <span style="display: flex; align-items: center; justify-content: center; color: #fff">{{r.heart}}</span>
            <span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span>
            <span style="display: flex; align-items: center; justify-content: center; color: #fff">{{r.more}}</span>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>

</script>
</body>
</html>
