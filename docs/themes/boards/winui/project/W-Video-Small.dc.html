<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video mini player, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|album:The Stereo Love Show:#3b5b7a" sel="0" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="home" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 16px">
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; flex-grow: 1">Good evening, Chris</h1>
        <div style="display: flex; align-items: center; gap: 2px"><sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button style="{{f.style}}">{{f.label}}<span style="{{f.bar}}"></span></button></sc-for></div>
      </div>
      <section aria-label="Videos you might like" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Videos you might like</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{videos}}" as="v" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; color: #fff"><span style="{{v.art}}"><span style="position: absolute; right: 6px; bottom: 6px; height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(0,0,0,0.6)">{{v.len}}</span></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.sub}}</span></span></a></sc-for>
        </div>
      </section>
      <section aria-label="Made for you" style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Made for you</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; color: #fff"><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span></span></a></sc-for>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="video" hint-size="800px,72px"></dc-import>
  <div aria-label="Video mini player" style="position: absolute; right: 16px; bottom: 88px; width: 320px; height: 180px; border-radius: 8px; overflow: hidden; background: #0b1a26; box-shadow: 0 16px 32px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.0837)">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 4px; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0))">
      <button aria-label="Play in a separate window" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 8 8M6 3.5H2.5v10h10V10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Full screen" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Turn off video" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.6))">
      <button aria-label="Pause" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 16px; background: #60cdff; color: #000; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
      <button aria-label="Next" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442); margin: 0 6px"><div style="width: 48%; height: 4px; border-radius: 2px; background: #60cdff"></div></div>
      <button aria-label="More: previous, mute, where to play" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
    </div>
    <span aria-hidden="true" style="position: absolute; right: 2px; bottom: 2px; width: 10px; height: 10px; border-right: 2px solid rgba(255,255,255,0.5); border-bottom: 2px solid rgba(255,255,255,0.5)"></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const fs = (l, s) => ({ label: l, style: 'position: relative; height: 36px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const facets = [fs('All', true), fs('Music', false), fs('Podcasts', false), fs('Audiobooks', false)];
  const videos = [['Stereo Love (Official Video)', 'Edward Maya, Vika Jigulina', '4:07', '#0b1a26'], ['Supernova', 'aespa · Music video', '3:02', '#2b1a33'], ['Broken Angel', 'Arash · Music video', '3:14', '#2a1f14'], ['Days of Thunder', 'The Midnight · Visualizer', '4:37', '#33200f']].map(v => ({ title: v[0], sub: v[1], len: v[2], art: 'position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; background: ' + v[3] }));
  const cards = [['Daily Mix 1', 'IVE, Red Velvet, IU and more', '#5b3b6b'], ['Daily Mix 2', 'aespa, ILLIT, NewJeans and more', '#3b5b6b'], ['Discover Weekly', 'Your weekly mixtape of fresh music', '#2f6b4a'], ['Release Radar', 'New music from artists you follow', '#6b4a2f']].map(c => ({ title: c[0], sub: c[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + c[2] }));
  return { facets, videos, cards };
}
}
</script>
</body>
</html>
