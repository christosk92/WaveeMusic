<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Album, Compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|album:The Stereo Love Show:#3b5b7a|artist:Arash:#4a3b2f" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <div style="width: 160px; height: 160px; border-radius: 8px; background: #3b5b7a; flex-shrink: 0; box-shadow: 0 8px 16px rgba(0,0,0,0.26)"></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center">
        <div style="font-size: 12px; line-height: 16px; color: #c5c5c5">Album · 2012 · Cat Music</div>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">The Stereo Love Show</h1>
        <div style="font-size: 14px; line-height: 20px; color: #c5c5c5"><a href="#">Edward Maya</a>, <a href="#">Vika Jigulina</a></div>
        <div style="font-size: 12px; line-height: 16px; color: #9e9e9e">15 songs · 57 min</div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <div style="display: flex; height: 40px; border-radius: 4px; overflow: hidden; background: #60cdff; color: #000; font-size: 14px"><button style="display: flex; align-items: center; gap: 8px; padding: 0 20px; border: 0; background: transparent; color: #000; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>Pause</button><span style="width: 1px; background: rgba(0,0,0,0.2)"></span><button aria-label="More play options" style="width: 40px; border: 0; background: transparent; color: #000; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
        <button aria-label="Shuffle" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Save to library" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
        <button aria-label="More: share, go to artist, find in album, sort" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      </div>
    </div>
    <div role="table" aria-label="Tracks" style="display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.0837); padding-top: 4px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <div role="row" style="{{r.style}}">
          <span style="{{r.num}}">{{r.n}}</span>
          <span style="display: flex; flex-direction: column; min-width: 0">
            <span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="{{r.title}}">{{r.t}}</span><span style="{{r.explicit}}">E</span></span>
            <span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
          </span>
          <span style="{{r.heart}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></span>
          <span style="{{r.timeStyle}}">{{r.time}}</span>
          <button aria-label="More for {{r.t}}" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #c5c5c5; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
        </div>
      </sc-for>
    </div>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const data = [['Stereo Love', '598.9M', '4:07', { playing: true, liked: true }], ['This Is My Life', '62.9M', '3:50', { explicit: true }], ['Mono in Love', '5.1M', '3:17', {}], ['Happy for You', '2.1M', '3:51', {}], ['Friends Forever', '1.3M', '3:35', {}], ['Twinheart', '780.7K', '3:59', {}], ['Nostalgy', '603.4K', '3:30', {}], ['Stay Longer', '602.9K', '3:40', {}], ['Back Home', '1.6M', '3:37', { unavailable: true }]];
  const rows = data.map((d, i) => {
    const f = d[3];
    return { n: f.playing ? '▮▮▮' : String(i + 1), t: d[0], time: f.unavailable ? '' : d[2],
      sub: f.unavailable ? 'Unavailable in your country' : ((i === 0 ? 'Edward Maya, Vika Jigulina' : (i === 2 ? 'Edward Maya, Andreea Banica' : 'Edward Maya')) + ' · ' + d[1] + ' plays'),
      style: 'display: grid; grid-template-columns: 32px minmax(0, 1fr) auto 40px 40px; align-items: center; column-gap: 4px; height: 56px; border-radius: 4px; ' + (f.unavailable ? 'opacity: 0.45;' : ''),
      num: 'padding-left: 4px; font-variant-numeric: tabular-nums; font-size: ' + (f.playing ? '10px' : '14px') + '; color: ' + (f.playing ? '#60cdff' : '#9e9e9e'),
      title: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (f.playing ? '#99ebff' : '#ffffff'),
      explicit: (f.explicit ? 'display: inline-flex' : 'display: none') + '; width: 16px; height: 16px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 2px; font-size: 10px; font-weight: 600; background: #c5c5c5; color: #000',
      heart: (f.liked ? 'display: flex' : 'display: none') + '; width: 24px; justify-content: center; color: #ffffff',
      timeStyle: 'text-align: right; font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums' };
  });
  return { rows };
}
}
</script>
</body>
</html>
