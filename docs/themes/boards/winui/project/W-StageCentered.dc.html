      <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 12px; color: #c5c5c5">Playing from <a href="#">The Stereo Love Show</a></span><span style="display: flex; gap: 6px"><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5">Synced lyrics</span><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5">128 BPM</span></span></span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const mode = (l, s) => ({ label: l, style: 'position: relative; height: 38px; padding: 0 14px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 14px; right: 14px; bottom: 3px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const modes = [mode('Lyrics', true), mode('Visualizer', false), mode('Up next', false), mode('Artist', false)];
  const cx = 720, cy = 336, r0 = 196, n = 72;
  const ring = Array.from({ length: n }, (_, i) => {
    const h = Math.round(12 + 76 * Math.abs(Math.sin(i * 0.52) * Math.cos(i * 0.13 + 0.4)));
    return { style: 'position: absolute; left: ' + (cx - 2) + 'px; top: ' + (cy - r0 - h) + 'px; width: 4px; height: ' + h + 'px; border-radius: 2px; transform-origin: 2px ' + (r0 + h) + 'px; transform: rotate(' + (i * 360 / n) + 'deg); background: ' + (i % 2 === 0 ? 'rgba(96,205,255,0.85)' : 'rgba(153,235,255,0.5)') };
  });
  return { modes, ring };
}
}
</script>
