<helmet>

<div style="position: relative; width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">

    </div>

    <span aria-hidden="true" style="position: absolute; left: 184px; top: 8px; width: 32px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span>
    <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between">

        <sc-for list="{{modes}}" as="m" hint-placeholder-count="4"><button role="tab" aria-label="{{m.label}}" aria-selected="{{m.sel}}" style="{{m.style}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{m.d}}" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="{{m.bar}}"></span></button></sc-for>
      </div>
      <button aria-label="More" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
    </div>

    <div style="position: relative; height: 320px; flex-shrink: 0; margin-top: 20px; display: flex; justify-content: center">
      <div aria-hidden="true" style="position: absolute; left: -16px; right: -16px; top: 40px; bottom: 40px; display: flex; align-items: center; gap: 3px; opacity: 0.55">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="40"><span style="{{b.style}}"></span></sc-for>
      </div>
      <span role="img" aria-label="The Stereo Love Show cover" style="position: relative; width: 320px; height: 320px; border-radius: 8px; background: #3b5b7a; box-shadow: 0 16px 32px rgba(0,0,0,0.4)"></span>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 20px">
      <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Stereo Love</span><span style="font-size: 14px; line-height: 20px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><a href="#">Edward Maya</a>, <a href="#">Vika Jigulina</a></span></span>
      <button aria-label="Saved to Liked Songs" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #60cdff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
    </div>
    <div style="margin-top: 8px; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: #ffffff">Don’t let go,</span><span style="color: #9e9e9e"> don’t let go</span></div>

    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 20px">
      <div style="position: relative; height: 18px; display: flex; align-items: center"><div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442)"></div><div style="position: absolute; left: 0; width: 48%; height: 4px; border-radius: 2px; background: #60cdff"></div><span style="position: absolute; left: calc(48% - 9px); width: 18px; height: 18px; border-radius: 9px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.0698); background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 12px; height: 12px; border-radius: 6px; background: #60cdff"></span></span></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: #c5c5c5; font-variant-numeric: tabular-nums"><span>1:59</span><span>-2:08</span></div>
    </div>

    <div style="height: 96px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <button aria-label="Shuffle" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Previous" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3.5v9L5.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Pause" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 32px; background: #60cdff; color: #000; font: inherit"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
      <button aria-label="Next" style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Repeat" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 7V5.5A1.5 1.5 0 0 1 4.5 4H13M11 2l2 2-2 2M13 9v1.5a1.5 1.5 0 0 1-1.5 1.5H3M5 14l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>

    <span style="flex-grow: 1"></span>
    <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 4px">
      <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.0605); color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3h13v8h-13zM6 13.5h4M8 11v2.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg>This PC<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <span style="flex-grow: 1; min-width: 0; font-size: 12px; line-height: 16px; color: #c5c5c5; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">from <a href="#">The Stereo Love Show</a></span>
      <button aria-label="Share" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M5 5.5l3-3 3 3M3.5 9v3.5h9V9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
  </section>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const icon = { Lyrics: 'M3 9.5V7a3 3 0 0 1 3-3M3 9.5h3v3H3zM10 9.5V7a3 3 0 0 1 3-3M10 9.5h3v3h-3z', Visualizer: 'M2.5 9v4M5.5 6v7M8.5 3v10M11.5 6v7M14 9v4', 'Up next': 'M2.5 4h11M2.5 8h7M2.5 12h7M11.5 9.5v4.5l3.5-2.25z', Artist: 'M8 2.5a3 3 0 1 1 0 6 3 3 0 0 1 0-6zM2.5 14c.8-2.6 3-4 5.5-4s4.7 1.4 5.5 4' };
  const mode = (l, s) => ({ label: l, d: icon[l], sel: s ? 'true' : 'false', style: 'position: relative; width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; font: inherit; color: ' + (s ? '#ffffff' : '#c5c5c5') + '; background: ' + (s ? 'rgba(255,255,255,0.0837)' : 'transparent'), bar: s ? 'position: absolute; left: 14px; right: 14px; bottom: 3px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const modes = [mode('Lyrics', false), mode('Visualizer', true), mode('Up next', false), mode('Artist', false)];
  const bars = Array.from({ length: 40 }, (_, i) => { const v = Math.round(20 + 200 * Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11))); return { style: 'flex-grow: 1; height: ' + v + 'px; border-radius: 3px; background: ' + (i % 2 === 0 ? 'rgba(96,205,255,0.6)' : 'rgba(59,91,122,0.9)') }; });
  return { modes, bars };
}
}
</script>
