<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Album, Fluent-corrected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="height: 48px; flex-shrink: 0; display: grid; grid-template-columns: 1fr 560px 1fr; align-items: center">
    <div style="display: flex; align-items: center; height: 48px">
      <button aria-label="Back" style="width: 40px; height: 36px; margin-left: 4px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8H2.5M7 3.5L2.5 8 7 12.5" fill="none" stroke="#fff" stroke-width="1"></path></svg></button>
      <button aria-label="Toggle navigation" style="width: 40px; height: 36px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="#fff" stroke-width="1"></path></svg></button>
      <span style="width: 16px; height: 16px; margin-left: 8px; border-radius: 4px; background: #60cdff"></span>
      <span style="font-size: 12px; margin-left: 16px">Wavee</span>
    </div>
    <label style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; border-radius: 4px; background: rgba(255,255,255,0.061); border: 1px solid rgba(255,255,255,0.07); border-bottom-color: rgba(255,255,255,0.14); font-size: 14px; color: #9e9e9e">
      <span style="flex-grow: 1">Search</span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="9.5" cy="6.5" r="4.5" fill="none" stroke="#c5c5c5" stroke-width="1"></circle><path d="M6.3 9.7L2 14" stroke="#c5c5c5" stroke-width="1"></path></svg>
    </label>
    <div style="display: flex; justify-content: flex-end; align-items: center; height: 48px">
      <span style="width: 32px; height: 32px; border-radius: 16px; background: #6b5b4a; margin-right: 12px"></span>
      <span style="width: 46px; text-align: center; font-size: 12px; color: #c5c5c5">—</span>
      <span style="width: 46px; text-align: center; font-size: 12px; color: #c5c5c5">▢</span>
      <span style="width: 46px; text-align: center; font-size: 12px; color: #c5c5c5">✕</span>
    </div>
  </div>
  <div style="flex-grow: 1; min-height: 0; display: flex">
    <nav aria-label="Library" style="width: 320px; flex-shrink: 0; box-sizing: border-box; padding: 4px 0; display: flex; flex-direction: column">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="14">
        <sc-if value="{{n.header}}" hint-placeholder-val="{{ false }}">
          <div style="height: 40px; display: flex; align-items: flex-end; padding: 0 0 8px 16px; box-sizing: border-box; font-size: 14px; font-weight: 600">{{n.label}}</div>
        </sc-if>
        <sc-if value="{{n.item}}" hint-placeholder-val="{{ true }}">
          <a href="#" style="{{n.style}}">
            <span style="{{n.pillStyle}}"></span>
            <span style="{{n.iconStyle}}"></span>
            <span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.label}}</span>
          </a>
        </sc-if>
      </sc-for>
    </nav>
    <main style="flex-grow: 1; min-width: 0; background: #282828; border-top: 1px solid rgba(255,255,255,0.06); border-left: 1px solid rgba(255,255,255,0.06); border-top-left-radius: 8px; padding: 24px 36px 0 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
      <div style="display: flex; gap: 24px; align-items: flex-end">
        <div style="width: 168px; height: 168px; border-radius: 8px; background: #3b5b7a; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <div style="font-size: 12px; color: #c5c5c5">Album · 2012</div>
          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">The Stereo Love Show</h1>
          <div style="font-size: 14px; color: #c5c5c5"><a href="#">Edward Maya</a> and 2 more · 15 songs · 57 min</div>
          <div style="display: flex; gap: 8px; align-items: center; padding-top: 12px">
            <div style="display: flex; height: 32px; border-radius: 4px; overflow: hidden; background: #60cdff; color: #000; font-size: 14px">
              <button style="display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: transparent; color: #000; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="none" stroke="#000" stroke-width="1" stroke-linejoin="round"></path></svg>Play</button>
              <span style="width: 1px; background: rgba(0,0,0,0.2)"></span>
              <button aria-label="More play options" style="width: 32px; border: 0; background: transparent; color: #000; font: inherit">⌄</button>
            </div>
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.061); border: 1px solid rgba(255,255,255,0.07); border-bottom-color: rgba(255,255,255,0.12); color: #fff; font: inherit; font-size: 14px">Shuffle</button>
            <button aria-label="Save to library" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 15px">♡</button>
            <button aria-label="Share" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">↗</button>
            <button aria-label="More" style="width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">⋯</button>
          </div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px; height: 40px; border-bottom: 1px solid rgba(255,255,255,0.08)">
        <span style="font-size: 12px; color: #9e9e9e; width: 48px">#</span>
        <span style="font-size: 12px; color: #9e9e9e; flex-grow: 1">Title</span>
        <span style="font-size: 12px; color: #9e9e9e; width: 100px; text-align: right">Plays</span>
        <span style="font-size: 12px; color: #9e9e9e; width: 80px; text-align: right">Duration</span>
        <span style="width: 92px"></span>
        <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Filter</button>
        <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Album order ⌄</button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
          <div style="{{r.rowStyle}}">
            <span style="{{r.pillStyle}}"></span>
            <span style="{{r.numStyle}}">{{r.num}}</span>
            <span style="{{r.titleStyle}}">{{r.title}}</span>
            <span style="width: 100px; text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.plays}}</span>
            <span style="width: 80px; text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span>
            <span style="width: 40px; text-align: center; font-size: 15px; color: #ffffff">{{r.heart}}</span>
            <span style="width: 40px; text-align: center; font-size: 14px; color: #ffffff">{{r.more}}</span>
            <span style="width: 32px; text-align: center; font-size: 12px; color: #c5c5c5">{{r.versions}}</span>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
  <div style="height: 88px; flex-shrink: 0; display: grid; grid-template-columns: 1fr 560px 1fr; align-items: center; padding: 0 16px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 12px; min-width: 0">
      <span style="width: 56px; height: 56px; border-radius: 4px; background: #3b5b7a; flex-shrink: 0"></span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 14px; font-weight: 600">Stereo Love</span>
        <span style="font-size: 12px; color: #c5c5c5">Edward Maya, Vika Jigulina</span>
        <span style="font-size: 12px; color: #9e9e9e">▭ Playing on iPhone</span>
      </div>
      <button aria-label="Liked" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 16px">♥</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; align-items: center">
      <div style="display: flex; align-items: center; gap: 8px">
        <sc-for list="{{transport}}" as="t" hint-placeholder-count="5">
          <button aria-label="{{t.label}}" style="{{t.style}}">{{t.glyph}}</button>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; width: 100%; font-size: 12px; color: #c5c5c5">
        <span>1:59</span>
        <div style="position: relative; flex-grow: 1; height: 18px; display: flex; align-items: center">
          <div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.54)"></div>
          <div style="position: absolute; left: 0; width: 48%; height: 4px; border-radius: 2px; background: #60cdff"></div>
          <div style="position: absolute; left: calc(48% - 9px); width: 18px; height: 18px; border-radius: 9px; background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #60cdff"></span></div>
        </div>
        <span>4:07</span>
      </div>
    </div>
    <div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px">
      <sc-for list="{{right}}" as="b" hint-placeholder-count="4">
        <button aria-label="{{b.label}}" style="{{b.style}}">{{b.glyph}}</button>
      </sc-for>
      <div style="position: relative; width: 96px; height: 18px; display: flex; align-items: center">
        <div style="width: 100%; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.54)"></div>
        <div style="position: absolute; left: 0; width: 70%; height: 4px; border-radius: 2px; background: #60cdff"></div>
        <div style="position: absolute; left: calc(70% - 9px); width: 18px; height: 18px; border-radius: 9px; background: #454545; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #60cdff"></span></div>
      </div>
      <button aria-label="More" style="width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit">⋯</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
  const navItem = (label, sel) => ({
    item: true, header: false, label,
    style: 'position: relative; height: 36px; margin: 2px 4px; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 16px; border-radius: 4px; font-size: 14px; color: #ffffff; ' + (sel ? 'background: rgba(255,255,255,0.061)' : ''),
    pillStyle: sel ? 'position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: #60cdff' : 'display: none',
    iconStyle: 'width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; border: 1px solid #c5c5c5; border-radius: 3px',
  });
  const head = (label) => ({ item: false, header: true, label });
  const nav = [
    navItem('Home', false), head('Pinned'), navItem('Your Episodes', false), navItem('90s rock permanent wave', false),
    head('Library'), navItem('Liked Songs', false), navItem('Albums', true), navItem('Artists', false), navItem('Podcasts', false), navItem('Audiobooks', false),
    head('Playlists'), navItem('K-Pop Duets (러블리 듀엣)', false), navItem('LoL Worlds Songs 2014–2026', false), navItem('New folder', false),
  ];
  const data = [['Stereo Love', '598.9M', '4:07', true, true], ['This Is My Life', '62.9M', '3:50', false, true], ['Mono in Love', '5.1M', '3:17', false, true], ['Happy for You', '2.1M', '3:51', false, false], ['Friends Forever', '1.3M', '3:35', false, false], ['Twinheart', '780.7K', '3:59', false, false], ['Nostalgy', '603.4K', '3:30', false, false], ['Stay Longer', '602.9K', '3:40', false, false], ['Back Home', '1.6M', '3:37', false, false], ['Close Your Eyes', '1M', '4:30', false, false]];
  const rows = data.map((d, i) => {
    const playing = i === 0, hover = i === 3, liked = i === 0;
    return {
      num: playing ? '▮▮▮' : String(i + 1), title: d[0], plays: d[1], time: d[2],
      heart: liked ? '♥' : (hover ? '♡' : ''), more: hover ? '⋯' : '', versions: d[4] ? '⌄' : '',
      rowStyle: 'position: relative; height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 0 0 0; border-radius: 4px; ' + (hover ? 'background: rgba(255,255,255,0.061)' : ''),
      pillStyle: 'display: none',
      numStyle: 'width: 48px; padding-left: 12px; box-sizing: border-box; font-size: ' + (playing ? '10px' : '14px') + '; color: ' + (playing ? '#60cdff' : '#9e9e9e') + '; font-variant-numeric: tabular-nums',
      titleStyle: 'flex-grow: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (playing ? '#99ebff' : '#ffffff'),
    };
  });
  const sub = 'width: 40px; height: 40px; border: 0; border-radius: 4px; background: transparent; color: #ffffff; font: inherit; font-size: 15px';
  const transport = [
    { label: 'Shuffle', glyph: '⇄', style: sub }, { label: 'Previous', glyph: '⏮', style: sub },
    { label: 'Pause', glyph: '❚❚', style: 'width: 40px; height: 40px; border: 0; border-radius: 20px; background: #60cdff; color: #000; font: inherit; font-size: 12px' },
    { label: 'Next', glyph: '⏭', style: sub }, { label: 'Repeat', glyph: '↻', style: sub },
  ];
  const right = [
    { label: 'Lyrics', glyph: '❝', style: sub }, { label: 'Queue', glyph: '☰', style: sub + '; background: rgba(255,255,255,0.061)' },
    { label: 'Devices', glyph: '▭', style: sub }, { label: 'Volume', glyph: '🔉︎', style: sub },
  ];
  return { nav, rows, transport, right };
}
}
</script>
</body>
</html>
