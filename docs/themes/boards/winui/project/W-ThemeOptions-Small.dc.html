<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WinUI theme options: Small</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|settings:Settings" sel="1" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="settings" height="440" hint-size="48px,440px"></dc-import>
    <main style="position: relative; flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600"><a href="#" style="color: #c5c5c5">Settings</a><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #c5c5c5"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Appearance</span></nav>
      <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
        <span style="height: 24px; display: flex; align-items: center; font-size: 12px; color: #c5c5c5">WinUI theme options</span>
        <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 16px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
            <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px">{{o.label}}</span><span style="font-size: 12px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.desc}}</span></span>
            <sc-if value="{{o.combo}}" hint-placeholder-val="{{ true }}"><span style="height: 32px; width: 160px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); font-size: 14px">{{o.value}}<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if>
            <sc-if value="{{o.toggle}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 12px; flex-shrink: 0; font-size: 14px"><span style="{{o.track}}"><span style="{{o.knob}}"></span></span><span style="width: 28px">{{o.value}}</span></span></sc-if>
          </div>
        </sc-for>
      </div>
      <div role="listbox" aria-label="Navigation pane" style="position: absolute; top: 36px; right: 36px; width: 312px; box-sizing: border-box; padding: 4px; display: flex; flex-direction: column; gap: 0; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26)">
        <sc-for list="{{navOpts}}" as="n" hint-placeholder-count="3">
          <button role="option" aria-selected="{{n.sel}}" style="{{n.style}}"><span style="{{n.pill}}"></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left"><span style="font-size: 14px">{{n.label}}</span><span style="font-size: 12px; color: #c5c5c5">{{n.desc}}</span></span></button>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const combo = (l, d, v) => ({ label: l, desc: d, value: v, combo: true, toggle: false });
  const tog = (l, d, on) => ({ label: l, desc: d, value: on ? 'On' : 'Off', combo: false, toggle: true, track: 'width: 40px; height: 20px; border-radius: 10px; position: relative; display: block; box-sizing: border-box; ' + (on ? 'background: #60cdff' : 'border: 1px solid rgba(255,255,255,0.5442)'), knob: 'position: absolute; top: ' + (on ? '4px' : '3px') + '; left: ' + (on ? '24px' : '3px') + '; width: 12px; height: 12px; border-radius: 6px; background: ' + (on ? '#000' : '#c5c5c5') });
  const opts = [combo('Backdrop', 'The window material behind the title bar, pane and player', 'Mica'), combo('Navigation pane', 'Expanded, compact rail, or automatic by window width', 'Automatic'), combo('Density', 'Row and pane item height', 'Default'), tog('Tabs in the title bar', 'Off hides the strip; open tabs stay and come back when it’s on', true), tog('Artwork in track rows', 'Shows a 40 px cover on playlist and liked rows', true), tog('Use the Windows accent colour', 'Off uses Wavee’s own blue', true)];
  const nav = [['Expanded', 'The 280 pane at every width'], ['Compact', 'The 48 rail; the hamburger opens the pane'], ['Automatic', 'Now the rail: this window is 800 wide']];
  const navOpts = nav.map((n, i) => { const s = i === 2; return { label: n[0], desc: n[1], sel: s ? 'true' : 'false',
    style: 'position: relative; height: 52px; display: flex; align-items: center; padding: 0 12px; border: 0; border-radius: 4px; color: #fff; font: inherit; ' + (s ? 'background: rgba(255,255,255,0.0605)' : 'background: transparent'),
    pill: s ? 'position: absolute; left: 0; top: 18px; width: 3px; height: 16px; border-radius: 2px; background: #60cdff' : 'display: none' }; });
  return { opts, navOpts };
}
}
</script>
</body>
</html>
