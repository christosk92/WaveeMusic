<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse category Pop, Compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|browse:Pop" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; gap: 16px; align-items: flex-start; flex-shrink: 0">
      <span style="width: 80px; height: 80px; border-radius: 8px; background: #E8115B; flex-shrink: 0"></span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: #c5c5c5">
          <a href="#" style="color: #c5c5c5">Browse</a>
          <svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span>Genre</span>
        </nav>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Pop</h1>
        <span style="font-size: 14px; line-height: 20px; color: #c5c5c5">Official playlists, new albums and the charts, updated weekly.</span>
      </div>
    </div>
    <section style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 12px"><h2 style="margin: 0; flex-grow: 1; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Popular Pop playlists</h2><a href="#" style="font-size: 14px; line-height: 40px">See all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{playlists}}" as="c" hint-placeholder-count="2"><a href="#" style="display: flex; flex-direction: column; gap: 8px; color: #fff; min-width: 0"><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span></span></a></sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 12px"><h2 style="margin: 0; flex-grow: 1; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Pop albums</h2><a href="#" style="font-size: 14px; line-height: 40px">See all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{albums}}" as="c" hint-placeholder-count="2"><a href="#" style="display: flex; flex-direction: column; gap: 8px; color: #fff; min-width: 0"><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span></span></a></sc-for>
      </div>
    </section>
    <section style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Explore more genres</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{more}}" as="t" hint-placeholder-count="2"><a href="#" style="{{t.style}}">{{t.label}}</a></sc-for>
      </div>
    </section>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const card = (t, s, c) => ({ title: t, sub: s, art: 'display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + c });
  const playlists = [card('Today’s Top Hits', 'Spotify · 50 songs', '#6b2f3b'), card('Pop Rising', 'Spotify · 80 songs', '#2f5b6b')];
  const albums = [card('Armageddon', 'aespa · 2024', '#5b2f6b'), card('How Sweet', 'NewJeans · 2024', '#6b2f3b')];
  const more = [['K-pop', '#8D67AB'], ['Dance/Electronic', '#0D73EC']].map(t => ({ label: t[0], style: 'display: flex; align-items: flex-end; height: 72px; padding: 12px; box-sizing: border-box; border-radius: 8px; background: ' + t[1] + '; color: #fff; font-size: 16px; line-height: 20px; font-weight: 600' }));
  return { playlists, albums, more };
}
}
</script>
</body>
</html>
