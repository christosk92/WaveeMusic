<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WinUI theme options: Compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabsOn="{{off}}" tabs="home:Home|settings:Settings" sel="1" hint-size="400px,48px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600"><a href="#" style="color: #c5c5c5">Settings</a><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #c5c5c5"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Appearance</span></nav>
    <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
      <span style="font-size: 12px; color: #c5c5c5; padding: 4px 0">WinUI theme options</span>
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; line-height: 20px">{{o.label}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">{{o.desc}}</span></span>
          <sc-if value="{{o.combo}}" hint-placeholder-val="{{ true }}"><span style="height: 40px; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); font-size: 14px">{{o.value}}<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if>
          <sc-if value="{{o.toggle}}" hint-placeholder-val="{{ false }}"><span style="height: 40px; display: flex; align-items: center; gap: 12px; font-size: 14px"><span style="{{o.track}}"><span style="{{o.knob}}"></span></span><span>{{o.value}}</span></span></sc-if>
          <sc-if value="{{o.hasNote}}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 8px; font-size: 12px; line-height: 16px; color: #c5c5c5"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px; color: #99ebff"><path d="M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM8 7v4.5M8 4.6v.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg><span>{{o.note}}</span></span></sc-if>
        </div>
      </sc-for>
    </div>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const combo = (l, d, v, note) => ({ label: l, desc: d, value: v, combo: true, toggle: false, hasNote: !!note, note: note || '' });
  const tog = (l, d, on, note) => ({ label: l, desc: d, value: on ? 'On' : 'Off', combo: false, toggle: true, hasNote: !!note, note: note || '', track: 'width: 40px; height: 20px; border-radius: 10px; position: relative; display: block; box-sizing: border-box; ' + (on ? 'background: #60cdff' : 'border: 1px solid rgba(255,255,255,0.5442)'), knob: 'position: absolute; top: ' + (on ? '4px' : '3px') + '; left: ' + (on ? '24px' : '3px') + '; width: 12px; height: 12px; border-radius: 6px; background: ' + (on ? '#000' : '#c5c5c5') });
  const opts = [
    combo('Backdrop', 'The window material behind the title bar, pane and player', 'Mica'),
    combo('Navigation pane', 'Expanded, compact rail, or automatic by window width', 'Automatic', 'Now minimal: the window is 400 wide. The rail returns from 641, the full pane from 1008.'),
    combo('Density', 'Row and pane item height', 'Default'),
    tog('Tabs in the title bar', 'Off hides the strip; open tabs stay and come back when it’s on', false, '2 tabs are still open (Home, Settings). Turn this on to bring the strip back with both.'),
    tog('Artwork in track rows', 'Shows a 40 px cover on playlist and liked rows', true),
    tog('Use the Windows accent colour', 'Off uses Wavee’s own blue', true)
  ];
  return { opts, off: false };
}
}
</script>
</body>
</html>
