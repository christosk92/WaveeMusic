          <div style="display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)"><span style="width: 48px; height: 48px; border-radius: 4px; background: #3b5b7a"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #99ebff">Stereo Love</span><span style="font-size: 12px; color: #c5c5c5">Edward Maya, Vika Jigulina</span></span></div>
          <div style="display: flex; align-items: center; height: 36px; padding: 0 4px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">Next in queue</span><a href="#" style="font-size: 12px">Clear</a></div>

          <div style="display: flex; align-items: center; height: 36px; padding: 0 4px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">Next up</span><span style="font-size: 12px; color: #c5c5c5">13 more</span></div>
          <sc-for list="{{next}}" as="q" hint-placeholder-count="8"><div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 4px 0 8px; border-radius: 4px"><span style="{{q.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.t}}</span><span style="font-size: 12px; color: #c5c5c5">{{q.a}}</span></span><span style="font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{q.d}}</span></div></sc-for>
          <div style="display: flex; align-items: center; gap: 12px; padding: 8px 4px; border-top: 1px solid rgba(255,255,255,0.0837)"><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 14px; font-weight: 600">Autoplay</span><span style="font-size: 12px; color: #c5c5c5">Similar music will keep playing</span></span><span style="width: 40px; height: 20px; border-radius: 10px; background: #60cdff; position: relative; display: block; flex-shrink: 0"><span style="position: absolute; top: 4px; left: 24px; width: 12px; height: 12px; border-radius: 6px; background: #000"></span></span></div>

      </aside>
      <aside aria-label="Lyrics" style="width: 340px; flex-shrink: 0; border-left: 1px solid rgba(255,255,255,0.0837); display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.0837)">

          <button style="height: 40px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #c5c5c5">Friends</button>
          <span style="flex-grow: 1"></span>
          <button aria-label="Close lyrics" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
        </div>
        <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px">
          <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600">Stereo Love</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Synced · word by word</span></span>
          <button aria-pressed="true" style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.0605); color: #fff; font: inherit; font-size: 12px">Translate</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 0 24px">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="9"><div style="{{l.style}}"><span style="{{l.doneStyle}}">{{l.done}}</span><span style="color: #9e9e9e">{{l.rest}}</span><sc-if value="{{l.second}}" hint-placeholder-val="{{ false }}"><span style="display: block; margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 400; color: #c5c5c5">{{l.secondText}}</span></sc-if></div></sc-for>
        </div>
      </aside>
    </div>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="huge" width="2560" variant="music" pane="lyrics,queue" hint-size="2560px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {

  const al = [['FINE', 'Jukjae · 2017', '#7a6a5a'], ['ARE YOU EVER COMING BACK?', 'vaultboy · 2026', '#5a6a7a'], ['STARTING OVER', 'Yu Takahashi · 2018', '#4a4a4a'], ['WLUWD', 'Tristam · 2021', '#3b4a7a'], ['2024 World Championship Theme', 'League of Legends · 2024', '#7a5a3b'], ['Arcane League of Legends: Season 2', 'Arcane · 2024', '#2f4a6b'], ['Sacrifice', 'League of Legends · 2025', '#6b3b2f'], ['The Stereo Love Show', 'Edward Maya · 2012', '#3b5b7a', true], ['Superman', 'Arash · 2014', '#6b8f8a'], ['Armageddon', 'aespa · 2024', '#5b2f6b'], ['Odyssey', 'HOME · 2014', '#2f5b6b'], ['Endless Summer', 'The Midnight · 2016', '#6b4a2f'], ['Donya', 'Arash · 2008', '#5b4a3b'], ['SUPER REAL ME', 'ILLIT · 2024', '#6b5b2f'], ['Whiplash', 'aespa · 2024', '#4a2f5b'], ['Days of Thunder', 'The Midnight · 2014', '#7a4a2f'], ['I’VE MINE', 'IVE · 2023', '#6b3b4a'], ['Arash', 'Arash · 2005', '#3b4a5b'], ['How Sweet', 'NewJeans · 2024', '#6b2f3b'], ['Sticky', 'KISS OF LIFE · 2024', '#2f6b5b'], ['From Zero', 'Linkin Park · 2024', '#5b4a3b']];
  const albums = al.map(a => ({ t: a[0], s: a[1], art: 'display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + a[2], title: 'font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (a[3] ? '#99ebff' : '#ffffff') }));
  const q = (t, a, c, d) => ({ t, a, d, art: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; background: ' + c });
  const queued = [q('Supernova', 'aespa', '#5b2f6b', '2:58'), q('Days of Thunder', 'The Midnight', '#6b4a2f', '4:37')];
  const next = [q('This Is My Life', 'Edward Maya', '#3b5b7a', '3:50'), q('Mono in Love', 'Edward Maya, Andreea Banica', '#3b5b7a', '3:17'), q('Happy for You', 'Edward Maya', '#3b5b7a', '3:51'), q('Friends Forever', 'Edward Maya', '#3b5b7a', '3:35'), q('Twinheart', 'Edward Maya', '#3b5b7a', '3:59'), q('Nostalgy', 'Edward Maya', '#3b5b7a', '3:30'), q('Stay Longer', 'Edward Maya', '#3b5b7a', '3:40'), q('Close Your Eyes', 'Edward Maya', '#3b5b7a', '4:30')];
  const src = [['When you gonna stop breaking my heart', -3], ['I don’t wanna be another one', -2], ['Paying for the things I never done', -1], ['Don’t let go,', 0, ' don’t let go', 'Nu mă lăsa, nu mă lăsa'], ['To my love', 1], ['Can I get to your soul', 2], ['Can you get to my thought', 3]];
  const lines = src.map(s => { const d = s[1], active = d === 0; return { done: s[0], rest: active ? s[2] : '', second: active, secondText: s[3] || '',
    style: active ? 'font-family: \'Segoe UI Variable Display\', \'Segoe UI\', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600' : 'font-size: 18px; line-height: 24px; font-weight: 600',

</script>
