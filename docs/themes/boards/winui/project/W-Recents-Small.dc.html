<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recents, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|recents:Recents" sel="1" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <div style="display: flex; align-items: flex-end; gap: 24px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.0837)">
        <h1 style="margin: 0 0 2px 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600; flex-shrink: 0">Recents</h1>
        <div role="tablist" aria-label="Filter recents" style="display: flex; align-items: center; gap: 4px; flex-grow: 1; min-width: 0; overflow: hidden">
          <sc-for list="{{views}}" as="v" hint-placeholder-count="4"><button role="tab" aria-selected="{{v.on}}" style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
        </div>
        <button style="height: 32px; flex-shrink: 0; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v10h-11zM2.5 6.5h11M5.5 2v3M10.5 2v3" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Overview</button>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{items}}" as="r" hint-placeholder-count="9">
          <sc-if value="{{r.day}}" hint-placeholder-val="{{ false }}"><div style="height: 32px; display: flex; align-items: flex-end; padding-bottom: 6px; font-size: 14px; font-weight: 600">{{r.label}}</div></sc-if>
          <sc-if value="{{r.row}}" hint-placeholder-val="{{ true }}">
            <div style="{{r.style}}">
              <span style="{{r.art}}"></span>
              <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span><span style="height: 20px; flex-shrink: 0; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5">{{r.kind}}</span></span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.meta}}</span></span>
              <span style="font-size: 12px; color: #9e9e9e; white-space: nowrap; font-variant-numeric: tabular-nums">{{r.when}}</span>
              <button aria-label="{{r.toggle}}" aria-expanded="{{r.open}}" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #c5c5c5; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="{{r.chev}}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
            </div>
          </sc-if>
          <sc-if value="{{r.sub}}" hint-placeholder-val="{{ false }}">
            <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 64px; align-items: center; height: 36px; margin-left: 56px; border-radius: 4px"><span style="padding-left: 8px; font-size: 14px; color: #9e9e9e; font-variant-numeric: tabular-nums">{{r.n}}</span><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span><span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.when}}</span></div>
          </sc-if>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, on: s ? 'true' : 'false', style: 'position: relative; height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const views = [vs('All', true), vs('Music', false), vs('Podcasts', false), vs('Artists', false)];
  const day = (l) => ({ day: true, row: false, sub: false, label: l });
  const row = (l, kind, meta, when, c, open, round) => ({ day: false, row: true, sub: false, label: l, kind, meta, when, open: open ? 'true' : 'false', toggle: (open ? 'Collapse ' : 'Expand ') + l,
    chev: open ? 'M3.5 10 8 5.5l4.5 4.5' : 'M3.5 6 8 10.5 12.5 6',
    style: 'display: flex; align-items: center; gap: 12px; height: 56px; margin-top: 2px; padding: 0 4px 0 8px; border-radius: 4px; ' + (open ? 'background: rgba(255,255,255,0.0605)' : ''),
    art: 'width: 44px; height: 44px; flex-shrink: 0; border-radius: ' + (round ? '22px' : '4px') + '; background: ' + c });
  const sub = (n, l, d) => ({ day: false, row: false, sub: true, n, label: l, when: d });
  const items = [day('Today'), row('The Stereo Love Show', 'Album', 'Played 5 tracks', '20:14', '#3b5b7a', true, false), sub('1', 'Stereo Love', '4:07'), sub('2', 'This Is My Life', '3:50'), sub('3', 'Mono in Love', '3:17'), row('Latency, Honestly', 'Episode', 'Coffee & Code · 23 min left', '17:40', '#4a5b3b', false, false), row('Arash', 'Artist', 'Played 3 tracks', '12:02', '#4a3b2f', false, true), day('Yesterday'), row('LoL Worlds Songs 2014–2026', 'Playlist', 'Played 12 tracks · grouped from 4 plays', '22:51', '#5b5b5b', false, false)];
  return { views, items };
}
}
</script>
</body>
</html>
