<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|browse:Browse" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="browse" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 24px 36px 0 36px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">Browse</h1>
        <span style="font-size: 14px; line-height: 20px; color: #c5c5c5">Genres, moods and charts — everything Spotify is featuring right now.</span>
      </div>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Top</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{top}}" as="t" hint-placeholder-count="4"><a href="#" style="{{t.style}}"><span style="{{t.disc}}"></span><span>{{t.label}}</span></a></sc-for>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">For you</h2>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{foryou}}" as="t" hint-placeholder-count="5"><a href="#" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px; box-sizing: border-box; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1); color: #fff; font-size: 14px; font-weight: 600"><span style="{{t.dot}}"></span>{{t.label}}</a></sc-for>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Genres</h2><a href="#" style="font-size: 14px">Explore all categories</a></div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{genres}}" as="t" hint-placeholder-count="12"><a href="#" style="{{t.style}}">{{t.label}}</a></sc-for>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Mood &amp; activity</h2>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{moods}}" as="t" hint-placeholder-count="6"><a href="#" style="{{t.style}}">{{t.label}}</a></sc-for>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const tile = (h) => (l, c) => ({ label: l, style: 'display: flex; align-items: flex-end; height: ' + h + 'px; padding: 12px; box-sizing: border-box; border-radius: 8px; background: ' + c + '; color: #fff; font-size: 16px; line-height: 20px; font-weight: 600' });
  const top = [['Music', '#E8115B'], ['Podcasts', '#1E3264'], ['Audiobooks', '#8D67AB'], ['Live Events', '#BA5D07']].map(t => ({ label: t[0], style: 'display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; height: 112px; padding: 12px; box-sizing: border-box; border-radius: 8px; background: ' + t[1] + '; color: #fff; font-size: 20px; line-height: 28px; font-weight: 600', disc: 'width: 40px; height: 40px; border-radius: 4px; background: rgba(0,0,0,0.25)' }));
  const foryou = [['Made For You', '#0D73EC'], ['New Releases', '#E91429'], ['Discover', '#477D95'], ['Fresh Finds', '#AF2896'], ['RADAR', '#006450']].map(t => ({ label: t[0], dot: 'width: 16px; height: 16px; border-radius: 8px; background: ' + t[1] }));
  const g = tile(88);
  const genres = [['Pop', '#E8115B'], ['K-pop', '#8D67AB'], ['Hip-Hop', '#BA5D07'], ['Rock', '#E91429'], ['Dance/Electronic', '#0D73EC'], ['Indie', '#148A08'], ['R&B', '#503750'], ['Latin', '#E13300'], ['Classical', '#7358FF'], ['Jazz', '#477D95'], ['Metal', '#8C1932'], ['Dutch music', '#27856A']].map(t => g(t[0], t[1]));
  const moods = [['Chill', '#477D95'], ['Focus', '#503750'], ['Workout Music', '#E13300'], ['Sleep', '#1E3264'], ['Party', '#AF2896'], ['Cooking & Dining', '#BA5D07']].map(t => g(t[0], t[1]));
  return { top, foryou, genres, moods };
}
}
</script>
</body>
</html>
