<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Track context menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|album:The Stereo Love Show:#3b5b7a" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="albums" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 24px 36px 0 36px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
      <div style="display: flex; gap: 24px; align-items: flex-end">
        <div style="width: 168px; height: 168px; border-radius: 8px; background: #3b5b7a; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
          <div style="font-size: 12px; line-height: 16px; color: #c5c5c5">Album · 2012 · Cat Music</div>
          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">The Stereo Love Show</h1>
          <div style="font-size: 14px; line-height: 20px; color: #c5c5c5"><a href="#">Edward Maya</a>, <a href="#">Vika Jigulina</a> · 15 songs · 57 min</div>
          <div style="display: flex; gap: 8px; align-items: center; padding-top: 12px">
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
            <button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Shuffle</button>
            <button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Save</button>
          </div>
        </div>
      </div>
      <div role="table" aria-label="Tracks" style="display: flex; flex-direction: column">
        <div role="row" style="display: grid; grid-template-columns: 48px minmax(0, 1fr) 120px 40px 72px 40px; align-items: center; height: 36px; border-bottom: 1px solid rgba(255,255,255,0.0837); font-size: 12px; color: #c5c5c5"><span style="padding-left: 14px">#</span><span>Title</span><span style="text-align: right">Plays</span><span></span><span style="text-align: right; padding-right: 8px">Time</span><span></span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
          <div role="row" style="{{r.style}}"><span style="{{r.num}}">{{r.n}}</span><span style="{{r.title}}">{{r.t}}</span><span style="text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.plays}}</span><span></span><span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span><span></span></div>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
  <div role="menu" aria-label="This Is My Life" style="position: absolute; left: 640px; top: 452px; width: 280px; box-sizing: border-box; padding: 4px; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column">
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="14">
      <sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="display: block; height: 1px; margin: 4px -4px; background: rgba(255,255,255,0.0837)"></span></sc-if>
      <sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}"><button role="menuitem" style="{{m.style}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="{{m.d}}" fill="{{m.fill}}" stroke="{{m.stroke}}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="flex-grow: 1; text-align: left">{{m.label}}</span><span style="font-size: 12px; color: #9e9e9e">{{m.key}}</span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="{{m.chev}}"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></sc-if>
    </sc-for>
  </div>
  <div role="menu" aria-label="Add to playlist" style="position: absolute; left: 916px; top: 520px; width: 300px; box-sizing: border-box; padding: 4px; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column">
    <label style="height: 32px; margin: 4px 4px 4px 4px; display: flex; align-items: center; padding: 0 10px 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); font-size: 14px; color: #9e9e9e"><span style="flex-grow: 1">Find a playlist</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="#c5c5c5" stroke-width="1" stroke-linecap="round"></path></svg></label>
    <button role="menuitem" style="height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>New playlist</button>
    <span style="display: block; height: 1px; margin: 4px -4px; background: rgba(255,255,255,0.0837)"></span>
    <sc-for list="{{lists}}" as="p" hint-placeholder-count="6">
      <button role="menuitem" style="{{p.style}}"><span style="{{p.art}}"></span><span style="flex-grow: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.label}}</span><span style="font-size: 12px; color: #9e9e9e; white-space: nowrap">{{p.note}}</span></button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const data = [['Stereo Love', '598.9M', '4:07', 'playing'], ['This Is My Life', '62.9M', '3:50', 'target'], ['Mono in Love', '5.1M', '3:17'], ['Happy for You', '2.1M', '3:51'], ['Friends Forever', '1.3M', '3:35'], ['Twinheart', '780.7K', '3:59'], ['Nostalgy', '603.4K', '3:30'], ['Stay Longer', '602.9K', '3:40'], ['Back Home', '1.6M', '3:37'], ['Close Your Eyes', '1M', '4:30']];
  const rows = data.map((d, i) => {
    const playing = d[3] === 'playing', target = d[3] === 'target';
    return { n: playing ? '▮▮▮' : String(i + 1), t: d[0], plays: d[1], time: d[2],
      style: 'display: grid; grid-template-columns: 48px minmax(0, 1fr) 120px 40px 72px 40px; align-items: center; height: 40px; margin-top: 2px; border-radius: 4px; ' + (target ? 'background: rgba(255,255,255,0.0605)' : ''),
      num: 'padding-left: 14px; font-variant-numeric: tabular-nums; font-size: ' + (playing ? '10px' : '14px') + '; color: ' + (playing ? '#60cdff' : '#9e9e9e'),
      title: 'font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (playing ? '#99ebff' : '#ffffff') };
  });
  const I = { play: 'M4.5 2.8v10.4L13 8z', next: 'M2.5 4h7M2.5 8h7M2.5 12h4M10.5 9.5v4.5l3.5-2.25z', queue: 'M2.5 4h11M2.5 8h7M2.5 12h7M11.5 9.5v4.5l3.5-2.25z', heart: 'M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z', add: 'M2.5 4h8M2.5 8h5M2.5 12h5M12 8v6M9 11h6', share: 'M8 2.5v8M5 5.5l3-3 3 3M3.5 9v3.5h9V9', artist: 'M8 2.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 13.5c0-2.5 2.2-4 5-4s5 1.5 5 4', radio: 'M2.5 6.5h11v7h-11zM4.5 6.5l7-4M5.5 10a1 1 0 1 1 0 .01M9 9h3M9 11h3', credits: 'M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM8 7v4.5M8 4.6v.1', video: 'M2 3h12v10H2zM6.5 6v4l3.5-2z' };
  const it = (label, icon, opts) => { const o = opts || {}; return { item: true, sep: false, label, key: o.key || '', d: I[icon], fill: icon === 'play' || (icon === 'heart' && o.on) ? 'currentColor' : 'none', stroke: icon === 'play' || (icon === 'heart' && o.on) ? 'none' : 'currentColor', chev: o.sub ? 'flex-shrink: 0; display: block' : 'display: none',
    style: 'height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border: 0; border-radius: 4px; color: #fff; font: inherit; font-size: 14px; background: ' + (o.open ? 'rgba(255,255,255,0.0605)' : 'transparent') }; };
  const sep = { item: false, sep: true };
  const menu = [it('Play', 'play'), it('Play next', 'next', { key: 'Ctrl+Shift+N' }), it('Add to queue', 'queue', { key: 'Ctrl+Q' }), sep, it('Save to Liked Songs', 'heart', { key: 'Ctrl+S' }), it('Add to playlist', 'add', { sub: true, open: true }), sep, it('Go to artist', 'artist', { sub: true }), it('Go to song radio', 'radio'), it('View credits', 'credits'), it('Video', 'video', { sub: true }), sep, it('Share', 'share', { sub: true })];
  const pl = [['K-Pop Duets (러블리 듀엣)', '#6b3b4a', ''], ['LoL Worlds Songs 2014–2026', '#5b5b5b', ''], ['90’s Nederlandstalig', '#2f5b6b', ''], ['Eurodance 2009–2012', '#3b5b7a', 'Already added'], ['Late night drive', '#2f3b5b', ''], ['Gym 2026', '#5b3b2f', '']];
  const lists = pl.map(p => ({ label: p[0], note: p[2], art: 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 4px; background: ' + p[1],
    style: 'height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 8px; border: 0; border-radius: 4px; background: transparent; font: inherit; font-size: 14px; color: ' + (p[2] ? '#9e9e9e' : '#ffffff') }));
  return { rows, menu, lists };
}
}
</script>
</body>
</html>
