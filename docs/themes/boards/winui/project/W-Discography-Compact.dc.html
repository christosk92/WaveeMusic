<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discography, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|artist:Arash:#4a3b2f" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 2px; flex-shrink: 0">
      <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 4px; height: 32px; margin-left: -4px; font-size: 14px">
        <a href="#" style="color: #c5c5c5; height: 32px; display: flex; align-items: center; padding: 0 4px">Arash</a>
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #9e9e9e"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="padding: 0 4px; font-weight: 600">Discography</span>
      </nav>
      <div style="display: flex; align-items: center; gap: 8px">
        <h1 style="margin: 0; flex-grow: 1; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Discography</h1>
        <div style="display: flex; height: 40px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.0698); overflow: hidden">
          <button aria-label="Grid view" aria-pressed="true" style="width: 40px; border: 0; background: rgba(255,255,255,0.0837); color: #fff; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z" fill="none" stroke="currentColor" stroke-width="1"></path></svg></button>
          <button aria-label="List view" aria-pressed="false" style="width: 40px; border: 0; background: transparent; color: #c5c5c5; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
        </div>
      </div>
      <span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Arash · 3 albums · 12 singles · 2 compilations</span>
    </div>
    <div style="display: flex; gap: 4px; flex-shrink: 0; margin-right: -16px; overflow: hidden; white-space: nowrap; border-bottom: 1px solid rgba(255,255,255,0.0837)">
      <sc-for list="{{views}}" as="v" hint-placeholder-count="3"><button style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
    </div>
    <section style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 8px; height: 40px">
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 10 8 5.5l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">2010s</h2>
        <span style="font-size: 12px; color: #c5c5c5; flex-grow: 1">2 albums</span>
        <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Newest<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{row1}}" as="a" hint-placeholder-count="2">
          <a href="#" style="{{a.card}}"><span style="{{a.art}}"></span><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.t}}</span><span style="font-size: 12px; color: #c5c5c5">{{a.s}}</span></a>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 12px 8px 16px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 96px; height: 96px; border-radius: 8px; background: #6b8f8a; flex-shrink: 0"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
            <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Superman</span>
            <span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Album · Jun 12, 2014<br>12 tracks · 41 min</span>
            <a href="#" style="font-size: 14px; line-height: 20px; padding-top: 4px">Go to album</a>
          </div>
          <button aria-label="Play Superman" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 20px; background: #60cdff; color: #000; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg></button>
        </div>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{tracks}}" as="r" hint-placeholder-count="5">
            <div style="display: grid; grid-template-columns: 28px minmax(0, 1fr) 24px 40px 40px; align-items: center; height: 48px; border-radius: 4px"><span style="font-size: 14px; color: #9e9e9e; font-variant-numeric: tabular-nums">{{r.n}}</span><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="text-align: center; font-size: 14px">{{r.h}}</span><span style="text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.d}}</span><button aria-label="More options for {{r.t}}" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button></div>
          </sc-for>
          <a href="#" style="height: 40px; display: flex; align-items: center; font-size: 14px">Show all 12 tracks</a>
        </div>
      </div>
    </section>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, style: 'position: relative; height: 44px; flex-shrink: 0; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const views = [vs('Albums', true), vs('Singles & EPs', false), vs('Compilations', false)];
  const row1 = [['Superman', 'Jun 12, 2014 · 12 tracks', '#6b8f8a', true], ['Donya', 'Jun 20, 2008 · 14 tracks', '#5b4a3b', false]].map(a => ({ t: a[0], s: a[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + a[2], card: 'display: flex; flex-direction: column; gap: 6px; padding: 6px; margin: -6px; min-width: 0; border-radius: 8px; color: #fff; ' + (a[3] ? 'background: rgba(255,255,255,0.0605)' : '') }));
  const tracks = [['Superman', '3:02', ''], ['One Day (feat. Helena)', '3:33', '♥'], ['She Makes Me Go (feat. Sean Paul)', '3:31', ''], ['Sex Love Rock n Roll (feat. T-Pain)', '3:19', ''], ['Broken Angel (feat. Helena)', '3:11', '♥']].map((t, i) => ({ n: String(i + 1), t: t[0], d: t[1], h: t[2] }));
  return { views, row1, tracks };
}
}
</script>
</body>
</html>
