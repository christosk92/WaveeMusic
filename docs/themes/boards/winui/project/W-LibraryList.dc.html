<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library: artists list with detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|artists:Artists" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="artists" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 24px 0 0 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="padding: 0 36px; display: flex; flex-direction: column; gap: 16px">
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">Library</h1>
        <div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
          <sc-for list="{{views}}" as="v" hint-placeholder-count="5"><button style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 380px minmax(0, 1fr); flex-grow: 1; min-height: 0">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px 0 36px; border-right: 1px solid rgba(255,255,255,0.0837); overflow: hidden">
          <div style="display: flex; align-items: center; gap: 8px">
            <label style="flex-grow: 1; height: 32px; display: flex; align-items: center; padding: 0 10px 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); font-size: 14px; color: #9e9e9e"><span style="flex-grow: 1">Filter artists</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="#c5c5c5" stroke-width="1" stroke-linecap="round"></path></svg></label>
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">A–Z<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          </div>
          <span style="font-size: 12px; color: #c5c5c5; padding: 0 4px">18 artists</span>
          <div style="display: flex; flex-direction: column">
            <sc-for list="{{list}}" as="r" hint-placeholder-count="12">
              <sc-if value="{{r.header}}" hint-placeholder-val="{{ false }}"><div style="height: 28px; display: flex; align-items: flex-end; padding: 0 0 4px 12px; font-size: 12px; font-weight: 600; color: #c5c5c5">{{r.label}}</div></sc-if>
              <sc-if value="{{r.item}}" hint-placeholder-val="{{ true }}">
                <a href="#" style="{{r.style}}"><span style="{{r.pill}}"></span><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">{{r.sub}}</span></span></a>
              </sc-if>
            </sc-for>
          </div>
        </div>
        <section aria-label="Arash in your library" style="display: flex; flex-direction: column; gap: 16px; padding: 0 36px 0 24px; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 16px">
            <span style="width: 72px; height: 72px; border-radius: 36px; background: #4a3b2f; flex-shrink: 0"></span>
            <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Arash</h2><span style="font-size: 14px; color: #c5c5c5">In your library: 3 albums · 12 songs · following since 2019</span></div>
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
            <button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Shuffle</button>
            <a href="#" style="height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font-size: 14px">Open artist<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M6 3.5H2.5v10h10V10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
          </div>
          <div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
            <sc-for list="{{scope}}" as="v" hint-placeholder-count="2"><button style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
            <span style="flex-grow: 1"></span>
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Newest<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          </div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
            <sc-for list="{{albums}}" as="a" hint-placeholder-count="3"><a href="#" style="display: flex; flex-direction: column; gap: 6px; color: #fff"><span style="{{a.art}}"></span><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.t}}</span><span style="font-size: 12px; color: #c5c5c5">{{a.s}}</span></a></sc-for>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <h3 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Liked songs by Arash</h3>
            <sc-for list="{{songs}}" as="r" hint-placeholder-count="4">
              <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1fr) 40px 64px; align-items: center; height: 40px; border-radius: 4px"><span style="padding-left: 8px; font-size: 14px; color: #9e9e9e; font-variant-numeric: tabular-nums">{{r.n}}</span><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 14px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span><span style="text-align: center">♥</span><span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.d}}</span></div>
            </sc-for>
          </div>
        </section>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const views = [vs('Playlists', false), vs('Albums', false), vs('Artists', true), vs('Podcasts', false), vs('Audiobooks', false)];
  const scope = [vs('In your library', true), vs('All releases', false)];
  const h = (l) => ({ header: true, item: false, label: l });
  const it = (l, s, c, sel) => ({ header: false, item: true, label: l, sub: s, art: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; background: ' + c,
    style: 'position: relative; display: flex; align-items: center; gap: 12px; height: 48px; margin: 2px 0; padding: 0 12px; border-radius: 4px; color: #fff; ' + (sel ? 'background: rgba(255,255,255,0.0605)' : ''),
    pill: sel ? 'position: absolute; left: 0; top: 16px; width: 3px; height: 16px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const list = [h('A'), it('aespa', '2 albums · 9 songs', '#5b2f6b', false), it('Arash', '3 albums · 12 songs', '#4a3b2f', true), it('Arcane', '1 album · 4 songs', '#2f4a6b', false), h('E'), it('Edward Maya', '1 album · 15 songs', '#3b5b7a', false), h('H'), it('HOME', '1 album · 2 songs', '#2f5b6b', false), h('I'), it('ILLIT', '1 album · 6 songs', '#6b5b2f', false), it('Inna', '4 songs', '#6b2f3b', false), h('J'), it('Jukjae', '1 album · 8 songs', '#7a6a5a', false), h('L'), it('League of Legends', '3 albums · 21 songs', '#7a5a3b', false)];
  const albums = [['Superman', '2014 · Album · 12 songs', '#6b8f8a'], ['Donya', '2008 · Album · 14 songs', '#5b4a3b'], ['Arash', '2005 · Album · 13 songs', '#3b4a5b']].map(a => ({ t: a[0], s: a[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + a[2] }));
  const songs = [['Broken Angel (feat. Helena)', 'Donya', '3:11'], ['One Day (feat. Helena)', 'Superman', '3:33'], ['Boro Boro', 'Arash', '3:47'], ['Temptation (feat. Rebecca)', 'Arash', '3:20']].map((s, i) => ({ n: String(i + 1), t: s[0], a: s[1], d: s[2] }));
  return { views, scope, list, albums, songs };
}
}
</script>
</body>
</html>
