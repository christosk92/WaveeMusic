<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a problem, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding-left: 16px; font-size: 12px">
    <span style="width: 16px; height: 16px; border-radius: 4px; background: #60cdff"></span><span>Wavee</span><span style="flex-grow: 1"></span>
    <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
    <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5h9v9h-9z" fill="none" stroke="currentColor" stroke-width="1"></path></svg></span>
    <span style="width: 46px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></span>
  </div>
  <div role="dialog" aria-label="Report a problem" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #2b2b2b; border-top: 1px solid rgba(117,117,117,0.4)">
    <div style="position: relative; flex-grow: 1; min-height: 0; padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Report a problem</h1><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Opens a prefilled GitHub form in your browser and copies the redacted report to your clipboard. Nothing is sent until you click.</span></div>
      <div role="radiogroup" aria-label="Kind" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; font-size: 14px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><label style="display: flex; align-items: center; gap: 8px; height: 40px"><span style="{{k.ring}}"><span style="{{k.dot}}"></span></span>{{k.label}}</label></sc-for>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Title<span style="height: 40px; display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom: 2px solid #60cdff; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Queue pane keeps the old theme for one frame after switching</span></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">What happened<span style="height: 96px; padding: 8px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #c5c5c5; font-size: 14px; line-height: 20px">Switched to the Zune theme while the queue pane was open; the pane painted one frame in WinUI colours.</span></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Steps to reproduce<span style="height: 80px; padding: 8px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #9e9e9e; font-size: 14px; line-height: 20px">1. Open the queue pane 2. Settings › Appearance › Theme › Zune 3. Watch the pane</span></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Expected behaviour<span style="height: 56px; padding: 8px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #9e9e9e; font-size: 14px; line-height: 20px">Never paint a frame in the wrong theme.</span></label>
      <label style="display: flex; align-items: center; gap: 8px; min-height: 40px; font-size: 14px; line-height: 20px"><span style="width: 20px; height: 20px; flex-shrink: 0; border-radius: 4px; background: #60cdff; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="#000" stroke-width="1.6"></path></svg></span>Include diagnostics and the last 200 log lines</label>
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; flex-shrink: 0; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)"><span style="display: flex; flex-direction: column"><span style="font-size: 14px">Report preview</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Personal paths, account details and secrets are removed. Track names are kept.</span></span><button style="align-self: flex-start; height: 40px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Save as…</button></div>
      <span aria-hidden="true" style="position: absolute; right: 3px; top: 8px; width: 2px; height: 220px; border-radius: 1px; background: rgba(255,255,255,0.5442)"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; background: #202020; border-top: 1px solid rgba(255,255,255,0.0837)">
      <button style="height: 40px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px">Report on GitHub</button>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 40px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Copy report</button>
        <button style="height: 40px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Not now</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const kinds = ['Bug', 'Feature', 'Question', 'Idea'].map((l, i) => ({ label: l, ring: 'width: 20px; height: 20px; flex-shrink: 0; border-radius: 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (i === 0 ? 'background: #60cdff' : 'border: 1px solid rgba(255,255,255,0.5442)'), dot: i === 0 ? 'width: 8px; height: 8px; border-radius: 4px; background: #000' : 'display: none' }));
  return { kinds };
}
}
</script>
</body>
</html>
