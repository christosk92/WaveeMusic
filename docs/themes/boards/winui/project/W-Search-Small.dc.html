<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|search:stereo love" sel="1" query="stereo love" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 8px 24px 0 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div role="tablist" aria-label="Results for stereo love" style="display: flex; align-items: center; gap: 4px; margin-right: -24px; overflow: hidden; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.0837)">
        <sc-for list="{{facets}}" as="f" hint-placeholder-count="11"><button role="tab" aria-selected="{{f.on}}" style="{{f.style}}">{{f.label}}<span style="{{f.bar}}"></span></button></sc-for>
      </div>
      <section aria-label="Top result" style="display: flex; align-items: center; gap: 16px; flex-shrink: 0; padding: 16px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
        <span style="width: 64px; height: 64px; flex-shrink: 0; border-radius: 4px; background: #3b5b7a"></span>
        <a href="#" style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1; color: #fff">
          <span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Top result</span>
          <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Stereo Love</span>
          <span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="font-size: 14px; line-height: 20px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Song · Edward Maya, Vika Jigulina</span><span style="height: 20px; flex-shrink: 0; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #fff">Matched title</span></span>
        </a>
        <button style="height: 32px; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
        <a href="#" style="height: 32px; flex-shrink: 0; display: inline-flex; align-items: center; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font-size: 14px">Go to album</a>
      </section>
      <section style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Songs</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{songs}}" as="r" hint-placeholder-count="3">
            <div style="{{r.style}}">
              <span style="{{r.art}}"></span>
              <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span>
              <span style="{{r.explicit}}">E</span>
              <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #fff">{{r.heart}}</span>
              <span style="width: 44px; text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span>
              <span style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: #fff">{{r.more}}</span>
            </div>
          </sc-for>
        </div>
      </section>
      <section style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Artists</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{artists}}" as="c" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 8px; align-items: center; color: #fff; text-align: center"><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600">{{c.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Artist</span></span></a></sc-for>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const fs = (l, s) => ({ label: l, on: s ? 'true' : 'false', style: 'position: relative; height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const facets = ['All', 'Songs', 'Albums', 'Playlists', 'Artists', 'Podcasts & shows', 'Episodes', 'Audiobooks', 'Authors', 'Profiles', 'Genres'].map((l, i) => fs(l, i === 0));
  const sd = [['Stereo Love - Radio Edit', 'Edward Maya, Vika Jigulina', '#3b5b7a', '3:05', false, false, true], ['Stereo Love (Molella Remix)', 'Edward Maya, Vika Jigulina', '#4a5b7a', '5:49', false, true, false], ['Stereo Love', 'Gigi D’Agostino', '#5b4a3b', '3:12', false, false, false]];
  const songs = sd.map(d => ({ title: d[0], sub: 'Song · ' + d[1], time: d[3], heart: d[4] ? '♥' : (d[6] ? '♡' : ''), more: d[6] ? '⋯' : '',
    style: 'display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px; margin: 0 -8px; border-radius: 4px; ' + (d[6] ? 'background: rgba(255,255,255,0.0605)' : ''),
    art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: ' + d[2],
    explicit: (d[5] ? 'display: inline-flex' : 'display: none') + '; width: 16px; height: 16px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 2px; font-size: 10px; font-weight: 600; background: #c5c5c5; color: #000' }));
  const artists = [['Edward Maya', '#3b5b7a'], ['Vika Jigulina', '#5b3b6b'], ['Gigi D’Agostino', '#5b4a3b'], ['Akcent', '#2f5b6b']].map(a => ({ title: a[0], art: 'display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 50%; background: ' + a[1] }));
  return { facets, songs, artists };
}
}
</script>
</body>
</html>
