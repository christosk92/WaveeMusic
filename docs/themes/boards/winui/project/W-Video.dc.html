<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video: floating mini player and placement menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|album:The Stereo Love Show:#3b5b7a" sel="0" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="home" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 24px 36px 0 36px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">Good evening, Chris</h1>
        <div style="display: flex; align-items: center; gap: 4px"><sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button style="{{f.style}}">{{f.label}}<span style="{{f.bar}}"></span></button></sc-for></div>
      </div>
      <section aria-label="Videos you might like" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Videos you might like</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{videos}}" as="v" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 8px; color: #fff"><span style="{{v.art}}"><span style="position: absolute; right: 8px; bottom: 8px; height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(0,0,0,0.6)">{{v.len}}</span></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">{{v.sub}}</span></span></a></sc-for>
        </div>
      </section>
      <section aria-label="Made for you" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Made for you</h2><a href="#" style="font-size: 14px">See all</a></div>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="6"><a href="#" style="display: flex; flex-direction: column; gap: 8px; color: #fff"><span style="{{c.art}}"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sub}}</span></span></a></sc-for>
        </div>
      </section>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="video" pane="none" hint-size="1440px,72px"></dc-import>
  <div aria-label="Video mini player" style="position: absolute; right: 24px; bottom: 96px; width: 384px; height: 216px; border-radius: 8px; overflow: hidden; background: #0b1a26; box-shadow: 0 16px 32px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.0837)">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 4px; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0))">
      <button aria-label="Dock in rail" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v10H2zM10 3v10" fill="none" stroke="currentColor" stroke-width="1"></path></svg></button>
      <button aria-label="Full screen" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Turn off video" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.6))">
      <button aria-label="Previous" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10M13 3.5v9L5.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Pause" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 16px; background: #60cdff; color: #000; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3v10M10.5 3v10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
      <button aria-label="Next" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 3v10M3 3.5v9L10.5 8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442); margin: 0 8px"><div style="width: 48%; height: 4px; border-radius: 2px; background: #60cdff"></div></div>
      <button aria-label="Mute" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4h2.5L8 13V3L5 6zM10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="More" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
    </div>
    <span aria-hidden="true" style="position: absolute; right: 2px; bottom: 2px; width: 10px; height: 10px; border-right: 2px solid rgba(255,255,255,0.5); border-bottom: 2px solid rgba(255,255,255,0.5)"></span>
  </div>
  <div role="menu" aria-label="Where to play the video" style="position: absolute; right: 236px; bottom: 80px; width: 260px; padding: 4px; border-radius: 8px; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); box-shadow: 0 8px 16px rgba(0,0,0,0.26); display: flex; flex-direction: column">
    <div style="height: 32px; display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: #9e9e9e">Where to play the video</div>
    <sc-for list="{{menu}}" as="m" hint-placeholder-count="6">
      <sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span style="display: block; height: 1px; margin: 4px 0; background: rgba(255,255,255,0.0837)"></span></sc-if>
      <sc-if value="{{m.item}}" hint-placeholder-val="{{ true }}"><button role="menuitemradio" aria-checked="{{m.checked}}" style="{{m.style}}"><span style="width: 16px; display: flex; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="{{m.check}}"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></span><span style="flex-grow: 1; text-align: left">{{m.label}}</span><span style="font-size: 12px; color: #9e9e9e">{{m.key}}</span></button></sc-if>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const fs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const facets = [fs('All', true), fs('Music', false), fs('Podcasts', false), fs('Audiobooks', false)];
  const videos = [['Stereo Love (Official Video)', 'Edward Maya, Vika Jigulina', '4:07', '#0b1a26'], ['Supernova', 'aespa · Music video', '3:02', '#2b1a33'], ['Broken Angel', 'Arash · Music video', '3:14', '#2a1f14'], ['Days of Thunder', 'The Midnight · Visualizer', '4:37', '#33200f']].map(v => ({ title: v[0], sub: v[1], len: v[2], art: 'position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; background: ' + v[3] }));
  const cards = [['Daily Mix 1', 'IVE, Red Velvet, IU and more', '#5b3b6b'], ['Daily Mix 2', 'aespa, ILLIT, NewJeans and more', '#3b5b6b'], ['Discover Weekly', 'Your weekly mixtape of fresh music', '#2f6b4a'], ['Release Radar', 'New music from artists you follow', '#6b4a2f'], ['On Repeat', 'Songs you can’t stop playing', '#6b2f3b'], ['Time Capsule', 'Songs from your past', '#4a4a6b']].map(c => ({ title: c[0], sub: c[1], art: 'width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + c[2] }));
  const mi = (l, checked, key) => ({ item: true, sep: false, label: l, key: key || '', checked: checked ? 'true' : 'false', check: checked ? 'display: block' : 'display: none', style: 'height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 8px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px; ' + (checked ? 'background: rgba(255,255,255,0.0605)' : '') });
  const menu = [mi('Dock in rail', false), mi('Play in a mini player', true), mi('Play in a separate window', false), mi('Full screen', false, 'F11'), { item: false, sep: true }, mi('Turn off video', false)];
  return { facets, videos, cards, menu };
}
}
</script>
</body>
</html>
