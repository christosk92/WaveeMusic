<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lyrics pane docked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|artist:Edward Maya:#3b5b7a" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="" hint-size="48px,800px"></dc-import>
    <div style="flex-grow: 1; min-width: 0; display: flex; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; overflow: hidden">
      <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 240px; flex-shrink: 0; position: relative; background: #2a3b4c; display: flex; align-items: flex-end; padding: 0 36px 24px 36px; box-sizing: border-box">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #ffffff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 9.6 3l2.2-.2.4 2.2 1.9 1.1-.9 2 .9 2-1.9 1.1-.4 2.2-2.2-.2L8 14.5 6.4 13l-2.2.2-.4-2.2-1.9-1.1.9-2-.9-2 1.9-1.1.4-2.2 2.2.2z" fill="#60cdff"></path><path d="M5.5 8 7.2 9.7 10.5 6.4" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Verified artist</span>
            <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 68px; line-height: 80px; font-weight: 600">Edward Maya</h1>
            <span style="font-size: 14px; line-height: 20px; color: #ffffff">4,812,330 monthly listeners</span>
          </div>
        </div>
        <div style="padding: 20px 36px 0 36px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; gap: 8px; align-items: center">
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
            <button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Shuffle</button>
            <button aria-pressed="true" style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>Following</button>
            <button aria-label="More" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
          </div>
          <div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
            <sc-for list="{{pivots}}" as="p" hint-placeholder-count="4"><button style="{{p.style}}">{{p.label}}<span style="{{p.bar}}"></span></button></sc-for>
          </div>
          <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Popular</h2>
          <div role="table" aria-label="Popular" style="display: flex; flex-direction: column">
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
              <div role="row" style="{{r.style}}">
                <span style="{{r.num}}">{{r.n}}</span>
                <span style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="{{r.art}}"></span><span style="{{r.title}}">{{r.t}}</span></span>
                <span style="text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.plays}}</span>
                <span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </main>
      <aside aria-label="Lyrics" style="width: 340px; flex-shrink: 0; border-left: 1px solid rgba(255,255,255,0.0837); display: flex; flex-direction: column; overflow: hidden">
        <div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button style="{{t.style}}">{{t.label}}<span style="{{t.bar}}"></span></button></sc-for>
          <span style="flex-grow: 1"></span>
          <button aria-label="Close lyrics" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
        </div>
        <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px">
          <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Stereo Love</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Synced · word by word</span></span>
          <button aria-pressed="true" aria-label="Show translation" style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.0605); color: #fff; font: inherit; font-size: 12px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h7M5.5 2v1.5M3.5 3.5c.5 2.5 2.3 4.4 4.5 5.2M7.5 3.5c-.6 2.6-2.4 4.6-5 5.5M8.5 14l3-7 3 7M9.5 11.8h4" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Translate</button>
          <button aria-label="Open lyrics full screen" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        </div>
        <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 24px 24px 0 24px; overflow: hidden">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="9">
            <div style="{{l.style}}"><span style="{{l.doneStyle}}">{{l.done}}</span><span style="{{l.restStyle}}">{{l.rest}}</span><sc-if value="{{l.second}}" hint-placeholder-val="{{ false }}"><span style="display: block; margin-top: 4px; font-size: 14px; line-height: 20px; font-weight: 400; color: #c5c5c5">{{l.secondText}}</span></sc-if></div>
          </sc-for>
        </div>
        <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid rgba(255,255,255,0.0837); font-size: 12px; color: #9e9e9e">Lyrics provided by Musixmatch</div>
      </aside>
    </div>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="lyrics" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const pv = (l, s) => ({ label: l, style: 'position: relative; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const pivots = [pv('Overview', true), pv('Albums', false), pv('Singles & EPs', false), pv('About', false)];
  const tab = (l, s) => ({ label: l, style: 'position: relative; height: 40px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const tabs = [tab('Queue', false), tab('Lyrics', true), tab('Now playing', false), tab('Friends', false)];
  const data = [['Stereo Love', '598,912,004', '4:07', '#3b5b7a', true], ['This Is My Life', '62,904,118', '3:50', '#3b5b7a', false], ['Desert Rain', '41,220,567', '3:46', '#6b5b3b', false], ['Mono in Love', '5,108,442', '3:17', '#3b5b7a', false], ['Love of My Life', '3,877,201', '3:28', '#5b3b4a', false], ['Universal Love', '2,114,930', '3:36', '#3b4a6b', false]];
  const rows = data.map((d, i) => ({ n: d[4] ? '▮▮▮' : String(i + 1), t: d[0], plays: d[1], time: d[2],
    style: 'display: grid; grid-template-columns: 48px minmax(0, 1fr) 140px 72px; align-items: center; height: 48px; margin-top: 2px; border-radius: 4px',
    num: 'padding-left: 14px; font-variant-numeric: tabular-nums; font-size: ' + (d[4] ? '10px' : '14px') + '; color: ' + (d[4] ? '#60cdff' : '#9e9e9e'),
    art: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; background: ' + d[3],
    title: 'font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[4] ? '#99ebff' : '#ffffff') }));
  const src = [['When you gonna stop breaking my heart', -3], ['I don’t wanna be another one', -2], ['Paying for the things I never done', -1], ['Don’t let go,', 0, ' don’t let go', 'Nu mă lăsa, nu mă lăsa'], ['To my love', 1], ['Can I get to your soul', 2], ['Can you get to my thought', 3]];
  const lines = src.map(s => {
    const d = s[1], active = d === 0;
    return {
      done: s[0], rest: active ? s[2] : '', second: active, secondText: s[3] || '',
      style: active ? 'font-family: \'Segoe UI Variable Display\', \'Segoe UI\', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600' : 'font-size: 18px; line-height: 24px; font-weight: 600',
      doneStyle: 'color: ' + (active ? '#ffffff' : (d < 0 ? '#9e9e9e' : '#c5c5c5')),
      restStyle: 'color: #9e9e9e'
    };
  });
  return { pivots, tabs, rows, lines };
}
}
</script>
</body>
</html>
