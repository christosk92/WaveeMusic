<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playlist owned, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|playlist:LoL Worlds Songs 2014–2026:#5b5b5b" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="width: 160px; height: 160px; flex-shrink: 0; align-self: center; border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))"><span style="background: #3b4a7a"></span><span style="background: #7a5a3b"></span><span style="background: #2f4a6b"></span><span style="background: #6b3b2f"></span></div>
    <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: #c5c5c5"><span>Playlist · Public</span><span style="height: 20px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,0.0605)"><svg width="10" height="10" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="2"></path></svg>Saved</span></div>
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">LoL Worlds Songs 2014–2026</h1>
      <a href="#" style="font-size: 14px; line-height: 20px; color: #9e9e9e">Add an optional description</a>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: #c5c5c5"><span style="width: 24px; height: 24px; border-radius: 12px; background: #6b5b4a; flex-shrink: 0"></span><span><a href="#">Luhkas</a> · 70 songs · 4 hr 32 min</span></div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
      <div style="display: flex; height: 40px; border-radius: 4px; overflow: hidden; background: #60cdff; color: #000; font-size: 14px"><button style="display: flex; align-items: center; gap: 8px; padding: 0 18px; border: 0; background: transparent; color: #000; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button><span style="width: 1px; background: rgba(0,0,0,0.2)"></span><button aria-label="More play options" style="width: 40px; border: 0; background: transparent; color: #000; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
      <button aria-label="Shuffle" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h2.5c1.4 0 2.3.7 3.2 1.9l1.6 2.2c.9 1.2 1.8 1.9 3.2 1.9H14M2 12h2.5c1.4 0 2.3-.7 3.2-1.9M8.3 5.9c.9-1.2 1.8-1.9 3.2-1.9H14M12 2l2 2-2 2M12 8l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Invite collaborators" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.8a2.2 2.2 0 1 1 0 4.4A2.2 2.2 0 0 1 6 2.8zM1.5 13c0-2.3 2-3.8 4.5-3.8s4.5 1.5 4.5 3.8M12.5 6v5M10 8.5h5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
      <span style="flex-grow: 1"></span>
      <button aria-label="More: tune, share, edit details" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
    </div>
    <div role="table" aria-label="Tracks" style="display: flex; flex-direction: column; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 4px; height: 40px; margin-left: -8px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
        <button aria-label="Find in playlist" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
        <span style="flex-grow: 1"></span>
        <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Custom order<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <button aria-label="Filter" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M4.5 8h7M7 12.5h2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div role="row" style="{{r.style}}">
          <span style="{{r.art}}"></span>
          <span style="display: flex; flex-direction: column; min-width: 0"><span style="{{r.title}}">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span>
          <span style="text-align: right; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span>
          <button aria-label="More options for {{r.t}}" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
        </div>
      </sc-for>
    </div>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const data = [['Warriors', 'Imagine Dragons, League of Legends', 'Warriors', '2:51', '#3b4a7a', false], ['Worlds Collide', 'Nicki Taylor, League of Legends', 'Worlds Collide', '3:46', '#7a5a3b', false], ['Ignite', 'Zedd, League of Legends', 'Ignite', '3:52', '#2f4a6b', false], ['Legends Never Die', 'Against The Current, League of Legends', 'Legends Never Die', '3:55', '#6b3b2f', true], ['RISE', 'The Glitch Mob, Mako, The Word Alive', 'RISE', '3:12', '#5b2f6b', false], ['Phoenix', 'Cailin Russo, Chrissy Costanza', 'Phoenix', '3:06', '#2f5b6b', false]];
  const rows = data.map(d => ({ t: d[0], sub: d[1] + ' · ' + d[2], time: d[3],
    style: 'display: grid; grid-template-columns: 40px minmax(0, 1fr) 36px 40px; gap: 0 12px; align-items: center; height: 56px; margin: 2px -8px 0 -8px; padding: 0 0 0 8px; border-radius: 4px; ' + (d[5] ? 'background: rgba(255,255,255,0.0605)' : ''),
    art: 'width: 40px; height: 40px; border-radius: 4px; background: ' + d[4],
    title: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[5] ? '#99ebff' : '#ffffff') }));
  return { rows };
}
}
</script>
</body>
</html>
