<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Podcast show, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|show:Coffee &amp; Code:#4a5b3b" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; gap: 16px; align-items: flex-end">
      <div style="width: 128px; height: 128px; border-radius: 8px; background: #4a5b3b; flex-shrink: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: #c5c5c5"><span>Podcast</span><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; background: rgba(255,255,255,0.0605)">Video</span></div>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Coffee &amp; Code</h1>
        <div style="font-size: 14px; line-height: 20px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><a href="#">Half Moon Recordings</a></div>
        <div style="font-size: 12px; line-height: 16px; color: #9e9e9e">4.7 ★ · 14 episodes · weekly</div>
      </div>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <button style="flex-grow: 1; height: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Resume · 31 min left</button>
      <button aria-pressed="true" aria-label="Following" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0837); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></button>
      <button aria-label="More: trailer, share, notifications" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
    </div>
    <section aria-label="Episodes" style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <div style="display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.0837); margin-right: -16px; overflow: hidden">
        <sc-for list="{{filters}}" as="v" hint-placeholder-count="4"><button style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
      </div>
      <div style="height: 40px; display: flex; align-items: center; gap: 4px">
        <span style="font-size: 14px; font-weight: 600; flex-grow: 1">September 2026</span>
        <button aria-label="Find in this show" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
        <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Newest<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </div>
      <sc-for list="{{episodes}}" as="e" hint-placeholder-count="5">
        <div style="{{e.style}}">
          <span style="{{e.bar}}"></span>
          <span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 4px; background: #4a5b3b"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
            <span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.title}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #9e9e9e; white-space: nowrap"><span style="{{e.tag}}">{{e.tagText}}</span><span>{{e.meta}}</span></span>
            <span style="{{e.progRow}}"><span style="width: 64px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.0837)"><span style="{{e.progFill}}"></span></span><span>{{e.left}}</span></span>
          </span>
          <button aria-label="{{e.playLabel}}" style="{{e.play}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{e.playD}}" fill="{{e.playFill}}" stroke="{{e.playStroke}}" stroke-width="2" stroke-linecap="round"></path></svg></button>
        </div>
      </sc-for>
    </section>
    <section aria-label="About" style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
      <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">About</h2>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #c5c5c5">Weekly conversations about building software that lasts: craft, latency, postmortems and the people behind the tools. New episodes every Monday.</p>
    </section>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="podcast" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const filters = [vs('All · 14', true), vs('Unplayed · 10', false), vs('In progress · 1', false), vs('Played · 3', false)];
  const ep = [
    { t: 'Latency, Honestly', m: '#42 · 23 Sep · 54 min', state: 'playing', pct: 43, left: '31 min left' },
    { t: 'The Build Trap', m: '#41 · 16 Sep · 41 min', state: 'new' },
    { t: 'On Craft', m: '#40 · 9 Sep · 48 min', state: '' },
    { t: 'Edge Cases', m: '#39 · 2 Sep · 37 min', state: 'played' }
  ];
  const episodes = ep.map(e => {
    const playing = e.state === 'playing', played = e.state === 'played', isNew = e.state === 'new';
    return { title: e.t, meta: e.m, left: e.left || '', tagText: isNew ? 'New' : (played ? '✓ Played' : ''),
      style: 'position: relative; display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 4px 0 8px; border-radius: 4px; ' + (playing ? 'background: rgba(255,255,255,0.0605);' : '') + (played ? 'opacity: 0.58;' : ''),
      bar: playing ? 'position: absolute; left: 0; top: 28px; width: 3px; height: 16px; border-radius: 2px; background: #60cdff' : 'display: none',
      tag: (isNew || played ? 'display: inline-flex' : 'display: none') + '; height: 18px; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5; flex-shrink: 0',
      progRow: (e.pct ? 'display: flex' : 'display: none') + '; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: #9e9e9e',
      progFill: 'display: block; width: ' + (e.pct || 0) + '%; height: 3px; border-radius: 2px; background: #60cdff',
      play: 'width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 20px; font: inherit; ' + (playing ? 'background: #60cdff; color: #000' : 'background: rgba(255,255,255,0.0605); color: #fff'),
      playLabel: playing ? 'Pause' : 'Play', playD: playing ? 'M5.5 3v10M10.5 3v10' : 'M4.5 2.8v10.4L13 8z', playFill: playing ? 'none' : 'currentColor', playStroke: playing ? 'currentColor' : 'none' };
  });
  return { filters, episodes };
}
}
</script>
</body>
</html>
