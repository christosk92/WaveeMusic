<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|recents:Recents" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 24px 36px 0 36px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; align-items: flex-end; gap: 12px"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600; flex-grow: 1">Recents</h1><button style="height: 32px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px; margin-bottom: 8px">Overview</button></div>
      <div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="4"><button style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
      </div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 36px; min-height: 0">
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{items}}" as="r" hint-placeholder-count="10">
            <sc-if value="{{r.day}}" hint-placeholder-val="{{ false }}"><div style="height: 36px; display: flex; align-items: flex-end; padding-bottom: 6px; font-size: 14px; font-weight: 600">{{r.label}}</div></sc-if>
            <sc-if value="{{r.row}}" hint-placeholder-val="{{ true }}">
              <div style="{{r.style}}">
                <span style="{{r.art}}"></span>
                <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5">{{r.kind}}</span></span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">{{r.meta}}</span></span>
                <span style="font-size: 12px; color: #9e9e9e; white-space: nowrap">{{r.when}}</span>
                <span style="width: 32px; display: flex; justify-content: center; color: #c5c5c5"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="{{r.chev}}" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
              </div>
            </sc-if>
            <sc-if value="{{r.sub}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 64px; align-items: center; height: 36px; margin-left: 60px; border-radius: 4px"><span style="padding-left: 8px; font-size: 14px; color: #9e9e9e; font-variant-numeric: tabular-nums">{{r.n}}</span><span style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.label}}</span><span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.when}}</span></div>
            </sc-if>
          </sc-for>
        </div>
        <aside aria-label="Listening calendar" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1); align-self: start">
          <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">October 2026</span><button aria-label="Previous month" style="width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit">‹</button><button aria-label="Next month" style="width: 28px; height: 28px; border: 0; border-radius: 4px; background: transparent; color: #5d5d5d; font: inherit">›</button></div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 12px; color: #9e9e9e; text-align: center"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
            <sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><span style="{{c.style}}"></span></sc-for>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #c5c5c5"><span>Quieter</span><span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(96,205,255,0.15)"></span><span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(96,205,255,0.4)"></span><span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(96,205,255,0.7)"></span><span style="width: 12px; height: 12px; border-radius: 2px; background: #60cdff"></span><span>Busier</span></div>
          <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.0837)"><span style="font-size: 14px">212 plays · So far</span><span style="font-size: 12px; color: #c5c5c5">10 Oct · 12 plays · top: Stereo Love</span></div>
        </aside>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const views = [vs('All', true), vs('Music', false), vs('Podcasts', false), vs('Artists', false)];
  const day = (l) => ({ day: true, row: false, sub: false, label: l });
  const row = (l, kind, meta, when, c, open, round) => ({ day: false, row: true, sub: false, label: l, kind, meta, when, chev: open ? 'M3.5 10 8 5.5l4.5 4.5' : 'M3.5 6 8 10.5 12.5 6',
    style: 'display: flex; align-items: center; gap: 12px; height: 56px; margin-top: 2px; padding: 0 8px; border-radius: 4px; ' + (open ? 'background: rgba(255,255,255,0.0605)' : ''),
    art: 'width: 48px; height: 48px; flex-shrink: 0; border-radius: ' + (round ? '24px' : '4px') + '; background: ' + c });
  const sub = (n, l, d) => ({ day: false, row: false, sub: true, n, label: l, when: d });
  const items = [day('Today'), row('The Stereo Love Show', 'Album', 'Played 5 tracks', '20:14', '#3b5b7a', true, false), sub('1', 'Stereo Love', '4:07'), sub('2', 'This Is My Life', '3:50'), sub('3', 'Mono in Love', '3:17'), row('Latency, Honestly', 'Episode', 'Coffee & Code · 23 min left', '17:40', '#4a5b3b', false, false), row('Arash', 'Artist', 'Played 3 tracks', '12:02', '#4a3b2f', false, true), day('Yesterday'), row('LoL Worlds Songs 2014–2026', 'Playlist', 'Played 12 tracks · grouped from 4 plays', '22:51', '#5b5b5b', false, false), row('Supernova', 'Song', 'aespa · Armageddon', '18:20', '#5b2f6b', false, false)];
  const lv = [0, 1, 0, 2, 1, 3, 2, 1, 0, 1, 2, 4, 3, 2, 1, 2, 0, 1, 3, 2, 1, 0, 1, 2, 1, 3, 4, 2, 1, 0, 1, 0, 0, 0, 0];
  const bg = ['rgba(255,255,255,0.0605)', 'rgba(96,205,255,0.15)', 'rgba(96,205,255,0.4)', 'rgba(96,205,255,0.7)', '#60cdff'];
  const cells = lv.map((l, i) => ({ style: 'aspect-ratio: 1 / 1; border-radius: 2px; background: ' + (i > 30 ? 'transparent' : bg[l]) + (i === 9 ? '; outline: 2px solid #ffffff; outline-offset: -2px' : '') }));
  return { views, items, cells };
}
}
</script>
</body>
</html>
