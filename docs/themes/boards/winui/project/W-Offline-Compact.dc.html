<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Offline, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home" sel="0" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div role="status" style="flex-shrink: 0; display: flex; align-items: flex-start; gap: 12px; padding: 12px 8px 12px 16px; box-sizing: border-box; border-radius: 4px; background: #433519; border: 1px solid rgba(0,0,0,0.1)">
      <span style="width: 16px; height: 16px; margin-top: 2px; border-radius: 8px; background: #fce100; color: #000; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 700">!</span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600">You’re offline</span><span style="font-size: 14px; line-height: 20px">Cached content still works; playback and edits resume when you’re back.</span></span>
      <button style="height: 40px; flex-shrink: 0; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Retry</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Good evening, Chris</h1>
      <div style="display: flex; align-items: center; gap: 4px; margin-right: -16px; overflow: hidden; white-space: nowrap">
        <sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button style="{{f.style}}">{{f.label}}<span style="{{f.bar}}"></span></button></sc-for>
      </div>
    </div>
    <section aria-label="Jump back in" style="display: flex; flex-direction: column; gap: 8px; flex-shrink: 0">
      <div style="display: flex; align-items: center; gap: 12px"><span style="display: flex; flex-direction: column; flex-grow: 1"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Jump back in</h2><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Cached on this PC</span></span><a href="#" style="font-size: 14px; line-height: 40px">Listening history</a></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
          <a href="#" aria-disabled="{{r.dis}}" style="{{r.style}}"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span></a>
        </sc-for>
      </div>
    </section>
    <section aria-label="Made for you" style="display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
      <h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Made for you</h2>
      <div style="height: 232px; box-sizing: border-box; padding: 24px 16px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
        <span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.0605); color: #c5c5c5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 6a9.5 9.5 0 0 1 13 0M3.5 8.4a6.5 6.5 0 0 1 9 0M5.8 10.7a3.2 3.2 0 0 1 4.4 0M8 13.2v.1M2 2l12 12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></span>
        <span style="font-size: 14px; line-height: 20px; font-weight: 600">Couldn’t load this section</span>
        <span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Check your connection and try again.</span>
        <button style="margin-top: 4px; height: 40px; padding: 0 16px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Retry</button>
      </div>
    </section>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const fs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const facets = [fs('All', true), fs('Music', false), fs('Podcasts', false), fs('Audiobooks', false)];
  const rec = [['The Stereo Love Show', 'Album · Cached', '#3b5b7a', false], ['LoL Worlds Songs 2014–2026', 'Playlist · Cached', '#5b5b5b', false], ['Arash', 'Artist · Not cached', '#4a3b2f', true, true]];
  const recent = rec.map(r => ({ title: r[0], sub: r[1], dis: r[3] ? 'true' : 'false',
    style: 'display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px 0 8px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1); color: #fff' + (r[3] ? '; opacity: 0.45' : ''),
    art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: ' + (r[4] ? '20px' : '4px') + '; background: ' + r[2] }));
  return { facets, recent };
}
}
</script>
</body>
</html>
