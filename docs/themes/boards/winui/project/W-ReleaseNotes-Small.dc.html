<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What's new, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|notes:What’s new" sel="1" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 16px">
        <h1 style="margin: 0; flex-grow: 1; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">What’s new</h1>
        <span role="combobox" aria-label="Release" aria-expanded="false" style="height: 32px; min-width: 260px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); font-size: 14px"><span style="flex-grow: 1">1.6.0 “Harbour”</span><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5">Latest</span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      </div>

      <div role="status" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 4px 6px 12px; box-sizing: border-box; border-radius: 4px; background: #2f2f2f; border: 1px solid rgba(0,0,0,0.1)"><span style="width: 16px; height: 16px; border-radius: 8px; background: #60cdff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #000; font-size: 11px; font-weight: 700">i</span><span style="font-size: 14px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Since you last looked: 3 releases — 1.4.0 → 1.6.0.</span><button style="height: 32px; flex-shrink: 0; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Only the latest</button><button aria-label="Close" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button></div>

      <div style="display: flex; align-items: baseline; gap: 12px">
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Wavee 1.6.0 “Harbour”</h2><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Released 3 Oct 2026 · Requires Windows 11 · Tag v1.6.0</span></span>
        <a href="#" style="font-size: 14px">Open on GitHub</a><a href="#" style="font-size: 14px">Copy link</a>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{highlights}}" as="h" hint-placeholder-count="3">
          <a href="#" style="display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1); color: #fff; min-width: 0"><span style="{{h.img}}"></span><span style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="{{h.tag}}">{{h.kind}}</span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{h.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{h.body}}</span></span></a>
        </sc-for>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
        <section style="display: flex; flex-direction: column; flex-shrink: 0">
          <h3 style="margin: 0; font-size: 14px; font-weight: 600; padding-bottom: 2px">{{g.title}}</h3>
          <sc-for list="{{g.items}}" as="i" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 6px 12px; box-sizing: border-box; border-radius: 4px; font-size: 14px; line-height: 20px"><span style="flex-grow: 1">{{i.text}}</span><a href="#" style="{{i.chip}}">{{i.issue}}</a></div>
          </sc-for>
        </section>
      </sc-for>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const tagS = 'align-self: flex-start; height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; background: rgba(255,255,255,0.0605); color: #c5c5c5';
  const highlights = [['New', 'Themes', 'Wavee Classic, WinUI and Zune. Each theme brings its own options; community themes can be installed.', '#2f4a6b'], ['Improved', 'Full-screen lyrics', 'Word-by-word timing on Copilot+ PCs, romanization as a second line.', '#3b5b7a'], ['Rebuilt', 'Library', 'One list, A–Z headers, a detail pane for albums, artists and shows.', '#4a3b2f']].map(h => ({ kind: h[0], title: h[1], body: h[2], tag: tagS, img: 'display: block; width: 56px; height: 56px; flex-shrink: 0; border-radius: 4px; background: ' + h[3] }));
  const chip = (s) => 'flex-shrink: 0; height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; font-variant-numeric: tabular-nums; ' + (s === 'closed' ? 'background: #3b2a4a; color: #d8b4fe' : 'background: #393d1b; color: #6ccb5f');
  const groups = [
    { title: 'Added', items: [{ text: 'Themes: Wavee Classic, WinUI and Zune, with per-theme options', issue: '#214', chip: chip('closed') }, { text: 'Lyrics: romanization and translation as a second line', issue: '#198', chip: chip('closed') }, { text: 'Concerts: tickets rail with provider availability', issue: '#171', chip: chip('closed') }] },
    { title: 'Changed', items: [{ text: 'Player bar: one Play style everywhere, transport buttons at 40 px', issue: '#205', chip: chip('closed') }, { text: 'Search: facet SelectorBar replaces the chip row', issue: '#188', chip: chip('closed') }] }
  ];
  return { highlights, groups };
}
}
</script>
</body>
</html>
