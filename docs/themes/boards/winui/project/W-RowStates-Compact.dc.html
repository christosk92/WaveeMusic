<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Row states, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; padding: 20px 16px 16px 16px; display: flex; flex-direction: column; overflow: hidden; background: #282828; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 0 16px 0">
    <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Dark</h1>
    <span style="font-size: 12px; line-height: 16px; color: #c5c5c5">track row, 56 px, two-line, ⋯ always shown</span>
  </div>
  <section aria-label="Compact track row states" style="display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="12">
      <div style="display: grid; grid-template-columns: 104px minmax(0, 1fr); align-items: center; gap: 8px; min-height: 60px">
        <span style="display: flex; flex-direction: column"><span style="font-size: 12px; line-height: 16px; font-weight: 600">{{r.label}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">{{r.spec}}</span></span>
        <div style="position: relative">
          <span style="{{r.drop}}"></span>
          <div role="row" style="{{r.style}}">
            <span style="{{r.pill}}"></span>
            <span style="display: flex; align-items: center; padding-left: 6px; color: #60cdff"><span style="{{r.box}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="{{r.tick}}"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.8"></path></svg></span><span style="{{r.numStyle}}">{{r.num}}</span><span style="{{r.eq}}"><span style="width: 2px; height: 7px; background: currentColor"></span><span style="width: 2px; height: 12px; background: currentColor"></span><span style="width: 2px; height: 4px; background: currentColor"></span><span style="width: 2px; height: 10px; background: currentColor"></span></span></span>
            <span style="display: flex; flex-direction: column; min-width: 0"><span style="{{r.title}}">{{r.t}}</span><span style="{{r.sub}}">{{r.a}}</span></span>
            <span style="{{r.heart}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></span>
            <span style="{{r.time}}">{{r.d}}</span>
            <span style="{{r.more}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></span>
          </div>
        </div>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const T = { t1: '#ffffff', t2: '#c5c5c5', t3: '#9e9e9e', dis: '#5d5d5d', hover: 'rgba(255,255,255,0.0605)', press: 'rgba(255,255,255,0.0419)', selHover: 'rgba(255,255,255,0.0837)', acc: '#60cdff', accText: '#99ebff', onAcc: '#000000', strong: 'rgba(255,255,255,0.5442)', focusOut: '#ffffff', focusIn: 'rgba(0,0,0,0.7)' };
  const states = [
    ['Rest', 'no fill', {}], ['Hover', 'subtle fill 1 · ▶ in #', { bg: 'hover', numPlay: true }], ['Pressed', 'subtle fill 2 · text 2', { bg: 'press', pressed: true, numPlay: true }],
    ['Selected', 'fill 1 + accent pill', { bg: 'hover', pill: true }], ['Selected, hover', 'fill 3 + pill', { bg: 'selHover', pill: true }],
    ['Playing', 'accent title + eq', { playing: true }], ['Playing, selected', 'both, no new colour', { playing: true, bg: 'hover', pill: true }],
    ['Keyboard focus', '2 + 1 px ring, radius 6', { focus: true }], ['Multi-select', 'check replaces #, ⋯ hides', { multi: true, checked: true, bg: 'hover' }],
    ['Multi-select, unchecked', 'empty box', { multi: true }], ['Unavailable', 'disabled text, no time', { dis: true }], ['Drag over', '2 px accent line', { drop: true }]
  ];
  const rows = states.map(s => {
    const o = s[2];
    const bg = o.bg ? T[o.bg] : 'transparent';
    const ink = o.dis ? T.dis : (o.playing ? T.accText : (o.pressed ? T.t2 : T.t1));
    const ink2 = o.dis ? T.dis : T.t2;
    return { label: s[0], spec: s[1], t: 'Stereo Love', a: o.dis ? 'Unavailable in your country' : 'Edward Maya, Vika Jigulina · 598.9M plays', d: o.dis ? '' : '4:07',
      num: o.numPlay ? '▶' : '1',
      style: 'position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 36px 40px; column-gap: 4px; align-items: center; height: 56px; border-radius: 4px; background: ' + bg + (o.focus ? '; outline: 2px solid ' + T.focusOut + '; outline-offset: 1px; box-shadow: inset 0 0 0 1px ' + T.focusIn : ''),
      pill: o.pill ? 'position: absolute; left: 0; top: 20px; width: 3px; height: 16px; border-radius: 2px; background: ' + T.acc : 'display: none',
      box: o.multi ? 'width: 20px; height: 20px; box-sizing: border-box; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: ' + T.onAcc + '; ' + (o.checked ? 'background: ' + T.acc : 'border: 1px solid ' + T.strong) : 'display: none',
      tick: o.checked ? 'display: block' : 'display: none',
      numStyle: (o.multi || o.playing ? 'display: none' : 'display: inline') + '; font-size: 14px; font-variant-numeric: tabular-nums; color: ' + (o.dis ? T.dis : (o.numPlay ? T.t1 : T.t3)),
      eq: o.playing && !o.multi ? 'display: flex; align-items: flex-end; gap: 2px; height: 12px' : 'display: none',
      title: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + ink,
      sub: 'font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + ink2,
      heart: (o.dis || o.multi ? 'display: none' : 'display: flex') + '; width: 20px; justify-content: center; color: ' + (o.playing ? T.acc : T.t1),
      time: 'text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: ' + ink2,
      more: (o.multi ? 'visibility: hidden; ' : '') + 'width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: ' + (o.dis ? T.dis : T.t2),
      drop: o.drop ? 'position: absolute; left: 0; right: 0; top: -2px; height: 2px; border-radius: 1px; background: ' + T.acc + '; z-index: 1' : 'display: none' };
  });
  return { rows };
}
}
</script>
</body>
</html>
