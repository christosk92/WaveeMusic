<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video strip, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|album:The Stereo Love Show:#3b5b7a" sel="0" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Good evening, Chris</h1>
      <div style="display: flex; align-items: center; margin-right: -16px; overflow: hidden"><sc-for list="{{facets}}" as="f" hint-placeholder-count="4"><button style="{{f.style}}">{{f.label}}<span style="{{f.bar}}"></span></button></sc-for></div>
    </div>
    <section aria-label="Videos you might like" style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Videos you might like</h2><a href="#" style="font-size: 14px; padding: 10px 0">See all</a></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px">
        <sc-for list="{{videos}}" as="v" hint-placeholder-count="4"><a href="#" style="display: flex; flex-direction: column; gap: 6px; color: #fff"><span style="{{v.art}}"><span style="{{v.badge}}">{{v.len}}</span></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.title}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{v.sub}}</span></span></a></sc-for>
      </div>
    </section>
  </main>
  <div aria-label="Video player, docked above the mini player" style="position: relative; width: 400px; height: 225px; flex-shrink: 0; overflow: hidden; background: #0b1a26; border-top: 1px solid rgba(255,255,255,0.0837)">
    <span aria-hidden="true" style="position: absolute; left: 184px; top: 8px; width: 32px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 0; padding: 4px 4px 0 4px; box-sizing: border-box; background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0))">
      <button aria-label="Where to play the video" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 3.5h13v9h-13zM8 8h5v3.5H8z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Full screen" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Turn off video" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 8px; box-sizing: border-box; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0.6))">
      <button aria-label="Back 10 seconds" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2.5a6.5 6.5 0 1 1-6.2 4.5M2.5 2.5v4.5H7" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="9" y="12.2" text-anchor="middle" font-size="6.5" font-family="Segoe UI Variable Small, Segoe UI, sans-serif" fill="currentColor">10</text></svg></button>
      <span style="font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">1:59</span>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5442); margin: 0 8px"><div style="width: 48%; height: 4px; border-radius: 2px; background: #60cdff"></div></div>
      <span style="font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums">4:07</span>
      <button aria-label="Mute" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6v4h2.5L8 13V3L5 6zM10.5 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="video" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const fs = (l, s) => ({ label: l, style: 'position: relative; height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const facets = [fs('All', true), fs('Music', false), fs('Podcasts', false), fs('Audiobooks', false)];
  const videos = [['Stereo Love (Official Video)', 'Edward Maya, Vika Jigulina', 'Playing', '#0b1a26', true], ['Supernova', 'aespa · Music video', '3:02', '#2b1a33'], ['Broken Angel', 'Arash · Music video', '3:14', '#2a1f14'], ['Days of Thunder', 'The Midnight · Visualizer', '4:37', '#33200f']].map(v => ({ title: v[0], sub: v[1], len: v[2],
    art: 'position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; background: ' + v[3] + (v[4] ? '; box-shadow: inset 0 0 0 2px #60cdff' : ''),
    badge: 'position: absolute; right: 6px; bottom: 6px; height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; ' + (v[4] ? 'background: #60cdff; color: #000' : 'background: rgba(0,0,0,0.6); color: #fff') }));
  return { facets, videos };
}
}
</script>
</body>
</html>
