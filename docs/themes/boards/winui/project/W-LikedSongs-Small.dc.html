<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liked Songs, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|liked:Liked Songs" sel="1" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="liked" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 20px 24px 0 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; gap: 20px; align-items: flex-end; flex-shrink: 0">
        <div style="width: 112px; height: 112px; border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex-shrink: 0"><span style="background: #3b5b7a"></span><span style="background: #5b2f6b"></span><span style="background: #6b4a2f"></span><span style="background: #2f6b5b"></span><span style="background: #6b2f3b"></span><span style="background: #4a3b2f"></span><span style="background: #2f5b6b"></span><span style="background: #6b5b2f"></span><span style="background: #4a4a6b"></span></div>
        <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
          <div style="font-size: 12px; line-height: 16px; color: #c5c5c5">Playlist · Liking since 12 Mar 2016</div>
          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Liked Songs</h1>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #c5c5c5"><span style="width: 20px; height: 20px; border-radius: 10px; background: #6b5b4a; flex-shrink: 0"></span><span><a href="#">Chris</a> · 1,284 songs · 78 hr 12 min</span></div>
          <div style="display: flex; gap: 8px; align-items: center; padding-top: 8px">
            <div style="display: flex; height: 32px; border-radius: 4px; overflow: hidden; background: #60cdff; color: #000; font-size: 14px"><button style="display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; background: transparent; color: #000; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button><span style="width: 1px; background: rgba(0,0,0,0.2)"></span><button aria-label="More play options" style="width: 32px; border: 0; background: transparent; color: #000; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button></div>
            <button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Shuffle</button>
            <button aria-label="More: cover style, share" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
          </div>
        </div>
      </div>
      <button aria-expanded="false" style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1); color: #fff; font: inherit; font-size: 14px; text-align: left">
        <span style="font-weight: 600; flex-shrink: 0">Insights</span>
        <span style="flex-grow: 1; min-width: 0; font-size: 12px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">+12 this week · Top: Arash, aespa, Edward Maya · Mostly the 2010s · Rediscover 12 songs</span>
        <span style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #c5c5c5"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      </button>
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
        <div role="group" aria-label="Filter by genre" style="display: flex; gap: 8px; flex-grow: 1; min-width: 0; overflow: hidden">
          <sc-for list="{{chips}}" as="c" hint-placeholder-count="6"><button aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button></sc-for>
        </div>
        <button aria-label="Find in Liked Songs" style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
        <button style="height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px; white-space: nowrap">Recently added<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </div>
      <div role="table" aria-label="Liked songs" style="display: flex; flex-direction: column">
        <div role="row" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 56px 40px; align-items: center; height: 32px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.0837); font-size: 12px; color: #c5c5c5">
          <span style="padding-left: 10px">#</span><span>Title</span><span style="text-align: right; padding-right: 8px">Time</span><span></span>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
          <div role="row" style="{{r.style}}">
            <span style="{{r.num}}">{{r.n}}</span>
            <span style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="{{r.title}}">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span></span></span>
            <span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span>
            <button aria-label="More for {{r.t}}" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #c5c5c5; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const chips = ['All', 'Chill', 'Dance', 'Electronic', 'Hip Hop', 'Indie', 'Jazz', 'Rock'].map((l, i) => ({ label: l, on: i === 0 ? 'true' : 'false',
    style: 'height: 32px; flex-shrink: 0; padding: 0 12px; border-radius: 4px; font: inherit; font-size: 14px; color: #fff; ' + (i === 0 ? 'background: rgba(255,255,255,0.0837); border: 1px solid rgba(255,255,255,0.0698)' : 'background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093)') }));
  const data = [['Supernova', 'aespa', '2:58', '#5b2f6b'], ['Stereo Love', 'Edward Maya, Vika Jigulina', '4:07', '#3b5b7a', true], ['Broken Angel (feat. Helena)', 'Arash', '3:11', '#4a3b2f'], ['Days of Thunder', 'The Midnight', '4:37', '#6b4a2f'], ['Magnetic', 'ILLIT', '2:41', '#6b5b2f']];
  const rows = data.map((d, i) => ({ n: d[4] ? '▮▮▮' : String(i + 1), t: d[0], a: d[1], time: d[2],
    style: 'display: grid; grid-template-columns: 40px minmax(0, 1fr) 56px 40px; align-items: center; height: 48px; flex-shrink: 0; margin-top: 2px; border-radius: 4px; ' + (d[4] ? 'background: rgba(255,255,255,0.0605)' : ''),
    num: 'padding-left: 10px; font-variant-numeric: tabular-nums; font-size: ' + (d[4] ? '10px' : '14px') + '; color: ' + (d[4] ? '#60cdff' : '#9e9e9e'),
    art: 'width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; background: ' + d[3],
    title: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[4] ? '#99ebff' : '#ffffff') }));
  return { chips, rows };
}
}
</script>
</body>
</html>
