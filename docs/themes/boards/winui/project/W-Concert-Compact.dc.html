<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concert, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|concert:Arash · Paradiso" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 8px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 2px; height: 40px; font-size: 14px">
      <button aria-label="Show earlier levels: Concerts" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #c5c5c5; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #9e9e9e"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <a href="#" style="color: #c5c5c5; padding: 10px 6px">Arash</a>
      <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #9e9e9e"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <span style="padding: 4px 6px; font-weight: 600">Paradiso</span>
    </nav>
    <div style="display: flex; gap: 16px; align-items: flex-end">
      <div style="width: 128px; height: 128px; border-radius: 8px; background: #4a3b2f; flex-shrink: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex-grow: 1">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: #c5c5c5"><span>Concert</span><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; background: #393d1b; color: #6ccb5f">On sale</span></div>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Arash — Amsterdam</h1>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 20px; color: #c5c5c5">
      <span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="M2.5 3.5h11v10h-11zM2.5 6.5h11M5 2v3M11 2v3" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>Sat 14 Nov 2026 · 20:00</span>
      <span style="display: flex; align-items: center; gap: 8px; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="M8 14s-4.5-4.2-4.5-7.5a4.5 4.5 0 0 1 9 0C12.5 9.8 8 14 8 14zM8 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg><a href="#">Paradiso</a> · Weteringschans 6, Amsterdam</span>
      <span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zM8 4.5V8l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg>Doors open 19:00 · Ages 16+</span>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <a href="#" style="flex-grow: 1; height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 16px; border-radius: 4px; background: #60cdff; color: #000; font-size: 14px">Buy tickets<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M6 3.5H2.5v10h10V10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <button aria-label="Interested" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg></button>
      <button aria-label="Add to calendar" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v10h-11zM2.5 6.5h11M5 2v3M11 2v3M8 8.5v3M6.5 10h3" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
      <button aria-label="Share" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M5 5.5l3-3 3 3M3.5 9v3.5h9V9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    </div>
    <section aria-label="Tickets" style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Tickets</h2><span style="font-size: 12px; color: #9e9e9e">from each provider</span></div>
      <div style="display: flex; flex-direction: column; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
        <sc-for list="{{tickets}}" as="t" hint-placeholder-count="3">
          <div style="{{t.row}}">
            <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
              <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 600">{{t.name}}</span><span style="{{t.badge}}">{{t.status}}</span></span>
              <span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.detail}}</span>
            </span>
            <a href="#" aria-label="{{t.aria}}" style="{{t.btn}}">{{t.cta}}</a>
          </div>
        </sc-for>
      </div>
    </section>
    <section aria-label="Lineup" style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Lineup</h2><span style="font-size: 12px; color: #c5c5c5">3 artists</span></div>
      <sc-for list="{{lineup}}" as="l" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 4px; border-radius: 4px; color: #fff"><span style="{{l.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px">{{l.name}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.sub}}</span></span><span style="height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); font-size: 14px">{{l.btn}}</span></a>
      </sc-for>
    </section>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const tickets = [
    { name: 'Ticketmaster', status: 'Available', ok: true, detail: 'From €45 · on sale from 3 Oct' },
    { name: 'Box office', status: 'Sold out', ok: false, detail: 'Paradiso box office · in person only' },
    { name: 'Resale partner', status: 'Available', ok: true, detail: 'From €89 · verified resale' }
  ].map((t, i) => ({ name: t.name, status: t.status, detail: t.detail, cta: t.ok ? 'Buy' : 'Sold out', aria: t.ok ? 'Buy tickets from ' + t.name : 'Sold out or unavailable',
    row: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 12px 0 16px; ' + (i ? 'border-top: 1px solid rgba(255,255,255,0.0837)' : ''),
    badge: 'height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; ' + (t.ok ? 'background: #393d1b; color: #6ccb5f' : 'background: rgba(255,255,255,0.0605); color: #c5c5c5'),
    btn: 'height: 40px; min-width: 64px; flex-shrink: 0; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; border-radius: 4px; font-size: 14px; ' + (t.ok ? 'background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff' : 'background: transparent; border: 1px solid rgba(255,255,255,0.0698); color: #5d5d5d') }));
  const lineup = [['Arash', 'Headliner · 20,577,457 monthly listeners', '#4a3b2f', 'Following'], ['The Openers', 'Support', '#3b5b6b', 'Follow'], ['Band of Silver', 'Support', '#6b5b2f', 'Follow']].map(l => ({ name: l[0], sub: l[1], btn: l[3], art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: ' + l[2] }));
  return { tickets, lineup };
}
}
</script>
</body>
</html>
