<!doctype html>
<html lang="en">
<head>

<title>Empty playlist, compact</title>

</head>

<x-dc>
<helmet>

body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}

</helmet>

  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|playlist:My playlist:#3a3a3a" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
      <button style="width: 160px; height: 160px; flex-shrink: 0; box-sizing: border-box; border-radius: 8px; background: rgba(255,255,255,0.0605); border: 1px dashed rgba(255,255,255,0.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #c5c5c5; font: inherit"><svg width="40" height="40" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h8M2.5 8h8M2.5 12h5M13 11.5V4M11.5 13a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill="none" stroke="currentColor" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-size: 12px">Choose a photo</span></button>

        <div style="font-size: 14px; line-height: 20px; color: #c5c5c5"><a href="#">Chris</a> · 0 songs</div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center">
        <button disabled style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border: 0; border-radius: 4px; background: rgba(255,255,255,0.1581); color: rgba(255,255,255,0.5302); font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="currentColor"></path></svg>Play</button>
        <button style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M11 2.5 13.5 5 6 12.5H3.5V10z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg>Edit details</button>
        <button style="height: 40px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Invite</button>
        <button aria-label="More" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 0 16px 0; border-top: 1px solid rgba(255,255,255,0.0837); text-align: center">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.0605); color: #c5c5c5; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h8M2.5 8h5M2.5 12h5M12 8v6M9 11h6" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"></path></svg></span>
      <span style="font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Nothing here yet</span>
      <span style="max-width: 320px; font-size: 14px; line-height: 20px; color: #c5c5c5">Find songs for your playlist, or drag them here from anywhere in Wavee.</span>
      <label style="align-self: stretch; height: 40px; margin-top: 4px; display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); font-size: 14px; color: #9e9e9e; text-align: left"><span style="flex-grow: 1">Search for songs or episodes</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="#c5c5c5" stroke-width="1" stroke-linecap="round"></path></svg></label>
    </div>
    <section aria-label="Recommended" style="display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; align-items: center; gap: 12px"><span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Recommended</h2><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Based on what you play most</span></span><button style="height: 40px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Refresh</button></div>
      <sc-for list="{{recs}}" as="r" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; height: 56px; padding-left: 4px">
          <span style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span></span></span>
          <button style="height: 40px; padding: 0 16px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px">Add</button>
        </div>
      </sc-for>
    </section>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const d = [['Supernova', 'aespa', 'Armageddon', '#5b2f6b'], ['Broken Angel (feat. Helena)', 'Arash', 'Donya', '#4a3b2f'], ['Magnetic', 'ILLIT', 'SUPER REAL ME', '#6b5b2f'], ['Days of Thunder', 'The Midnight', 'Days of Thunder', '#7a4a2f'], ['This Is My Life', 'Edward Maya', 'The Stereo Love Show', '#3b5b7a']];
  const recs = d.map(x => ({ t: x[0], sub: x[1] + ' · ' + x[2], art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: ' + x[3] }));
  return { recs };
}
}
</script>
</body>
</html>
