<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concert, small window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 800px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|concert:Arash · Paradiso" sel="1" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 440px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="" height="440" hint-size="48px,440px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 12px 24px 0 24px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 4px; height: 32px; font-size: 14px">
        <a href="#" style="color: #c5c5c5; padding: 4px">Concerts</a>
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #9e9e9e"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <a href="#" style="color: #c5c5c5; padding: 4px">Arash</a>
        <svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #9e9e9e"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="padding: 4px; font-weight: 600">Paradiso</span>
      </nav>
      <div style="display: flex; gap: 20px; align-items: flex-end">
        <div style="width: 128px; height: 128px; border-radius: 8px; background: #4a3b2f; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex-grow: 1">
          <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; color: #c5c5c5"><span>Concert</span><span style="height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; background: #393d1b; color: #6ccb5f">On sale</span></div>
          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Arash — Amsterdam</h1>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #c5c5c5; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="flex-shrink: 0"><path d="M2.5 3.5h11v10h-11zM2.5 6.5h11M5 2v3M11 2v3" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg><span>Sat 14 Nov 2026 · 20:00 · <a href="#">Paradiso</a>, Amsterdam · doors 19:00 · 16+</span></div>
          <div style="display: flex; gap: 8px; align-items: center; padding-top: 8px">
            <a href="#" style="height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 4px; background: #60cdff; color: #000; font-size: 14px">Buy tickets<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 7 9M6 3.5H2.5v10h10V10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
            <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"></path></svg>Interested</button>
            <button aria-label="Add to calendar" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-top-color: rgba(255,255,255,0.093); color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 3.5h11v10h-11zM2.5 6.5h11M5 2v3M11 2v3M8 8.5v3M6.5 10h3" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
            <button aria-label="Share" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v8M5 5.5l3-3 3 3M3.5 9v3.5h9V9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
          </div>
        </div>
      </div>
      <section aria-label="Tickets" style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
        <div style="display: flex; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600; flex-grow: 1">Tickets</h2><span style="font-size: 12px; color: #9e9e9e">Prices and availability come from each provider.</span></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{tickets}}" as="t" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
              <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1; white-space: nowrap">{{t.name}}</span><span style="{{t.badge}}">{{t.status}}</span></div>
              <div style="font-size: 12px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.detail}}</div>
              <a href="#" style="{{t.btn}}">{{t.cta}}</a>
            </div>
          </sc-for>
        </div>
      </section>
      <section aria-label="Lineup" style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: baseline; gap: 8px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Lineup</h2><span style="font-size: 12px; color: #c5c5c5">3 artists</span></div>
        <sc-for list="{{lineup}}" as="l" hint-placeholder-count="3">
          <a href="#" style="display: flex; align-items: center; gap: 12px; height: 56px; flex-shrink: 0; padding: 0 8px; border-radius: 4px; color: #fff"><span style="{{l.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px">{{l.name}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">{{l.sub}}</span></span><span style="height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); font-size: 14px">{{l.btn}}</span></a>
        </sc-for>
      </section>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" variant="music" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":600}}'>
class Component extends DCLogic {
renderVals() {
  const tickets = [
    { name: 'Ticketmaster', status: 'Available', ok: true, detail: 'From €45 · on sale from 3 Oct', cta: 'Buy tickets' },
    { name: 'Box office', status: 'Sold out', ok: false, detail: 'Paradiso box office · in person only', cta: 'Sold out or unavailable' },
    { name: 'Resale partner', status: 'Available', ok: true, detail: 'From €89 · verified resale', cta: 'Buy tickets' }
  ].map(t => ({ name: t.name, status: t.status, detail: t.detail, cta: t.cta,
    badge: 'height: 20px; flex-shrink: 0; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 4px; font-size: 12px; ' + (t.ok ? 'background: #393d1b; color: #6ccb5f' : 'background: rgba(255,255,255,0.0605); color: #c5c5c5'),
    btn: 'height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 14px; white-space: nowrap; ' + (t.ok ? 'background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff' : 'background: transparent; border: 1px solid rgba(255,255,255,0.0698); color: #5d5d5d') }));
  const lineup = [['Arash', 'Headliner · 20,577,457 monthly listeners', '#4a3b2f', 'Following'], ['The Openers', 'Support', '#3b5b6b', 'Follow'], ['Band of Silver', 'Support', '#6b5b2f', 'Follow']].map(l => ({ name: l[0], sub: l[1], btn: l[3], art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: ' + l[2] }));
  return { tickets, lineup };
}
}
</script>
</body>
</html>
