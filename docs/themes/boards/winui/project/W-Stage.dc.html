<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const mode = (l, s) => ({ label: l, style: 'position: relative; height: 38px; padding: 0 14px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 14px; right: 14px; bottom: 3px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const modes = [mode('Lyrics', false), mode('Visualizer', true), mode('Up next', false), mode('Artist', false)];
  const h = [12, 18, 26, 40, 58, 72, 90, 120, 150, 180, 210, 250, 300, 340, 372, 400, 420, 436, 448, 456, 462, 466, 468, 470, 470, 468, 466, 462, 456, 448, 436, 420, 400, 372, 340, 300, 250, 210, 180, 150, 120, 90, 72, 58, 40, 26, 18, 12];
  const bars = h.map((v, i) => ({ style: 'flex-grow: 1; height: ' + Math.round(v * 0.9) + 'px; border-radius: 4px; background: ' + (i % 2 === 0 ? 'rgba(96,205,255,' + (0.35 + v / 1400).toFixed(2) + ')' : 'rgba(59,91,122,' + (0.55 + v / 1100).toFixed(2) + ')') }));
  return { modes, bars };
}
}
