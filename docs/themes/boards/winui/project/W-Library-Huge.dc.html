<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library albums, huge window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 2560px; height: 1440px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="huge" width="2560" tabs="home:Home|albums:Albums" sel="1" hint-size="2560px,88px"></dc-import>
  <div style="display: flex; height: 1280px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="albums" height="1280" hint-size="280px,1280px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 32px 48px 0 48px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">Library</h1>
      <div role="tablist" aria-label="Library views" style="display: flex; align-items: center; gap: 4px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.0837)">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="5"><button role="tab" aria-selected="{{v.on}}" style="{{v.style}}">{{v.label}}<span style="{{v.bar}}"></span></button></sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
        <label style="width: 320px; height: 32px; display: flex; align-items: center; padding: 0 10px 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); font-size: 14px; color: #9e9e9e"><span style="flex-grow: 1">Filter albums</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zM10.3 10.3 14 14" fill="none" stroke="#c5c5c5" stroke-width="1" stroke-linecap="round"></path></svg></label>
        <button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Recently added<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
        <span style="flex-grow: 1; font-size: 12px; color: #c5c5c5; text-align: right; padding-right: 8px">20 albums</span>
        <div style="display: flex; height: 32px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.0698); overflow: hidden">
          <button aria-label="Grid view" aria-pressed="true" style="width: 40px; border: 0; background: rgba(255,255,255,0.0837); color: #fff; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5H2.5zM9 2.5h4.5v4.5H9zM2.5 9h4.5v4.5H2.5zM9 9h4.5v4.5H9z" fill="none" stroke="currentColor" stroke-width="1"></path></svg></button>
          <button aria-label="List view" aria-pressed="false" style="width: 40px; border: 0; background: transparent; color: #c5c5c5; font: inherit; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 24px; padding-top: 4px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <section aria-label="{{g.label}}" style="display: flex; flex-direction: column; gap: 12px">
            <div style="display: flex; align-items: baseline; gap: 8px; height: 28px"><h2 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">{{g.label}}</h2><span style="font-size: 12px; color: #9e9e9e">{{g.count}}</span></div>
            <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 20px 24px">
              <sc-for list="{{g.albums}}" as="a" hint-placeholder-count="10">
                <a href="#" style="{{a.card}}"><span style="position: relative; display: block"><span style="{{a.art}}"></span><span style="{{a.play}}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4L13 8z" fill="#000"></path></svg></span></span><span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.s}}</span></a>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="huge" width="2560" variant="music" pane="none" hint-size="2560px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2560,"height":1440}}'>
class Component extends DCLogic {
renderVals() {
  const vs = (l, s) => ({ label: l, on: s ? 'true' : 'false', style: 'position: relative; height: 40px; flex-shrink: 0; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const views = [vs('Playlists', false), vs('Albums', true), vs('Artists', false), vs('Podcasts', false), vs('Audiobooks', false)];
  const card = (d) => ({ t: d[0], s: d[1],
    card: 'display: flex; flex-direction: column; gap: 6px; padding: 8px; margin: -8px; border-radius: 8px; color: #fff; min-width: 0; ' + (d[3] ? 'background: rgba(255,255,255,0.0605)' : ''),
    art: 'display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: ' + d[2],
    play: (d[3] ? 'display: flex' : 'display: none') + '; position: absolute; right: 10px; bottom: 10px; width: 40px; height: 40px; border-radius: 20px; background: #60cdff; align-items: center; justify-content: center; box-shadow: 0 4px 8px rgba(0,0,0,0.26)' });
  const groups = [
    { label: 'October 2026', count: '4 albums', albums: [['FINE', 'Jukjae · 2017', '#7a6a5a'], ['ARE YOU EVER COMING BACK?', 'vaultboy · 2026', '#5a6a7a'], ['STARTING OVER', 'Yu Takahashi · 2018', '#4a4a4a'], ['WLUWD', 'Tristam · 2021', '#3b4a7a', true]].map(card) },
    { label: 'September 2026', count: '6 albums', albums: [['2024 World Championship Theme', 'League of Legends · 2024', '#7a5a3b'], ['Arcane League of Legends: Season 2', 'Arcane · 2024', '#2f4a6b'], ['Sacrifice', 'League of Legends · 2025', '#6b3b2f'], ['The Stereo Love Show', 'Edward Maya · 2012', '#3b5b7a'], ['Superman', 'Arash · 2014', '#6b8f8a'], ['Armageddon', 'aespa · 2024', '#5b2f6b']].map(card) },
    { label: 'Earlier in 2026', count: '10 albums', albums: [['Odyssey', 'HOME · 2014', '#2f5b6b'], ['Endless Summer', 'The Midnight · 2016', '#6b4a2f'], ['Donya', 'Arash · 2008', '#5b4a3b'], ['Arash', 'Arash · 2005', '#3b4a5b'], ['SUPER REAL ME', 'ILLIT · 2024', '#6b5b2f'], ['Whiplash', 'aespa · 2024', '#2f3b5b'], ['Days of Thunder', 'The Midnight · 2014', '#6b2f3b'], ['I’VE MINE', 'IVE · 2023', '#4a4a6b'], ['Stereo Love Remixes', 'Edward Maya · 2010', '#2f6b5b'], ['Stereo Love', 'Gigi D’Agostino · 2011', '#4a3b2f']].map(card) }
  ];
  return { views, groups };
}
}
</script>
</body>
</html>
