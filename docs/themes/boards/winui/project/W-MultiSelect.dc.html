<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Multi-select with CommandBar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|liked:Liked Songs" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="liked" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 24px 36px 0 36px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <div style="display: flex; gap: 20px; align-items: center">
        <div style="width: 96px; height: 96px; border-radius: 8px; overflow: hidden; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex-shrink: 0"><span style="background: #3b5b7a"></span><span style="background: #5b2f6b"></span><span style="background: #6b4a2f"></span><span style="background: #2f6b5b"></span><span style="background: #6b2f3b"></span><span style="background: #4a3b2f"></span><span style="background: #2f5b6b"></span><span style="background: #6b5b2f"></span><span style="background: #4a4a6b"></span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><div style="font-size: 12px; line-height: 16px; color: #c5c5c5">Playlist</div><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">Liked Songs</h1><div style="font-size: 14px; line-height: 20px; color: #c5c5c5">Chris · 1,284 songs</div></div>
      </div>
      <div role="toolbar" aria-label="Selection commands" style="display: flex; align-items: center; gap: 4px; height: 48px; padding: 0 8px 0 12px; box-sizing: border-box; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
        <label style="display: flex; align-items: center; gap: 12px; font-size: 14px; padding-right: 12px"><span style="width: 20px; height: 20px; border-radius: 4px; background: #60cdff; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 2px; border-radius: 1px; background: #000"></span></span>3 selected</label>
        <span style="width: 1px; height: 24px; background: rgba(255,255,255,0.0837)"></span>
        <sc-for list="{{cmds}}" as="c" hint-placeholder-count="5"><button style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="{{c.d}}" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{c.label}}</button></sc-for>
        <button aria-label="More" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
        <span style="flex-grow: 1"></span>
        <button style="height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit; font-size: 14px">Select all</button>
        <button aria-label="Cancel selection (Esc)" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
      </div>
      <div role="table" aria-label="Tracks" aria-multiselectable="true" style="display: flex; flex-direction: column">
        <div role="row" style="display: grid; grid-template-columns: 48px minmax(0, 1.6fr) minmax(0, 1fr) 140px 40px 72px; align-items: center; height: 36px; border-bottom: 1px solid rgba(255,255,255,0.0837); font-size: 12px; color: #c5c5c5"><span style="padding-left: 14px; display: flex"><span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 4px; background: #60cdff; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 2px; border-radius: 1px; background: #000"></span></span></span><span>Title</span><span>Album</span><span>Date added</span><span></span><span style="text-align: right; padding-right: 8px">Time</span></div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
          <div role="row" aria-selected="{{r.sel}}" style="{{r.style}}">
            <span style="{{r.pill}}"></span>
            <span style="padding-left: 14px; display: flex"><span style="{{r.box}}"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="{{r.tick}}"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="#000" stroke-width="1.8"></path></svg></span></span>
            <span style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="{{r.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0"><span style="{{r.title}}">{{r.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.a}}</span></span></span>
            <span style="font-size: 14px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 12px">{{r.album}}</span>
            <span style="font-size: 14px; color: #c5c5c5">{{r.added}}</span>
            <span style="display: flex; align-items: center; justify-content: center; color: #fff"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></span>
            <span style="text-align: right; padding-right: 8px; font-size: 14px; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.time}}</span>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const cmds = [['Play next', 'M2.5 4h7M2.5 8h7M2.5 12h4M10.5 9.5v4.5l3.5-2.25z'], ['Add to queue', 'M2.5 4h11M2.5 8h7M2.5 12h7M11.5 9.5v4.5l3.5-2.25z'], ['Add to playlist', 'M2.5 4h8M2.5 8h5M2.5 12h5M12 8v6M9 11h6'], ['Remove from Liked Songs', 'M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9']].map(c => ({ label: c[0], d: c[1] }));
  const data = [['Supernova', 'aespa', 'Armageddon', 'Today', '2:58', '#5b2f6b', true], ['Stereo Love', 'Edward Maya, Vika Jigulina', 'The Stereo Love Show', 'Yesterday', '4:07', '#3b5b7a', false, true], ['Broken Angel (feat. Helena)', 'Arash', 'Donya', '3 days ago', '3:11', '#4a3b2f', true], ['Days of Thunder', 'The Midnight', 'Endless Summer', '4 days ago', '4:37', '#6b4a2f', false], ['Magnetic', 'ILLIT', 'SUPER REAL ME', '1 week ago', '2:41', '#6b5b2f', true], ['Whiplash', 'aespa', 'Whiplash', '1 week ago', '3:03', '#4a2f5b', false], ['Love wins all', 'IU', 'The Winning', '2 weeks ago', '4:31', '#7a6a5a', false], ['GODS', 'NewJeans', 'GODS', '3 weeks ago', '3:40', '#2f4a5b', false], ['Heavy Is the Crown', 'Linkin Park', 'From Zero', '1 month ago', '2:47', '#5b4a3b', false], ['Supernova (Instrumental)', 'aespa', 'Armageddon', '1 month ago', '2:58', '#5b2f6b', false]];
  const rows = data.map(d => ({ t: d[0], a: d[1], album: d[2], added: d[3], time: d[4], sel: d[6] ? 'true' : 'false',
    style: 'position: relative; display: grid; grid-template-columns: 48px minmax(0, 1.6fr) minmax(0, 1fr) 140px 40px 72px; align-items: center; height: 48px; margin-top: 2px; border-radius: 4px; ' + (d[6] ? 'background: rgba(255,255,255,0.0605)' : ''),
    pill: d[6] ? 'position: absolute; left: 0; top: 16px; width: 3px; height: 16px; border-radius: 2px; background: #60cdff' : 'display: none',
    box: 'width: 20px; height: 20px; box-sizing: border-box; border-radius: 4px; display: flex; align-items: center; justify-content: center; ' + (d[6] ? 'background: #60cdff' : 'border: 1px solid rgba(255,255,255,0.5442)'),
    tick: d[6] ? 'display: block' : 'display: none',
    art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: ' + d[5],
    title: 'font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[7] ? '#99ebff' : '#ffffff') }));
  return { cmds, rows };
}
}
</script>
</body>
</html>
