<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report a problem</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tabs="home:Home|settings:Settings" sel="1" hint-size="1440px,88px"></dc-import>
  <div style="display: flex; height: 800px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="open" sel="settings" hint-size="280px,800px"></dc-import>
    <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; padding: 24px 36px 0 36px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
      <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 40px; line-height: 52px; font-weight: 600">Settings</h1>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" variant="music" pane="none" hint-size="1440px,72px"></dc-import>
  <div style="position: absolute; left: 0; right: 0; top: 40px; bottom: 0; background: rgba(0,0,0,0.3)"></div>
  <div role="dialog" aria-label="Report a problem" style="position: absolute; left: 340px; top: 100px; width: 760px; box-sizing: border-box; border-radius: 8px; overflow: hidden; background: #2b2b2b; border: 1px solid rgba(117,117,117,0.4); box-shadow: 0 32px 64px rgba(0,0,0,0.4); display: flex; flex-direction: column">
    <div style="padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 20px; line-height: 28px; font-weight: 600">Report a problem</h1><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Opens a prefilled GitHub form in your browser and copies the redacted report to your clipboard. Nothing is sent until you click.</span></div>
      <div style="display: flex; gap: 20px; font-size: 14px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><label style="display: flex; align-items: center; gap: 8px"><span style="{{k.ring}}"><span style="{{k.dot}}"></span></span>{{k.label}}</label></sc-for>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Title<span style="height: 32px; display: flex; align-items: center; padding: 0 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom: 2px solid #60cdff; color: #fff">Queue pane keeps the old theme for one frame after switching</span></label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">What happened<span style="height: 88px; padding: 6px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #c5c5c5; font-size: 14px; line-height: 20px">Switched to the Zune theme while the queue pane was open; the pane painted one frame in WinUI colours.</span></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Steps to reproduce<span style="height: 88px; padding: 6px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #9e9e9e; font-size: 14px; line-height: 20px">1. Open the queue pane 2. Settings › Appearance › Theme › Zune 3. Watch the pane</span></label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Expected behaviour<span style="height: 56px; padding: 6px 12px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); border-bottom-color: rgba(255,255,255,0.5442); color: #9e9e9e; font-size: 14px; line-height: 20px">Never paint a frame in the wrong theme.</span></label>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span style="width: 20px; height: 20px; border-radius: 4px; background: #60cdff; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 6 12l7.5-7.5" fill="none" stroke="#000" stroke-width="1.6"></path></svg></span>Include diagnostics and the last 200 log lines</label>
      <div style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 16px; box-sizing: border-box; border-radius: 4px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)"><span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 14px">Report preview</span><span style="font-size: 12px; color: #c5c5c5">Personal paths, account details and secrets are removed. Track names are kept.</span></span><button style="height: 32px; padding: 0 12px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Save as…</button><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" style="color: #c5c5c5"><path d="M3.5 6 8 10.5 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 24px; background: #202020; border-top: 1px solid rgba(255,255,255,0.0837)">
      <button style="height: 32px; border: 0; border-radius: 4px; background: #60cdff; color: #000; font: inherit; font-size: 14px">Report on GitHub</button>
      <button style="height: 32px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Copy report</button>
      <button style="height: 32px; border-radius: 4px; background: rgba(255,255,255,0.0605); border: 1px solid rgba(255,255,255,0.0698); color: #fff; font: inherit; font-size: 14px">Not now</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
  const kinds = ['Bug', 'Feature', 'Question', 'Idea'].map((l, i) => ({ label: l, ring: 'width: 20px; height: 20px; border-radius: 10px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (i === 0 ? 'background: #60cdff' : 'border: 1px solid rgba(255,255,255,0.5442)'), dot: i === 0 ? 'width: 8px; height: 8px; border-radius: 4px; background: #000' : 'display: none' }));
  return { kinds };
}
}
</script>
</body>
</html>
