<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shell, Short</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 800px; height: 330px; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="small" width="800" tabs="home:Home|album:The Stereo Love Show:#3b5b7a|artist:Arash:#4a3b2f" sel="1" badge="2" hint-size="800px,88px"></dc-import>
  <div style="display: flex; height: 170px; flex-shrink: 0">
    <dc-import name="Shell-Nav" theme="dark" mode="compact" sel="albums" height="170" hint-size="48px,170px"></dc-import>
    <main style="position: relative; flex-grow: 1; min-width: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); border-left: 1px solid rgba(255,255,255,0.0837); border-top-left-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
      <header style="height: 48px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 12px; background: #2c2c2c; border-bottom: 1px solid rgba(255,255,255,0.0837)">
        <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 4px; background: #3b5b7a"></span>
        <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
          <span style="font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The Stereo Love Show</span>
          <span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Edward Maya, Vika Jigulina · 15 songs · 57 min</span>
        </span>
        <button style="height: 32px; padding: 0 16px; border: 0; border-radius: 4px; background: #60cdff; color: #000000; font: inherit; font-size: 14px; font-weight: 600">Play</button>
      </header>
      <div style="padding: 0 24px; display: flex; flex-direction: column">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3"><div style="display: grid; grid-template-columns: 40px minmax(0, 1fr) 56px; align-items: center; height: 40px; margin-top: 2px; font-size: 14px"><span style="padding-left: 10px; color: #9e9e9e">{{r.n}}</span><span style="{{r.title}}">{{r.t}}</span><span style="text-align: right; color: #c5c5c5; font-variant-numeric: tabular-nums">{{r.d}}</span></div></sc-for>
      </div>
      <div style="position: absolute; right: 12px; bottom: 8px; box-sizing: border-box; height: 24px; padding: 0 10px; display: flex; align-items: center; border-radius: 4px; background: rgba(32,32,32,0.94); border: 1px solid rgba(255,255,255,0.0837); font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap">330 tall (under 720): short hero, header collapsed to the 48 sticky bar, panes overlay, player 72 reserved</div>
    </main>
  </div>
  <dc-import name="Shell-Player" theme="dark" tier="compact" width="800" hint-size="800px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":800,"height":330}}'>
class Component extends DCLogic {
renderVals() {
  const data = [['Stereo Love', '4:07', true], ['This Is My Life', '3:50'], ['Mono in Love', '3:17']];
  const rows = data.map((d, i) => ({ n: String(i + 1), t: d[0], d: d[1], title: 'white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: ' + (d[2] ? '#99ebff' : '#ffffff') }));
  return { rows };
}
}
</script>
</body>
</html>
