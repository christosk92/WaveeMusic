<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Queue sheet, compact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#99ebff;text-decoration:none}a:hover{text-decoration:underline}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #202020; color: #ffffff; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif">
  <dc-import name="Shell-Top" theme="dark" tier="compact" width="400" tabs="home:Home|album:The Stereo Love Show:#3b5b7a" sel="1" hint-size="400px,88px"></dc-import>
  <main style="flex-grow: 1; min-height: 0; box-sizing: border-box; background: #282828; border-top: 1px solid rgba(255,255,255,0.0837); padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; gap: 16px; align-items: flex-end">
      <div style="width: 128px; height: 128px; border-radius: 8px; background: #3b5b7a; flex-shrink: 0"></div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <div style="font-size: 12px; line-height: 16px; color: #c5c5c5">Album · 2012</div>
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', sans-serif; font-size: 28px; line-height: 36px; font-weight: 600">The Stereo Love Show</h1>
      </div>
    </div>
  </main>
  <dc-import name="Shell-Player" theme="dark" tier="mini" width="400" variant="music" hint-size="400px,64px"></dc-import>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.3)"></div>
  <section role="dialog" aria-label="Queue" style="position: absolute; left: 0; right: 0; bottom: 0; height: 731px; box-sizing: border-box; display: flex; flex-direction: column; background: #2c2c2c; border: 1px solid rgba(0,0,0,0.2); border-bottom: 0; border-radius: 8px 8px 0 0; box-shadow: 0 -8px 16px rgba(0,0,0,0.26); overflow: hidden">
    <span aria-hidden="true" style="align-self: center; width: 32px; height: 4px; margin-top: 8px; flex-shrink: 0; border-radius: 2px; background: rgba(255,255,255,0.3)"></span>
    <div style="height: 48px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 4px 0 8px; border-bottom: 1px solid rgba(255,255,255,0.0837)">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4"><button role="tab" aria-selected="{{t.sel}}" style="{{t.style}}">{{t.label}}<span style="{{t.bar}}"></span></button></sc-for>
      <span style="flex-grow: 1"></span>
      <button aria-label="Close queue" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path></svg></button>
    </div>

    <div style="flex-grow: 1; min-height: 0; padding: 12px 12px 0 12px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
      <span style="font-size: 12px; line-height: 16px; color: #c5c5c5; padding: 0 4px 6px 4px">Playing from <a href="#">The Stereo Love Show</a></span>
      <div style="display: flex; gap: 12px; align-items: center; padding: 8px; flex-shrink: 0; border-radius: 8px; background: rgba(255,255,255,0.0512); border: 1px solid rgba(0,0,0,0.1)">
        <span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 4px; background: #3b5b7a"></span>
        <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; font-weight: 600; color: #99ebff">Stereo Love</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">Edward Maya, Vika Jigulina</span></span>
        <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 14px; padding-right: 4px"><span style="width: 3px; height: 8px; background: #60cdff"></span><span style="width: 3px; height: 14px; background: #60cdff"></span><span style="width: 3px; height: 5px; background: #60cdff"></span><span style="width: 3px; height: 11px; background: #60cdff"></span></span>
        <button aria-label="Saved to Liked Songs" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #60cdff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5 3 8.7a3 3 0 0 1 4.2-4.3l.8.8.8-.8A3 3 0 0 1 13 8.7z" fill="currentColor"></path></svg></button>
      </div>

      <div style="display: flex; align-items: center; height: 40px; flex-shrink: 0; padding: 4px 4px 0 4px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">Next in queue</span><button style="height: 40px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: #99ebff; font: inherit; font-size: 14px">Clear</button></div>
      <div style="position: relative; height: 56px; flex-shrink: 0; border-radius: 4px; overflow: hidden">
        <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 96px; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255,255,255,0.0837); color: #fff; font-size: 14px"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path></svg>Remove</div>
        <div style="position: absolute; left: -96px; right: 96px; top: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 0 0 0 104px; background: #2c2c2c"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: #5b2f6b"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Supernova</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5">aespa</span></span></div>
      </div>
      <sc-for list="{{queued}}" as="q" hint-placeholder-count="1">
        <div style="{{q.style}}"><span style="{{q.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.a}}</span></span><button aria-label="{{q.drag}}" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #c5c5c5; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6h10M3 10h10" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"></path></svg></button></div>
      </sc-for>

      <div style="display: flex; align-items: center; height: 40px; flex-shrink: 0; padding: 4px 4px 0 4px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">Next up</span><span style="font-size: 12px; color: #c5c5c5">13 more</span></div>
      <sc-for list="{{next}}" as="q" hint-placeholder-count="5">
        <div style="{{q.style}}"><span style="{{q.art}}"></span><span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.t}}</span><span style="font-size: 12px; line-height: 16px; color: #c5c5c5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.a}}</span></span><span style="font-size: 12px; color: #c5c5c5; font-variant-numeric: tabular-nums; padding-right: 4px">{{q.d}}</span><button aria-label="{{q.more}}" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 4px; background: transparent; color: #fff; font: inherit"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="13" cy="8" r="1.1" fill="currentColor"></circle></svg></button></div>
      </sc-for>
    </div>

    <div style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-top: 1px solid rgba(255,255,255,0.0837)">
      <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 14px; font-weight: 600">Autoplay</span><span style="font-size: 12px; color: #c5c5c5">Similar music will keep playing</span></span>
      <button aria-pressed="true" aria-label="Autoplay" style="padding: 0; border: 0; width: 40px; height: 20px; border-radius: 10px; background: #60cdff; position: relative; display: block; flex-shrink: 0"><span style="position: absolute; top: 4px; left: 24px; width: 12px; height: 12px; border-radius: 6px; background: #000"></span></button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
renderVals() {
  const tab = (l, s) => ({ label: l, sel: s ? 'true' : 'false', style: 'position: relative; height: 40px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 14px; white-space: nowrap; color: ' + (s ? '#ffffff' : '#c5c5c5'), bar: s ? 'position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: #60cdff' : 'display: none' });
  const tabs = [tab('Queue', true), tab('Lyrics', false), tab('Now playing', false), tab('Friends', false)];
  const row = (t, a, c, d) => ({ t, a, d: d || '', drag: 'Reorder ' + t, more: 'More options for ' + t,
    style: 'display: flex; align-items: center; gap: 12px; height: 56px; flex-shrink: 0; padding: 0 0 0 8px; border-radius: 4px',
    art: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 4px; background: ' + c });
  const queued = [row('Days of Thunder', 'The Midnight', '#6b4a2f')];
  const next = [row('This Is My Life', 'Edward Maya', '#3b5b7a', '3:50'), row('Mono in Love', 'Edward Maya, Andreea Banica', '#3b5b7a', '3:17'), row('Happy for You', 'Edward Maya', '#3b5b7a', '3:51'), row('Friends Forever', 'Edward Maya', '#3b5b7a', '3:35'), row('Twinheart', 'Edward Maya', '#3b5b7a', '3:59')];
  return { tabs, queued, next };
}
}
</script>
</body>
</html>
