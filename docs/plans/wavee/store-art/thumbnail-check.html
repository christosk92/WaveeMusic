<!doctype html><html><head><meta charset="utf-8"><title>Wavee store art — thumbnail check (round 2)</title><style>
*{box-sizing:border-box;margin:0}
html,body{width:2000px;height:1240px;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI",sans-serif}
body{display:grid;grid-template-columns:1fr 1fr}
.pane{padding:30px 34px}
.light{background:#F3F3F3;color:#1a1a1a}
.dark{background:#202020;color:#eaeaea}
h2{font-size:18px;font-weight:600;margin-bottom:6px}
.hint{font-size:12px;opacity:.55;margin-bottom:18px}
.row{display:flex;gap:18px;align-items:flex-start;margin-bottom:16px}
.lbl{font-size:11px;opacity:.55;width:78px;flex:0 0 auto;padding-top:6px;line-height:1.35}
img{display:block;border-radius:6px}
.w420{width:420px}.w220{width:220px}
</style></head><body>
<div class="pane light"><h2>Store page — LIGHT surface (#F3F3F3)</h2><div class="hint">420 px card · 220 px search-result thumb</div>
<div class="row"><div class="lbl">01 artist</div><img class="w420" src="round2-1-artist.png"><img class="w220" src="round2-1-artist.png"></div>
<div class="row"><div class="lbl">02 library</div><img class="w420" src="round2-2-library.png"><img class="w220" src="round2-2-library.png"></div>
<div class="row"><div class="lbl">03 queue</div><img class="w420" src="round2-3-queue.png"><img class="w220" src="round2-3-queue.png"></div>
<div class="row"><div class="lbl">04 promo</div><img class="w420" src="round2-4-promo.png"><img class="w220" src="round2-4-promo.png"></div>
<div class="row"><div class="lbl">05 hero</div><img class="w420" src="round2-5-hero-1920x1080.png"><img class="w220" src="round2-5-hero-1920x1080.png"></div>
</div>
<div class="pane dark"><h2>Store page — DARK surface (#202020)</h2><div class="hint">420 px card · 220 px search-result thumb</div>
<div class="row"><div class="lbl">01 artist</div><img class="w420" src="round2-1-artist.png"><img class="w220" src="round2-1-artist.png"></div>
<div class="row"><div class="lbl">02 library</div><img class="w420" src="round2-2-library.png"><img class="w220" src="round2-2-library.png"></div>
<div class="row"><div class="lbl">03 queue</div><img class="w420" src="round2-3-queue.png"><img class="w220" src="round2-3-queue.png"></div>
<div class="row"><div class="lbl">04 promo</div><img class="w420" src="round2-4-promo.png"><img class="w220" src="round2-4-promo.png"></div>
<div class="row"><div class="lbl">05 hero</div><img class="w420" src="round2-5-hero-1920x1080.png"><img class="w220" src="round2-5-hero-1920x1080.png"></div>
</div></body></html>
