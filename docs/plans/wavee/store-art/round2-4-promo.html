<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wavee Store art — Round 2 · Promotional / trailer thumbnail</title>
<!--
  ROUND 2 · PROMOTIONAL IMAGE + TRAILER THUMBNAIL (the trailer thumbnail slot is 1920x1080 PNG and
  allows both text and app UI). Canvas 2400x1200; set --w/--h to 1920/1080 for the trailer thumbnail.
  Real app icon: assets/appicon.png (byte-for-byte from src/apps/Wavee/assets/AppIcon/appicon-source.png).
  Real capture: shots/shot-liked.png, cropped with PIL out of assets/readme/promo/home.jpg.
  One flat ground colour, one hairline, one real shadow. Nothing is drawn that the app does not have.
-->
<style>
  :root{
  --n1:#050D2C;  --n2:#06184F;  --n3:#0A1A55;  --n4:#0F2467;
  --n5:#12206B;  --v1:#1C1773;  --b1:#0B57D0;  --c1:#01DEFD;

    --w:2400px; --h:1200px;
    --ground:#0B1130;        /* flat; the app icon's plate navy, desaturated one step */
    --ink:#FFFFFF;
    --ink-2:#A7ADC4;
    --rule:#2A3157;
    --accent:#4C8DFF;
    --display:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
    --text:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--ground)}
  .canvas{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:var(--ground)}
  .edge{position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.09);z-index:20}

  .col{position:absolute;left:152px;top:186px;width:1000px;z-index:6}
  .brand{display:flex;align-items:center;gap:30px;margin-bottom:56px}
  .brand img{width:132px;height:132px;border-radius:30px;display:block;
             box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .brand .name{font-family:var(--display);font-weight:600;font-size:104px;letter-spacing:-3.4px;color:var(--ink)}
  .cap{font-family:var(--display);font-weight:350;font-size:58px;line-height:1.2;white-space:nowrap;
       letter-spacing:-1.6px;color:var(--ink)}
  .hr{width:100%;height:1px;background:var(--rule);margin:52px 0 40px}
  .facts{font-family:var(--text);font-weight:400;font-size:33px;line-height:1.62;color:var(--ink-2)}
  .facts b{color:#fff;font-weight:600}
  .foot{position:absolute;left:154px;bottom:104px;z-index:6;
        font-family:var(--text);font-weight:400;font-size:26px;color:#767C93}

  .shot{position:absolute;left:1210px;top:214px;width:1600px;z-index:4;
        border-radius:16px;overflow:hidden;background:#101010;
        box-shadow:0 3px 8px rgba(0,0,0,.45), 0 44px 100px rgba(0,0,0,.55);}
  .shot img{display:block;width:100%;height:auto}
  /* The hero's flat tile field, reused so the two dark assets share one identity. Percentage-positioned, so it
     holds at any export size. The scrim above it keeps the headline and fact list legible over the busier left
     third without softening the pattern into a gradient. */
  .t{position:absolute}
  .tilefield{position:absolute;inset:0;z-index:0}
  .tilescrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg, rgba(5,13,44,.92) 0%, rgba(5,13,44,.86) 38%, rgba(5,13,44,.35) 62%, rgba(5,13,44,0) 78%)}
</style>
</head>
<body>
<div class="canvas">
  <div class="tilefield">
    <div class="t" style="left:0;top:0;width:12.5%;height:39%;background:var(--n4)"></div>
    <div class="t" style="left:0;top:39%;width:12.5%;height:27%;background:var(--n2)"></div>
    <div class="t" style="left:0;top:66%;width:12.5%;height:34%;background:var(--n5)"></div>
    <div class="t" style="left:12.5%;top:0;width:14.6%;height:61%;background:var(--n2)"></div>
    <div class="t" style="left:12.5%;top:61%;width:14.6%;height:1.7%;background:var(--c1)"></div>
    <div class="t" style="left:12.5%;top:62.7%;width:14.6%;height:37.3%;background:var(--b1)"></div>
    <div class="t" style="left:27.1%;top:0;width:9.4%;height:22%;background:var(--v1)"></div>
    <div class="t" style="left:27.1%;top:22%;width:9.4%;height:50%;background:var(--n4)"></div>
    <div class="t" style="left:27.1%;top:72%;width:9.4%;height:28%;background:var(--n2)"></div>
    <div class="t" style="left:36.5%;top:0;width:16.6%;height:81%;background:var(--n3)"></div>
    <div class="t" style="left:36.5%;top:81%;width:16.6%;height:19%;background:var(--v1)"></div>
    <div class="t" style="left:53.1%;top:0;width:8.4%;height:26%;background:var(--b1)"></div>
    <div class="t" style="left:53.1%;top:26%;width:8.4%;height:2.2%;background:var(--c1)"></div>
    <div class="t" style="left:53.1%;top:28.2%;width:8.4%;height:71.8%;background:var(--n2)"></div>
    <div class="t" style="left:61.5%;top:0;width:13.5%;height:50%;background:var(--n4)"></div>
    <div class="t" style="left:61.5%;top:50%;width:13.5%;height:50%;background:var(--n5)"></div>
    <div class="t" style="left:75%;top:0;width:13.5%;height:18%;background:var(--n2)"></div>
    <div class="t" style="left:75%;top:18%;width:13.5%;height:56%;background:var(--v1)"></div>
    <div class="t" style="left:75%;top:74%;width:13.5%;height:26%;background:var(--n4)"></div>
    <div class="t" style="left:88.5%;top:0;width:11.5%;height:67%;background:var(--n3)"></div>
    <div class="t" style="left:88.5%;top:67%;width:11.5%;height:33%;background:var(--b1)"></div>
  </div>
  <div class="tilescrim"></div>
  <div class="col">
    <div class="brand">
      <img src="assets/appicon.png" alt="">
      <div class="name">Wavee</div>
    </div>
    <div class="cap">A native Windows app for<br>your own Spotify Premium account.</div>
    <div class="hr"></div>
    <div class="facts">
      <b>32 MB</b> download, no runtime to install<br>
      <b>Word-by-word</b> synced lyrics<br>
      Full playback on your own Premium account
    </div>
  </div>

  <div class="shot"><img src="shots/shot-liked.png" alt="Wavee — Liked Songs"></div>

  <div class="foot">Independent client. Not made by, endorsed by, or affiliated with Spotify AB.</div>
  <div class="edge"></div>
</div>
</body>
</html>
